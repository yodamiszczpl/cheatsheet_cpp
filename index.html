  const CPP_KEYWORDS = new Set(
    ("alignas alignof and asm auto bool break case catch char char8_t char16_t char32_t class co_await co_return " +
      "co_yield concept const consteval constexpr constinit const_cast continue decltype default delete do double " +
      "dynamic_cast else enum explicit export extern false final float for friend goto if inline int long mutable " +
      "namespace new noexcept not nullptr operator or override private protected public register reinterpret_cast " +
      "requires return short signed sizeof static static_assert static_cast struct switch template this " +
      "thread_local throw true try typedef typeid typename union unsigned using virtual void volatile wchar_t while " +
      "size_t int8_t int16_t int32_t int64_t uint8_t uint16_t uint32_t uint64_t").split(" ")
  );
  const CPP_TOKEN = new RegExp(
    [
      /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/.source, // 1 comment
      /((?:u8|[uUL])?R"([^(\s]*)\([\s\S]*?\)\3"|(?:u8|[uUL])?"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])+')/.source, // 2 string (3 raw delimiter)
      /(^[ \t]*#[ \t]*[a-z]+)/.source, // 4 preprocessor
      /(\b0[xXbB][\da-fA-F']+[uUlL]*|(?:\b\d[\d']*(?:\.[\d']*)?|\.\d+)(?:[eE][+-]?\d+)?[fFuUlLzZ]*)/.source, // 5 number
      /([A-Za-z_]\w*)/.source, // 6 identifier
      /([-+*/%=<>!&|^~?:]+)/.source, // 7 operator
    ].join("|"),
    "gm"
  );

  function highlightCpp(code) {
    let out = "";
    let last = 0;
    let m;
    CPP_TOKEN.lastIndex = 0;
    while ((m = CPP_TOKEN.exec(code))) {
      if (m.index > last) out += esc(code.slice(last, m.index));
      const [text, com, str, , pp, num, id, op] = m;
      last = CPP_TOKEN.lastIndex;
      let cls = null;
      if (com) cls = "com";
      else if (str) cls = "str";
      else if (pp) {
        out += `<span class="tk-pp">${esc(text)}</span>`;
        const header = /^([ \t]*)(<[^>\n]*>)/.exec(code.slice(last));
        if (header) {
          out += esc(header[1]) + `<span class="tk-str">${esc(header[2])}</span>`;
          last += header[0].length;
          CPP_TOKEN.lastIndex = last;
        }
        continue;
      } else if (num) cls = "num";
      else if (id) {
        if (CPP_KEYWORDS.has(id)) cls = "kw";
        else if (id === "std" || /\bstd::(?:\w+::)*$/.test(code.slice(Math.max(0, m.index - 60), m.index))) cls = "bi";
        else if (/^\s*\(/.test(code.slice(last, last + 20))) cls = "fn";
      } else if (op) cls = "op";
      out += cls ? `<span class="tk-${cls}">${esc(text)}</span>` : esc(text);
    }
    return out + esc(code.slice(last));
  }

  function highlightShell(code) {
    return code
      .split("\n")
      .map((line) => {
        if (/^\s*#/.test(line)) return `<span class="tk-com">${esc(line)}</span>`;
        let first = true;
        return line
          .split(/(\s+)/)
          .map((part) => {
            if (!part.trim()) return part;
            let cls = null;
            if (part === "$" || part === ">") cls = "op";
            else if (first) { cls = "fn"; first = false; }
            else if (/^-/.test(part)) cls = "kw";
            else if (/^["']/.test(part)) cls = "str";
            return cls ? `<span class="tk-${cls}">${esc(part)}</span>` : esc(part);
          })
          .join("");
      })
      .join("\n");
  }

  const highlight = (code, kind) => (kind === "cpp" ? highlightCpp(code) : kind === "shell" ? highlightShell(code) : esc(code));

  // ---------- overview: map ----------
  const LOOKS = [
    { blob: "50% 47% 52% 49% / 48% 52% 49% 51%", drift: 0, tilt: 0 },
    { blob: "48% 52% 49% 51% / 51% 48% 52% 49%", drift: 17.8, tilt: 1.5 },
    { blob: "52% 48% 50% 50% / 49% 51% 48% 52%", drift: -4.6, tilt: -2 },
    { blob: "49% 51% 47% 53% / 52% 49% 51% 48%", drift: 9.5, tilt: 1 },
    { blob: "51% 49% 53% 47% / 48% 51% 49% 52%", drift: -12, tilt: -1.2 },
    { blob: "47% 53% 50% 50% / 50% 47% 53% 50%", drift: 6, tilt: 2 },
  ];
  const MINI_BLOBS = ["22px 30px 26px 34px", "30px 22px 34px 26px", "26px 34px 22px 30px", "34px 26px 30px 22px"];
  const BUBBLE = 116;

  const hint = (thing) => ({
    en: `Pick a ${thing.en} to dive in · ${kbd(SHORTCUT)} to search · ${kbd("Esc")} to come back up`,
    pl: `Wybierz ${thing.pl}, żeby zanurkować · ${kbd(SHORTCUT)} – szukaj · ${kbd("Esc")} – powrót`,
  });

  function tile(t, cls, inner) {
    return t.planned
      ? `<span class="${cls} planned">${inner}<span class="sr-only">(${L(UI.soon)})</span></span>`
      : `<a class="${cls}" href="#${t.id}" data-tile="${t.id}">${inner}</a>`;
  }

  function renderMap() {
    let widest = 0;
    const islands = DATA.areas.map((area, ai) => {
      const ring = area.topics.length - 1;
      const radius = ring <= 1 ? 132 : Math.max(132, (BUBBLE + 18) / (2 * Math.sin(Math.PI / ring)));
      const size = 2 * (radius + BUBBLE / 2) + 60;
      widest = Math.max(widest, size);
      const look = LOOKS[ai % LOOKS.length];
      const slots = area.topics.map((t, i) => {
        let x = 0, y = 0, bob = 0;
        if (i > 0) {
          const angle = -Math.PI / 2 + ((i - 1) * 2 * Math.PI) / ring;
          x = radius * Math.cos(angle);
          y = radius * Math.sin(angle);
          bob = [4.3, -4.4, 0.1][(i - 1) % 3];
        }
        const inner = `<span class="glyph" aria-hidden="true">${esc(t.glyph)}</span><span class="name">${L(t.name)}</span>`;
        return `<li class="slot" style="--x:${x.toFixed(1)};--y:${y.toFixed(1)};--bob:${bob}">${tile(t, "bubble", inner)}</li>`;
      });
      return `<section class="island" data-area="${area.id}" style="--hue:${area.hue};--size:${size.toFixed(1)};--bubble:${BUBBLE};--blob:${look.blob};--drift:${look.drift};--tilt:${look.tilt}deg">
        <h2 class="flag"><span>${L(area.name)}</span></h2>
        <ul class="bubbles">${slots.join("")}</ul>
      </section>`;
    });
    const map = $("[data-map]");
    map.style.setProperty("--widest", Math.round(widest + 125));
    map.innerHTML = `<div class="sea">${islands.join("")}</div><p class="hint">${L(hint(UI.bubble))}</p>`;
  }

  // ---------- overview: trail ----------
  function renderTrail() {
    const STEP = 124, TOP = 74;
    const lands = DATA.areas.map((area) => {
      const points = area.topics.map((t, i) => ({ t, i, x: 50 + 21 * Math.sin(i * 0.9), y: TOP + i * STEP }));
      const height = TOP * 2 + (points.length - 1) * STEP;
      const d = points.map((p, i) => `${i ? "L" : "M"}${p.x.toFixed(2)} ${p.y}`).join(" ");
      const stones = points.map((p) => {
        const inner = `<span class="number" aria-hidden="true">${p.i + 1}</span><span class="glyph" aria-hidden="true">${esc(p.t.glyph)}</span>` +
          `<span class="label"><b>${L(p.t.name)}</b><span class="summary">${L(p.t.summary)}</span></span>`;
        return `<li class="${p.x > 52 ? "left" : ""}" style="--x:${p.x.toFixed(2)}%;--y:${p.y}px">${tile(p.t, "stone", inner)}</li>`;
      });
      return `<section class="land" id="land-${area.id}" data-land="${area.id}" style="--hue:${area.hue}" aria-labelledby="land-title-${area.id}">
        <div class="sign"><h2 id="land-title-${area.id}">${L(area.name)}</h2><p>${L(area.desc)}</p></div>
        <div class="path" style="height:${height}px">
          <svg viewBox="0 0 100 ${height}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}"/></svg>
          <ol class="stones">${stones.join("")}</ol>
        </div>
      </section>`;
    });
    const dots = DATA.areas.map((area) =>
      `<button class="dot" type="button" data-land="${area.id}" style="--hue:${area.hue}"><i aria-hidden="true"></i><span>${L(area.name)}</span></button>`);
    $("[data-trail]").innerHTML =
      `<p class="start">${L(UI.startHere)}<span class="arrow" aria-hidden="true">↓</span><small>${L(hint(UI.stone))}</small></p>` +
      lands.join("") +
      `<nav class="lands" data-i18n-label="lands">${dots.join("")}</nav>`;

    const observer = new IntersectionObserver((items) => {
      for (const item of items) {
        if (!item.isIntersecting) continue;
        for (const dot of $$(".dot")) {
          if (dot.dataset.land === item.target.dataset.land) dot.setAttribute("aria-current", "true");
          else dot.removeAttribute("aria-current");
        }
      }
    }, { rootMargin: "-45% 0px -50% 0px" });
    $$(".land").forEach((land) => observer.observe(land));
  }

  // ---------- rail (index next to a topic) ----------
  function renderRail() {
    const entryList = (t) =>
      `<ul class="entries">${t.entries.map((e) => `<li><a href="#${t.id}--${e.id}" data-entry-link="${t.id}--${e.id}">${L(e.title)}</a></li>`).join("")}</ul>`;
    const here = `<span class="here">${L(UI.here)}</span>`;
    const map = DATA.areas.map((a, ai) =>
      `<div class="mini" style="--hue:${a.hue};--blob:${MINI_BLOBS[ai % MINI_BLOBS.length]}">
        <p class="area" id="rail-map-${a.id}">${L(a.name)}</p>
        <ul class="pins" aria-labelledby="rail-map-${a.id}">${a.topics.map((t) => t.planned
          ? `<li><span class="planned">${L(t.name)}</span></li>`
          : `<li><a class="pin" href="#${t.id}" data-topic-link="${t.id}"><span class="glyph" aria-hidden="true">${esc(t.glyph)}</span>${L(t.name)}${here}</a>${entryList(t)}</li>`).join("")}</ul>
      </div>`).join("");
    const trail = DATA.areas.map((a) =>
      `<div class="mini-trail" style="--hue:${a.hue}">
        <p class="area" id="rail-trail-${a.id}">${L(a.name)}</p>
        <ol class="steps" aria-labelledby="rail-trail-${a.id}">${a.topics.map((t) => t.planned
          ? `<li><span class="planned"><i></i>${L(t.name)}</span></li>`
          : `<li><a class="step" href="#${t.id}" data-topic-link="${t.id}"><span class="number">${t.step}</span>${L(t.name)}${here}</a>${entryList(t)}</li>`).join("")}</ol>
      </div>`).join("");
    $("[data-rail]").innerHTML =
      `<div class="arrangement" data-arrangement="map">${map}</div><div class="arrangement" data-arrangement="trail">${trail}</div>`;
  }

  function markRail(topic) {
    for (const a of $$("[data-topic-link]")) {
      if (a.dataset.topicLink === topic.id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    }
    const rail = $("[data-rail]");
    const target = $$(`[data-topic-link="${topic.id}"]`, rail).find((a) => a.offsetParent !== null);
    if (!target) return;
    const r = target.getBoundingClientRect(), box = rail.getBoundingClientRect();
    if (rail.scrollHeight > rail.clientHeight + 4) rail.scrollTop += r.top - box.top - box.height / 4;
    if (rail.scrollWidth > rail.clientWidth + 4) rail.scrollLeft += r.left - box.left - 16;
  }

  // ---------- topic pages ----------
  function seeLink(ref) {
    const t = topicById.get(ref.topic);
    if (!t || t.planned) return "";
    const e = ref.entry ? t.entries.find((x) => x.id === ref.entry) : null;
    const label = e ? { en: `${t.name.en} › ${e.title.en}`, pl: `${t.name.pl} › ${e.title.pl}` } : t.name;
    return `<a href="#${t.id}${e ? "--" + e.id : ""}" style="--hue:${t.area.hue}">${L(label)}</a>`;
  }

  function renderEntry(t, e) {
    const key = `${t.id}--${e.id}`;
    const code = `<div class="code">${e.codeTitle ? `<p class="code-title">${esc(e.codeTitle)}</p>` : ""}` +
      `<button class="copy" type="button" data-copy="${esc(e.code)}"><span aria-live="polite">${L(UI.copy)}</span></button>` +
      `<pre tabindex="0" data-language="${e.lang}"><code>${highlight(e.code, e.lang)}</code></pre></div>`;
    const input = e.input != null
      ? `<div class="output stdin"><p class="output-label">${L(UI.input)}</p><pre>${esc(e.input)}</pre></div>` : "";
    const output = e.output != null
      ? `<div class="output"><p class="output-label">${L(e.error ? UI.compileError : UI.output)}</p><pre${e.error ? ' class="error"' : ""}>${esc(e.output)}</pre></div>` : "";
    const pitfall = e.pitfall
      ? `<aside class="pitfall" data-i18n-label="pitfall"><p><strong>${L(UI.pitfall)}:</strong> ${L(e.pitfall)}</p></aside>` : "";
    const links = e.see.map(seeLink).join("");
    const see = links ? `<p class="see"><span class="see-label">${L(UI.seeAlso)}</span>${links}</p>` : "";
    return `<section class="entry" data-entry="${key}" tabindex="-1" aria-labelledby="entry-${key}">
      ${e.pitfall ? `<span class="sticker" aria-hidden="true">${L(UI.watchOut)}</span>` : ""}
      <h2 id="entry-${key}">${L(e.title)}</h2>
      <p class="explain">${L(e.explain)}</p>
      ${code}${input}${output}${pitfall}${see}
    </section>`;
  }

  function renderTopic(t) {
    const area = t.area;
    const i = live.indexOf(t);
    const prev = live[i - 1], next = live[i + 1];
    const headers = t.headers.length
      ? `<ul class="includes">${t.headers.map((h) => `<li><code><span class="pp">#include</span> ${esc(h)}</code></li>`).join("")}</ul>` : "";
    return `<article class="topic" data-topic="${t.id}" tabindex="-1" aria-labelledby="topic-${t.id}" style="--hue:${area.hue}">
      <header class="hero">
        <a class="home" href="#" data-home><span aria-hidden="true">←</span> <span data-arrangement="map">${L(UI.map)}</span><span data-arrangement="trail">${L(UI.trail)}</span></a>
        <span class="hero-glyph" aria-hidden="true">${esc(t.glyph)}</span>
        <div class="hero-text">
          <p class="area-name">${L(area.name)}</p>
          <h1 id="topic-${t.id}">${L(t.name)}</h1>
          <p class="summary">${L(t.summary)}</p>
          ${headers}
        </div>
      </header>
      <nav class="chips" data-i18n-label="entries">${t.entries.map((e) => `<a href="#${t.id}--${e.id}">${L(e.title)}</a>`).join("")}</nav>
      <div class="cards">${t.entries.map((e) => renderEntry(t, e)).join("")}</div>
      <nav class="stops" data-i18n-label="topicOrder">
        ${prev ? `<a class="stop previous" href="#${prev.id}" rel="prev" style="--hue:${prev.area.hue}"><small>${L(UI.prevStop)}</small><span aria-hidden="true">←</span> ${L(prev.name)}</a>` : ""}
        ${next ? `<a class="stop next" href="#${next.id}" rel="next" style="--hue:${next.area.hue}"><small>${L(UI.nextStop)}</small>${L(next.name)} <span aria-hidden="true">→</span></a>` : ""}
      </nav>
    </article>`;
  }

  // Which entry is being read: highlighted in the rail's entry list.
  const visibleEntries = new Set();
  const entryObserver = new IntersectionObserver((items) => {
    for (const item of items) {
      if (item.isIntersecting) visibleEntries.add(item.target);
      else visibleEntries.delete(item.target);
    }
    const article = current && rendered.get(current);
    if (!article) return;
    const first = $$(".entry", article).find((el) => visibleEntries.has(el));
    if (!first) return;
    for (const a of $$("[data-entry-link]")) {
      if (a.dataset.entryLink === first.dataset.entry) a.setAttribute("aria-current", "location");
      else a.removeAttribute("aria-current");
    }
  }, { rootMargin: "-15% 0px -55% 0px" });

  // ---------- routing ----------
  const overview = $("[data-overview]");
  const topicView = $("[data-topic-view]");
  const host = $("[data-topic-host]");
  const rendered = new Map();
  let current = null;
  let overviewY = 0;
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  function setTitle() {
    const t = current && topicById.get(current);
    document.title = t ? `${plain(t.name[lang()])} · ${UI.title[lang()]}` : UI.title[lang()];
  }

  function showOverview() {
    const from = current;
    current = null;
    topicView.hidden = true;
    overview.hidden = false;
    for (const el of $$(".was-here")) el.classList.remove("was-here");
    if (from) {
      window.scrollTo(0, overviewY);
      const tiles = $$(`[data-tile="${from}"]`);
      tiles.forEach((el) => el.classList.add("was-here"));
      const shown = tiles.find((el) => el.offsetParent !== null);
      if (shown) {
        shown.focus({ preventScroll: true });
        const r = shown.getBoundingClientRect();
        if (r.top < 0 || r.bottom > innerHeight) shown.scrollIntoView({ block: "center" });
      }
    }
    setTitle();
  }

  function showTopic(topic, entryId, force) {
    if (current === null) overviewY = window.scrollY;
    const changed = current !== topic.id;
    current = topic.id;
    overview.hidden = true;
    topicView.hidden = false;
    let article = rendered.get(topic.id);
    if (!article) {
      host.insertAdjacentHTML("beforeend", renderTopic(topic));
      article = host.lastElementChild;
      rendered.set(topic.id, article);
      applyLabels(article);
      $$(".entry", article).forEach((el) => entryObserver.observe(el));
    }
    if (changed) {
      rendered.forEach((el, id) => { el.hidden = id !== topic.id; });
      markRail(topic);
    }
    const entry = entryId && $(`[data-entry="${topic.id}--${entryId}"]`, article);
    if (entry) {
      // Land the card just below the sticky chips (their height depends on how many rows they wrap to).
      const chips = $(".chips", article);
      const top = (parseFloat(getComputedStyle(chips).top) || 0) + chips.offsetHeight + 18;
      window.scrollTo(0, window.scrollY + entry.getBoundingClientRect().top - top);
      entry.focus({ preventScroll: true });
      entry.classList.remove("flash");
      void entry.offsetWidth;
      entry.classList.add("flash");
    } else if (changed || force) {
      window.scrollTo(0, 0);
      article.focus({ preventScroll: true });
    }
    setTitle();
  }

  function route(force) {
    const [topicId, entryId] = decodeURIComponent(location.hash.slice(1)).split(/--|\//); // "#topic--entry" (older links: "#topic/entry")
    const topic = topicById.get(topicId);
    if (!topic || topic.planned) showOverview();
    else showTopic(topic, entryId, force);
  }

  // ---------- search ----------
  const dialog = $("[data-search]");
  const query = $("[data-query]");
  const results = $("[data-results]");
  const status = $("[data-search-status]");
  let hits = [];
  let selected = 0;

  const index = [];
  for (const t of live) {
    const both = (f) => ({ en: norm(plain(f("en"))), pl: norm(plain(f("pl"))) });
    index.push({
      topic: t, entry: null, href: `#${t.id}`,
      title: both((l) => t.name[l]),
      text: both((l) => `${t.summary[l]} ${t.glyph} ${t.headers.join(" ")}`),
      code: "",
    });
    for (const e of t.entries) {
      index.push({
        topic: t, entry: e, href: `#${t.id}--${e.id}`,
        title: both((l) => e.title[l]),
        text: both((l) => `${e.explain[l]} ${e.pitfall ? e.pitfall[l] : ""}`),
        code: norm(e.code),
      });
    }
  }
  index.forEach((item, i) => { item.order = i; });

  /** Score of one query word for one item; inCode: show the matching code line under the result. */
  function scoreWord(item, word, l) {
    const title = item.title[l];
    let score = 0;
    if (title.startsWith(word)) score = 100;
    else if (new RegExp(`(^|[^a-z0-9])${escRe(word)}`).test(title)) score = 80;
    else if (title.includes(word)) score = 60;
    else if (item.title[l === "en" ? "pl" : "en"].includes(word)) score = 45;
    if (item.text[l].includes(word)) score += 30;
    const inCode = Math.min(3, item.code.split(word).length - 1);
    if (inCode) score += 15 + 5 * inCode;
    return { score, inCode: inCode > 0 && !title.includes(word) };
  }

  function search(q) {
    const words = norm(q).split(/\s+/).filter(Boolean);
    const l = lang();
    if (!words.length) return live.map((t) => ({ item: index.find((it) => it.topic === t && !it.entry), score: 1, codeWord: null }));
    const found = [];
    for (const item of index) {
      let score = 0, codeWord = null;
      for (const w of words) {
        const s = scoreWord(item, w, l);
        if (!s.score) { score = 0; break; }
        if (s.inCode && !codeWord) codeWord = w;
        score += s.score;
      }
      if (score) found.push({ item, score: score + (item.entry ? 0 : 5), codeWord });
    }
    found.sort((a, b) => b.score - a.score || a.item.order - b.item.order);
    return found.slice(0, 60);
  }

  function codeLine(code, word) {
    const line = code.split("\n").find((x) => norm(x).includes(word));
    if (!line) return "";
    const text = line.trim();
    const at = norm(text).indexOf(word);
    if (at < 0) return esc(text);
    return esc(text.slice(0, at)) + `<mark>${esc(text.slice(at, at + word.length))}</mark>` + esc(text.slice(at + word.length));
  }

  function renderResults() {
    const q = query.value.trim();
    hits = search(q);
    selected = 0;
    const l = lang();
    results.innerHTML = hits.map(({ item, codeWord }, i) => {
      const t = item.topic;
      const title = item.entry ? item.entry.title[l] : t.name[l];
      const where = item.entry ? `${t.area.name[l]} › ${t.name[l]}` : t.area.name[l];
      const match = codeWord ? `<code class="match">${codeLine(item.entry.code, codeWord)}</code>` : "";
      return `<li role="option" id="hit-${i}" aria-selected="${i === 0}" data-index="${i}"><span class="title">${title}</span><span class="where">${where}</span>${match}</li>`;
    }).join("");
    status.textContent = q && !hits.length
      ? (l === "en" ? `Nothing found for “${q}”.` : `Nic nie znaleziono dla „${q}”.`)
      : "";
    query.setAttribute("aria-activedescendant", hits.length ? "hit-0" : "");
  }

  function select(i) {
    if (!hits.length) return;
    selected = (i + hits.length) % hits.length;
    $$("[role=option]", results).forEach((el, j) => el.setAttribute("aria-selected", String(j === selected)));
    const el = $(`#hit-${selected}`);
    query.setAttribute("aria-activedescendant", el.id);
    el.scrollIntoView({ block: "nearest" });
  }

  function go(href) {
    if (location.hash === href) route(true);
    else location.hash = href;
  }

  function openHit(i) {
    const hit = hits[i];
    if (!hit) return;
    dialog.close();
    go(hit.item.href);
  }

  function openSearch() {
    if (!dialog.open) dialog.showModal();
    query.focus();
    query.select();
    renderResults();
  }

  query.addEventListener("input", renderResults);
  query.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowDown") { ev.preventDefault(); select(selected + 1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); select(selected - 1); }
    else if (ev.key === "Enter") { ev.preventDefault(); openHit(selected); }
  });
  results.addEventListener("click", (ev) => {
    const option = ev.target.closest("[role=option]");
    if (option) openHit(Number(option.dataset.index));
  });
  results.addEventListener("mousemove", (ev) => {
    const option = ev.target.closest("[role=option]");
    if (option && Number(option.dataset.index) !== selected) select(Number(option.dataset.index));
  });
  dialog.addEventListener("click", (ev) => { if (ev.target === dialog) dialog.close(); });

  // ---------- language, arrangement, labels ----------
  function applyLabels(scope = document) {
    const l = lang();
    for (const el of $$("[data-i18n-label]", scope)) el.setAttribute("aria-label", LABELS[el.dataset.i18nLabel][l]);
    for (const el of $$("[data-i18n-placeholder]", scope)) el.setAttribute("placeholder", LABELS[el.dataset.i18nPlaceholder][l]);
  }

  function setLanguage(l) {
    root.lang = l;
    try { localStorage.setItem(STORE.language, l); } catch (e) { /* private mode */ }
    applyLabels();
    setTitle();
    if (dialog.open) renderResults();
  }

  function setArrangement(a) {
    root.dataset.arrangement = a;
    try { localStorage.setItem(STORE.arrangement, a); } catch (e) { /* private mode */ }
    if (current) markRail(topicById.get(current));
  }

  for (const input of $$('input[name="language"]')) input.addEventListener("change", () => setLanguage(input.value));
  for (const input of $$('input[name="arrangement"]')) input.addEventListener("change", () => setArrangement(input.value));

  // ---------- clicks and keys ----------
  async function copy(button) {
    const text = button.dataset.copy;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.append(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    const label = button.firstElementChild;
    label.innerHTML = L(UI.copied);
    button.dataset.state = "copied";
    clearTimeout(button._timer);
    button._timer = setTimeout(() => {
      label.innerHTML = L(UI.copy);
      delete button.dataset.state;
    }, 1600);
  }

  document.addEventListener("click", (ev) => {
    const button = ev.target.closest(".copy");
    if (button) return void copy(button);
    if (ev.target.closest("[data-search-open]")) return void openSearch();
    const dot = ev.target.closest(".dot");
    if (dot) return void $(`#land-${dot.dataset.land}`).scrollIntoView({ behavior: "smooth", block: "start" });
    const link = ev.target.closest('a[href^="#"]');
    if (link && link.getAttribute("href") === location.hash && link.getAttribute("href") !== "#") {
      ev.preventDefault();
      route(true);
    }
  });
  document.addEventListener("pointerdown", () => {
    for (const el of $$(".was-here")) el.classList.remove("was-here");
  });

  const typing = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  document.addEventListener("keydown", (ev) => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k") {
      ev.preventDefault();
      openSearch();
    } else if (ev.key === "/" && !dialog.open && !typing(ev.target)) {
      ev.preventDefault();
      openSearch();
    } else if (ev.key === "Escape" && !dialog.open && current) {
      ev.preventDefault();
      location.hash = "";
    }
  });

  // ---------- start ----------
  function renderFooter() {
    const t = DATA.stats.topics, e = DATA.stats.entries;
    const inspired = '<a href="https://brokenpumpernickel.github.io/python-cheat-sheet/">Python Cheat Sheet</a>';
    $("[data-footer]").innerHTML = L({
      en: `${t} topics · ${e} entries · every snippet compiled and run with g++ (C++20) · design inspired by the ${inspired}`,
      pl: `${t} ${plPlural(t, "temat", "tematy", "tematów")} · ${e} ${plPlural(e, "hasło", "hasła", "haseł")} · ` +
        `każdy przykład skompilowany i uruchomiony w g++ (C++20) · wygląd wzorowany na ${inspired}`,
    });
  }

  for (const k of $$("[data-shortcut]")) k.textContent = SHORTCUT;
  renderMap();
  renderTrail();
  renderRail();
  renderFooter();
  applyLabels();
  window.addEventListener("hashchange", () => route());
  route();
})();
</script>
</body>
</html>
