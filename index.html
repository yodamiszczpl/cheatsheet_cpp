de>. Inaczej linker zgłosi <em>undefined reference to Robot::created<\/em>."},"see":[]},{"id":"outside-definition","title":{"en":"Methods outside the class","pl":"Metody poza klasą"},"explain":{"en":"In longer classes only the declarations stay inside, and the methods are defined below (or in a <code>.cpp<\/code> file) with the class name and <code>::<\/code> in front: <code>double Rectangle::area() const<\/code>. This is how code is split into a header and a source file.","pl":"W dłuższych klasach w środku zostają same deklaracje, a metody definiuje się niżej (albo w pliku <code>.cpp<\/code>), poprzedzając ich nazwy nazwą klasy i <code>::<\/code>, np. <code>double Rectangle::area() const<\/code>. Tak dzieli się kod na plik nagłówkowy i plik źródłowy."},"code":"class Rectangle {\npublic:\n    void resize(double w, double h);   // declarations only\n    double area() const;\n    void print() const;\n\nprivate:\n    double width = 1.0;\n    double height = 1.0;\n};\n\nvoid Rectangle::resize(double w, double h) {\n    width = w;\n    height = h;\n}\n\ndouble Rectangle::area() const {       // ClassName:: and the same const\n    return width * height;\n}\n\nvoid Rectangle::print() const {\n    std::cout << width << \" x \" << height << \" = \" << area() << '\\n';\n}\n\nint main() {\n    Rectangle r;\n    r.resize(3, 4.5);\n    r.print();\n}","lang":"cpp","codeTitle":null,"input":null,"output":"3 x 4.5 = 13.5","error":false,"pitfall":{"en":"Without <code>Rectangle::<\/code> you define an ordinary function, and the compiler complains that <code>width<\/code> was not declared. The <code>const<\/code> must be repeated in the definition too.","pl":"Bez <code>Rectangle::<\/code> definiujesz zwykłą funkcję i kompilator zgłasza, że nie zna <code>width<\/code>. <code>const<\/code> trzeba powtórzyć także w definicji."},"see":[{"topic":"headers","entry":null}]}]},{"id":"constructors","glyph":"T()","name":{"en":"Constructors","pl":"Konstruktory"},"summary":{"en":"Constructors and destructors: default and parameterised constructors, initialiser lists, overloading, destruction order, RAII, explicit.","pl":"Konstruktory (constructors) i destruktory: konstruktor domyślny i z parametrami, lista inicjalizacyjna, przeciążanie, kolejność niszczenia, RAII, explicit."},"headers":[],"planned":false,"entries":[{"id":"basic","title":{"en":"Writing a constructor","pl":"Pierwszy konstruktor"},"explain":{"en":"A constructor is a method with the class's name and no return type. It runs automatically when an object is created and sets it up, so an object never exists half-initialised. The arguments go in <code>()<\/code> or <code>{}<\/code> after the object's name.","pl":"Konstruktor (constructor) to metoda o nazwie klasy, bez typu zwracanego. Uruchamia się automatycznie przy tworzeniu obiektu i go przygotowuje, więc obiekt nigdy nie istnieje w połowie zainicjalizowany. Argumenty podajesz w <code>()<\/code> albo <code>{}<\/code> po nazwie obiektu."},"code":"class Student {\npublic:\n    Student(const std::string& n, int y) {   // class name, no return type\n        name = n;\n        year = y;\n        std::cout << \"created \" << name << '\\n';\n    }\n    void print() const { std::cout << name << \", year \" << year << '\\n'; }\n\nprivate:\n    std::string name;\n    int year;\n};\n\nint main() {\n    Student s(\"Ada\", 2);     // the constructor runs here\n    Student t{\"Alan\", 1};    // the same with braces\n    s.print();\n    t.print();\n}","lang":"cpp","codeTitle":null,"input":null,"output":"created Ada\ncreated Alan\nAda, year 2\nAlan, year 1","error":false,"pitfall":{"en":"Once you write any constructor, the compiler stops generating the default one, so <code>Student s;<\/code> no longer compiles. Add a default constructor yourself if you need it (see <em>Overloaded constructors<\/em>).","pl":"Gdy napiszesz jakikolwiek konstruktor, kompilator przestaje generować konstruktor domyślny (default constructor), więc <code>Student s;<\/code> przestaje się kompilować. Jeśli go potrzebujesz, dopisz go sam (zob. <em>Kilka konstruktorów<\/em>)."},"see":[{"topic":"classes","entry":null}]},{"id":"initializer-list","title":{"en":"Member initialiser list","pl":"Lista inicjalizacyjna"},"explain":{"en":"<code>: member(value), ...<\/code> before the constructor body initialises members directly instead of assigning them later. Use it always; it's required for <code>const<\/code> members, references and members without a default constructor. <code>id(id)<\/code> is fine: outside the parentheses is the member, inside is the parameter.","pl":"Lista inicjalizacyjna (member initialiser list) <code>: pole(wartość), ...<\/code> przed ciałem konstruktora inicjalizuje pola od razu, zamiast przypisywać je później. Używaj jej zawsze, a dla pól <code>const<\/code>, referencji i pól bez konstruktora domyślnego jest obowiązkowa. Zapis <code>id(id)<\/code> jest poprawny: przed nawiasem stoi pole, w nawiasie parametr."},"code":"class Order {\npublic:\n    Order(int id, double price, int qty)\n        : id(id), price(price), qty(qty) {}   // member(parameter)\n\n    void print() const {\n        std::cout << \"#\" << id << \": \" << price * qty << '\\n';\n    }\n\nprivate:\n    const int id;     // const: can only be set in the list\n    double price;\n    int qty;\n};\n\nint main() {\n    Order o(17, 2.5, 4);\n    o.print();\n}","lang":"cpp","codeTitle":null,"input":null,"output":"#17: 10","error":false,"pitfall":{"en":"Members are initialised in the order they are <em>declared<\/em> in the class, not in the order of the list. If a member's initialiser uses a member declared <em>below<\/em> it, it reads garbage. g++ warns about a mismatched order (<code>-Wreorder<\/code>).","pl":"Pola są inicjalizowane w kolejności <em>deklaracji<\/em> w klasie, a nie w kolejności na liście. Jeśli inicjalizacja pola korzysta z pola zadeklarowanego <em>niżej<\/em>, odczyta śmieci. g++ ostrzega o niezgodnej kolejności (<code>-Wreorder<\/code>)."},"see":[]},{"id":"overloaded","title":{"en":"Overloaded constructors","pl":"Kilka konstruktorów"},"explain":{"en":"A class can have several constructors with different parameters; the arguments pick one. <code>= default<\/code> keeps the compiler-generated default constructor, a default member initialiser (<code>double w = 1.0;<\/code>) is used when a constructor doesn't set that member, and <code>: Rect(side, side)<\/code> delegates to another constructor.","pl":"Klasa może mieć kilka konstruktorów z różnymi parametrami, a argumenty decydują, który się wywoła (przeciążanie, overloading). <code>= default<\/code> zostawia konstruktor domyślny wygenerowany przez kompilator, domyślny inicjalizator pola (<code>double w = 1.0;<\/code>) działa, gdy konstruktor nie ustawia tego pola, a <code>: Rect(side, side)<\/code> przekazuje pracę innemu konstruktorowi (delegating constructor)."},"code":"class Rect {\npublic:\n    Rect() = default;                         // uses the defaults below\n    Rect(double w, double h) : w(w), h(h) {}\n    Rect(double side) : Rect(side, side) {}   // delegates to Rect(w, h)\n\n    double area() const { return w * h; }\n\nprivate:\n    double w = 1.0;                           // default member initialisers\n    double h = 1.0;\n};\n\nint main() {\n    Rect a;\n    Rect b(2, 3);\n    Rect c(4);\n    std::cout << a.area() << ' ' << b.area() << ' ' << c.area() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"1 6 16","error":false,"pitfall":{"en":"<code>Rect a();<\/code> does not create an object: it declares a function returning <code>Rect<\/code> (the \"most vexing parse\"). Write <code>Rect a;<\/code> or <code>Rect a{};<\/code>.","pl":"<code>Rect a();<\/code> nie tworzy obiektu, tylko deklaruje funkcję zwracającą <code>Rect<\/code> (tzw. „most vexing parse”). Pisz <code>Rect a;<\/code> albo <code>Rect a{};<\/code>."},"see":[{"topic":"functions","entry":null}]},{"id":"destructor","title":{"en":"Destructor and destruction order","pl":"Destruktor i kolejność niszczenia"},"explain":{"en":"The destructor <code>~ClassName()<\/code> runs automatically when an object dies, e.g. at the end of its <code>{ }<\/code> block. Local objects are destroyed in reverse order of creation: last created, first destroyed. A destructor has no parameters, and you never call it yourself.","pl":"Destruktor (destructor) <code>~NazwaKlasy()<\/code> uruchamia się automatycznie, gdy obiekt przestaje istnieć, np. na końcu bloku <code>{ }<\/code>. Obiekty lokalne są niszczone w odwrotnej kolejności niż powstały: ostatni utworzony ginie pierwszy. Destruktor nie ma parametrów i nigdy nie wywołujesz go sam."},"code":"class Noisy {\npublic:\n    Noisy(const std::string& n) : name(n) { std::cout << \"+ \" << name << '\\n'; }\n    ~Noisy() { std::cout << \"- \" << name << '\\n'; }   // destructor\n\nprivate:\n    std::string name;\n};\n\nint main() {\n    Noisy a(\"a\");\n    {\n        Noisy b(\"b\");\n        Noisy c(\"c\");\n    }                     // c and b die here, in reverse order\n    std::cout << \"end of main\\n\";\n}                         // a dies here","lang":"cpp","codeTitle":null,"input":null,"output":"+ a\n+ b\n+ c\n- c\n- b\nend of main\n- a","error":false,"pitfall":{"en":"An object created with <code>new<\/code> is destroyed only by <code>delete<\/code>. Forget it and the destructor never runs (a memory leak). Prefer local objects, containers and smart pointers.","pl":"Obiekt utworzony przez <code>new<\/code> zniszczy dopiero <code>delete<\/code>. Jeśli o nim zapomnisz, destruktor nigdy się nie wykona (wyciek pamięci, memory leak). Wybieraj obiekty lokalne, kontenery i inteligentne wskaźniki."},"see":[{"topic":"dynamic-memory","entry":null}]},{"id":"raii","title":{"en":"RAII","pl":"RAII"},"explain":{"en":"RAII (Resource Acquisition Is Initialisation): acquire a resource (memory, a file, a lock, a connection) in the constructor and release it in the destructor. The destructor runs however the block ends, by <code>return<\/code> or by an exception, so the resource can't leak. <code>std::vector<\/code>, <code>std::string<\/code>, <code>std::ifstream<\/code> and smart pointers all work this way.","pl":"RAII (Resource Acquisition Is Initialization, „pozyskanie zasobu jest inicjalizacją”): konstruktor zajmuje zasób (pamięć, plik, blokadę, połączenie), a destruktor go zwalnia. Destruktor wykona się bez względu na to, jak kończy się blok, przez <code>return<\/code> czy przez wyjątek (exception), więc zasób nie wycieknie. Tak działają <code>std::vector<\/code>, <code>std::string<\/code>, <code>std::ifstream<\/code> i inteligentne wskaźniki (smart pointers)."},"code":"class Connection {\npublic:\n    Connection() { std::cout << \"connect\\n\"; }       // acquire\n    ~Connection() { std::cout << \"disconnect\\n\"; }   // release\n};\n\nvoid work(bool fail) {\n    Connection c;\n    if (fail) {\n        throw std::runtime_error(\"network error\");\n    }\n    std::cout << \"working\\n\";\n}                             // c is destroyed here either way\n\nint main() {\n    work(false);\n    try {\n        work(true);\n    } catch (const std::exception& e) {\n        std::cout << \"caught: \" << e.what() << '\\n';\n    }\n}","lang":"cpp","codeTitle":null,"input":null,"output":"connect\nworking\ndisconnect\nconnect\ndisconnect\ncaught: network error","error":false,"pitfall":null,"see":[{"topic":"smart-pointers","entry":null},{"topic":"exceptions","entry":null},{"topic":"files","entry":null}]},{"id":"explicit","title":{"en":"explicit constructors","pl":"Konstruktory explicit"},"explain":{"en":"A constructor with one parameter also works as an implicit conversion: without <code>explicit<\/code>, <code>printDistance(5.5)<\/code> would quietly build a <code>Meters<\/code> from a <code>double<\/code>. <code>explicit<\/code> turns that off, so the conversion must be written out. Make one-argument constructors <code>explicit<\/code> unless the conversion is really natural.","pl":"Konstruktor z jednym parametrem działa też jako niejawna konwersja (implicit conversion): bez <code>explicit<\/code> wywołanie <code>printDistance(5.5)<\/code> po cichu zbudowałoby <code>Meters<\/code> z <code>double<\/code>. <code>explicit<\/code> to wyłącza i konwersję trzeba zapisać jawnie. Konstruktory z jednym argumentem oznaczaj jako <code>explicit<\/code>, chyba że konwersja jest naprawdę naturalna."},"code":"class Meters {\npublic:\n    explicit Meters(double v) : value(v) {}\n    double get() const { return value; }\n\nprivate:\n    double value;\n};\n\nvoid printDistance(Meters m) {\n    std::cout << m.get() << \" m\\n\";\n}\n\nint main() {\n    printDistance(Meters(5.5));   // OK: the conversion is visible\n    // printDistance(5.5);        // error: the constructor is explicit\n    // Meters m = 3.0;            // error too\n}","lang":"cpp","codeTitle":null,"input":null,"output":"5.5 m","error":false,"pitfall":{"en":"Without <code>explicit<\/code>, a class with <code>Stack(int capacity)<\/code> lets <code>s = 10;<\/code> compile: it builds a new, empty stack of capacity 10 and assigns it to <code>s<\/code>, wiping out its contents.","pl":"Bez <code>explicit<\/code> w klasie z konstruktorem <code>Stack(int capacity)<\/code> kompiluje się <code>s = 10;<\/code>: powstaje nowy, pusty stos o pojemności 10, który zastępuje całą zawartość <code>s<\/code>."},"see":[]}]},{"id":"operator-overloading","glyph":"op+","name":{"en":"Operator overloading","pl":"Przeciążanie operatorów"},"summary":{"en":"Operators for your own types: arithmetic (+, +=), comparisons (==, &lt;, &lt;=&gt;), operator&lt;&lt; for printing, operator[], member or free function.","pl":"Przeciążanie operatorów (operator overloading): arytmetyka (+, +=), porównania (==, &lt;, &lt;=&gt;), operator&lt;&lt; do wypisywania, operator[], metoda czy wolna funkcja."},"headers":[],"planned":false,"entries":[{"id":"arithmetic","title":{"en":"+ and +=","pl":"+ i +="},"explain":{"en":"An operator is a function named <code>operator+<\/code>, <code>operator+=<\/code> and so on. Write <code>+=<\/code> as a method that changes <code>*this<\/code> and returns it by reference, then <code>+<\/code> as a free function built on it: take the left operand by value (a copy), add to it and return it.","pl":"Operator to zwykła funkcja o nazwie <code>operator+<\/code>, <code>operator+=<\/code> itd. Napisz <code>+=<\/code> jako metodę, która zmienia <code>*this<\/code> i zwraca go przez referencję (reference), a <code>+<\/code> jako wolną funkcję (free function) opartą na <code>+=<\/code>: weź lewy argument przez wartość (kopię), dodaj do niego i go zwróć."},"code":"struct Vec2 {\n    double x = 0;\n    double y = 0;\n\n    Vec2& operator+=(const Vec2& o) {     // member: changes this object\n        x += o.x;\n        y += o.y;\n        return *this;\n    }\n};\n\nVec2 operator+(Vec2 a, const Vec2& b) {   // free: returns a new object\n    a += b;                               // a is a copy, so this is safe\n    return a;\n}\n\nint main() {\n    Vec2 p{1, 2};\n    Vec2 q{3, 4};\n    Vec2 r = p + q;                       // p and q stay unchanged\n    std::cout << r.x << ' ' << r.y << '\\n';\n    r += Vec2{10, 10};\n    std::cout << r.x << ' ' << r.y << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"4 6\n14 16","error":false,"pitfall":{"en":"<code>+<\/code> must return a new object by value. Returning a reference to a local (<code>Vec2&amp; operator+<\/code>) leaves a dangling reference, and a <code>+<\/code> that changes its left operand surprises everyone.","pl":"<code>+<\/code> musi zwracać nowy obiekt przez wartość. Zwrócenie referencji do zmiennej lokalnej (<code>Vec2&amp; operator+<\/code>) daje wiszącą referencję (dangling reference), a <code>+<\/code>, który zmienia swój lewy argument, zaskoczy każdego."},"see":[{"topic":"classes","entry":"this"}]},{"id":"printing","title":{"en":"operator&lt;&lt; for printing","pl":"operator&lt;&lt; do wypisywania"},"explain":{"en":"To print an object with <code>std::cout &lt;&lt; x<\/code>, write a free function <code>std::ostream&amp; operator&lt;&lt;(std::ostream&amp; os, const T&amp; x)<\/code> that writes to <code>os<\/code> and returns it. Declared as a <code>friend<\/code> inside the class, it can read private members.","pl":"Żeby wypisać obiekt przez <code>std::cout &lt;&lt; x<\/code>, napisz wolną funkcję <code>std::ostream&amp; operator&lt;&lt;(std::ostream&amp; os, const T&amp; x)<\/code>, która pisze do <code>os<\/code> i go zwraca. Zadeklarowana wewnątrz klasy jako <code>friend<\/code> (funkcja zaprzyjaźniona) ma dostęp do pól prywatnych."},"code":"class Fraction {\npublic:\n    Fraction(int num, int den) : num(num), den(den) {}\n\n    friend std::ostream& operator<<(std::ostream& os, const Fraction& f) {\n        return os << f.num << '/' << f.den;   // write, then return the stream\n    }\n\nprivate:\n    int num;\n    int den;\n};\n\nint main() {\n    Fraction half(1, 2);\n    std::cout << \"half = \" << half << \", third = \" << Fraction(1, 3) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"half = 1/2, third = 1/3","error":false,"pitfall":{"en":"Take and return the stream by reference (<code>std::ostream&amp;<\/code>): streams can't be copied, and returning <code>os<\/code> is what lets <code>std::cout &lt;&lt; a &lt;&lt; b<\/code> chain. Don't print <code>'\\n'<\/code> inside; let the caller decide where lines end.","pl":"Strumień przyjmuj i zwracaj przez referencję (<code>std::ostream&amp;<\/code>): strumieni nie da się kopiować, a zwrócenie <code>os<\/code> pozwala łączyć <code>std::cout &lt;&lt; a &lt;&lt; b<\/code>. Nie wypisuj w środku <code>'\\n'<\/code>, niech o końcu linii decyduje wywołujący."},"see":[{"topic":"io","entry":null}]},{"id":"comparison","title":{"en":"== and &lt;","pl":"== i &lt;"},"explain":{"en":"<code>==<\/code> decides equality, and <code>&lt;<\/code> is what <code>std::sort<\/code>, <code>std::set<\/code> and <code>std::map<\/code> use to order your type. <code>std::tie<\/code> compares several fields in turn, like words in a dictionary. Since C++20, <code>a != b<\/code> is rewritten as <code>!(a == b)<\/code> automatically.","pl":"<code>==<\/code> sprawdza równość, a <code>&lt;<\/code> to operator, którego <code>std::sort<\/code>, <code>std::set<\/code> i <code>std::map<\/code> używają do porządkowania twojego typu. <code>std::tie<\/code> porównuje kilka pól po kolei, jak słowa w słowniku. Od C++20 <code>a != b<\/code> jest automatycznie zamieniane na <code>!(a == b)<\/code>."},"code":"struct Date {\n    int year, month, day;\n};\n\nbool operator==(const Date& a, const Date& b) {\n    return a.year == b.year && a.month == b.month && a.day == b.day;\n}\n\nbool operator<(const Date& a, const Date& b) {\n    return std::tie(a.year, a.month, a.day) < std::tie(b.year, b.month, b.day);\n}\n\nint main() {\n    std::vector<Date> v{{2024, 5, 1}, {2023, 12, 24}, {2024, 1, 15}};\n    std::sort(v.begin(), v.end());               // uses operator<\n    for (const Date& d : v) {\n        std::cout << d.year << '-' << d.month << '-' << d.day << '\\n';\n    }\n    std::cout << std::boolalpha << (v[0] == Date{2023, 12, 24}) << ' '\n              << (v[0] != v[1]) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"2023-12-24\n2024-1-15\n2024-5-1\ntrue true","error":false,"pitfall":{"en":"<code>a.year &lt; b.year &amp;&amp; a.month &lt; b.month<\/code> is not a correct ordering: by that rule December 2023 is <em>not<\/em> less than January 2024. Compare field by field with <code>std::tie<\/code>, or use <code>&lt;=&gt;<\/code> (next card).","pl":"<code>a.year &lt; b.year &amp;&amp; a.month &lt; b.month<\/code> to błędne porównanie: według niego grudzień 2023 <em>nie jest<\/em> mniejszy od stycznia 2024. Porównuj pole po polu przez <code>std::tie<\/code> albo użyj <code>&lt;=&gt;<\/code> (następna karta)."},"see":[{"topic":"sorting","entry":null},{"topic":"pair-tuple","entry":null}]},{"id":"spaceship","title":{"en":"&lt;=&gt; (C++20)","pl":"&lt;=&gt; (C++20)"},"explain":{"en":"In C++20 one defaulted line, <code>auto operator&lt;=&gt;(const T&amp;) const = default;<\/code>, gives all six comparisons: <code>&lt;<\/code>, <code>&lt;=<\/code>, <code>&gt;<\/code>, <code>&gt;=<\/code> come from <code>&lt;=&gt;<\/code>, and <code>==<\/code>, <code>!=<\/code> from an implicitly added <code>==<\/code>. Members are compared in declaration order, so put the most important one first.","pl":"W C++20 jedna linia <code>auto operator&lt;=&gt;(const T&amp;) const = default;<\/code> daje wszystkie sześć porównań: <code>&lt;<\/code>, <code>&lt;=<\/code>, <code>&gt;<\/code>, <code>&gt;=<\/code> biorą się z operatora <code>&lt;=&gt;<\/code> (spaceship, „statek kosmiczny”), a <code>==<\/code> i <code>!=<\/code> z automatycznie dodanego <code>==<\/code>. Pola są porównywane w kolejności deklaracji, więc najważniejsze umieść pierwsze."},"code":"struct Time {\n    int h = 0;\n    int m = 0;\n    auto operator<=>(const Time&) const = default;   // all six comparisons\n};\n\nint main() {\n    Time a{9, 30};\n    Time b{14, 5};\n    std::cout << std::boolalpha;\n    std::cout << (a < b) << ' ' << (a == b) << ' ' << (a >= b) << '\\n';\n\n    std::vector<Time> v{b, a, {9, 5}};\n    std::sort(v.begin(), v.end());\n    for (const Time& t : v) {\n        std::cout << std::format(\"{:02}:{:02}\\n\", t.h, t.m);\n    }\n}","lang":"cpp","codeTitle":null,"input":null,"output":"true false false\n09:05\n09:30\n14:05","error":false,"pitfall":{"en":"If you write <code>&lt;=&gt;<\/code> by hand instead of <code>= default<\/code>, <code>==<\/code> is <em>not<\/em> generated: define <code>operator==<\/code> as well (it can be <code>= default<\/code>).","pl":"Jeśli piszesz <code>&lt;=&gt;<\/code> ręcznie zamiast <code>= default<\/code>, operator <code>==<\/code> <em>nie<\/em> zostanie wygenerowany: zdefiniuj też <code>operator==<\/code> (może być <code>= default<\/code>)."},"see":[{"topic":"sorting","entry":null}]},{"id":"subscript","title":{"en":"operator[]","pl":"operator[]"},"explain":{"en":"<code>operator[]<\/code> makes an object indexable like an array. Return a reference (<code>int&amp;<\/code>) so that <code>s[0] = 10<\/code> can write through it, and add a <code>const<\/code> version returning <code>const int&amp;<\/code> so that <code>const<\/code> objects can be read too.","pl":"<code>operator[]<\/code> pozwala indeksować obiekt jak tablicę. Zwracaj referencję (<code>int&amp;<\/code>), żeby <code>s[0] = 10<\/code> mogło zapisywać, i dodaj wersję <code>const<\/code> zwracającą <code>const int&amp;<\/code>, żeby dało się też czytać z obiektów <code>const<\/code>."},"code":"class Scores {\npublic:\n    explicit Scores(std::size_t n) : data(n, 0) {}\n    int& operator[](std::size_t i) { return data[i]; }              // read/write\n    const int& operator[](std::size_t i) const { return data[i]; }  // read only\n    std::size_t size() const { return data.size(); }\n\nprivate:\n    std::vector<int> data;\n};\n\nint sum(const Scores& s) {          // s is const: uses the const version\n    int total = 0;\n    for (std::size_t i = 0; i < s.size(); ++i) {\n        total += s[i];\n    }\n    return total;\n}\n\nint main() {\n    Scores s(3);\n    s[0] = 10;                      // writes through the returned int&\n    s[2] = 5;\n    std::cout << s[0] << ' ' << sum(s) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"10 15","error":false,"pitfall":{"en":"If <code>operator[]<\/code> returns <code>int<\/code> (by value), <code>s[0] = 10<\/code> doesn't compile. With class-type elements such as <code>std::string<\/code> it's worse: the assignment compiles, changes a temporary copy, and the object stays the same.","pl":"Jeśli <code>operator[]<\/code> zwraca <code>int<\/code> (przez wartość), <code>s[0] = 10<\/code> się nie skompiluje. Przy elementach typu klasowego, np. <code>std::string<\/code>, jest gorzej: przypisanie się kompiluje, zmienia tymczasową kopię, a obiekt zostaje bez zmian."},"see":[{"topic":"vector","entry":null}]},{"id":"member-vs-free","title":{"en":"Member or free function?","pl":"Metoda czy wolna funkcja?"},"explain":{"en":"A member operator always has your object on the left (<code>*this<\/code>), so <code>price * 3<\/code> can be a method but <code>3 * price<\/code> must be a free function. Rule of thumb: <code>=<\/code>, <code>[]<\/code>, <code>()<\/code> and <code>-&gt;<\/code> must be members, <code>+=<\/code> and friends usually are; <code>&lt;&lt;<\/code>, <code>&gt;&gt;<\/code> and symmetric ones (<code>+<\/code>, <code>==<\/code>, <code>&lt;<\/code>) are usually free functions (<code>friend<\/code> if needed).","pl":"W operatorze-metodzie lewym argumentem jest zawsze twój obiekt (<code>*this<\/code>), więc <code>price * 3<\/code> może być metodą, ale <code>3 * price<\/code> musi być wolną funkcją. Zasada: <code>=<\/code>, <code>[]<\/code>, <code>()<\/code> i <code>-&gt;<\/code> muszą być metodami, operatory w rodzaju <code>+=<\/code> zwykle nimi są, a <code>&lt;&lt;<\/code>, <code>&gt;&gt;<\/code> i operatory symetryczne (<code>+<\/code>, <code>==<\/code>, <code>&lt;<\/code>) to zwykle wolne funkcje (w razie potrzeby <code>friend<\/code>)."},"code":"class Money {\npublic:\n    explicit Money(int cents) : cents(cents) {}\n    Money operator*(int k) const { return Money(cents * k); }   // money * 3\n    int value() const { return cents; }\n\nprivate:\n    int cents;\n};\n\nMoney operator*(int k, const Money& m) {   // 3 * money: must be free\n    return m * k;\n}\n\nint main() {\n    Money price(250);\n    std::cout << (price * 3).value() << ' ' << (2 * price).value() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"750 500","error":false,"pitfall":null,"see":[]}]},{"id":"copy-move","glyph":"&&","name":{"en":"Copy &amp; move","pl":"Kopiowanie i przenoszenie"},"summary":{"en":"Copying and moving objects: copy constructor and assignment, shallow vs deep copy, rules of three, five and zero, std::move, = default and = delete.","pl":"Kopiowanie i przenoszenie obiektów: konstruktor kopiujący i przypisanie, płytka i głęboka kopia, reguły trzech, pięciu i zera, std::move, = default i = delete."},"headers":["<utility>"],"planned":false,"entries":[{"id":"copy-constructor","title":{"en":"Copy constructor and assignment","pl":"Konstruktor kopiujący i przypisanie"},"explain":{"en":"The copy constructor <code>T(const T&amp;)<\/code> creates a <em>new<\/em> object as a copy: <code>Song b = a;<\/code>, <code>Song b(a);<\/code>, or passing by value. Copy assignment <code>T&amp; operator=(const T&amp;)<\/code> overwrites an object that <em>already exists<\/em>: <code>c = a;<\/code>. If you don't write them, the compiler generates both, copying member by member.","pl":"Konstruktor kopiujący (copy constructor) <code>T(const T&amp;)<\/code> tworzy <em>nowy<\/em> obiekt jako kopię: <code>Song b = a;<\/code>, <code>Song b(a);<\/code> albo przy przekazaniu przez wartość. Przypisanie kopiujące (copy assignment) <code>T&amp; operator=(const T&amp;)<\/code> nadpisuje obiekt, który <em>już istnieje<\/em>: <code>c = a;<\/code>. Jeśli ich nie napiszesz, kompilator wygeneruje oba i skopiuje pole po polu."},"code":"struct Song {\n    std::string title;\n\n    explicit Song(const std::string& t) : title(t) {}\n    Song(const Song& other) : title(other.title) {   // copy constructor\n        std::cout << \"copy constructor\\n\";\n    }\n    Song& operator=(const Song& other) {             // copy assignment\n        title = other.title;\n        std::cout << \"copy assignment\\n\";\n        return *this;\n    }\n};\n\nvoid play(Song s) {\n    std::cout << \"playing \" << s.title << '\\n';\n}\n\nint main() {\n    Song a(\"Intro\");\n    Song b = a;      // new object: copy constructor\n    Song c(\"Outro\");\n    c = a;           // existing object: copy assignment\n    play(a);         // by value: copy constructor\n}","lang":"cpp","codeTitle":null,"input":null,"output":"copy constructor\ncopy assignment\ncopy constructor\nplaying Intro","error":false,"pitfall":{"en":"Passing an object by value (<code>void play(Song s)<\/code>) silently copies it, which is slow for big objects. Pass <code>const Song&amp;<\/code> unless the function needs its own copy.","pl":"Przekazanie obiektu przez wartość (<code>void play(Song s)<\/code>) po cichu go kopiuje, co dla dużych obiektów jest wolne. Przekazuj <code>const Song&amp;<\/code>, chyba że funkcja potrzebuje własnej kopii."},"see":[{"topic":"functions","entry":null},{"topic":"references","entry":null}]},{"id":"shallow-deep","title":{"en":"Shallow vs deep copy","pl":"Płytka i głęboka kopia"},"explain":{"en":"The generated copy copies each member as it is. For a pointer member that is a <em>shallow copy<\/em>: both objects point at the same memory, so changing one changes the other. A <em>deep copy<\/em> allocates new memory and copies the contents; <code>std::vector<\/code> and <code>std::string<\/code> do that for you.","pl":"Wygenerowana kopia kopiuje każde pole tak, jak jest. Dla pola-wskaźnika to płytka kopia (shallow copy): oba obiekty wskazują tę samą pamięć, więc zmiana jednego zmienia drugi. Głęboka kopia (deep copy) przydziela nową pamięć i kopiuje zawartość; <code>std::vector<\/code> i <code>std::string<\/code> robią to za ciebie."},"code":"struct Shallow {\n    int* data;\n};\n\nint main() {\n    Shallow a{new int(1)};\n    Shallow b = a;              // copies the pointer, not the int\n    *b.data = 99;\n    std::cout << *a.data << '\\n';                            // a changed too\n    std::cout << std::boolalpha << (a.data == b.data) << '\\n';\n    delete a.data;              // only once: there is just one int\n}","lang":"cpp","codeTitle":null,"input":null,"output":"99\ntrue","error":false,"pitfall":{"en":"If <code>Shallow<\/code> also had a destructor <code>~Shallow() { delete data; }<\/code>, both <code>a<\/code> and <code>b<\/code> would delete the same int: a double delete, which is undefined behaviour (often a crash). A class that owns raw memory needs its own copy operations: the rule of three.","pl":"Gdyby <code>Shallow<\/code> miał jeszcze destruktor <code>~Shallow() { delete data; }<\/code>, <code>a<\/code> i <code>b<\/code> usunęłyby tę samą liczbę: podwójne <code>delete<\/code> (double delete), czyli niezdefiniowane zachowanie (undefined behaviour), często kończące się awarią. Klasa, która posiada surową pamięć, potrzebuje własnych operacji kopiowania: reguły trzech (rule of three)."},"see":[{"topic":"dynamic-memory","entry":null}]},{"id":"rule-of-three","title":{"en":"Deep copy: rule of three","pl":"Głęboka kopia: reguła trzech"},"explain":{"en":"Rule of three: if a class needs its own destructor (because it owns a resource), it also needs its own copy constructor and copy assignment. Here every <code>Buffer<\/code> owns a separate array, so copies are independent. In real code use <code>std::vector<\/code>, which does exactly this inside.","pl":"Reguła trzech (rule of three): jeśli klasa potrzebuje własnego destruktora (bo posiada zasób), potrzebuje też własnego konstruktora kopiującego i przypisania kopiującego. Tutaj każdy <code>Buffer<\/code> ma osobną tablicę, więc kopie są niezależne. W prawdziwym kodzie używaj <code>std::vector<\/code>, który w środku robi dokładnie to samo."},"code":"class Buffer {\npublic:\n    explicit Buffer(std::size_t n) : n(n), data(new int[n]{}) {}\n    ~Buffer() { delete[] data; }                        // 1. destructor\n    Buffer(const Buffer& o) : n(o.n), data(new int[n]) {   // 2. copy constructor\n        std::copy(o.data, o.data + n, data);            // its own new array\n    }\n    Buffer& operator=(const Buffer& o) {                // 3. copy assignment\n        int* fresh = new int[o.n];                      // copy first...\n        std::copy(o.data, o.data + o.n, fresh);\n        delete[] data;                                  // ...then free the old one\n        data = fresh;\n        n = o.n;\n        return *this;\n    }\n    int& operator[](std::size_t i) { return data[i]; }\n\nprivate:\n    std::size_t n;\n    int* data;\n};\n\nint main() {\n    Buffer a(3);\n    a[0] = 1;\n    Buffer b = a;    // copy constructor\n    b[0] = 99;\n    Buffer c(1);\n    c = a;           // copy assignment\n    std::cout << a[0] << ' ' << b[0] << ' ' << c[0] << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"1 99 1","error":false,"pitfall":{"en":"The naive assignment <code>delete[] data; data = new int[o.n]; ...<\/code> breaks on self-assignment <code>a = a;<\/code>: it frees the array before copying from it. Allocate and copy first, then delete the old array (as above), or check <code>if (this != &amp;o)<\/code>.","pl":"Naiwne przypisanie <code>delete[] data; data = new int[o.n]; ...<\/code> psuje się przy przypisaniu do samego siebie <code>a = a;<\/code>: zwalnia tablicę, zanim z niej skopiuje. Najpierw przydziel i skopiuj, potem usuń starą tablicę (jak wyżej), albo sprawdź <code>if (this != &amp;o)<\/code>."},"see":[{"topic":"dynamic-memory","entry":null},{"topic":"vector","entry":null}]},{"id":"move","title":{"en":"Move constructor and std::move","pl":"Konstruktor przenoszący i std::move"},"explain":{"en":"A move constructor <code>T(T&amp;&amp; other)<\/code> takes over the resources of an object that is about to disappear instead of copying them, which is much cheaper for strings and vectors. Temporaries are moved automatically; <code>std::move(x)<\/code> says \"I no longer need <code>x<\/code>\". Mark it <code>noexcept<\/code>, so that <code>std::vector<\/code> moves its elements when it grows.","pl":"Konstruktor przenoszący (move constructor) <code>T(T&amp;&amp; other)<\/code> przejmuje zasoby obiektu, który i tak zaraz zniknie, zamiast je kopiować, co dla napisów i wektorów jest dużo tańsze. Obiekty tymczasowe są przenoszone automatycznie, a <code>std::move(x)<\/code> mówi: „już nie potrzebuję <code>x<\/code>”. Oznacz go <code>noexcept<\/code>, wtedy <code>std::vector<\/code> przy powiększaniu przenosi elementy zamiast je kopiować."},"code":"class Track {\npublic:\n    explicit Track(const std::string& t) : title(t) {}\n    Track(const Track& other) : title(other.title) {\n        std::cout << \"copy \" << title << '\\n';\n    }\n    Track(Track&& other) noexcept : title(std::move(other.title)) {\n        std::cout << \"move \" << title << '\\n';\n    }\n\nprivate:\n    std::string title;\n};\n\nint main() {\n    Track a(\"Intro\");\n    Track b = a;              // a is still needed: copy\n    Track c = std::move(a);   // a is no longer needed: move\n    std::vector<Track> v;\n    v.push_back(Track(\"Outro\"));   // a temporary: moved automatically\n}","lang":"cpp","codeTitle":null,"input":null,"output":"copy Intro\nmove Intro\nmove Outro","error":false,"pitfall":{"en":"<code>std::move<\/code> moves nothing by itself; it only allows a move. Afterwards the source is valid but unspecified (a moved-from <code>std::string<\/code> is usually empty): don't read it, only assign it a new value or let it go out of scope.","pl":"Samo <code>std::move<\/code> niczego nie przenosi, tylko pozwala na przeniesienie. Potem obiekt źródłowy jest poprawny, ale w nieokreślonym stanie (przeniesiony <code>std::string<\/code> jest zwykle pusty): nie czytaj go, możesz mu tylko przypisać nową wartość albo pozwolić mu zniknąć."},"see":[{"topic":"vector","entry":null},{"topic":"smart-pointers","entry":null}]},{"id":"rule-of-zero","title":{"en":"Rules of five and zero","pl":"Reguły pięciu i zera"},"explain":{"en":"Rule of five: a class that manages a resource by hand needs all five special members (destructor, copy constructor, copy assignment, move constructor, move assignment). Rule of zero, the better default: keep resources in members that manage themselves (<code>std::string<\/code>, <code>std::vector<\/code>, <code>std::unique_ptr<\/code>) and write none of them.","pl":"Reguła pięciu (rule of five): klasa, która sama zarządza zasobem, potrzebuje wszystkich pięciu funkcji specjalnych (destruktor, konstruktor kopiujący, przypisanie kopiujące, konstruktor przenoszący, przypisanie przenoszące). Reguła zera (rule of zero), lepszy wybór domyślny: trzymaj zasoby w polach, które same o siebie dbają (<code>std::string<\/code>, <code>std::vector<\/code>, <code>std::unique_ptr<\/code>), i nie pisz żadnej z tych funkcji."},"code":"class Playlist {   // rule of zero: no destructor, no copy or move code\npublic:\n    explicit Playlist(const std::string& n) : name(n) {}\n    void add(const std::string& song) { songs.push_back(song); }\n    void print() const {\n        std::cout << name << \" (\" << songs.size() << \")\\n\";\n    }\n\nprivate:\n    std::string name;                 // these members copy\n    std::vector<std::string> songs;   // and move themselves\n};\n\nint main() {\n    Playlist a(\"road trip\");\n    a.add(\"Intro\");\n    Playlist b = a;               // deep copy for free\n    b.add(\"Outro\");\n    Playlist c = std::move(b);    // move for free\n    a.print();\n    c.print();\n}","lang":"cpp","codeTitle":null,"input":null,"output":"road trip (1)\nroad trip (2)","error":false,"pitfall":{"en":"Don't add an empty destructor <code>~Playlist() {}<\/code> \"just in case\": declaring a destructor or a copy operation turns off the generated move operations, so every move silently becomes a copy.","pl":"Nie dopisuj pustego destruktora <code>~Playlist() {}<\/code> „na wszelki wypadek”: zadeklarowanie destruktora albo operacji kopiowania wyłącza generowane operacje przenoszenia i każde przeniesienie po cichu staje się kopią."},"see":[{"topic":"smart-pointers","entry":null}]},{"id":"default-delete","title":{"en":"= default and = delete","pl":"= default i = delete"},"explain":{"en":"<code>= default<\/code> asks for the compiler-generated version; <code>= delete<\/code> forbids the function, so any use is a compile error. Deleting the copy operations and defaulting the moves gives a move-only type, like <code>std::unique_ptr<\/code>. The class below also shows the signatures of all five special members.","pl":"<code>= default<\/code> prosi o wersję wygenerowaną przez kompilator, a <code>= delete<\/code> zabrania użycia funkcji: każde wywołanie to błąd kompilacji. Usunięcie kopiowania i domyślne przenoszenie daje typ, który można tylko przenosić (move-only), jak <code>std::unique_ptr<\/code>. Klasa poniżej pokazuje też sygnatury wszystkich pięciu funkcji specjalnych."},"code":"class Ticket {   // move-only, like std::unique_ptr\npublic:\n    explicit Ticket(int number) : number(number) {}\n    ~Ticket() = default;\n    Ticket(const Ticket&) = delete;              // no copies\n    Ticket& operator=(const Ticket&) = delete;\n    Ticket(Ticket&&) noexcept = default;         // moving is fine\n    Ticket& operator=(Ticket&&) noexcept = default;\n\n    int get() const { return number; }\n\nprivate:\n    int number;\n};\n\nint main() {\n    Ticket a(7);\n    // Ticket b = a;          // error: use of deleted function\n    Ticket c = std::move(a);\n    std::vector<Ticket> queue;\n    queue.push_back(std::move(c));\n    std::cout << \"ticket \" << queue[0].get() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"ticket 7","error":false,"pitfall":{"en":"<em>use of deleted function<\/em> usually means you tried to copy a move-only object, e.g. <code>v.push_back(t)<\/code> with a <code>std::unique_ptr<\/code>. Write <code>v.push_back(std::move(t))<\/code>, or pass it by reference.","pl":"Błąd <em>use of deleted function<\/em> zwykle oznacza próbę skopiowania obiektu, który można tylko przenosić, np. <code>v.push_back(t)<\/code> z <code>std::unique_ptr<\/code>. Napisz <code>v.push_back(std::move(t))<\/code> albo przekaż go przez referencję."},"see":[{"topic":"smart-pointers","entry":null}]}]},{"id":"inheritance","glyph":": B","name":{"en":"Inheritance","pl":"Dziedziczenie"},"summary":{"en":"Deriving classes: public inheritance, <code>protected<\/code>, calling the base constructor, overriding vs hiding, construction order, slicing.","pl":"Dziedziczenie (inheritance): dziedziczenie publiczne, <code>protected<\/code>, wywołanie konstruktora bazowego, nadpisywanie a ukrywanie, kolejność konstrukcji, wycinanie obiektu."},"headers":[],"planned":false,"entries":[{"id":"public-inheritance","title":{"en":"Public inheritance","pl":"Dziedziczenie publiczne"},"explain":{"en":"<code>class Dog : public Animal<\/code> makes <code>Dog<\/code> a derived class of the base class <code>Animal<\/code>: a <code>Dog<\/code> <em>is an<\/em> <code>Animal<\/code> and gets all its members, so you only add what is new. Use inheritance for real \"is-a\" relations; for \"has-a\" use a member instead.","pl":"<code>class Dog : public Animal<\/code> tworzy klasę pochodną (derived class) <code>Dog<\/code> z klasy bazowej (base class) <code>Animal<\/code>: <code>Dog<\/code> <em>jest<\/em> zwierzęciem i dostaje wszystkie jego składowe (members), więc dopisujesz tylko to, co nowe. Dziedziczenia używaj dla relacji „jest” (is-a); dla relacji „ma” (has-a) wystarczy zwykła składowa."},"code":"class Animal {\npublic:\n    std::string name;\n    void eat() const { std::cout << name << \" eats\\n\"; }\n};\n\nclass Dog : public Animal {\npublic:\n    void bark() const { std::cout << name << \" barks\\n\"; }\n};\n\nint main() {\n    Dog d;\n    d.name = \"Rex\";  // inherited member\n    d.eat();         // inherited method\n    d.bark();        // Dog's own method\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Rex eats\nRex barks","error":false,"pitfall":{"en":"In a <code>class<\/code>, inheritance is private by default: with <code>class Dog : Animal<\/code> the method <code>eat()<\/code> is hidden from everyone outside and <code>d.eat()<\/code> doesn't compile. Always write <code>public<\/code>. (In a <code>struct<\/code> the default is public.)","pl":"W <code>class<\/code> dziedziczenie jest domyślnie prywatne: przy <code>class Dog : Animal<\/code> metoda <code>eat()<\/code> jest niedostępna z zewnątrz i <code>d.eat()<\/code> się nie skompiluje. Zawsze pisz <code>public<\/code>. (W <code>struct<\/code> domyślne jest dziedziczenie publiczne.)"},"see":[{"topic":"classes","entry":null}]},{"id":"protected","title":{"en":"protected members","pl":"Składowe protected"},"explain":{"en":"<code>private<\/code> members are hidden even from derived classes. <code>protected<\/code> ones are visible inside derived classes but still hidden from the rest of the program. <code>public<\/code> ones are open to everyone.","pl":"Składowe <code>private<\/code> są ukryte nawet przed klasami pochodnymi. Składowe chronione (<code>protected<\/code>) są dostępne wewnątrz klas pochodnych, ale nadal niedostępne dla reszty programu. Składowe <code>public<\/code> są dostępne dla wszystkich."},"code":"class Account {\npublic:\n    double balance() const { return balance_; }\nprotected:\n    double balance_ = 0;  // visible in derived classes\n};\n\nclass Savings : public Account {\npublic:\n    void deposit(double x) { balance_ += x; }\n    void addInterest(double rate) { balance_ += balance_ * rate; }\n};\n\nint main() {\n    Savings s;\n    s.deposit(200);\n    s.addInterest(0.05);\n    std::cout << s.balance() << '\\n';\n    // s.balance_ = 0;  // error: 'balance_' is protected\n}","lang":"cpp","codeTitle":null,"input":null,"output":"210","error":false,"pitfall":{"en":"Private members are still inherited (they sit inside every <code>Savings<\/code> object); the derived class just can't name them. If it needs them, make them <code>protected<\/code> or, better, give the base a <code>protected<\/code> or <code>public<\/code> function that does the job.","pl":"Składowe prywatne też są dziedziczone (siedzą w każdym obiekcie <code>Savings<\/code>), tylko klasa pochodna nie ma do nich dostępu. Jeśli ich potrzebuje, zrób je <code>protected<\/code> albo, lepiej, dodaj w klasie bazowej funkcję <code>protected<\/code> lub <code>public<\/code>, która wykona tę pracę."},"see":[]},{"id":"base-constructor","title":{"en":"Calling the base constructor","pl":"Wywołanie konstruktora bazowego"},"explain":{"en":"The base part is built first, by a base constructor. To pass it arguments, call it at the start of the member initialiser list: <code>: Person(name), year_(year)<\/code>. If you don't, the base's default constructor is used.","pl":"Najpierw powstaje część bazowa, przez konstruktor klasy bazowej. Żeby przekazać mu argumenty, wywołaj go na początku listy inicjalizacyjnej (member initializer list): <code>: Person(name), year_(year)<\/code>. Jeśli tego nie zrobisz, zostanie użyty konstruktor domyślny klasy bazowej."},"code":"class Person {\npublic:\n    explicit Person(const std::string& name) : name_(name) {}\n    const std::string& name() const { return name_; }\nprivate:\n    std::string name_;\n};\n\nclass Student : public Person {\npublic:\n    Student(const std::string& name, int year)\n        : Person(name), year_(year) {}  // base first, then own members\n    void print() const {\n        std::cout << name() << \", year \" << year_ << '\\n';\n    }\nprivate:\n    int year_;\n};\n\nint main() {\n    Student s(\"Ola\", 2);\n    s.print();\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Ola, year 2","error":false,"pitfall":{"en":"If the base has no default constructor and you forget to call another one, you get <em>no matching function for call to 'Person::Person()'<\/em>. You also can't initialise base members yourself (<code>: name_(name)<\/code> is an error): pass the value to the base constructor.","pl":"Jeśli klasa bazowa nie ma konstruktora domyślnego, a zapomnisz wywołać inny, dostaniesz błąd <em>no matching function for call to 'Person::Person()'<\/em>. Nie możesz też sam inicjalizować składowych klasy bazowej (<code>: name_(name)<\/code> to błąd): przekaż wartość do konstruktora bazowego."},"see":[{"topic":"constructors","entry":null}]},{"id":"construction-order","title":{"en":"Construction and destruction order","pl":"Kolejność konstrukcji i destrukcji"},"explain":{"en":"A derived object is built from the inside out: the base class first, then the members (in declaration order), then the body of the derived constructor. Destruction runs in exactly the reverse order.","pl":"Obiekt pochodny jest budowany od środka: najpierw klasa bazowa, potem składowe (w kolejności deklaracji), na końcu ciało konstruktora klasy pochodnej. Destrukcja przebiega dokładnie w odwrotnej kolejności."},"code":"struct Part {\n    Part()  { std::cout << \"Part()\\n\"; }\n    ~Part() { std::cout << \"~Part()\\n\"; }\n};\n\nstruct Base {\n    Base()  { std::cout << \"Base()\\n\"; }\n    ~Base() { std::cout << \"~Base()\\n\"; }\n};\n\nstruct Derived : Base {\n    Part part;\n    Derived()  { std::cout << \"Derived()\\n\"; }\n    ~Derived() { std::cout << \"~Derived()\\n\"; }\n};\n\nint main() {\n    Derived d;\n    std::cout << \"--- using d ---\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Base()\nPart()\nDerived()\n--- using d ---\n~Derived()\n~Part()\n~Base()","error":false,"pitfall":{"en":"While the <code>Base<\/code> constructor runs, the <code>Derived<\/code> part doesn't exist yet, so a virtual function called there runs the <code>Base<\/code> version, not the override. The same holds in destructors.","pl":"Gdy działa konstruktor <code>Base<\/code>, części <code>Derived<\/code> jeszcze nie ma, więc wywołana w nim funkcja wirtualna (virtual function) uruchomi wersję z <code>Base<\/code>, a nie nadpisaną. To samo dotyczy destruktorów."},"see":[{"topic":"constructors","entry":null},{"topic":"polymorphism","entry":null}]},{"id":"overriding-vs-hiding","title":{"en":"Overriding vs hiding","pl":"Nadpisywanie a ukrywanie"},"explain":{"en":"A derived function with the same name <em>hides<\/em> every base function of that name, overloads included. <code>using Base::greet;<\/code> brings them back, and <code>Base::greet()<\/code> calls the base version. Only a <code>virtual<\/code> function is really <em>overridden<\/em>; a non-virtual one is picked by the static type, as the last line shows.","pl":"Funkcja w klasie pochodnej o tej samej nazwie <em>ukrywa<\/em> (hiding) wszystkie funkcje bazowe o tej nazwie, łącznie z przeciążeniami (overloads). <code>using Base::greet;<\/code> przywraca je, a <code>Base::greet()<\/code> wywołuje wersję bazową. Prawdziwe nadpisanie (overriding) działa tylko dla funkcji <code>virtual<\/code>; zwykłą funkcję wybiera typ statyczny, co widać w ostatniej linii."},"code":"struct Base {\n    void greet() const { std::cout << \"Base::greet\\n\"; }\n    void greet(const std::string& who) const { std::cout << \"Hi, \" << who << '\\n'; }\n};\n\nstruct Derived : Base {\n    using Base::greet;  // without it, greet(who) would be hidden\n    void greet() const {\n        std::cout << \"Derived::greet, then \";\n        Base::greet();  // call the base version\n    }\n};\n\nint main() {\n    Derived d;\n    d.greet();\n    d.greet(\"Ola\");\n    const Base& b = d;\n    b.greet();  // not virtual: the type of b decides\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Derived::greet, then Base::greet\nHi, Ola\nBase::greet","error":false,"pitfall":{"en":"Without <code>virtual<\/code>, a <code>Base&amp;<\/code> or <code>Base*<\/code> that refers to a <code>Derived<\/code> still calls <code>Base::greet()<\/code>. If the call should depend on the real object, declare the function <code>virtual<\/code> in the base.","pl":"Bez <code>virtual<\/code> referencja <code>Base&amp;<\/code> czy wskaźnik <code>Base*<\/code> na obiekt <code>Derived<\/code> i tak wywoła <code>Base::greet()<\/code>. Jeśli wywołanie ma zależeć od rzeczywistego obiektu, zadeklaruj funkcję w klasie bazowej jako <code>virtual<\/code>."},"see":[{"topic":"polymorphism","entry":null}]},{"id":"slicing","title":{"en":"Object slicing","pl":"Wycinanie obiektu"},"explain":{"en":"Copying a derived object into a base-class <em>value<\/em> keeps only the base part: the extra members and overrides are \"sliced off\". Pass and store polymorphic objects by reference or pointer instead.","pl":"Skopiowanie obiektu pochodnego do <em>wartości<\/em> typu bazowego zostawia tylko część bazową: dodatkowe składowe i nadpisane funkcje zostają odcięte. To wycinanie obiektu (object slicing). Obiekty polimorficzne przekazuj i przechowuj przez referencję lub wskaźnik."},"code":"struct Animal {\n    virtual ~Animal() = default;\n    virtual std::string sound() const { return \"...\"; }\n};\n\nstruct Cat : Animal {\n    std::string sound() const override { return \"meow\"; }\n};\n\nvoid byValue(Animal a)      { std::cout << a.sound() << '\\n'; }\nvoid byRef(const Animal& a) { std::cout << a.sound() << '\\n'; }\n\nint main() {\n    Cat c;\n    byValue(c);  // copies only the Animal part\n    byRef(c);    // sees the whole Cat\n}","lang":"cpp","codeTitle":null,"input":null,"output":"...\nmeow","error":false,"pitfall":{"en":"<code>std::vector&lt;Animal&gt;<\/code> slices every <code>Cat<\/code> you push into it. To keep different derived types in one container, use <code>std::vector&lt;std::unique_ptr&lt;Animal&gt;&gt;<\/code>.","pl":"<code>std::vector&lt;Animal&gt;<\/code> wycina każdy wrzucony do niego obiekt <code>Cat<\/code>. Żeby trzymać różne typy pochodne w jednym kontenerze, użyj <code>std::vector&lt;std::unique_ptr&lt;Animal&gt;&gt;<\/code>."},"see":[{"topic":"polymorphism","entry":null},{"topic":"smart-pointers","entry":null}]}]},{"id":"polymorphism","glyph":"virt","name":{"en":"Polymorphism","pl":"Polimorfizm"},"summary":{"en":"Virtual functions: <code>virtual<\/code> and <code>override<\/code>, base pointers to derived objects, abstract classes, virtual destructors, <code>final<\/code>, <code>dynamic_cast<\/code>.","pl":"Polimorfizm (polymorphism): <code>virtual<\/code> i <code>override<\/code>, wskaźniki bazowe na obiekty pochodne, klasy abstrakcyjne, wirtualny destruktor, <code>final<\/code>, <code>dynamic_cast<\/code>."},"headers":[],"planned":false,"entries":[{"id":"virtual-override","title":{"en":"virtual and override","pl":"virtual i override"},"explain":{"en":"When a base function is <code>virtual<\/code>, the version that runs is chosen at run time by the real (dynamic) type of the object, even through a <code>Shape&amp;<\/code> or <code>Shape*<\/code>. In the derived class write <code>override<\/code>, so the compiler checks that you really override a base function.","pl":"Dla funkcji wirtualnej (virtual function), oznaczonej w klasie bazowej słowem <code>virtual<\/code>, wersję do wykonania wybiera w czasie działania programu rzeczywisty (dynamiczny) typ obiektu, także przy wywołaniu przez <code>Shape&amp;<\/code> czy <code>Shape*<\/code>. W klasie pochodnej dopisz <code>override<\/code>: kompilator sprawdzi, czy naprawdę nadpisujesz (override) funkcję bazową."},"code":"class Shape {\npublic:\n    virtual ~Shape() = default;\n    virtual std::string name() const { return \"shape\"; }\n};\n\nclass Circle : public Shape {\npublic:\n    std::string name() const override { return \"circle\"; }\n};\n\nvoid describe(const Shape& s) {\n    std::cout << \"This is a \" << s.name() << '\\n';\n}\n\nint main() {\n    Shape s;\n    Circle c;\n    describe(s);\n    describe(c);  // calls Circle::name at run time\n}","lang":"cpp","codeTitle":null,"input":null,"output":"This is a shape\nThis is a circle","error":false,"pitfall":{"en":"Without <code>override<\/code>, a small mismatch, like a missing <code>const<\/code> or a different parameter type, silently creates a <em>new<\/em> function, and the base version keeps being called. With <code>override<\/code> it's a compile error.","pl":"Bez <code>override<\/code> drobna różnica, np. brak <code>const<\/code> albo inny typ parametru, po cichu tworzy <em>nową<\/em> funkcję i nadal wywoływana jest wersja bazowa. Z <code>override<\/code> to błąd kompilacji."},"see":[{"topic":"inheritance","entry":null}]},{"id":"base-pointers","title":{"en":"Base pointers to derived objects","pl":"Wskaźniki bazowe na obiekty pochodne"},"explain":{"en":"A <code>Base*<\/code>, a <code>Base&amp;<\/code> or a <code>std::unique_ptr&lt;Base&gt;<\/code> can refer to any derived object. So one container can hold different types and one loop can handle them all; each object answers with its own override.","pl":"Wskaźnik (pointer) <code>Base*<\/code>, referencja (reference) <code>Base&amp;<\/code> czy <code>std::unique_ptr&lt;Base&gt;<\/code> mogą wskazywać na dowolny obiekt pochodny. Dzięki temu jeden kontener przechowuje różne typy, a jedna pętla obsługuje je wszystkie; każdy obiekt odpowiada własną wersją funkcji."},"code":"struct Animal {\n    virtual ~Animal() = default;\n    virtual std::string sound() const { return \"...\"; }\n};\n\nstruct Dog : Animal {\n    std::string sound() const override { return \"woof\"; }\n};\n\nstruct Cat : Animal {\n    std::string sound() const override { return \"meow\"; }\n};\n\nint main() {\n    std::vector<std::unique_ptr<Animal>> zoo;\n    zoo.push_back(std::make_unique<Dog>());\n    zoo.push_back(std::make_unique<Cat>());\n    zoo.push_back(std::make_unique<Animal>());\n    for (const auto& a : zoo) {\n        std::cout << a->sound() << '\\n';\n    }\n}","lang":"cpp","codeTitle":null,"input":null,"output":"woof\nmeow\n...","error":false,"pitfall":{"en":"Polymorphism works only through pointers and references. <code>Animal a = dog;<\/code> or a <code>std::vector&lt;Animal&gt;<\/code> copies just the <code>Animal<\/code> part (slicing), and every call runs <code>Animal::sound()<\/code>.","pl":"Polimorfizm działa tylko przez wskaźniki i referencje. <code>Animal a = dog;<\/code> albo <code>std::vector&lt;Animal&gt;<\/code> kopiuje wyłącznie część <code>Animal<\/code> (wycinanie, slicing) i każde wywołanie uruchamia <code>Animal::sound()<\/code>."},"see":[{"topic":"inheritance","entry":"slicing"},{"topic":"smart-pointers","entry":null}]},{"id":"abstract-classes","title":{"en":"Pure virtual and abstract classes","pl":"Funkcje czysto wirtualne i klasy abstrakcyjne"},"explain":{"en":"<code>= 0<\/code> makes a function pure virtual: it has no body in the base, and every concrete derived class must override it. A class with a pure virtual function is abstract: you can't create its objects, you only use it as an interface through references and pointers.","pl":"<code>= 0<\/code> tworzy funkcję czysto wirtualną (pure virtual function): nie ma ona ciała w klasie bazowej i każda konkretna klasa pochodna musi ją nadpisać. Klasa z taką funkcją jest abstrakcyjna (abstract class): nie można tworzyć jej obiektów, służy jako interfejs używany przez referencje i wskaźniki."},"code":"class Shape {\npublic:\n    virtual ~Shape() = default;\n    virtual double area() const = 0;  // pure virtual\n};\n\nclass Rect : public Shape {\npublic:\n    Rect(double w, double h) : w_(w), h_(h) {}\n    double area() const override { return w_ * h_; }\nprivate:\n    double w_, h_;\n};\n\nclass Circle : public Shape {\npublic:\n    explicit Circle(double r) : r_(r) {}\n    double area() const override { return 3.14159 * r_ * r_; }\nprivate:\n    double r_;\n};\n\nvoid print(const Shape& s) { std::cout << s.area() << '\\n'; }\n\nint main() {\n    Rect r(2, 3);\n    Circle c(1);\n    print(r);\n    print(c);\n    // Shape s;  // error: Shape is abstract\n}","lang":"cpp","codeTitle":null,"input":null,"output":"6\n3.14159","error":false,"pitfall":{"en":"A derived class that misses even one pure virtual function is still abstract. g++ then says <em>cannot declare variable 'r' to be of abstract type 'Rect'<\/em> and lists the function you forgot.","pl":"Klasa pochodna, która nie nadpisze choćby jednej funkcji czysto wirtualnej, nadal jest abstrakcyjna. g++ zgłosi wtedy <em>cannot declare variable 'r' to be of abstract type 'Rect'<\/em> i wypisze funkcję, o której zapomniałeś."},"see":[]},{"id":"virtual-destructor","title":{"en":"Virtual destructor","pl":"Wirtualny destruktor"},"explain":{"en":"When an object is deleted through a base pointer (<code>delete p;<\/code> or a <code>std::unique_ptr&lt;Base&gt;<\/code>), the base destructor must be <code>virtual<\/code>, so that the derived destructor runs first. Rule of thumb: a class with any virtual function gets <code>virtual ~Base() = default;<\/code>.","pl":"Gdy obiekt jest usuwany przez wskaźnik bazowy (<code>delete p;<\/code> albo <code>std::unique_ptr&lt;Base&gt;<\/code>), destruktor klasy bazowej musi być wirtualny, żeby najpierw wykonał się destruktor klasy pochodnej. Zasada: klasa z jakąkolwiek funkcją wirtualną dostaje <code>virtual ~Base() = default;<\/code>."},"code":"struct Base {\n    virtual ~Base() { std::cout << \"~Base\\n\"; }\n};\n\nstruct Derived : Base {\n    ~Derived() override { std::cout << \"~Derived\\n\"; }\n};\n\nint main() {\n    std::unique_ptr<Base> p = std::make_unique<Derived>();\n    p.reset();  // deletes the Derived through a Base pointer\n    std::cout << \"done\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"~Derived\n~Base\ndone","error":false,"pitfall":{"en":"Without <code>virtual ~Base()<\/code>, deleting a <code>Derived<\/code> through a <code>Base*<\/code> is undefined behaviour: usually only <code>~Base<\/code> runs and whatever <code>Derived<\/code> owns leaks.","pl":"Bez <code>virtual ~Base()<\/code> usunięcie obiektu <code>Derived<\/code> przez <code>Base*<\/code> to niezdefiniowane zachowanie (undefined behaviour): zwykle wykona się tylko <code>~Base<\/code>, a wszystko, co posiada <code>Derived<\/code>, wycieknie."},"see":[{"topic":"inheritance","entry":"construction-order"},{"topic":"smart-pointers","entry":null}]},{"id":"final","title":{"en":"final","pl":"final"},"explain":{"en":"<code>final<\/code> after a virtual function stops any further overriding; <code>final<\/code> after a class name stops anyone from inheriting from that class. Use it to lock a design down (it can also let the compiler skip the virtual call).","pl":"<code>final<\/code> po funkcji wirtualnej blokuje dalsze nadpisywanie, a <code>final<\/code> po nazwie klasy zabrania dziedziczenia (inheritance) z tej klasy. Przydaje się, gdy projekt ma być zamknięty (a czasem pozwala też kompilatorowi pominąć wywołanie wirtualne)."},"code":"struct Shape {\n    virtual ~Shape() = default;\n    virtual void draw() const { std::cout << \"shape\\n\"; }\n};\n\nstruct Square : Shape {\n    void draw() const final { std::cout << \"square\\n\"; }  // no more overrides\n};\n\nstruct BigSquare final : Square {};  // nobody can inherit from BigSquare\n\n// struct Bad : Square { void draw() const override {} };  // error: draw is final\n// struct Worse : BigSquare {};                            // error: BigSquare is final\n\nint main() {\n    BigSquare b;\n    const Shape& s = b;\n    s.draw();\n}","lang":"cpp","codeTitle":null,"input":null,"output":"square","error":false,"pitfall":null,"see":[]},{"id":"dynamic-cast","title":{"en":"dynamic_cast","pl":"dynamic_cast"},"explain":{"en":"<code>dynamic_cast&lt;const Dog*&gt;(p)<\/code> checks at run time whether a base pointer really points to a <code>Dog<\/code>: you get a <code>Dog<\/code> pointer, or <code>nullptr<\/code> if it's something else. On references a failed cast throws <code>std::bad_cast<\/code>. It needs a polymorphic base (at least one virtual function).","pl":"<code>dynamic_cast&lt;const Dog*&gt;(p)<\/code> sprawdza w czasie działania programu, czy wskaźnik bazowy naprawdę wskazuje na <code>Dog<\/code>: dostajesz wskaźnik na <code>Dog<\/code> albo <code>nullptr<\/code>, jeśli to inny typ. Dla referencji nieudane rzutowanie (cast) rzuca wyjątek <code>std::bad_cast<\/code>. Działa tylko dla klas polimorficznych (z co najmniej jedną funkcją wirtualną)."},"code":"struct Animal {\n    virtual ~Animal() = default;\n};\n\nstruct Dog : Animal {\n    void fetch() const { std::cout << \"fetching!\\n\"; }\n};\n\nstruct Cat : Animal {};\n\nvoid play(const Animal& a) {\n    if (auto dog = dynamic_cast<const Dog*>(&a)) {\n        dog->fetch();\n    } else {\n        std::cout << \"not a dog\\n\";\n    }\n}\n\nint main() {\n    play(Dog{});\n    play(Cat{});\n}","lang":"cpp","codeTitle":null,"input":null,"output":"fetching!\nnot a dog","error":false,"pitfall":{"en":"<code>static_cast&lt;const Dog*&gt;(p)<\/code> checks nothing: if <code>p<\/code> doesn't point to a <code>Dog<\/code>, using the result is undefined behaviour. And if you need <code>dynamic_cast<\/code> often, a virtual function is usually the better design.","pl":"<code>static_cast&lt;const Dog*&gt;(p)<\/code> niczego nie sprawdza: jeśli <code>p<\/code> nie wskazuje na <code>Dog<\/code>, użycie wyniku to niezdefiniowane zachowanie. A jeśli często potrzebujesz <code>dynamic_cast<\/code>, zwykle lepszym rozwiązaniem jest funkcja wirtualna."},"see":[]}]}]},{"id":"containers","hue":210,"name":{"en":"STL containers","pl":"Kontenery STL"},"desc":{"en":"Ready-made data structures from the standard library.","pl":"Gotowe struktury danych z biblioteki standardowej."},"topics":[{"id":"vector","glyph":"vec","name":{"en":"vector","pl":"vector"},"summary":{"en":"The go-to resizable array: creating, adding, accessing, looping, inserting and erasing, 2-D vectors, reserve vs resize.","pl":"Wektor (vector), czyli tablica o zmiennym rozmiarze: tworzenie, dodawanie, dostęp, pętle, wstawianie i usuwanie, wektory 2D, reserve kontra resize."},"headers":["<vector>"],"planned":false,"entries":[{"id":"creating","title":{"en":"Creating and adding","pl":"Tworzenie i dodawanie"},"explain":{"en":"A <code>std::vector&lt;T&gt;<\/code> holds any number of <code>T<\/code>s in a row and grows as needed. <code>push_back<\/code> copies a value onto the end; <code>emplace_back<\/code> passes its arguments to the element's constructor and builds it in place. <code>size()<\/code> is the number of elements.","pl":"<code>std::vector&lt;T&gt;<\/code> przechowuje dowolną liczbę elementów typu <code>T<\/code> jeden za drugim i sam rośnie, gdy trzeba. <code>push_back<\/code> dopisuje wartość na końcu, a <code>emplace_back<\/code> przekazuje swoje argumenty do konstruktora (constructor) elementu i tworzy go od razu w wektorze. <code>size()<\/code> zwraca liczbę elementów (rozmiar, size)."},"code":"std::vector<int> a;                // empty\nstd::vector<int> b{1, 2, 3};       // 1 2 3\nstd::vector<int> c(4, 7);          // 7 7 7 7\na.push_back(10);                   // add at the end\na.push_back(20);\nstd::vector<std::string> names;\nnames.emplace_back(3, 'x');        // builds std::string(3, 'x')\nstd::cout << a.size() << ' ' << b.size() << ' ' << c.size() << '\\n';\nstd::cout << names[0] << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"2 3 4\nxxx","error":false,"pitfall":{"en":"Parentheses and braces mean different things: <code>std::vector&lt;int&gt; v(5);<\/code> is five zeros, <code>std::vector&lt;int&gt; v{5};<\/code> is one element, <code>5<\/code>.","pl":"Nawiasy okrągłe i klamrowe znaczą co innego: <code>std::vector&lt;int&gt; v(5);<\/code> to pięć zer, a <code>std::vector&lt;int&gt; v{5};<\/code> to jeden element o wartości <code>5<\/code>."},"see":[]},{"id":"access","title":{"en":"[] vs at, front and back","pl":"[] kontra at, front i back"},"explain":{"en":"<code>v[i]<\/code> and <code>v.at(i)<\/code> both give the element at index <code>i<\/code> (from 0). <code>at<\/code> checks the index and throws <code>std::out_of_range<\/code> when it is wrong; <code>[]<\/code> doesn't check. <code>front()<\/code> and <code>back()<\/code> are the first and last element.","pl":"<code>v[i]<\/code> i <code>v.at(i)<\/code> zwracają element o indeksie <code>i<\/code> (liczonym od 0). <code>at<\/code> sprawdza indeks i przy błędnym rzuca wyjątek (exception) <code>std::out_of_range<\/code>, a <code>[]<\/code> niczego nie sprawdza. <code>front()<\/code> i <code>back()<\/code> to pierwszy i ostatni element."},"code":"std::vector<int> v{10, 20, 30};\nstd::cout << v[0] << ' ' << v.front() << ' ' << v.back() << '\\n';\nv[1] = 25;\nstd::cout << v.at(1) << '\\n';\ntry {\n    std::cout << v.at(3) << '\\n';\n} catch (const std::out_of_range&) {\n    std::cout << \"index 3 is out of range\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"10 10 30\n25\nindex 3 is out of range","error":false,"pitfall":{"en":"<code>v[3]<\/code> on a 3-element vector is undefined behaviour: no error, just garbage or a crash, sometimes much later. The same goes for <code>front()<\/code> / <code>back()<\/code> on an empty vector. Use <code>at()<\/code> or check <code>i &lt; v.size()<\/code> first.","pl":"<code>v[3]<\/code> na wektorze z 3 elementami to niezdefiniowane zachowanie (undefined behaviour): żadnego błędu, tylko śmieci albo awaria programu, czasem dużo później. To samo dotyczy <code>front()<\/code> / <code>back()<\/code> na pustym wektorze. Używaj <code>at()<\/code> albo najpierw sprawdź <code>i &lt; v.size()<\/code>."},"see":[{"topic":"exceptions","entry":null}]},{"id":"looping","title":{"en":"Looping over a vector","pl":"Pętle po wektorze"},"explain":{"en":"Range-based <code>for<\/code> is the simplest: <code>int&amp;<\/code> lets you change the elements, <code>const int&amp;<\/code> (or <code>const auto&amp;<\/code>) reads them without copying. Use an index loop with <code>std::size_t<\/code> when you need the position.","pl":"Najprościej użyć pętli zakresowej (range-based <code>for<\/code>): z <code>int&amp;<\/code> możesz zmieniać elementy, a <code>const int&amp;<\/code> (albo <code>const auto&amp;<\/code>) tylko je czyta, bez kopiowania. Gdy potrzebujesz numeru pozycji, użyj pętli po indeksie typu <code>std::size_t<\/code>."},"code":"std::vector<int> v{1, 2, 3};\nfor (int& x : v) {             // & : change the elements\n    x *= 10;\n}\nfor (const int& x : v) {       // read only, no copies\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';\nfor (std::size_t i = 0; i < v.size(); ++i) {\n    std::cout << i << ':' << v[i] << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"10 20 30\n0:10 1:20 2:30","error":false,"pitfall":{"en":"<code>for (int x : v) x *= 10;<\/code> changes copies, not the vector. And <code>v.size()<\/code> is unsigned: <code>int i &lt; v.size()<\/code> gives a warning, and <code>v.size() - 1<\/code> on an empty vector is a huge number, not -1.","pl":"<code>for (int x : v) x *= 10;<\/code> zmienia kopie, a nie wektor. Do tego <code>v.size()<\/code> jest bez znaku (unsigned): porównanie <code>int i &lt; v.size()<\/code> daje ostrzeżenie, a <code>v.size() - 1<\/code> dla pustego wektora to ogromna liczba, a nie -1."},"see":[{"topic":"loops","entry":null},{"topic":"iterators","entry":null}]},{"id":"insert-erase","title":{"en":"insert, erase, pop_back, clear","pl":"insert, erase, pop_back, clear"},"explain":{"en":"<code>insert<\/code> and <code>erase<\/code> take an iterator to a position, usually <code>v.begin() + index<\/code>; <code>erase<\/code> can also remove a range <code>[first, last)<\/code>. <code>pop_back<\/code> removes the last element, <code>clear<\/code> removes all, <code>empty()<\/code> checks for no elements.","pl":"<code>insert<\/code> i <code>erase<\/code> przyjmują iterator wskazujący pozycję, zwykle <code>v.begin() + indeks<\/code>; <code>erase<\/code> usuwa też cały zakres <code>[first, last)<\/code>. <code>pop_back<\/code> usuwa ostatni element, <code>clear<\/code> usuwa wszystkie, a <code>empty()<\/code> sprawdza, czy wektor jest pusty."},"code":"std::vector<int> v{1, 2, 3, 4, 5};\nv.insert(v.begin() + 1, 9);              // 1 9 2 3 4 5\nv.erase(v.begin());                      // 9 2 3 4 5\nv.erase(v.begin() + 1, v.begin() + 3);   // 9 4 5\nv.pop_back();                            // 9 4\nfor (int x : v) std::cout << x << ' ';\nstd::cout << '\\n';\nv.clear();\nstd::cout << v.size() << ' ' << v.empty() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"9 4\n0 1","error":false,"pitfall":{"en":"<code>erase<\/code> invalidates iterators, so <code>v.erase(it)<\/code> inside a loop that then does <code>++it<\/code> is undefined behaviour. Write <code>it = v.erase(it);<\/code> (it returns the next position), or remove by condition with <code>std::erase_if(v, pred)<\/code> (C++20). Erasing near the front is also slow: every later element moves.","pl":"<code>erase<\/code> unieważnia (invalidates) iteratory, więc <code>v.erase(it)<\/code> w pętli, która potem robi <code>++it<\/code>, to niezdefiniowane zachowanie. Pisz <code>it = v.erase(it);<\/code> (zwraca następną pozycję) albo usuwaj według warunku przez <code>std::erase_if(v, pred)<\/code> (C++20). Usuwanie z początku jest też wolne: wszystkie dalsze elementy się przesuwają."},"see":[{"topic":"iterators","entry":null},{"topic":"transforming","entry":null}]},{"id":"2d","title":{"en":"2-D vectors","pl":"Wektory 2D"},"explain":{"en":"A vector of vectors works as a grid or matrix: <code>grid[row][col]<\/code>. Create it with the number of rows and one ready-made row to copy, e.g. <code>std::vector&lt;int&gt;(cols, 0)<\/code>.","pl":"Wektor wektorów działa jak siatka albo macierz: <code>grid[wiersz][kolumna]<\/code>. Tworzysz go, podając liczbę wierszy i jeden gotowy wiersz do skopiowania, np. <code>std::vector&lt;int&gt;(cols, 0)<\/code>."},"code":"int rows = 2, cols = 3;\nstd::vector<std::vector<int>> grid(rows, std::vector<int>(cols, 0));\ngrid[1][2] = 5;\nfor (const auto& row : grid) {\n    for (int x : row) std::cout << x << ' ';\n    std::cout << '\\n';\n}\nstd::cout << grid.size() << 'x' << grid[0].size() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"0 0 0\n0 0 5\n2x3","error":false,"pitfall":{"en":"<code>std::vector&lt;std::vector&lt;int&gt;&gt; grid(rows);<\/code> makes <code>rows<\/code> <em>empty<\/em> rows, so <code>grid[0][0]<\/code> is undefined behaviour. Give each row a size, or <code>push_back<\/code> into it.","pl":"<code>std::vector&lt;std::vector&lt;int&gt;&gt; grid(rows);<\/code> tworzy <code>rows<\/code> <em>pustych<\/em> wierszy, więc <code>grid[0][0]<\/code> to niezdefiniowane zachowanie. Nadaj każdemu wierszowi rozmiar albo dodawaj do niego elementy przez <code>push_back<\/code>."},"see":[{"topic":"arrays","entry":null}]},{"id":"reserve-resize","title":{"en":"reserve vs resize","pl":"reserve kontra resize"},"explain":{"en":"<code>resize(n)<\/code> changes the number of elements, adding zeros or cutting off the end. <code>reserve(n)<\/code> only sets aside memory (the <code>capacity<\/code>), so many <code>push_back<\/code>s don't reallocate; the size stays the same.","pl":"<code>resize(n)<\/code> zmienia liczbę elementów: dopisuje zera albo obcina koniec. <code>reserve(n)<\/code> tylko rezerwuje pamięć (pojemność, capacity), żeby kolejne <code>push_back<\/code> nie musiały przenosić danych; rozmiar się nie zmienia."},"code":"std::vector<int> a;\na.reserve(100);          // room for 100, still empty\nstd::cout << a.size() << ' ' << a.capacity() << '\\n';\nstd::vector<int> b;\nb.resize(3);             // 3 elements, all 0\nb[2] = 7;\nstd::cout << b.size() << \": \" << b[0] << ' ' << b[1] << ' ' << b[2] << '\\n';\nb.resize(1);             // keep only the first element\nstd::cout << b.size() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"0 100\n3: 0 0 7\n1","error":false,"pitfall":{"en":"After <code>reserve(n)<\/code> the vector is still empty, so <code>a[0] = 1;<\/code> is undefined behaviour. Either <code>resize(n)<\/code> and assign by index, or <code>reserve(n)<\/code> and <code>push_back<\/code>.","pl":"Po <code>reserve(n)<\/code> wektor nadal jest pusty, więc <code>a[0] = 1;<\/code> to niezdefiniowane zachowanie. Albo <code>resize(n)<\/code> i przypisuj po indeksie, albo <code>reserve(n)<\/code> i <code>push_back<\/code>."},"see":[]}]},{"id":"map","glyph":"{k:v}","name":{"en":"map","pl":"map"},"summary":{"en":"Key-value lookup with std::map: inserting, [] vs at, find / contains, iterating in key order, erasing, counting, std::unordered_map.","pl":"Mapa (map), czyli słownik klucz-wartość: wstawianie, [] kontra at, find / contains, przechodzenie po kluczach w kolejności, usuwanie, zliczanie, std::unordered_map."},"headers":["<map>","<unordered_map>"],"planned":false,"entries":[{"id":"creating","title":{"en":"Creating and inserting","pl":"Tworzenie i wstawianie"},"explain":{"en":"A <code>std::map&lt;Key, Value&gt;<\/code> stores key-value pairs sorted by key, each key at most once. <code>m[key] = value<\/code> adds the key or overwrites its value; <code>insert<\/code> and <code>emplace<\/code> add only if the key is not there yet.","pl":"<code>std::map&lt;Key, Value&gt;<\/code> przechowuje pary klucz (key) – wartość (value) posortowane według klucza, a każdy klucz występuje najwyżej raz. <code>m[klucz] = wartość<\/code> dodaje klucz albo nadpisuje jego wartość; <code>insert<\/code> i <code>emplace<\/code> dodają parę tylko wtedy, gdy klucza jeszcze nie ma."},"code":"std::map<std::string, int> age{{\"Ann\", 31}, {\"Bob\", 25}};\nage[\"Cid\"] = 40;               // new key\nage[\"Bob\"] = 26;               // overwrites\nage.insert({\"Ann\", 99});       // key exists: does nothing\nage.emplace(\"Dan\", 19);\nstd::cout << age.size() << ' ' << age[\"Ann\"] << ' ' << age[\"Bob\"] << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"4 31 26","error":false,"pitfall":null,"see":[]},{"id":"lookup","title":{"en":"Looking up keys","pl":"Wyszukiwanie kluczy"},"explain":{"en":"<code>contains(key)<\/code> (C++20) answers yes/no; <code>count(key)<\/code> gives 0 or 1. <code>find(key)<\/code> returns an iterator to the pair (<code>it-&gt;second<\/code> is the value) or <code>end()<\/code> if missing. <code>at(key)<\/code> returns the value and throws <code>std::out_of_range<\/code> for a missing key.","pl":"<code>contains(klucz)<\/code> (C++20) odpowiada tak/nie, a <code>count(klucz)<\/code> zwraca 0 albo 1. <code>find(klucz)<\/code> zwraca iterator do pary (<code>it-&gt;second<\/code> to wartość) albo <code>end()<\/code>, gdy klucza nie ma. <code>at(klucz)<\/code> zwraca wartość, a dla brakującego klucza rzuca wyjątek (exception) <code>std::out_of_range<\/code>."},"code":"std::map<std::string, int> age{{\"Ann\", 31}};\nif (age.contains(\"Ann\")) {                    // C++20\n    std::cout << \"Ann: \" << age.at(\"Ann\") << '\\n';\n}\nauto it = age.find(\"Bob\");\nif (it == age.end()) std::cout << \"no Bob\\n\";\nstd::cout << age.count(\"Ann\") << ' ' << age.count(\"Bob\") << '\\n';\nint z = age[\"Zoe\"];                           // adds \"Zoe\" -> 0 !\nstd::cout << z << ' ' << age.size() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"Ann: 31\nno Bob\n1 0\n0 2","error":false,"pitfall":{"en":"<code>m[key]<\/code> <em>creates<\/em> a missing key with a default value (<code>0<\/code>, <code>\"\"<\/code>), so merely reading with <code>[]<\/code> quietly grows the map, and it doesn't compile on a <code>const<\/code> map. To read, check with <code>contains<\/code> / <code>find<\/code> first, or use <code>at<\/code>.","pl":"<code>m[klucz]<\/code> <em>tworzy<\/em> brakujący klucz z wartością domyślną (<code>0<\/code>, <code>\"\"<\/code>), więc samo odczytanie przez <code>[]<\/code> po cichu powiększa mapę, a na mapie <code>const<\/code> w ogóle się nie kompiluje. Do odczytu najpierw sprawdź <code>contains<\/code> / <code>find<\/code> albo użyj <code>at<\/code>."},"see":[]},{"id":"iterating","title":{"en":"Iterating in key order","pl":"Przechodzenie w kolejności kluczy"},"explain":{"en":"A map is always sorted by key, so a loop visits keys in ascending order. Each element is a <code>std::pair&lt;const Key, Value&gt;<\/code>; a structured binding <code>[key, value]<\/code> (C++17) unpacks it, or use <code>it-&gt;first<\/code> / <code>it-&gt;second<\/code>.","pl":"Mapa jest zawsze posortowana według klucza, więc pętla odwiedza klucze rosnąco. Każdy element to <code>std::pair&lt;const Key, Value&gt;<\/code>; rozpakujesz go dowiązaniem strukturalnym (structured binding) <code>[key, value]<\/code> (C++17) albo przez <code>it-&gt;first<\/code> / <code>it-&gt;second<\/code>."},"code":"std::map<std::string, int> stock{{\"pear\", 3}, {\"apple\", 5}, {\"fig\", 0}};\nfor (const auto& [fruit, n] : stock) {\n    std::cout << fruit << \": \" << n << '\\n';\n}\nfor (auto& [fruit, n] : stock) n += 10;      // & : change the values\nauto it = stock.begin();\nstd::cout << it->first << ' ' << it->second << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"apple: 5\nfig: 0\npear: 3\napple 15","error":false,"pitfall":{"en":"<code>for (auto [fruit, n] : stock) n += 10;<\/code> changes copies only; use <code>auto&amp;<\/code>. Keys are <code>const<\/code>: you can change a value, but to change a key, erase the element and insert a new one.","pl":"<code>for (auto [fruit, n] : stock) n += 10;<\/code> zmienia tylko kopie; użyj <code>auto&amp;<\/code>. Klucze są <code>const<\/code>: wartość możesz zmienić, ale żeby zmienić klucz, usuń element i wstaw nowy."},"see":[{"topic":"pair-tuple","entry":"structured-bindings"},{"topic":"iterators","entry":null}]},{"id":"erasing","title":{"en":"Erasing","pl":"Usuwanie"},"explain":{"en":"<code>erase(key)<\/code> removes that key and returns how many were removed (0 or 1). To remove while looping, <code>erase(it)<\/code> returns the iterator to the next element: assign it back instead of doing <code>++it<\/code>.","pl":"<code>erase(klucz)<\/code> usuwa ten klucz i zwraca liczbę usuniętych elementów (0 albo 1). Żeby usuwać w trakcie pętli, użyj <code>erase(it)<\/code>: zwraca iterator do następnego elementu, który przypisujesz z powrotem zamiast robić <code>++it<\/code>."},"code":"std::map<int, std::string> m{{1, \"one\"}, {2, \"two\"}, {3, \"three\"}, {4, \"four\"}};\nm.erase(1);                                   // by key\nstd::cout << m.erase(9) << '\\n';              // 0: no such key\nfor (auto it = m.begin(); it != m.end(); ) {\n    if (it->first % 2 == 0) it = m.erase(it); // remove even keys\n    else ++it;
