rótem Ctrl+C."},"see":[]},{"id":"do-while","title":{"en":"do … while","pl":"do … while"},"explain":{"en":"Checks the condition <em>after<\/em> the body, so the body always runs at least once. Typical use: asking for input until it is valid. Note the <code>;<\/code> after <code>while (...)<\/code>.","pl":"Sprawdza warunek <em>po<\/em> wykonaniu treści, więc treść zawsze wykona się co najmniej raz. Typowe zastosowanie: pytanie o dane, dopóki użytkownik nie poda poprawnych. Zwróć uwagę na <code>;<\/code> po <code>while (...)<\/code>."},"code":"int n = 0;\ndo {\n    std::cout << \"Enter 1-10:\\n\";\n    std::cin >> n;\n} while (n < 1 || n > 10);\nstd::cout << \"Got \" << n << '\\n';","lang":"cpp","codeTitle":null,"input":"0\n42\n7","output":"Enter 1-10:\nEnter 1-10:\nEnter 1-10:\nGot 7","error":false,"pitfall":null,"see":[{"topic":"io","entry":null}]},{"id":"range-for","title":{"en":"Range-based for","pl":"Pętla for po zakresie"},"explain":{"en":"<code>for (type x : container)<\/code> visits every element of a vector, array or string in order, with no index to get wrong. Use <code>auto&amp;<\/code> to change the elements, and <code>const auto&amp;<\/code> to read big elements (like strings) without copying them.","pl":"Pętla for po zakresie (range-based for), <code>for (typ x : kontener)<\/code>, przechodzi po kolei przez każdy element wektora, tablicy albo napisu, bez indeksu, w którym można się pomylić. Użyj <code>auto&amp;<\/code>, żeby zmieniać elementy, a <code>const auto&amp;<\/code>, żeby czytać duże elementy (np. napisy) bez kopiowania."},"code":"std::vector<int> v{3, 1, 4};\nfor (int x : v) {\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';\nfor (int& x : v) {   // a reference: changes the elements themselves\n    x *= 10;\n}\nfor (const auto& x : v) {\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"3 1 4\n30 10 40","error":false,"pitfall":{"en":"<code>for (auto x : v) x *= 10;<\/code> compiles, but it changes only a copy of each element and <code>v<\/code> stays the same. Add <code>&amp;<\/code> when the loop should modify the container.","pl":"<code>for (auto x : v) x *= 10;<\/code> się kompiluje, ale zmienia tylko kopię każdego elementu, a <code>v<\/code> zostaje bez zmian. Dodaj <code>&amp;<\/code>, gdy pętla ma modyfikować kontener."},"see":[{"topic":"vector","entry":null},{"topic":"references","entry":null}]},{"id":"break-continue","title":{"en":"break and continue","pl":"break i continue"},"explain":{"en":"<code>continue<\/code> skips the rest of the current pass and goes on to the next one; <code>break<\/code> leaves the loop at once. <code>while (true)<\/code> with a <code>break<\/code> inside is the usual way to write a loop whose exit is in the middle.","pl":"<code>continue<\/code> pomija resztę bieżącej iteracji i przechodzi do następnej, a <code>break<\/code> natychmiast kończy pętlę. <code>while (true)<\/code> z <code>break<\/code> w środku to typowy sposób na pętlę, z której wychodzi się w połowie treści."},"code":"for (int i = 1; i <= 10; ++i) {\n    if (i % 2 == 0) {\n        continue;   // skip even numbers\n    }\n    if (i > 7) {\n        break;      // stop the whole loop\n    }\n    std::cout << i << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 3 5 7","error":false,"pitfall":null,"see":[]},{"id":"nested","title":{"en":"Nested loops","pl":"Pętle zagnieżdżone"},"explain":{"en":"A loop inside a loop: the inner loop runs completely for every pass of the outer one. Typical for tables, grids and 2-D arrays. The inner limit may depend on the outer counter, as in this triangle.","pl":"Pętla w pętli (nested loops): wewnętrzna pętla wykonuje się w całości przy każdej iteracji zewnętrznej. Przydaje się do tabel, siatek i tablic dwuwymiarowych. Granica wewnętrznej pętli może zależeć od licznika zewnętrznej, jak w tym trójkącie."},"code":"for (int row = 1; row <= 4; ++row) {\n    for (int col = 1; col <= row; ++col) {\n        std::cout << '*';\n    }\n    std::cout << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"*\n**\n***\n****","error":false,"pitfall":{"en":"<code>break<\/code> leaves only the innermost loop. To get out of both, set a flag (<code>bool found = true;<\/code>) and check it in the outer loop, or move the loops into a function and <code>return<\/code>.","pl":"<code>break<\/code> wychodzi tylko z najbardziej wewnętrznej pętli. Żeby wyjść z obu, ustaw flagę (<code>bool found = true;<\/code>) i sprawdzaj ją w zewnętrznej pętli albo przenieś pętle do funkcji i użyj <code>return<\/code>."},"see":[{"topic":"arrays","entry":null}]}]},{"id":"functions","glyph":"f()","name":{"en":"Functions","pl":"Funkcje"},"summary":{"en":"Defining and declaring functions, passing by value / reference / const reference, default arguments, overloading, recursion and returning several values.","pl":"Funkcje (functions): definicja i deklaracja, przekazywanie przez wartość / referencję / stałą referencję, argumenty domyślne, przeciążanie, rekurencja i zwracanie kilku wartości."},"headers":[],"planned":false,"entries":[{"id":"defining","title":{"en":"Defining and calling","pl":"Definicja i wywołanie"},"explain":{"en":"A function has a return type (<code>void<\/code> = returns nothing), a name, parameters and a body. The compiler reads the file top to bottom, so a function must be declared before it is called: define it above <code>main<\/code>, or put a declaration (prototype) above and the definition below.","pl":"Funkcja ma typ zwracany (return type; <code>void<\/code> oznacza, że nic nie zwraca), nazwę, parametry i treść. Kompilator czyta plik od góry do dołu, więc funkcja musi być znana przed wywołaniem: zdefiniuj ją nad <code>main<\/code> albo wpisz nad <code>main<\/code> samą deklarację, czyli prototyp (prototype), a definicję (definition) umieść niżej."},"code":"void sayHi() {                // void: returns nothing\n    std::cout << \"Hi!\\n\";\n}\n\nint add(int a, int b);        // declaration (prototype)\n\nint main() {\n    sayHi();\n    int sum = add(2, 3);\n    std::cout << sum << '\\n';\n}\n\nint add(int a, int b) {       // definition, below main\n    return a + b;\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Hi!\n5","error":false,"pitfall":{"en":"Without the prototype, the call in <code>main<\/code> fails with <em>'add' was not declared in this scope<\/em>. Also, a non-<code>void<\/code> function must <code>return<\/code> a value on every path: reaching the end without one is undefined behaviour (<code>-Wall<\/code> warns about it).","pl":"Bez prototypu wywołanie w <code>main<\/code> kończy się błędem <em>'add' was not declared in this scope<\/em>. Poza tym funkcja inna niż <code>void<\/code> musi zwrócić wartość (<code>return<\/code>) w każdej ścieżce: dojście do końca bez <code>return<\/code> to niezdefiniowane zachowanie (undefined behaviour), przed którym ostrzega <code>-Wall<\/code>."},"see":[{"topic":"headers","entry":null}]},{"id":"parameters","title":{"en":"Passing arguments","pl":"Przekazywanie argumentów"},"explain":{"en":"By value (<code>int x<\/code>) the function gets a copy, so changes stay inside it. By reference (<code>int&amp; x<\/code>) it works on the caller's variable. By const reference (<code>const T&amp; x<\/code>) there is neither a copy nor a change: the default choice for strings, vectors and other big objects.","pl":"Przy przekazywaniu przez wartość (by value, <code>int x<\/code>) funkcja dostaje kopię, więc zmiany zostają w środku. Przez referencję (by reference, <code>int&amp; x<\/code>) działa na zmiennej wywołującego. Przez stałą referencję (<code>const T&amp; x<\/code>) nie ma ani kopii, ani zmian: to domyślny wybór dla napisów, wektorów i innych dużych obiektów."},"code":"void byValue(int x) {\n    x = 100;                  // changes only the copy\n    std::cout << \"copy: \" << x << '\\n';\n}\n\nvoid byReference(int& x) {\n    x = 100;                  // changes the caller's variable\n}\n\nint total(const std::vector<int>& v) {   // no copy, read-only\n    int sum = 0;\n    for (int x : v) {\n        sum += x;\n    }\n    return sum;\n}\n\nint main() {\n    int a = 1;\n    int b = 1;\n    byValue(a);\n    byReference(b);\n    std::cout << a << ' ' << b << '\\n';\n    std::cout << total({1, 2, 3}) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"copy: 100\n1 100\n6","error":false,"pitfall":{"en":"A non-const reference needs a real variable: <code>byReference(5)<\/code> and <code>byReference(a + 1)<\/code> don't compile. If the function only reads the value, take it by value (small types) or by <code>const&amp;<\/code> (big ones).","pl":"Zwykła (niestała) referencja wymaga prawdziwej zmiennej: ani <code>byReference(5)<\/code>, ani <code>byReference(a + 1)<\/code> się nie skompiluje. Jeśli funkcja tylko odczytuje wartość, przyjmij ją przez wartość (małe typy) albo przez <code>const&amp;<\/code> (duże obiekty)."},"see":[{"topic":"references","entry":null}]},{"id":"default-arguments","title":{"en":"Default arguments","pl":"Argumenty domyślne"},"explain":{"en":"A parameter written with <code>= value<\/code> can be left out in the call, and then the default is used. Parameters with defaults must come last in the list.","pl":"Parametr zapisany z <code>= wartość<\/code> można pominąć przy wywołaniu i wtedy zostanie użyta wartość domyślna (default argument). Parametry z wartościami domyślnymi muszą stać na końcu listy."},"code":"void repeat(const std::string& text, int times = 2, char sep = ' ') {\n    for (int i = 0; i < times; ++i) {\n        std::cout << text << sep;\n    }\n    std::cout << '\\n';\n}\n\nint main() {\n    repeat(\"hey\");\n    repeat(\"hey\", 3);\n    repeat(\"hey\", 3, '!');\n}","lang":"cpp","codeTitle":null,"input":null,"output":"hey hey\nhey hey hey\nhey!hey!hey!","error":false,"pitfall":{"en":"If the function has a separate declaration, write the default only there: repeating <code>= 2<\/code> in the definition is a <em>redefinition of default argument<\/em> error. You also can't skip one in the middle: to pass <code>sep<\/code>, you must pass <code>times<\/code> too.","pl":"Jeśli funkcja ma osobną deklarację, wartość domyślną wpisz tylko w niej: powtórzenie <code>= 2<\/code> w definicji daje błąd <em>redefinition of default argument<\/em>. Nie da się też pominąć argumentu w środku: żeby podać <code>sep<\/code>, musisz podać również <code>times<\/code>."},"see":[]},{"id":"overloading","title":{"en":"Overloading","pl":"Przeciążanie funkcji"},"explain":{"en":"Several functions may share a name if their parameter lists differ (in types or count). The compiler picks the one that best matches the arguments. The return type alone is not enough to tell them apart.","pl":"Kilka funkcji może mieć tę samą nazwę, jeśli różnią się listą parametrów (typami lub liczbą). To przeciążanie (overloading): kompilator wybiera wersję, która najlepiej pasuje do argumentów. Sam typ zwracany nie wystarczy, żeby je rozróżnić."},"code":"int twice(int x) {\n    return 2 * x;\n}\n\ndouble twice(double x) {\n    return 2 * x;\n}\n\nstd::string twice(const std::string& s) {\n    return s + s;\n}\n\nint main() {\n    std::cout << twice(21) << '\\n';\n    std::cout << twice(1.25) << '\\n';\n    std::cout << twice(\"ab\") << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"42\n2.5\nabab","error":false,"pitfall":null,"see":[{"topic":"templates","entry":null}]},{"id":"recursion","title":{"en":"Recursion","pl":"Rekurencja"},"explain":{"en":"A recursive function calls itself on a smaller version of the problem. It needs a base case that returns without calling itself, and every call must get closer to that case.","pl":"Rekurencja (recursion) to wywoływanie przez funkcję samej siebie dla mniejszej wersji problemu. Potrzebny jest przypadek bazowy (base case), który kończy się bez kolejnego wywołania, a każde wywołanie musi się do niego zbliżać."},"code":"long long factorial(int n) {\n    if (n <= 1) {\n        return 1;                    // base case\n    }\n    return n * factorial(n - 1);     // a smaller problem\n}\n\nint main() {\n    std::cout << factorial(5) << '\\n';\n    std::cout << factorial(20) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"120\n2432902008176640000","error":false,"pitfall":{"en":"With no base case, or one that is never reached (checking <code>n == 0<\/code> and calling <code>factorial(-1)<\/code>), the calls never stop and the program crashes with a <em>stack overflow<\/em>. Very deep recursion (say a million levels) overflows too; use a loop then.","pl":"Bez przypadku bazowego albo z takim, do którego nie da się dojść (sprawdzanie <code>n == 0<\/code> i wywołanie <code>factorial(-1)<\/code>), wywołania nigdy się nie kończą, a program pada z przepełnieniem stosu (stack overflow). Bardzo głęboka rekurencja (np. milion poziomów) też przepełni stos; wtedy lepiej użyć pętli."},"see":[]},{"id":"several-values","title":{"en":"Returning several values","pl":"Zwracanie kilku wartości"},"explain":{"en":"A function returns one value, but that value can be a <code>struct<\/code> with named fields or a <code>std::pair<\/code>. A structured binding (C++17), <code>auto [q, r] = ...<\/code>, unpacks the result into separate variables.","pl":"Funkcja zwraca jedną wartość, ale może nią być <code>struct<\/code> z nazwanymi polami albo <code>std::pair<\/code>. Wiązanie strukturalne (structured binding, C++17) <code>auto [q, r] = ...<\/code> rozpakowuje wynik do osobnych zmiennych."},"code":"struct MinMax {\n    int min;\n    int max;\n};\n\nMinMax minMax(const std::vector<int>& v) {\n    MinMax r{v[0], v[0]};\n    for (int x : v) {\n        r.min = std::min(r.min, x);\n        r.max = std::max(r.max, x);\n    }\n    return r;\n}\n\nstd::pair<int, int> divide(int a, int b) {\n    return {a / b, a % b};\n}\n\nint main() {\n    MinMax m = minMax({4, 9, 1, 7});\n    std::cout << m.min << ' ' << m.max << '\\n';\n    auto [q, r] = divide(17, 5);\n    std::cout << q << \" r \" << r << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"1 9\n3 r 2","error":false,"pitfall":null,"see":[{"topic":"pair-tuple","entry":null},{"topic":"classes","entry":null}]}]},{"id":"strings","glyph":"\"Aa\"","name":{"en":"Strings","pl":"Napisy"},"summary":{"en":"std::string: joining, indexing, searching and editing, comparing, converting to and from numbers, character functions and C strings.","pl":"Napisy (strings) std::string: łączenie, indeksowanie, wyszukiwanie i edycja, porównywanie, konwersja na liczby i z liczb, funkcje znakowe i napisy w stylu C."},"headers":["<string>","<cctype>"],"planned":false,"entries":[{"id":"building","title":{"en":"Creating and joining","pl":"Tworzenie i łączenie"},"explain":{"en":"<code>std::string<\/code> holds text and grows as needed. <code>+<\/code> joins strings, <code>+=<\/code> appends to one, <code>size()<\/code> (same as <code>length()<\/code>) gives the number of characters, and <code>empty()<\/code> checks whether there are none.","pl":"<code>std::string<\/code> przechowuje tekst i sam się powiększa w razie potrzeby. <code>+<\/code> łączy napisy (concatenation), <code>+=<\/code> dopisuje na końcu, <code>size()<\/code> (to samo co <code>length()<\/code>) zwraca liczbę znaków, a <code>empty()<\/code> sprawdza, czy napis jest pusty."},"code":"std::string name = \"Ada\";\nstd::string s = \"Hi, \" + name + \"!\";\ns += \" Bye.\";\nstd::cout << s << '\\n';\nstd::cout << s.size() << ' ' << std::boolalpha << s.empty() << '\\n';\nstd::string line(5, '-');    // 5 copies of '-'\nstd::cout << line << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"Hi, Ada! Bye.\n13 false\n-----","error":false,"pitfall":{"en":"<code>\"Hi, \" + \"Ada\"<\/code> doesn't compile: both are C string literals (<code>char<\/code> arrays), not <code>std::string<\/code>s. At least one side of <code>+<\/code> must be a <code>std::string<\/code>, e.g. <code>std::string(\"Hi, \") + \"Ada\"<\/code>.","pl":"<code>\"Hi, \" + \"Ada\"<\/code> się nie skompiluje: oba napisy to literały w stylu C (tablice <code>char<\/code>), a nie <code>std::string<\/code>. Przynajmniej jedna strona <code>+<\/code> musi być typu <code>std::string<\/code>, np. <code>std::string(\"Hi, \") + \"Ada\"<\/code>."},"see":[{"topic":"io","entry":null}]},{"id":"characters","title":{"en":"Characters and indexing","pl":"Znaki i indeksowanie"},"explain":{"en":"<code>s[i]<\/code> is the character at index <code>i<\/code> (from 0 to <code>size() - 1<\/code>); <code>s.at(i)<\/code> does the same but checks the index. <code>&lt;cctype&gt;<\/code> has functions for single <code>char<\/code>s: <code>std::isdigit<\/code>, <code>std::isalpha<\/code>, <code>std::isspace<\/code>, <code>std::toupper<\/code>, <code>std::tolower<\/code>.","pl":"<code>s[i]<\/code> to znak o indeksie (index) <code>i<\/code> (od 0 do <code>size() - 1<\/code>), a <code>s.at(i)<\/code> robi to samo, ale sprawdza indeks. W <code>&lt;cctype&gt;<\/code> są funkcje dla pojedynczych znaków <code>char<\/code>: <code>std::isdigit<\/code>, <code>std::isalpha<\/code>, <code>std::isspace<\/code>, <code>std::toupper<\/code>, <code>std::tolower<\/code>."},"code":"std::string s = \"abc123\";\nstd::cout << s[0] << s.at(1) << s.back() << '\\n';\nint digits = 0;\nfor (char& c : s) {\n    if (std::isdigit(c)) {\n        ++digits;\n    }\n    c = std::toupper(c);\n}\nstd::cout << s << ' ' << digits << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"ab3\nABC123 3","error":false,"pitfall":{"en":"<code>std::toupper<\/code> returns an <code>int<\/code>, so <code>std::cout &lt;&lt; std::toupper('a')<\/code> prints <code>65<\/code>. Store the result in a <code>char<\/code> (as above) or write <code>static_cast&lt;char&gt;(std::toupper(c))<\/code>.","pl":"<code>std::toupper<\/code> zwraca <code>int<\/code>, więc <code>std::cout &lt;&lt; std::toupper('a')<\/code> wypisze <code>65<\/code>. Zapisz wynik do zmiennej typu <code>char<\/code> (jak wyżej) albo napisz <code>static_cast&lt;char&gt;(std::toupper(c))<\/code>."},"see":[{"topic":"loops","entry":null}]},{"id":"search-edit","title":{"en":"Searching and editing","pl":"Wyszukiwanie i edycja"},"explain":{"en":"<code>find(text)<\/code> returns the index of the first match, or <code>std::string::npos<\/code> if there is none. <code>substr(pos, count)<\/code> copies <code>count<\/code> characters starting at <code>pos<\/code>. <code>replace(pos, count, text)<\/code>, <code>insert(pos, text)<\/code> and <code>erase(pos, count)<\/code> change the string itself.","pl":"<code>find(tekst)<\/code> zwraca indeks pierwszego wystąpienia albo <code>std::string::npos<\/code>, jeśli go nie ma. <code>substr(pos, ile)<\/code> kopiuje fragment (substring) o długości <code>ile<\/code> od pozycji <code>pos<\/code>. <code>replace(pos, ile, tekst)<\/code>, <code>insert(pos, tekst)<\/code> i <code>erase(pos, ile)<\/code> zmieniają sam napis."},"code":"std::string s = \"I like tea\";\nstd::size_t pos = s.find(\"tea\");\nstd::cout << pos << ' ' << s.substr(2, 4) << '\\n';\ns.replace(pos, 3, \"coffee\");\ns.insert(0, \"Yes, \");\nstd::cout << s << '\\n';\nif (s.find(\"milk\") == std::string::npos) {\n    std::cout << \"no milk\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"7 like\nYes, I like coffee\nno milk","error":false,"pitfall":{"en":"<code>if (s.find(\"x\"))<\/code> is wrong: a match at index 0 counts as <code>false<\/code>, and \"not found\" (<code>npos<\/code>, a huge number) counts as <code>true<\/code>. Always compare with <code>std::string::npos<\/code>. And the second argument of <code>substr<\/code> is a length, not an end index.","pl":"<code>if (s.find(\"x\"))<\/code> to błąd: trafienie na indeksie 0 daje <code>false<\/code>, a brak trafienia (<code>npos<\/code>, bardzo duża liczba) daje <code>true<\/code>. Zawsze porównuj z <code>std::string::npos<\/code>. Pamiętaj też, że drugi argument <code>substr<\/code> to długość, a nie indeks końca."},"see":[]},{"id":"comparing","title":{"en":"Comparing","pl":"Porównywanie"},"explain":{"en":"<code>==<\/code>, <code>!=<\/code>, <code>&lt;<\/code> and <code>&gt;<\/code> compare strings by content, character by character, like a dictionary. Case matters: every uppercase letter comes before every lowercase one, and <code>\"10\" &lt; \"9\"<\/code> because <code>'1' &lt; '9'<\/code>. For case-insensitive or numeric order, convert first (<code>std::tolower<\/code>, <code>std::stoi<\/code>).","pl":"<code>==<\/code>, <code>!=<\/code>, <code>&lt;<\/code> i <code>&gt;<\/code> porównują napisy po zawartości, znak po znaku, jak w słowniku (leksykograficznie, lexicographically). Wielkość liter ma znaczenie: każda wielka litera jest „mniejsza” od każdej małej, a <code>\"10\" &lt; \"9\"<\/code>, bo <code>'1' &lt; '9'<\/code>. Żeby porównać bez wielkości liter albo jak liczby, najpierw przekształć napisy (<code>std::tolower<\/code>, <code>std::stoi<\/code>)."},"code":"std::string a = \"apple\";\nstd::string b = \"banana\";\nstd::cout << std::boolalpha;\nstd::cout << (a == \"apple\") << ' ' << (a < b) << '\\n';\nstd::cout << (std::string(\"Zebra\") < a) << '\\n';   // 'Z' < 'a'\nstd::cout << (std::string(\"10\") < \"9\") << '\\n';    // '1' < '9'","lang":"cpp","codeTitle":null,"input":null,"output":"true true\ntrue\ntrue","error":false,"pitfall":null,"see":[{"topic":"sorting","entry":null}]},{"id":"converting","title":{"en":"Numbers to text and back","pl":"Liczby a napisy"},"explain":{"en":"<code>std::stoi<\/code> and <code>std::stod<\/code> turn text into an <code>int<\/code> or a <code>double<\/code>; <code>std::to_string<\/code> turns a number into text. For a single digit character <code>c<\/code>, <code>c - '0'<\/code> gives its value.","pl":"<code>std::stoi<\/code> i <code>std::stod<\/code> zamieniają tekst na <code>int<\/code> lub <code>double<\/code>, a <code>std::to_string<\/code> zamienia liczbę na tekst. Dla pojedynczej cyfry zapisanej jako znak <code>c<\/code> wyrażenie <code>c - '0'<\/code> daje jej wartość."},"code":"int n = std::stoi(\"42\");\ndouble d = std::stod(\"3.75\");\nstd::string s = std::to_string(n + 1);\nstd::cout << n * 2 << ' ' << d + 1 << ' ' << s + \"!\" << '\\n';\nchar c = '7';\nstd::cout << c - '0' << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"84 4.75 43!\n7","error":false,"pitfall":{"en":"<code>std::stoi(\"abc\")<\/code> throws <code>std::invalid_argument<\/code>, which ends the program unless you catch it, while <code>std::stoi(\"12abc\")<\/code> quietly returns 12. And <code>std::to_string(2.5)<\/code> gives <code>\"2.500000\"<\/code>; use <code>std::format<\/code> or a stream for nicer output.","pl":"<code>std::stoi(\"abc\")<\/code> rzuca wyjątek (exception) <code>std::invalid_argument<\/code>, który kończy program, jeśli go nie złapiesz, a <code>std::stoi(\"12abc\")<\/code> po cichu zwraca 12. Z kolei <code>std::to_string(2.5)<\/code> daje <code>\"2.500000\"<\/code>; do ładnego formatowania użyj <code>std::format<\/code> albo strumienia."},"see":[{"topic":"exceptions","entry":null},{"topic":"io","entry":null}]},{"id":"c-strings","title":{"en":"C strings vs std::string","pl":"Napisy w stylu C a std::string"},"explain":{"en":"A C string is a <code>char<\/code> array ending with the null character <code>'\\0'<\/code>; literals like <code>\"cat\"<\/code> are C strings. They don't know their length and can't be joined with <code>+<\/code>. Convert with <code>std::string s = cstr;<\/code>, and back with <code>s.c_str()<\/code> when an old function wants a <code>const char*<\/code>.","pl":"Napis w stylu C (C string) to tablica <code>char<\/code> zakończona znakiem zerowym <code>'\\0'<\/code>; literały takie jak <code>\"cat\"<\/code> są właśnie takimi napisami. Nie znają swojej długości i nie da się ich łączyć przez <code>+<\/code>. Zamiana: <code>std::string s = cstr;<\/code>, a w drugą stronę <code>s.c_str()<\/code>, gdy stara funkcja wymaga <code>const char*<\/code>."},"code":"char word[] = \"cat\";              // 4 chars: 'c' 'a' 't' '\\0'\nstd::cout << sizeof(word) << '\\n';\nstd::string s = word;             // C string -> std::string\ns += \"fish\";\nstd::cout << s << ' ' << s.size() << '\\n';\nconst char* p = s.c_str();        // std::string -> C string\nstd::cout << p << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"4\ncatfish 7\ncatfish","error":false,"pitfall":{"en":"<code>==<\/code> on C strings compares their addresses, not the text, so <code>word == \"cat\"<\/code> is <code>false<\/code>. Compare <code>std::string<\/code>s instead, or use <code>std::strcmp<\/code> from <code>&lt;cstring&gt;<\/code>.","pl":"<code>==<\/code> na napisach w stylu C porównuje ich adresy, a nie tekst, więc <code>word == \"cat\"<\/code> daje <code>false<\/code>. Porównuj obiekty <code>std::string<\/code> albo użyj <code>std::strcmp<\/code> z <code>&lt;cstring&gt;<\/code>."},"see":[{"topic":"arrays","entry":null},{"topic":"pointers","entry":null}]}]},{"id":"arrays","glyph":"a[i]","name":{"en":"Arrays","pl":"Tablice"},"summary":{"en":"C arrays and std::array, 2-D arrays, passing arrays to functions, and why going out of bounds is undefined behaviour.","pl":"Tablice (arrays): tablice w stylu C i std::array, tablice dwuwymiarowe, przekazywanie tablic do funkcji i dlaczego wyjście poza zakres to niezdefiniowane zachowanie."},"headers":["<array>"],"planned":false,"entries":[{"id":"c-arrays","title":{"en":"C arrays","pl":"Tablice w stylu C"},"explain":{"en":"<code>int a[5]<\/code> is five <code>int<\/code>s side by side, with indices <code>0<\/code> to <code>4<\/code>. Missing values in <code>{...}<\/code> become 0 (so <code>= {}<\/code> zeroes the whole array), and <code>int b[] = {...}<\/code> takes its size from the list. <code>std::size(a)<\/code> (C++17) gives the number of elements.","pl":"<code>int a[5]<\/code> to pięć liczb <code>int<\/code> leżących obok siebie, z indeksami (index) od <code>0<\/code> do <code>4<\/code>. Brakujące wartości w <code>{...}<\/code> stają się zerami (więc <code>= {}<\/code> zeruje całą tablicę), a <code>int b[] = {...}<\/code> bierze rozmiar z listy. <code>std::size(a)<\/code> (C++17) zwraca liczbę elementów."},"code":"int a[5] = {10, 20, 30};   // the rest are 0\nint b[] = {1, 2, 3};       // size 3, from the list\na[4] = 50;\nfor (int i = 0; i < 5; ++i) {\n    std::cout << a[i] << ' ';\n}\nstd::cout << '\\n' << std::size(b) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"10 20 30 0 50\n3","error":false,"pitfall":{"en":"The size must be a compile-time constant: <code>int a[n];<\/code> with <code>n<\/code> read at run time is a g++ extension (VLA), not standard C++ (<code>-pedantic<\/code> warns), so use <code>std::vector&lt;int&gt; a(n);<\/code>. And a local array without <code>= {...}<\/code> holds garbage.","pl":"Rozmiar musi być stałą znaną w czasie kompilacji: <code>int a[n];<\/code> z <code>n<\/code> wczytanym w trakcie działania to rozszerzenie g++ (VLA), a nie standardowy C++ (<code>-pedantic<\/code> ostrzega), więc użyj <code>std::vector&lt;int&gt; a(n);<\/code>. Lokalna tablica bez <code>= {...}<\/code> zawiera śmieci."},"see":[{"topic":"vector","entry":null}]},{"id":"std-array","title":{"en":"std::array","pl":"std::array"},"explain":{"en":"<code>std::array&lt;int, 4&gt;<\/code> is a fixed-size array that behaves like a normal object: it knows its <code>size()<\/code>, can be copied with <code>=<\/code> and compared with <code>==<\/code>, has <code>at()<\/code> with bounds checking, and works with algorithms. Prefer it to a C array when the size is fixed; use <code>std::vector<\/code> when it isn't.","pl":"<code>std::array&lt;int, 4&gt;<\/code> to tablica o stałym rozmiarze, która zachowuje się jak zwykły obiekt: zna swój <code>size()<\/code>, można ją skopiować przez <code>=<\/code> i porównać przez <code>==<\/code>, ma <code>at()<\/code> ze sprawdzaniem zakresu i działa z algorytmami. Wybieraj ją zamiast tablicy w stylu C, gdy rozmiar jest stały, a <code>std::vector<\/code>, gdy nie jest."},"code":"std::array<int, 4> a{5, 2, 8, 1};\nstd::sort(a.begin(), a.end());\nfor (int x : a) {\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';\nstd::array<int, 4> copy = a;   // a C array can't be copied like this\ncopy[0] = 99;\nstd::cout << a.size() << ' ' << a[0] << ' ' << copy[0] << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 5 8\n4 1 99","error":false,"pitfall":null,"see":[{"topic":"vector","entry":null},{"topic":"sorting","entry":null}]},{"id":"2d-arrays","title":{"en":"2-D arrays","pl":"Tablice dwuwymiarowe"},"explain":{"en":"<code>int grid[2][3]<\/code> is 2 rows of 3 columns, used as <code>grid[row][col]<\/code>, usually with nested loops. To pass one to a function, write every size except the first: <code>void print(int g[][3], int rows)<\/code>. For sizes known only at run time, use a vector of vectors.","pl":"<code>int grid[2][3]<\/code> to tablica dwuwymiarowa (2-D array): 2 wiersze po 3 kolumny, a element to <code>grid[wiersz][kolumna]<\/code>. Przechodzi się po niej zwykle pętlami zagnieżdżonymi. Przy przekazywaniu do funkcji podaj wszystkie rozmiary oprócz pierwszego: <code>void print(int g[][3], int rows)<\/code>. Gdy rozmiary są znane dopiero w trakcie działania, użyj wektora wektorów."},"code":"int grid[2][3] = {\n    {1, 2, 3},\n    {4, 5, 6},\n};\nfor (int r = 0; r < 2; ++r) {\n    for (int c = 0; c < 3; ++c) {\n        std::cout << grid[r][c] << ' ';\n    }\n    std::cout << '\\n';\n}\nstd::cout << grid[1][2] << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 3\n4 5 6\n6","error":false,"pitfall":{"en":"<code>grid[1, 2]<\/code> is not <code>grid[1][2]<\/code>: the comma operator throws the <code>1<\/code> away, so it means <code>grid[2]<\/code>, a row that doesn't exist. Use one pair of brackets per dimension.","pl":"<code>grid[1, 2]<\/code> to nie <code>grid[1][2]<\/code>: operator przecinka odrzuca <code>1<\/code>, więc wychodzi <code>grid[2]<\/code>, czyli nieistniejący wiersz. Każdy wymiar ma własną parę nawiasów."},"see":[{"topic":"vector","entry":null},{"topic":"loops","entry":null}]},{"id":"passing","title":{"en":"Passing to functions","pl":"Przekazywanie do funkcji"},"explain":{"en":"A C array passed to a function decays to a pointer to its first element: the size is lost, so pass it as a second parameter. The elements are not copied, so the function can change the caller's array. A <code>std::array<\/code> passed by reference keeps its size.","pl":"Tablica w stylu C przekazana do funkcji zamienia się we wskaźnik (pointer) na pierwszy element (array decay): rozmiar ginie, więc przekaż go jako drugi parametr. Elementy nie są kopiowane, więc funkcja może zmienić tablicę wywołującego. <code>std::array<\/code> przekazana przez referencję zachowuje rozmiar."},"code":"void doubleAll(int a[], std::size_t n) {   // a is really an int*\n    for (std::size_t i = 0; i < n; ++i) {\n        a[i] *= 2;                         // changes the caller's array\n    }\n}\n\nint sum(const std::array<int, 3>& a) {     // the size is part of the type\n    int total = 0;\n    for (int x : a) {\n        total += x;\n    }\n    return total;\n}\n\nint main() {\n    int raw[] = {1, 2, 3};\n    doubleAll(raw, std::size(raw));\n    std::cout << raw[0] << ' ' << raw[2] << '\\n';\n    std::array<int, 3> arr{4, 5, 6};\n    std::cout << sum(arr) << ' ' << arr.size() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"2 6\n15 3","error":false,"pitfall":{"en":"Inside the function, <code>sizeof(a) / sizeof(a[0])<\/code> doesn't give the element count: <code>a<\/code> is a pointer, so you get something like 2 (8 / 4). g++ even warns about it. Always pass the size, or use <code>std::array<\/code> / <code>std::vector<\/code>.","pl":"Wewnątrz funkcji <code>sizeof(a) / sizeof(a[0])<\/code> nie daje liczby elementów: <code>a<\/code> jest wskaźnikiem, więc wychodzi np. 2 (8 / 4). g++ nawet o tym ostrzega. Zawsze przekazuj rozmiar albo używaj <code>std::array<\/code> / <code>std::vector<\/code>."},"see":[{"topic":"pointers","entry":null},{"topic":"functions","entry":null}]},{"id":"out-of-bounds","title":{"en":"Out of bounds","pl":"Wyjście poza zakres"},"explain":{"en":"Valid indices are <code>0<\/code> to <code>size - 1<\/code>. <code>a[i]<\/code> doesn't check the index: reading or writing outside is undefined behaviour (UB), so the program may crash, print garbage or seem to work. <code>at(i)<\/code> on <code>std::array<\/code>, <code>std::vector<\/code> and <code>std::string<\/code> checks and throws <code>std::out_of_range<\/code>.","pl":"Poprawne indeksy to od <code>0<\/code> do <code>rozmiar - 1<\/code>. <code>a[i]<\/code> nie sprawdza indeksu: odczyt lub zapis poza tablicą to niezdefiniowane zachowanie (undefined behaviour, UB), więc program może się wysypać, wypisać śmieci albo pozornie działać. <code>at(i)<\/code> w <code>std::array<\/code>, <code>std::vector<\/code> i <code>std::string<\/code> sprawdza indeks i rzuca wyjątek <code>std::out_of_range<\/code>."},"code":"std::array<int, 3> a{1, 2, 3};\n// a[3] = 7;   // undefined behaviour: no check at all!\ntry {\n    std::cout << a.at(3) << '\\n';\n} catch (const std::out_of_range&) {\n    std::cout << \"index 3 is out of range\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"index 3 is out of range","error":false,"pitfall":{"en":"The classic off-by-one: <code>for (int i = 0; i &lt;= 5; ++i)<\/code> on a 5-element array touches <code>a[5]<\/code>. Write <code>i &lt; size<\/code>. Compiling with <code>-fsanitize=address<\/code> (g++ or clang on Linux and macOS) catches such bugs while testing.","pl":"Klasyczny błąd o jeden (off-by-one): <code>for (int i = 0; i &lt;= 5; ++i)<\/code> na tablicy 5-elementowej sięga do <code>a[5]<\/code>. Pisz <code>i &lt; rozmiar<\/code>. Kompilacja z <code>-fsanitize=address<\/code> (g++ lub clang na Linuksie i macOS) wyłapuje takie błędy podczas testów."},"see":[{"topic":"exceptions","entry":null},{"topic":"vector","entry":null}]}]}]},{"id":"memory","hue":25,"name":{"en":"Pointers &amp; memory","pl":"Wskaźniki i pamięć"},"desc":{"en":"Addresses, references, the heap and who owns the memory.","pl":"Adresy, referencje, sterta i to, kto jest właścicielem pamięci."},"topics":[{"id":"pointers","glyph":"*p","name":{"en":"Pointers","pl":"Wskaźniki"},"summary":{"en":"Addresses with <code>&amp;<\/code> and <code>*<\/code>, <code>nullptr<\/code>, pointers and arrays, pointer arithmetic, <code>const<\/code> pointers and <code>-&gt;<\/code>.","pl":"Wskaźniki (pointers): adresy, <code>&amp;<\/code> i <code>*<\/code>, <code>nullptr<\/code>, wskaźniki a tablice, arytmetyka wskaźników, <code>const<\/code> i <code>-&gt;<\/code>."},"headers":[],"planned":false,"entries":[{"id":"address-and-dereference","title":{"en":"Address-of and dereference","pl":"Adres i wyłuskanie"},"explain":{"en":"A pointer stores the address of another variable. <code>&amp;x<\/code> gives the address of <code>x<\/code>, and <code>*p<\/code> (dereference) reaches the variable that <code>p<\/code> points to, for reading or writing. <code>std::cout &lt;&lt; p<\/code> would print the address itself, e.g. <code>0x7ffd5e8c<\/code>, which changes from run to run.","pl":"Wskaźnik (pointer) przechowuje adres innej zmiennej. <code>&amp;x<\/code> daje adres zmiennej <code>x<\/code>, a <code>*p<\/code> (wyłuskanie, dereference) pozwala odczytać lub zmienić zmienną, na którą wskazuje <code>p<\/code>. <code>std::cout &lt;&lt; p<\/code> wypisałoby sam adres, np. <code>0x7ffd5e8c<\/code>, inny przy każdym uruchomieniu."},"code":"int x = 10;\nint* p = &x;               // p holds the address of x\nstd::cout << *p << '\\n';   // read x through p\n*p = 20;                   // change x through p\nstd::cout << x << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"10\n20","error":false,"pitfall":{"en":"<code>int* a, b;<\/code> makes only <code>a<\/code> a pointer; <code>b<\/code> is a plain <code>int<\/code>. Declare one pointer per line, or write <code>int *a, *b;<\/code>.","pl":"<code>int* a, b;<\/code> deklaruje jako wskaźnik tylko <code>a<\/code>; <code>b<\/code> jest zwykłym <code>int<\/code>. Deklaruj jeden wskaźnik na linię albo pisz <code>int *a, *b;<\/code>."},"see":[{"topic":"references","entry":null}]},{"id":"nullptr","title":{"en":"nullptr","pl":"nullptr"},"explain":{"en":"<code>nullptr<\/code> means \"points nowhere\". Use it to initialise a pointer that has no target yet, and check for it before dereferencing. <code>if (p)<\/code> is short for <code>if (p != nullptr)<\/code>.","pl":"<code>nullptr<\/code> oznacza wskaźnik pusty (null pointer), który na nic nie wskazuje. Inicjalizuj nim wskaźnik, który nie ma jeszcze celu, i sprawdzaj go przed wyłuskaniem. <code>if (p)<\/code> to skrót od <code>if (p != nullptr)<\/code>."},"code":"int* p = nullptr;          // points nowhere yet\nif (p == nullptr) {\n    std::cout << \"no target\\n\";\n}\nint x = 5;\np = &x;\nif (p) {                   // same as p != nullptr\n    std::cout << *p << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"no target\n5","error":false,"pitfall":{"en":"Dereferencing <code>nullptr<\/code> or an uninitialised pointer (<code>int* p;<\/code>) is undefined behaviour, usually a crash (segmentation fault). Always initialise pointers, and use <code>nullptr<\/code> rather than the old <code>NULL<\/code> or <code>0<\/code>.","pl":"Wyłuskanie <code>nullptr<\/code> albo niezainicjalizowanego wskaźnika (<code>int* p;<\/code>) to zachowanie niezdefiniowane (undefined behaviour), zwykle kończące się awarią (segmentation fault). Zawsze inicjalizuj wskaźniki i używaj <code>nullptr<\/code> zamiast starego <code>NULL<\/code> czy <code>0<\/code>."},"see":[]},{"id":"arrays","title":{"en":"Pointers and arrays","pl":"Wskaźniki a tablice"},"explain":{"en":"An array name turns (decays) into a pointer to its first element, so <code>int* p = a;<\/code> means <code>p = &amp;a[0]<\/code>. Indexing works on pointers too: <code>p[i]<\/code> is exactly <code>*(p + i)<\/code>.","pl":"Nazwa tablicy zamienia się (decay) we wskaźnik na pierwszy element, więc <code>int* p = a;<\/code> znaczy <code>p = &amp;a[0]<\/code>. Indeksowanie działa też na wskaźnikach: <code>p[i]<\/code> to dokładnie <code>*(p + i)<\/code>."},"code":"int a[] = {10, 20, 30};\nint* p = a;                // same as &a[0]\nstd::cout << *p << ' ' << p[1] << ' ' << *(p + 2) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"10 20 30","error":false,"pitfall":{"en":"A pointer doesn't know how many elements it points to: <code>sizeof(p)<\/code> is the size of the pointer (8 bytes on 64-bit), not of the array. Pass the size separately, or use <code>std::array<\/code> / <code>std::vector<\/code>.","pl":"Wskaźnik nie wie, na ile elementów wskazuje: <code>sizeof(p)<\/code> to rozmiar samego wskaźnika (8 bajtów w systemie 64-bitowym), a nie tablicy. Przekazuj rozmiar osobno albo użyj <code>std::array<\/code> / <code>std::vector<\/code>."},"see":[{"topic":"arrays","entry":null}]},{"id":"arithmetic","title":{"en":"Pointer arithmetic","pl":"Arytmetyka wskaźników"},"explain":{"en":"<code>p + 1<\/code> moves by one <em>element<\/em>, not one byte, and <code>++p<\/code> steps to the next element. Subtracting two pointers into the same array gives the number of elements between them. Pointer \"one past the end\" may be compared, but not dereferenced.","pl":"<code>p + 1<\/code> przesuwa wskaźnik o jeden <em>element<\/em>, a nie o bajt, a <code>++p<\/code> przechodzi do następnego elementu. Różnica dwóch wskaźników do tej samej tablicy to liczba elementów między nimi. Wskaźnik „jeden za końcem” można porównywać, ale nie wolno go wyłuskiwać."},"code":"int a[] = {1, 2, 3, 4, 5};\nint* first = a;\nint* last = a + 5;         // one past the end\nint sum = 0;\nfor (int* p = first; p != last; ++p) {\n    sum += *p;\n}\nstd::cout << sum << '\\n';\nstd::cout << last - first << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"15\n5","error":false,"pitfall":{"en":"Nothing checks the bounds: <code>*(a + 5)<\/code> or moving a pointer before the start of the array is undefined behaviour, and it may silently read garbage.","pl":"Nic nie sprawdza zakresu: <code>*(a + 5)<\/code> albo cofnięcie wskaźnika przed początek tablicy to zachowanie niezdefiniowane, które może po cichu odczytać śmieci."},"see":[{"topic":"iterators","entry":null}]},{"id":"const","title":{"en":"const with pointers","pl":"const i wskaźniki"},"explain":{"en":"Read the type right to left. <code>const int* p<\/code> is a pointer to a const int: you can't change the value through <code>p<\/code>, but <code>p<\/code> can point elsewhere. <code>int* const q<\/code> is a const pointer: it always points to the same variable, which you can change.","pl":"Typ czytaj od prawej do lewej. <code>const int* p<\/code> to wskaźnik na stałą (pointer to const): przez <code>p<\/code> nie zmienisz wartości, ale <code>p<\/code> może wskazać coś innego. <code>int* const q<\/code> to stały wskaźnik (const pointer): zawsze wskazuje tę samą zmienną, ale możesz ją zmieniać."},"code":"int x = 1;\nint y = 2;\nconst int* p = &x;         // pointer to const int\n// *p = 5;                 // error: can't change x through p\np = &y;                    // OK: p points elsewhere\nint* const q = &x;         // const pointer to int\n*q = 5;                    // OK: x becomes 5\n// q = &y;                 // error: q can't be re-pointed\nstd::cout << *p << ' ' << x << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"2 5","error":false,"pitfall":null,"see":[]},{"id":"arrow","title":{"en":"The -&gt; operator","pl":"Operator -&gt;"},"explain":{"en":"To reach a member through a pointer to a struct or class, write <code>p-&gt;x<\/code>. It is shorthand for <code>(*p).x<\/code>.","pl":"Do składowej struktury lub klasy przez wskaźnik sięgasz operatorem <code>p-&gt;x<\/code>. To skrót od <code>(*p).x<\/code>."},"code":"struct Point {\n    int x;\n    int y;\n};\nPoint pt{3, 4};\nPoint* p = &pt;\np->x = 10;                 // same as (*p).x = 10\nstd::cout << p->x << ' ' << (*p).y << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"10 4","error":false,"pitfall":{"en":"<code>*p.x<\/code> doesn't compile: <code>.<\/code> binds tighter than <code>*<\/code>, so it means <code>*(p.x)<\/code>. Write <code>p-&gt;x<\/code> or <code>(*p).x<\/code>.","pl":"<code>*p.x<\/code> się nie skompiluje: <code>.<\/code> wiąże mocniej niż <code>*<\/code>, więc to znaczy <code>*(p.x)<\/code>. Pisz <code>p-&gt;x<\/code> albo <code>(*p).x<\/code>."},"see":[{"topic":"classes","entry":null},{"topic":"smart-pointers","entry":null}]}]},{"id":"references","glyph":"&r","name":{"en":"References","pl":"Referencje"},"summary":{"en":"References as aliases: reference vs pointer, <code>const<\/code> references, references in loops and dangling references.","pl":"Referencje (references) jako aliasy: referencja a wskaźnik, referencje <code>const<\/code>, referencje w pętlach i referencje wiszące."},"headers":[],"planned":false,"entries":[{"id":"alias","title":{"en":"A reference is an alias","pl":"Referencja to alias"},"explain":{"en":"<code>int&amp; r = x;<\/code> makes <code>r<\/code> another name for <code>x<\/code>: no copy is made, and reading or writing <code>r<\/code> reads or writes <code>x<\/code>. A reference must be initialised when it is declared.","pl":"<code>int&amp; r = x;<\/code> sprawia, że <code>r<\/code> jest drugą nazwą (aliasem) zmiennej <code>x<\/code>: nic nie jest kopiowane, a odczyt i zapis <code>r<\/code> działa wprost na <code>x<\/code>. Referencję (reference) trzeba zainicjalizować już przy deklaracji."},"code":"int x = 10;\nint& r = x;                // r is another name for x\nr = 20;                    // changes x\nstd::cout << x << '\\n';\nx = 30;\nstd::cout << r << '\\n';\nstd::cout << (&r == &x) << '\\n';   // 1: same address","lang":"cpp","codeTitle":null,"input":null,"output":"20\n30\n1","error":false,"pitfall":{"en":"<code>int&amp; r;<\/code> doesn't compile: a reference has to refer to something from the start. There is no \"null reference\".","pl":"<code>int&amp; r;<\/code> się nie skompiluje: referencja musi od początku na coś wskazywać. Nie istnieje „pusta referencja”."},"see":[]},{"id":"vs-pointer","title":{"en":"Reference vs pointer","pl":"Referencja a wskaźnik"},"explain":{"en":"A pointer can be <code>nullptr<\/code> and can be re-pointed; you use it with <code>*<\/code> and <code>&amp;<\/code>. A reference is always bound to one object for its whole life and is used like the object itself. Prefer references; use a pointer when \"nothing\" is a valid value or the target must change.","pl":"Wskaźnik (pointer) może być <code>nullptr<\/code> i można go przestawić na inny obiekt; używasz go z <code>*<\/code> i <code>&amp;<\/code>. Referencja jest przez całe życie związana z jednym obiektem i używa się jej jak samego obiektu. Wybieraj referencje; wskaźnika używaj, gdy „brak obiektu” jest poprawną wartością albo cel musi się zmieniać."},"code":"int a = 1;\nint b = 2;\nint* p = &a;\np = &b;                    // pointer: now points to b\n*p = 20;                   // b = 20\nint& r = a;                // reference: bound to a for good\nr = b;                     // NOT re-binding: copies b's value into a\nstd::cout << a << ' ' << b << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"20 20","error":false,"pitfall":{"en":"<code>r = b;<\/code> never makes <code>r<\/code> refer to <code>b<\/code>: it assigns <code>b<\/code>'s value to the object <code>r<\/code> is bound to. A reference can't be re-bound.","pl":"<code>r = b;<\/code> nigdy nie przestawia <code>r<\/code> na <code>b<\/code>: przypisuje wartość <code>b<\/code> obiektowi, z którym <code>r<\/code> jest związana. Referencji nie da się przepiąć."},"see":[{"topic":"pointers","entry":null}]},{"id":"const-reference","title":{"en":"const references","pl":"Referencje const"},"explain":{"en":"<code>const T&amp;<\/code> is a read-only view: no copy, no changes, but it still sees changes made to the original. It can also bind to a temporary value, and keeps that temporary alive. That's why <code>const std::string&amp;<\/code> is the usual type for read-only parameters.","pl":"<code>const T&amp;<\/code> to widok tylko do odczytu: bez kopii i bez możliwości zmiany, ale widać przez niego zmiany oryginału. Można ją też związać z wartością tymczasową (temporary), której życie wtedy się wydłuża. Dlatego <code>const std::string&amp;<\/code> to typowy typ parametru tylko do odczytu."},"code":"int x = 5;\nconst int& cr = x;         // read-only view of x\nx = 6;\nstd::cout << cr << '\\n';   // sees the change\n// cr = 7;                 // error: cr is read-only\nconst std::string& s = std::string(\"tmp\") + \"!\";  // binds to a temporary\nstd::cout << s << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"6\ntmp!","error":false,"pitfall":{"en":"A non-const reference can't bind to a literal or temporary: calling <code>void twice(int&amp; n)<\/code> as <code>twice(5)<\/code> fails with <em>cannot bind non-const lvalue reference of type 'int&amp;' to an rvalue<\/em>. Take <code>const int&amp;<\/code> (or plain <code>int<\/code>) if you don't modify it.","pl":"Referencji bez <code>const<\/code> nie zwiążesz z literałem ani wartością tymczasową: wywołanie <code>void twice(int&amp; n)<\/code> jako <code>twice(5)<\/code> kończy się błędem <em>cannot bind non-const lvalue reference of type 'int&amp;' to an rvalue<\/em>. Jeśli nie zmieniasz argumentu, przyjmij <code>const int&amp;<\/code> (albo zwykły <code>int<\/code>)."},"see":[{"topic":"functions","entry":null}]},{"id":"range-for","title":{"en":"References in range-for","pl":"Referencje w pętli zakresowej"},"explain":{"en":"In <code>for (int x : v)<\/code> each <code>x<\/code> is a copy, so changing it doesn't touch the vector. Write <code>auto&amp;<\/code> to modify the elements, and <code>const auto&amp;<\/code> to read big elements (strings, structs) without copying them.","pl":"W <code>for (int x : v)<\/code> każde <code>x<\/code> jest kopią, więc jego zmiana nie wpływa na wektor. Pisz <code>auto&amp;<\/code>, żeby zmieniać elementy, i <code>const auto&amp;<\/code>, żeby czytać duże elementy (napisy, struktury) bez kopiowania."},"code":"std::vector<int> v = {1, 2, 3};\nfor (auto& x : v) {        // x is each element itself\n    x *= 10;\n}\nfor (const auto& x : v) {  // read-only, no copies\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"10 20 30","error":false,"pitfall":{"en":"Forgetting the <code>&amp;<\/code> is a silent bug: <code>for (auto x : v) x *= 10;<\/code> compiles and runs, but only changes copies and leaves <code>v<\/code> as it was.","pl":"Zapomniany <code>&amp;<\/code> to cichy błąd: <code>for (auto x : v) x *= 10;<\/code> kompiluje się i działa, ale zmienia tylko kopie, a <code>v<\/code> zostaje bez zmian."},"see":[{"topic":"loops","entry":null},{"topic":"vector","entry":null}]},{"id":"returning-reference","title":{"en":"Returning a reference","pl":"Zwracanie referencji"},"explain":{"en":"A function may return a reference to something that outlives the call, such as an element of a container passed in by reference. The caller then works on the original, and can even assign to the call.","pl":"Funkcja może zwrócić referencję do czegoś, co żyje dłużej niż samo wywołanie, np. do elementu kontenera przekazanego przez referencję. Wywołujący działa wtedy na oryginale i może nawet przypisać coś do wyniku wywołania."},"code":"int& largest(std::vector<int>& v) {\n    return *std::max_element(v.begin(), v.end());\n}\n\nint main() {\n    std::vector<int> v = {3, 9, 4};\n    largest(v) = 0;            // changes the 9 inside v\n    for (int x : v) {\n        std::cout << x << ' ';\n    }\n    std::cout << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"3 0 4","error":false,"pitfall":null,"see":[]},{"id":"dangling","title":{"en":"Dangling references","pl":"Wiszące referencje"},"explain":{"en":"A reference to a local variable dies with it: once the function returns, the reference refers to freed stack memory. g++ warns <em>reference to local variable returned<\/em>. Return such values by value (<code>int make()<\/code>) instead.","pl":"Referencja do zmiennej lokalnej umiera razem z nią: po powrocie z funkcji wskazuje na zwolnioną pamięć stosu (stack). Taka wisząca referencja (dangling reference) to błąd; g++ ostrzega <em>reference to local variable returned<\/em>. Takie wartości zwracaj przez wartość (<code>int make()<\/code>)."},"code":"int& make() {\n    int local = 42;\n    return local;          // warning: reference to local variable returned\n}                          // local is destroyed here\n\nint main() {\n    int& r = make();       // r refers to a dead variable\n    std::cout << r;        // undefined behaviour!\n}","lang":"cpp","codeTitle":null,"input":null,"output":null,"error":false,"pitfall":{"en":"References into a <code>std::vector<\/code> dangle too: <code>int&amp; first = v[0]; v.push_back(4);<\/code> may move the elements to new memory, and <code>first<\/code> then refers to the old, freed block.","pl":"Referencje do elementów <code>std::vector<\/code> też mogą zawisnąć: po <code>int&amp; first = v[0]; v.push_back(4);<\/code> elementy mogą zostać przeniesione w nowe miejsce, a <code>first<\/code> wskazuje wtedy na stary, zwolniony blok."},"see":[{"topic":"dynamic-memory","entry":null},{"topic":"iterators","entry":null}]}]},{"id":"dynamic-memory","glyph":"new","name":{"en":"Dynamic memory","pl":"Pamięć dynamiczna"},"summary":{"en":"Stack vs heap, <code>new<\/code> / <code>delete<\/code>, <code>new[]<\/code> / <code>delete[]<\/code>, leaks, dangling pointers and why to prefer containers and smart pointers.","pl":"Pamięć dynamiczna (dynamic memory): stos i sterta, <code>new<\/code> / <code>delete<\/code>, <code>new[]<\/code> / <code>delete[]<\/code>, wycieki, wiszące wskaźniki i dlaczego lepiej użyć kontenerów i inteligentnych wskaźników."},"headers":[],"planned":false,"entries":[{"id":"stack-vs-heap","title":{"en":"Stack vs heap","pl":"Stos a sterta"},"explain":{"en":"Local variables live on the stack and are destroyed automatically at the closing <code>}<\/code> of their block. An object made with <code>new<\/code> lives on the heap until you <code>delete<\/code> it, so it can outlive the block (or function) that created it.","pl":"Zmienne lokalne żyją na stosie (stack) i są niszczone automatycznie przy zamykającym <code>}<\/code> swojego bloku. Obiekt utworzony przez <code>new<\/code> żyje na stercie (heap), dopóki go nie usuniesz przez <code>delete<\/code>, więc może przeżyć blok (lub funkcję), który go stworzył."},"code":"struct Noisy {\n    std::string name;\n    Noisy(std::string n) : name(n) { std::cout << \"+ \" << name << '\\n'; }\n    ~Noisy() { std::cout << \"- \" << name << '\\n'; }\n};\n\nint main() {\n    Noisy* h = nullptr;\n    {\n        Noisy s(\"stack\");\n        h = new Noisy(\"heap\");\n    }                          // s is destroyed here, *h is not\n    std::cout << \"after block\\n\";\n    delete h;                  // now *h is destroyed\n}","lang":"cpp","codeTitle":null,"input":null,"output":"+ stack\n+ heap\n- stack\nafter block\n- heap","error":false,"pitfall":null,"see":[{"topic":"constructors","entry":null}]},{"id":"new-delete","title":{"en":"new and delete","pl":"new i delete"},"explain":{"en":"<code>new T(args)<\/code> creates one object on the heap and returns a pointer to it; <code>delete p<\/code> destroys it and frees the memory. Every <code>new<\/code> needs exactly one matching <code>delete<\/code>. If memory runs out, <code>new<\/code> throws <code>std::bad_alloc<\/code>.","pl":"<code>new T(args)<\/code> tworzy jeden obiekt na stercie i zwraca wskaźnik (pointer) do niego; <code>delete p<\/code> niszczy go i zwalnia pamięć. Każde <code>new<\/code> potrzebuje dokładnie jednego pasującego <code>delete<\/code>. Gdy zabraknie pamięci, <code>new<\/code> rzuca wyjątek (exception) <code>std::bad_alloc<\/code>."},"code":"int* n = new int(42);                 // one int on the heap\nstd::string* s = new std::string(\"hi\");\n*n += 1;\nstd::cout << *n << ' ' << s->size() << '\\n';\ndelete n;                             // free each one exactly once\ndelete s;","lang":"cpp","codeTitle":null,"input":null,"output":"43 2","error":false,"pitfall":{"en":"Only <code>delete<\/code> what came from <code>new<\/code>. <code>int x; delete &amp;x;<\/code> (freeing a stack variable) is undefined behaviour.","pl":"Usuwaj przez <code>delete<\/code> tylko to, co pochodzi z <code>new<\/code>. <code>int x; delete &amp;x;<\/code> (zwalnianie zmiennej ze stosu) to zachowanie niezdefiniowane (undefined behaviour)."},"see":[]},{"id":"arrays","title":{"en":"new[] and delete[]","pl":"new[] i delete[]"},"explain":{"en":"<code>new int[n]<\/code> allocates an array whose size is known only at run time; free it with <code>delete[]<\/code>. The elements start uninitialised; <code>new int[n]{}<\/code> sets them to zero.","pl":"<code>new int[n]<\/code> przydziela tablicę, której rozmiar jest znany dopiero w trakcie działania programu; zwalniasz ją przez <code>delete[]<\/code>. Elementy nie są zainicjalizowane; <code>new int[n]{}<\/code> ustawia je na zero."},"code":"int n = 0;\nstd::cin >> n;\nint* a = new int[n];       // size chosen at run time\nfor (int i = 0; i < n; ++i) {\n    a[i] = i * i;\n}\nstd::cout << a[n - 1] << '\\n';\ndelete[] a;                // [] because it came from new[]","lang":"cpp","codeTitle":null,"input":"5","output":"16","error":false,"pitfall":{"en":"Match the forms: <code>new<\/code> with <code>delete<\/code>, <code>new[]<\/code> with <code>delete[]<\/code>. Mixing them is undefined behaviour. And <code>int a[n];<\/code> with a run-time <code>n<\/code> is not standard C++ (it's a g++ extension; <code>-pedantic<\/code> warns).","pl":"Dopasuj formy: <code>new<\/code> z <code>delete<\/code>, <code>new[]<\/code> z <code>delete[]<\/code>. Pomieszanie ich to zachowanie niezdefiniowane. A <code>int a[n];<\/code> z <code>n<\/code> znanym dopiero w trakcie działania to nie jest standardowy C++ (to rozszerzenie g++; <code>-pedantic<\/code> ostrzega)."},"see":[{"topic":"vector","entry":null}]},{"id":"leaks","title":{"en":"Memory leaks","pl":"Wycieki pamięci"},"explain":{"en":"Memory that is never <code>delete<\/code>d is leaked: the program still works, but its memory use keeps growing. A typical cause is an early <code>return<\/code> (or an exception) that skips the <code>delete<\/code>. On Linux, <code>g++ -fsanitize=address<\/code> or Valgrind will find leaks.","pl":"Pamięć, której nikt nie zwolnił przez <code>delete<\/code>, to wyciek pamięci (memory leak): program działa dalej, ale zużywa coraz więcej pamięci. Typowa przyczyna to wczesny <code>return<\/code> (albo wyjątek), który omija <code>delete<\/code>. Na Linuksie wycieki znajdzie <code>g++ -fsanitize=address<\/code> albo Valgrind."},"code":"bool fill(int n) {\n    int* buffer = new int[n];\n    if (n > 100) {\n        return false;          // leak: delete[] below is skipped\n    }\n    buffer[0] = 1;\n    delete[] buffer;\n    return true;\n}\n\nint main() {\n    std::cout << fill(10) << ' ' << fill(1000) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"1 0","error":false,"pitfall":{"en":"Every way out of a function (each <code>return<\/code>, each exception) has to reach the <code>delete<\/code>. That's hard to get right by hand; containers and smart pointers do it for you.","pl":"Każda droga wyjścia z funkcji (każdy <code>return<\/code>, każdy wyjątek) musi dojść do <code>delete<\/code>. Trudno o to zadbać ręcznie; kontenery i inteligentne wskaźniki (smart pointers) robią to za ciebie."},"see":[]},{"id":"dangling","title":{"en":"Dangling pointers, double delete","pl":"Wiszące wskaźniki, podwójne delete"},"explain":{"en":"After <code>delete<\/code>, every pointer to that object dangles: it still holds the old address, but the memory is no longer yours. Using it (use after free) or deleting it again (double delete) is undefined behaviour: crashes, or worse, corrupted data.","pl":"Po <code>delete<\/code> każdy wskaźnik do tego obiektu staje się wiszącym wskaźnikiem (dangling pointer): nadal trzyma stary adres, ale pamięć nie należy już do ciebie. Użycie go (use after free) albo ponowne usunięcie (double delete) to zachowanie niezdefiniowane: awaria albo, co gorsza, uszkodzone dane."},"code":"int* p = new int(5);\nint* q = p;                // q points to the same int\ndelete p;                  // the int is freed: p and q dangle\nstd::cout << *q;           // undefined behaviour! (use after free)\ndelete q;                  // undefined behaviour! (double delete)","lang":"cpp","codeTitle":null,"input":null,"output":null,"error":false,"pitfall":{"en":"Setting <code>p = nullptr;<\/code> after <code>delete p;<\/code> helps (<code>delete nullptr<\/code> does nothing), but copies like <code>q<\/code> still dangle. Returning <code>&amp;local<\/code> from a function dangles in the same way.","pl":"Ustawienie <code>p = nullptr;<\/code> po <code>delete p;<\/code> pomaga (<code>delete nullptr<\/code> nic nie robi), ale kopie takie jak <code>q<\/code> dalej wiszą. Tak samo wisi wskaźnik <code>&amp;local<\/code> zwrócony z funkcji."},"see":[{"topic":"references","entry":null}]},{"id":"prefer-raii","title":{"en":"Prefer containers and smart pointers","pl":"Wybieraj kontenery i inteligentne wskaźniki"},"explain":{"en":"In modern C++ you rarely write <code>new<\/code> / <code>delete<\/code> yourself. Use <code>std::vector<\/code> instead of <code>new[]<\/code>, and <code>std::make_unique<\/code> instead of <code>new<\/code>: they free the memory automatically when they go out of scope (RAII), even on an early <code>return<\/code>.","pl":"We współczesnym C++ rzadko pisze się <code>new<\/code> / <code>delete<\/code> ręcznie. Zamiast <code>new[]<\/code> użyj <code>std::vector<\/code>, a zamiast <code>new<\/code> użyj <code>std::make_unique<\/code>. Same zwalniają pamięć, gdy wychodzą z zasięgu (scope), nawet przy wczesnym <code>return<\/code> (to idiom RAII)."},"code":"int n = 5;\nstd::vector<int> a(n);                 // instead of new int[n]{}\nauto p = std::make_unique<int>(42);    // instead of new int(42)\na[n - 1] = *p;\nstd::cout << a.size() << ' ' << a[4] << '\\n';\n// no delete: both free themselves at the end of the scope","lang":"cpp","codeTitle":null,"input":null,"output":"5 42","error":false,"pitfall":null,"see":[{"topic":"smart-pointers","entry":null},{"topic":"vector","entry":null},{"topic":"copy-move","entry":null}]}]},{"id":"smart-pointers","glyph":"ptr<>","name":{"en":"Smart pointers","pl":"Inteligentne wskaźniki"},"summary":{"en":"Pointers that delete for you: <code>std::unique_ptr<\/code>, moving ownership, <code>std::shared_ptr<\/code>, <code>std::weak_ptr<\/code>.","pl":"Inteligentne wskaźniki (smart pointers), które same zwalniają pamięć: <code>std::unique_ptr<\/code>, przenoszenie własności, <code>std::shared_ptr<\/code>, <code>std::weak_ptr<\/code>."},"headers":["<memory>"],"planned":false,"entries":[{"id":"unique-ptr","title":{"en":"std::unique_ptr","pl":"std::unique_ptr"},"explain":{"en":"<code>std::unique_ptr&lt;T&gt;<\/code> is the only owner of a heap object and deletes it when it goes out of scope. Create it with <code>std::make_unique&lt;T&gt;(args)<\/code> and use it like a raw pointer: <code>*p<\/code>, <code>p-&gt;member<\/code>, <code>if (p)<\/code>. Make it your default choice.","pl":"<code>std::unique_ptr&lt;T&gt;<\/code> jest jedynym właścicielem obiektu na stercie i usuwa go, gdy sam wychodzi z zasięgu. Tworzysz go przez <code>std::make_unique&lt;T&gt;(args)<\/code> i używasz jak zwykłego wskaźnika: <code>*p<\/code>, <code>p-&gt;member<\/code>, <code>if (p)<\/code>. To twój domyślny wybór."},"code":"std::unique_ptr<int> p = std::make_unique<int>(42);\n*p += 1;\nstd::cout << *p << '\\n';\nauto s = std::make_unique<std::string>(\"hello\");  // auto saves typing\nstd::cout << s->size() << '\\n';\n// no delete: both are freed at the end of the scope","lang":"cpp","codeTitle":null,"input":null,"output":"43\n5","error":false,"pitfall":{"en":"A <code>unique_ptr<\/code> can't be copied: <code>auto q = p;<\/code> fails with <em>use of deleted function 'std::unique_ptr...'<\/em>. Move it instead (next entry). Also prefer <code>std::make_unique<\/code> to <code>std::unique_ptr&lt;int&gt;(new int(42))<\/code>.","pl":"<code>unique_ptr<\/code> nie da się skopiować: <code>auto q = p;<\/code> kończy się błędem <em>use of deleted function 'std::unique_ptr...'<\/em>. Zamiast tego go przenieś (następna karta). Wybieraj też <code>std::make_unique<\/code> zamiast <code>std::unique_ptr&lt;int&gt;(new int(42))<\/code>."},"see":[{"topic":"dynamic-memory","entry":null}]},{"id":"moving","title":{"en":"Moving ownership","pl":"Przenoszenie własności"},"explain":{"en":"<code>std::move<\/code> hands the object over to another <code>unique_ptr<\/code>; the old one becomes empty (<code>nullptr<\/code>). A function can return a <code>unique_ptr<\/code> as usual, and a parameter taken by value takes ownership.","pl":"<code>std::move<\/code> przekazuje obiekt innemu <code>unique_ptr<\/code>; stary wskaźnik staje się pusty (<code>nullptr<\/code>). Funkcja może normalnie zwrócić <code>unique_ptr<\/code>, a parametr przyjmowany przez wartość przejmuje własność (ownership)."},"code":"std::unique_ptr<int> make_number(int n) {\n    return std::make_unique<int>(n);\n}\n\nvoid consume(std::unique_ptr<int> p) {     // takes ownership\n    std::cout << \"consume \" << *p << '\\n';\n}                                          // the int is deleted here\n\nint main() {\n    auto a = make_number(7);\n    auto b = std::move(a);                 // a is now empty\n    std::cout << (a ? \"a owns\" : \"a is empty\") << '\\n';\n    consume(std::move(b));\n    std::cout << (b == nullptr) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"a is empty\nconsume 7\n1","error":false,"pitfall":{"en":"After <code>std::move(a)<\/code>, <code>a<\/code> is <code>nullptr<\/code>; dereferencing it is undefined behaviour (usually a crash). Don't use a moved-from pointer until you assign it a new object.","pl":"Po <code>std::move(a)<\/code> wskaźnik <code>a<\/code> jest <code>nullptr<\/code>; wyłuskanie go to zachowanie niezdefiniowane (undefined behaviour), zwykle awaria. Nie używaj przeniesionego wskaźnika, dopóki nie przypiszesz mu nowego obiektu."},"see":[{"topic":"copy-move","entry":null}]},{"id":"custom-types","title":{"en":"Your own types","pl":"Własne typy"},"explain":{"en":"<code>std::make_unique&lt;Book&gt;(\"Dune\")<\/code> passes its arguments to <code>Book<\/code>'s constructor. A <code>std::vector<\/code> of <code>unique_ptr<\/code>s owns all its objects: when the vector is destroyed, each object's destructor runs.","pl":"<code>std::make_unique&lt;Book&gt;(\"Dune\")<\/code> przekazuje swoje argumenty do konstruktora (constructor) <code>Book<\/code>. <code>std::vector<\/code> z elementami <code>unique_ptr<\/code> jest właścicielem wszystkich obiektów: gdy wektor zostaje zniszczony, dla każdego obiektu wywoływany jest destruktor (destructor)."},"code":"struct Book {\n    std::string title;\n    Book(std::string t) : title(t) { std::cout << \"open \" << title << '\\n'; }\n    ~Book() { std::cout << \"close \" << title << '\\n'; }\n};\n\nint main() {\n    std::vector<std::unique_ptr<Book>> shelf;\n    shelf.push_back(std::make_unique<Book>(\"Dune\"));\n    shelf.push_back(std::make_unique<Book>(\"Emma\"));\n    std::cout << shelf[1]->title << '\\n';\n}   // shelf is destroyed: every Book is deleted","lang":"cpp","codeTitle":null,"input":null,"output":"open Dune\nopen Emma\nEmma\nclose Dune\nclose Emma","error":false,"pitfall":null,"see":[{"topic":"constructors","entry":null},{"topic":"polymorphism","entry":null}]},{"id":"shared-ptr","title":{"en":"std::shared_ptr","pl":"std::shared_ptr"},"explain":{"en":"<code>std::shared_ptr<\/code> allows several owners. Copies share one object and a reference count (<code>use_count()<\/code>); the object is deleted when the last owner is gone. Create it with <code>std::make_shared<\/code>.","pl":"<code>std::shared_ptr<\/code> pozwala mieć wielu właścicieli. Kopie dzielą jeden obiekt i licznik referencji (reference count, <code>use_count()<\/code>); obiekt jest usuwany, gdy znika ostatni właściciel. Tworzysz go przez <code>std::make_shared<\/code>."},"code":"auto a = std::make_shared<std::string>(\"data\");\nstd::cout << a.use_count() << '\\n';\n{\n    auto b = a;                    // copy: one more owner\n    std::cout << a.use_count() << '\\n';\n}                                  // b is gone\nstd::cout << a.use_count() << ' ' << *a << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1\n2\n1 data","error":false,"pitfall":{"en":"Don't reach for <code>shared_ptr<\/code> by default: it costs more (a shared counter) and makes it unclear who owns what. Use it only when ownership really is shared; otherwise use <code>unique_ptr<\/code>.","pl":"Nie sięgaj po <code>shared_ptr<\/code> odruchowo: jest droższy (wspólny licznik) i zaciera to, kto jest właścicielem. Używaj go tylko przy naprawdę współdzielonej własności; w pozostałych przypadkach wybierz <code>unique_ptr<\/code>."},"see":[]},{"id":"weak-ptr","title":{"en":"std::weak_ptr","pl":"std::weak_ptr"},"explain":{"en":"<code>std::weak_ptr<\/code> watches an object owned by <code>shared_ptr<\/code>s without owning it. <code>lock()<\/code> gives a <code>shared_ptr<\/code> that is empty if the object is already gone. Its main use is breaking ownership cycles.","pl":"<code>std::weak_ptr<\/code> obserwuje obiekt należący do <code>shared_ptr<\/code>, ale nie jest jego właścicielem. <code>lock()<\/code> zwraca <code>shared_ptr<\/code>, który jest pusty, jeśli obiekt już nie istnieje. Służy głównie do przerywania cykli własności."},"code":"std::weak_ptr<int> w;\n{\n    auto s = std::make_shared<int>(5);\n    w = s;                         // observes, doesn't own\n    if (auto p = w.lock()) {       // a shared_ptr, or empty\n        std::cout << *p << '\\n';\n    }\n}                                  // last owner gone: int deleted\nstd::cout << (w.expired() ? \"expired\" : \"alive\") << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"5\nexpired","error":false,"pitfall":{"en":"Two objects holding <code>shared_ptr<\/code>s to each other (parent and child) keep each other alive forever: a leak. Make one direction a <code>weak_ptr<\/code>.","pl":"Dwa obiekty trzymające do siebie nawzajem <code>shared_ptr<\/code> (np. rodzic i dziecko) utrzymują się przy życiu na zawsze, czyli powstaje wyciek pamięci. Jeden z kierunków zrób <code>weak_ptr<\/code>."},"see":[]},{"id":"get-reset","title":{"en":"Using without owning","pl":"Używanie bez posiadania"},"explain":{"en":"A function that only uses an object should take <code>T&amp;<\/code> or <code>const T&amp;<\/code> (pass <code>*p<\/code>), not the smart pointer. <code>p.get()<\/code> gives a non-owning raw pointer, and <code>p.reset()<\/code> deletes the object right away and leaves <code>p<\/code> empty.","pl":"Funkcja, która tylko używa obiektu, powinna przyjmować <code>T&amp;<\/code> lub <code>const T&amp;<\/code> (przekaż <code>*p<\/code>), a nie sam inteligentny wskaźnik. <code>p.get()<\/code> daje zwykły wskaźnik bez własności, a <code>p.reset()<\/code> od razu usuwa obiekt i zostawia <code>p<\/code> pusty."},"code":"void print(const std::string& s) {     // just uses the object\n    std::cout << s << '\\n';\n}\n\nint main() {\n    auto p = std::make_unique<std::string>(\"hello\");\n    print(*p);\n    std::string* raw = p.get();        // non-owning view\n    std::cout << raw->size() << '\\n';\n    p.reset();                         // deletes the string now\n    std::cout << (p == nullptr) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"hello\n5\n1","error":false,"pitfall":{"en":"Never <code>delete p.get()<\/code> or build a second smart pointer from it: the object gets deleted twice. And a raw pointer from <code>get()<\/code> dangles once the owner is reset or destroyed.","pl":"Nigdy nie rób <code>delete p.get()<\/code> ani nie twórz z niego drugiego inteligentnego wskaźnika: obiekt zostanie usunięty dwa razy. A zwykły wskaźnik z <code>get()<\/code> zawisa, gdy właściciel zrobi <code>reset()<\/code> lub zostanie zniszczony."},"see":[{"topic":"references","entry":null},{"topic":"functions","entry":null}]}]}]},{"id":"oop","hue":270,"name":{"en":"Object-oriented C++","pl":"Programowanie obiektowe"},"desc":{"en":"Classes, constructors, operators, copying, inheritance and polymorphism.","pl":"Klasy, konstruktory, operatory, kopiowanie, dziedziczenie i polimorfizm."},"topics":[{"id":"classes","glyph":"class","name":{"en":"Classes","pl":"Klasy"},"summary":{"en":"Classes and structs: members and methods, public and private, const methods, this, static members, methods defined outside the class.","pl":"Klasy (classes) i struktury: pola i metody, public i private, metody const, this, składowe statyczne, definiowanie metod poza klasą."},"headers":[],"planned":false,"entries":[{"id":"class-vs-struct","title":{"en":"class vs struct","pl":"class a struct"},"explain":{"en":"A class groups data (members) with the functions that work on it (methods). <code>struct<\/code> and <code>class<\/code> differ only in default access: everything in a <code>struct<\/code> is public unless you say otherwise, in a <code>class<\/code> it's private. By convention, <code>struct<\/code> is for plain data and <code>class<\/code> for types with rules to protect.","pl":"Klasa (class) łączy dane, czyli pola (members), z funkcjami, które na nich działają, czyli metodami (methods). <code>struct<\/code> i <code>class<\/code> różnią się tylko domyślnym dostępem: w <code>struct<\/code> wszystko jest publiczne, dopóki nie napiszesz inaczej, a w <code>class<\/code> prywatne. Zwyczajowo <code>struct<\/code> służy do prostych danych, a <code>class<\/code> do typów, które pilnują swoich reguł."},"code":"struct Point {        // struct: public by default\n    int x = 0;\n    int y = 0;\n};\n\nclass Counter {       // class: private by default\n    int value = 0;    // private: only methods can touch it\n\npublic:\n    void increment() { ++value; }\n    int get() const { return value; }\n};\n\nint main() {\n    Point p{3, 4};\n    std::cout << p.x << \", \" << p.y << '\\n';\n\n    Counter c;\n    c.increment();\n    c.increment();\n    std::cout << c.get() << '\\n';  // c.value would not compile\n}","lang":"cpp","codeTitle":null,"input":null,"output":"3, 4\n2","error":false,"pitfall":{"en":"A class definition ends with <code>};<\/code>. Forget the semicolon and the compiler reports strange errors on the line <em>after<\/em> the class.","pl":"Definicja klasy kończy się <code>};<\/code>. Bez średnika kompilator zgłasza dziwne błędy w linii <em>za<\/em> klasą."},"see":[{"topic":"constructors","entry":null}]},{"id":"access","title":{"en":"public and private","pl":"public i private"},"explain":{"en":"Members under <code>public:<\/code> can be used anywhere, those under <code>private:<\/code> only inside the class's own methods. Keep the data private and change it through methods that check their input: the object then can't end up in an invalid state. This is <em>encapsulation<\/em>.","pl":"Składowe w sekcji <code>public:<\/code> są dostępne wszędzie, a te w <code>private:<\/code> tylko w metodach tej klasy. Trzymaj dane jako prywatne i zmieniaj je przez metody, które sprawdzają argumenty: wtedy obiekt nie trafi w niepoprawny stan. To jest hermetyzacja (encapsulation)."},"code":"class BankAccount {\npublic:\n    void deposit(double amount) {\n        if (amount > 0) {        // the class guards its own data\n            balance += amount;\n        }\n    }\n    double getBalance() const { return balance; }\n\nprivate:\n    double balance = 0.0;\n};\n\nint main() {\n    BankAccount acc;\n    acc.deposit(100);\n    acc.deposit(-50);            // rejected\n    // acc.balance = 1e9;        // error: 'balance' is private\n    std::cout << acc.getBalance() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"100","error":false,"pitfall":null,"see":[{"topic":"inheritance","entry":null}]},{"id":"const-methods","title":{"en":"const methods","pl":"Metody const"},"explain":{"en":"<code>const<\/code> after the parameter list promises that the method won't change the object. Only <code>const<\/code> methods can be called on a <code>const<\/code> object or through a <code>const&amp;<\/code>, which is how objects are usually passed to functions. Mark every method that only reads as <code>const<\/code>.","pl":"Metoda stała (const method) ma <code>const<\/code> po liście parametrów: to obietnica, że nie zmieni obiektu. Na obiekcie <code>const<\/code> albo przez referencję <code>const&amp;<\/code> (a tak zwykle przekazuje się obiekty do funkcji) można wywołać tylko metody <code>const<\/code>. Oznaczaj jako <code>const<\/code> każdą metodę, która tylko odczytuje dane."},"code":"class Circle {\npublic:\n    double area() const {            // const: only reads the object\n        return 3.14159 * radius * radius;\n    }\n    void scale(double factor) {      // not const: changes radius\n        radius *= factor;\n    }\n\nprivate:\n    double radius = 1.0;\n};\n\nvoid print(const Circle& c) {        // const&: only const methods allowed\n    std::cout << c.area() << '\\n';\n    // c.scale(2.0);                 // error: scale() is not const\n}\n\nint main() {\n    Circle c;\n    print(c);\n    c.scale(2.0);\n    print(c);\n}","lang":"cpp","codeTitle":null,"input":null,"output":"3.14159\n12.5664","error":false,"pitfall":{"en":"Forget <code>const<\/code> on <code>area()<\/code> and <code>print<\/code> fails with <em>passing 'const Circle' as 'this' argument discards qualifiers<\/em>. The fix is to add <code>const<\/code> to the method, not to remove it from the parameter.","pl":"Bez <code>const<\/code> przy <code>area()<\/code> funkcja <code>print<\/code> się nie skompiluje: <em>passing 'const Circle' as 'this' argument discards qualifiers<\/em>. Rozwiązanie: dopisz <code>const<\/code> do metody, a nie usuwaj go z parametru."},"see":[{"topic":"references","entry":null}]},{"id":"this","title":{"en":"The this pointer","pl":"Wskaźnik this"},"explain":{"en":"Inside a method, <code>this<\/code> points to the object the method was called on. You need it when a parameter has the same name as a member (<code>this-&gt;name = name<\/code>), and <code>return *this;<\/code> returns the object itself, which allows chaining calls.","pl":"Wewnątrz metody <code>this<\/code> to wskaźnik (pointer) na obiekt, na którym ją wywołano. Przydaje się, gdy parametr nazywa się tak samo jak pole (<code>this-&gt;name = name<\/code>), a <code>return *this;<\/code> zwraca sam obiekt, co pozwala łączyć wywołania w łańcuch (chaining)."},"code":"class Player {\npublic:\n    Player& setName(const std::string& name) {\n        this->name = name;       // member = parameter\n        return *this;            // the object itself\n    }\n    Player& addScore(int points) {\n        score += points;         // same as this->score\n        return *this;\n    }\n    void print() const { std::cout << name << \": \" << score << '\\n'; }\n\nprivate:\n    std::string name;\n    int score = 0;\n};\n\nint main() {\n    Player p;\n    p.setName(\"Ada\").addScore(10).addScore(5);\n    p.print();\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Ada: 15","error":false,"pitfall":{"en":"Return <code>Player&amp;<\/code>, not <code>Player<\/code>. Returning by value makes every chained call work on a temporary copy, so only the first one changes <code>p<\/code>.","pl":"Zwracaj <code>Player&amp;<\/code>, a nie <code>Player<\/code>. Przy zwracaniu przez wartość każde kolejne wywołanie w łańcuchu działa na tymczasowej kopii i tylko pierwsze zmienia <code>p<\/code>."},"see":[{"topic":"pointers","entry":null}]},{"id":"static-members","title":{"en":"Static members","pl":"Składowe statyczne"},"explain":{"en":"A <code>static<\/code> data member belongs to the class, not to an object: all objects share one copy. <code>static inline<\/code> (C++17) lets you initialise it right in the class. A <code>static<\/code> method has no <code>this<\/code>, so it can only use static members; call it as <code>Robot::total()<\/code>.","pl":"Pole statyczne (static member) należy do klasy, a nie do obiektu: wszystkie obiekty dzielą jedną kopię. <code>static inline<\/code> (C++17) pozwala nadać mu wartość od razu w klasie. Metoda statyczna nie ma <code>this<\/code>, więc korzysta tylko ze składowych statycznych; wywołujesz ją jako <code>Robot::total()<\/code>."},"code":"class Robot {\npublic:\n    static int total() { return created; }  // no object needed\n    int getId() const { return id; }\n\nprivate:\n    static inline int created = 0;  // one counter shared by all robots\n    int id = ++created;             // each robot has its own id\n};\n\nint main() {\n    Robot a, b, c;\n    std::cout << \"c has id \" << c.getId() << '\\n';\n    std::cout << \"created: \" << Robot::total() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"c has id 3\ncreated: 3","error":false,"pitfall":{"en":"Without <code>inline<\/code> (before C++17) the class only <em>declares<\/em> the static member, and you must also define it once in a <code>.cpp<\/code> file: <code>int Robot::created = 0;<\/code>. Otherwise the linker reports <em>undefined reference to Robot::created<\/em>.","pl":"Bez <code>inline<\/code> (przed C++17) klasa tylko <em>deklaruje<\/em> pole statyczne i trzeba je jeszcze raz zdefiniować w pliku <code>.cpp<\/code>: <code>int Robot::created = 0;<\/co
