transform, fill i iota, copy_if, usuwanie elementów (erase-remove, erase_if), min, max i clamp."},"headers":["<algorithm>","<numeric>"],"planned":false,"entries":[{"id":"accumulate","title":{"en":"Sum with accumulate","pl":"Suma: accumulate"},"explain":{"en":"<code>std::accumulate<\/code> (from <code>&lt;numeric&gt;<\/code>) adds up a range, starting from the initial value you pass. A fourth argument replaces <code>+<\/code>, e.g. <code>std::multiplies&lt;&gt;()<\/code> for a product.","pl":"<code>std::accumulate<\/code> (z <code>&lt;numeric&gt;<\/code>) sumuje zakres (range), zaczynając od podanej wartości początkowej. Czwarty argument zastępuje <code>+<\/code>, np. <code>std::multiplies&lt;&gt;()<\/code> liczy iloczyn."},"code":"std::vector<int> v{1, 2, 3, 4};\nint sum = std::accumulate(v.begin(), v.end(), 0);\nint product = std::accumulate(v.begin(), v.end(), 1, std::multiplies<>());\nstd::cout << sum << ' ' << product << '\\n';\n\nstd::vector<double> d{0.5, 1.25};\nstd::cout << std::accumulate(d.begin(), d.end(), 0.0) << '\\n';\nstd::cout << std::accumulate(d.begin(), d.end(), 0) << '\\n';  // int: wrong!","lang":"cpp","codeTitle":null,"input":null,"output":"10 24\n1.75\n1","error":false,"pitfall":{"en":"The result has the type of the initial value. With <code>0<\/code> the sum is an <code>int<\/code>: doubles get truncated at every step and big sums overflow. Use <code>0.0<\/code> for doubles and <code>0LL<\/code> for large sums.","pl":"Wynik ma typ wartości początkowej. Przy <code>0<\/code> suma jest typu <code>int<\/code>: liczby <code>double<\/code> są obcinane w każdym kroku, a duże sumy się przepełniają. Dla <code>double<\/code> pisz <code>0.0<\/code>, a dla dużych sum <code>0LL<\/code>."},"see":[{"topic":"variables","entry":null}]},{"id":"transform","title":{"en":"transform","pl":"transform"},"explain":{"en":"<code>std::transform<\/code> applies a function to every element and writes the results to an output position: another container or the same one (in place). Here it squares numbers and upper-cases a string.","pl":"<code>std::transform<\/code> wywołuje funkcję dla każdego elementu i zapisuje wyniki od wskazanej pozycji: do innego kontenera albo do tego samego (w miejscu, in place). Tutaj podnosi liczby do kwadratu i zamienia napis na wielkie litery."},"code":"std::vector<int> v{1, 2, 3, 4};\nstd::vector<int> squares(v.size());\nstd::transform(v.begin(), v.end(), squares.begin(),\n               [](int x) { return x * x; });\nfor (int x : squares) std::cout << x << ' ';\nstd::cout << '\\n';\n\nstd::string s = \"hello\";\nstd::transform(s.begin(), s.end(), s.begin(),\n               [](unsigned char c) { return std::toupper(c); });\nstd::cout << s << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 4 9 16\nHELLO","error":false,"pitfall":{"en":"The output must already have room: writing to <code>out.begin()<\/code> of an empty vector (even after <code>reserve<\/code>) is undefined behaviour. Create it with the right size, or pass <code>std::back_inserter(out)<\/code>, which calls <code>push_back<\/code>.","pl":"Kontener docelowy musi już mieć odpowiedni rozmiar: zapis do <code>out.begin()<\/code> pustego wektora (nawet po <code>reserve<\/code>) to niezdefiniowane zachowanie (undefined behaviour). Utwórz go od razu z właściwym rozmiarem albo przekaż <code>std::back_inserter(out)<\/code>, który wywołuje <code>push_back<\/code>."},"see":[{"topic":"lambdas","entry":null},{"topic":"strings","entry":null},{"topic":"ranges","entry":null}]},{"id":"fill-iota","title":{"en":"fill and iota","pl":"fill i iota"},"explain":{"en":"<code>std::fill<\/code> sets every element to one value. <code>std::iota<\/code> (from <code>&lt;numeric&gt;<\/code>) fills with increasing values: start, start + 1, start + 2, ... Both need a container that already has its size.","pl":"<code>std::fill<\/code> ustawia wszystkie elementy na jedną wartość. <code>std::iota<\/code> (z <code>&lt;numeric&gt;<\/code>) wypełnia kolejnymi wartościami: start, start + 1, start + 2, ... Obie wymagają kontenera, który ma już swój rozmiar."},"code":"std::vector<int> v(5);\nstd::fill(v.begin(), v.end(), 7);\nfor (int x : v) std::cout << x << ' ';\nstd::cout << '\\n';\n\nstd::iota(v.begin(), v.end(), 1);  // 1, 2, 3, ...\nfor (int x : v) std::cout << x << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"7 7 7 7 7\n1 2 3 4 5","error":false,"pitfall":null,"see":[{"topic":"vector","entry":null}]},{"id":"copy-if","title":{"en":"copy_if","pl":"copy_if"},"explain":{"en":"<code>std::copy_if<\/code> copies only the elements for which a predicate is true. Write into an empty vector through <code>std::back_inserter<\/code>, so it grows as needed. <code>std::copy<\/code> copies everything.","pl":"<code>std::copy_if<\/code> kopiuje tylko te elementy, dla których predykat (predicate) jest prawdziwy. Zapisuj do pustego wektora przez <code>std::back_inserter<\/code>, wtedy rośnie on w miarę potrzeby. <code>std::copy<\/code> kopiuje wszystko."},"code":"std::vector<int> v{5, 12, 8, 21, 3, 14};\nstd::vector<int> big;\nstd::copy_if(v.begin(), v.end(), std::back_inserter(big),\n             [](int x) { return x > 10; });\nfor (int x : big) std::cout << x << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"12 21 14","error":false,"pitfall":null,"see":[{"topic":"lambdas","entry":null},{"topic":"searching","entry":null}]},{"id":"erase-remove","title":{"en":"Removing elements","pl":"Usuwanie elementów"},"explain":{"en":"The classic erase-remove idiom: <code>std::remove<\/code> (or <code>std::remove_if<\/code>) moves the kept elements to the front and returns the new end, then <code>erase<\/code> cuts off the rest. C++20 does both in one call: <code>std::erase(v, x)<\/code> and <code>std::erase_if(v, pred)<\/code>.","pl":"Klasyczny idiom erase-remove (erase-remove idiom): <code>std::remove<\/code> (lub <code>std::remove_if<\/code>) przesuwa zostające elementy na początek i zwraca nowy koniec, a <code>erase<\/code> odcina resztę. W C++20 robi to jedno wywołanie: <code>std::erase(v, x)<\/code> i <code>std::erase_if(v, pred)<\/code>."},"code":"std::vector<int> v{4, 2, 7, 2, 9};\nv.erase(std::remove(v.begin(), v.end(), 2), v.end());\nfor (int x : v) std::cout << x << ' ';\nstd::cout << '\\n';\n\nstd::vector<int> w{1, 2, 3, 4, 5, 6};\nstd::erase_if(w, [](int x) { return x % 2 == 0; });  // C++20\nfor (int x : w) std::cout << x << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"4 7 9\n1 3 5","error":false,"pitfall":{"en":"<code>std::remove<\/code> alone does not shrink the container: <code>size()<\/code> stays the same and the tail holds leftovers. Always pass its result to <code>erase<\/code>, or use <code>std::erase_if<\/code>.","pl":"Samo <code>std::remove<\/code> nie zmniejsza kontenera: <code>size()<\/code> się nie zmienia, a na końcu zostają resztki. Zawsze przekaż jego wynik do <code>erase<\/code> albo użyj <code>std::erase_if<\/code>."},"see":[{"topic":"vector","entry":null},{"topic":"sorting","entry":"reverse-unique"}]},{"id":"min-max-clamp","title":{"en":"min, max and clamp","pl":"min, max i clamp"},"explain":{"en":"<code>std::min<\/code> and <code>std::max<\/code> pick the smaller or larger of two values, or of a whole <code>{...}<\/code> list. <code>std::clamp(x, lo, hi)<\/code> (C++17) squeezes <code>x<\/code> into the range <code>[lo, hi]<\/code>.","pl":"<code>std::min<\/code> i <code>std::max<\/code> wybierają mniejszą lub większą z dwóch wartości albo z całej listy <code>{...}<\/code>. <code>std::clamp(x, lo, hi)<\/code> (C++17) „przycina” <code>x<\/code> do przedziału <code>[lo, hi]<\/code>."},"code":"std::cout << std::min(3, 7) << ' ' << std::max(3, 7) << '\\n';\nstd::cout << std::max({4, 9, 2}) << '\\n';\nstd::cout << std::clamp(15, 0, 10) << ' '\n          << std::clamp(-5, 0, 10) << ' '\n          << std::clamp(6, 0, 10) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"3 7\n9\n10 0 6","error":false,"pitfall":{"en":"Both arguments must have the same type: <code>std::min(v.size(), 5)<\/code> does not compile (<code>std::size_t<\/code> vs <code>int<\/code>). Write <code>std::min&lt;std::size_t&gt;(v.size(), 5)<\/code> or make the types match.","pl":"Oba argumenty muszą mieć ten sam typ: <code>std::min(v.size(), 5)<\/code> się nie skompiluje (<code>std::size_t<\/code> kontra <code>int<\/code>). Napisz <code>std::min&lt;std::size_t&gt;(v.size(), 5)<\/code> albo ujednolij typy."},"see":[{"topic":"searching","entry":"min-max-element"}]}]},{"id":"ranges","glyph":"views","name":{"en":"Ranges (C++20)","pl":"Zakresy (C++20)"},"summary":{"en":"C++20 ranges: algorithms on whole containers, projections, and lazy views (filter, transform, take, reverse, iota) chained with |.","pl":"Zakresy (ranges) z C++20: algorytmy na całych kontenerach, projekcje oraz leniwe widoki (filter, transform, take, reverse, iota) łączone operatorem |."},"headers":["<algorithm>","<ranges>"],"planned":false,"entries":[{"id":"whole-container","title":{"en":"Algorithms on whole containers","pl":"Algorytmy na całych kontenerach"},"explain":{"en":"Every classic algorithm has a <code>std::ranges::<\/code> version (C++20) that takes the container itself, so there's no <code>begin()<\/code>/<code>end()<\/code> pair to get wrong. Results are still iterators, compared with <code>v.end()<\/code>.","pl":"Każdy klasyczny algorytm ma wersję <code>std::ranges::<\/code> (C++20), która przyjmuje cały kontener, więc nie trzeba pisać pary <code>begin()<\/code>/<code>end()<\/code> i nie da się jej pomylić. Wyniki to nadal iteratory, które porównujesz z <code>v.end()<\/code>."},"code":"std::vector<int> v{5, 2, 9, 1, 7};\nstd::ranges::sort(v);\nfor (int x : v) std::cout << x << ' ';\nstd::cout << '\\n';\n\nauto it = std::ranges::find(v, 7);\nif (it != v.end()) std::cout << \"7 at index \" << (it - v.begin()) << '\\n';\nstd::cout << \"max: \" << *std::ranges::max_element(v) << '\\n';\nstd::ranges::sort(v, std::greater{});  // descending\nstd::cout << v.front() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 5 7 9\n7 at index 3\nmax: 9\n9","error":false,"pitfall":null,"see":[{"topic":"sorting","entry":null},{"topic":"searching","entry":null}]},{"id":"projections","title":{"en":"Projections","pl":"Projekcje"},"explain":{"en":"A projection is the last argument: it says <em>what<\/em> to compare, e.g. <code>&amp;Student::grade<\/code>. The comparator before it may be <code>{}<\/code> (the default, ascending) or <code>std::greater{}<\/code>. No lambda needed to sort or search structs by a field.","pl":"Projekcja (projection) to ostatni argument: mówi, <em>co<\/em> porównywać, np. <code>&amp;Student::grade<\/code>. Komparator (comparator) przed nią może być <code>{}<\/code> (domyślny, rosnąco) albo <code>std::greater{}<\/code>. Do sortowania i szukania struktur po polu nie trzeba wtedy pisać lambdy."},"code":"struct Student {\n    std::string name;\n    int grade;\n};\n\nint main() {\n    std::vector<Student> s{{\"Tom\", 4}, {\"Ann\", 5}, {\"Eve\", 3}};\n    std::ranges::sort(s, {}, &Student::grade);              // ascending\n    for (const auto& st : s) std::cout << st.name << ' ';\n    std::cout << '\\n';\n    std::ranges::sort(s, std::greater{}, &Student::grade);  // descending\n    for (const auto& st : s) std::cout << st.name << ' ';\n    std::cout << '\\n';\n    auto it = std::ranges::find(s, \"Tom\", &Student::name);\n    if (it != s.end()) std::cout << \"Tom has \" << it->grade << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Eve Tom Ann\nAnn Tom Eve\nTom has 4","error":false,"pitfall":{"en":"<code>std::ranges::sort(s, &amp;Student::grade)<\/code> does not compile: the second argument is the comparator. Put <code>{}<\/code> in its place: <code>std::ranges::sort(s, {}, &amp;Student::grade)<\/code>.","pl":"<code>std::ranges::sort(s, &amp;Student::grade)<\/code> się nie skompiluje, bo drugi argument to komparator. Wstaw w jego miejsce <code>{}<\/code>: <code>std::ranges::sort(s, {}, &amp;Student::grade)<\/code>."},"see":[{"topic":"sorting","entry":null},{"topic":"classes","entry":null}]},{"id":"filter-transform","title":{"en":"Views: filter and transform","pl":"Widoki: filter i transform"},"explain":{"en":"A view is a lazy window onto a range: it copies nothing and computes elements only while you loop over it. <code>std::views::filter<\/code> keeps elements matching a predicate, <code>std::views::transform<\/code> changes each one, and <code>|<\/code> chains them left to right. <code>v<\/code> itself is not modified.","pl":"Widok (view) to leniwe (lazy) okno na zakres: niczego nie kopiuje i wylicza elementy dopiero podczas przechodzenia pętlą. <code>std::views::filter<\/code> zostawia elementy spełniające predykat (predicate), <code>std::views::transform<\/code> zmienia każdy z nich, a operator <code>|<\/code> łączy je w potok (pipe) czytany od lewej do prawej. Sam <code>v<\/code> się nie zmienia."},"code":"std::vector<int> v{1, 2, 3, 4, 5, 6};\nauto even_squares = v\n    | std::views::filter([](int x) { return x % 2 == 0; })\n    | std::views::transform([](int x) { return x * x; });\nfor (int x : even_squares) std::cout << x << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"4 16 36","error":false,"pitfall":{"en":"A view stores no elements, it only refers to <code>v<\/code>. Don't return a view of a local vector from a function (it would dangle); if you need to keep the results, copy them into a new <code>std::vector<\/code> in a loop.","pl":"Widok nie przechowuje elementów, tylko odwołuje się do <code>v<\/code>. Nie zwracaj z funkcji widoku na lokalny wektor, bo zostanie wiszący (dangling); jeśli chcesz zachować wyniki, skopiuj je w pętli do nowego <code>std::vector<\/code>."},"see":[{"topic":"lambdas","entry":null},{"topic":"transforming","entry":null}]},{"id":"take-reverse","title":{"en":"Views: take and reverse","pl":"Widoki: take i reverse"},"explain":{"en":"<code>std::views::take(n)<\/code> gives the first n elements (fewer if the range is shorter) and <code>std::views::reverse<\/code> walks backwards. Order matters: <code>reverse | take(3)<\/code> is the last three, <code>take(3) | reverse<\/code> the first three backwards.","pl":"<code>std::views::take(n)<\/code> daje pierwsze n elementów (mniej, jeśli zakres jest krótszy), a <code>std::views::reverse<\/code> przechodzi od końca. Kolejność ma znaczenie: <code>reverse | take(3)<\/code> to trzy ostatnie, a <code>take(3) | reverse<\/code> to trzy pierwsze od tyłu."},"code":"std::vector<int> v{1, 2, 3, 4, 5, 6, 7};\nfor (int x : v | std::views::take(3)) std::cout << x << ' ';\nstd::cout << '\\n';\nfor (int x : v | std::views::reverse) std::cout << x << ' ';\nstd::cout << '\\n';\nfor (int x : v | std::views::reverse | std::views::take(3))\n    std::cout << x << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 3\n7 6 5 4 3 2 1\n7 6 5","error":false,"pitfall":null,"see":[{"topic":"iterators","entry":null}]},{"id":"iota","title":{"en":"Views: iota","pl":"Widoki: iota"},"explain":{"en":"<code>std::views::iota(a, b)<\/code> counts from <code>a<\/code> up to, but not including, <code>b<\/code>: a neat counting loop. <code>std::views::iota(a)<\/code> never ends, so cut it with <code>take<\/code>. Combined with other views it builds sequences on the fly.","pl":"<code>std::views::iota(a, b)<\/code> liczy od <code>a<\/code> do <code>b<\/code>, ale bez <code>b<\/code>: zgrabna pętla licząca. <code>std::views::iota(a)<\/code> nie ma końca, więc przytnij go przez <code>take<\/code>. W połączeniu z innymi widokami tworzy ciągi „w locie”."},"code":"for (int i : std::views::iota(1, 6)) std::cout << i << ' ';\nstd::cout << '\\n';\n\nauto odd_squares = std::views::iota(1)  // 1, 2, 3, ... endless\n    | std::views::filter([](int x) { return x % 2 == 1; })\n    | std::views::transform([](int x) { return x * x; })\n    | std::views::take(4);\nfor (int x : odd_squares) std::cout << x << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 3 4 5\n1 9 25 49","error":false,"pitfall":{"en":"<code>std::views::iota(0, v.size())<\/code> does not compile: <code>0<\/code> is a signed <code>int<\/code> and <code>v.size()<\/code> is unsigned. Make both the same kind, e.g. <code>std::views::iota(0u, v.size())<\/code>.","pl":"<code>std::views::iota(0, v.size())<\/code> się nie skompiluje: <code>0<\/code> to <code>int<\/code> ze znakiem, a <code>v.size()<\/code> jest bez znaku. Użyj tego samego rodzaju typu dla obu, np. <code>std::views::iota(0u, v.size())<\/code>."},"see":[{"topic":"loops","entry":null}]}]}]},{"id":"advanced","hue":330,"name":{"en":"Beyond the basics","pl":"Dalej niż podstawy"},"desc":{"en":"Templates, exceptions, files, multi-file programs and more.","pl":"Szablony, wyjątki, pliki, programy wieloplikowe i więcej."},"topics":[{"id":"templates","glyph":"<T>","name":{"en":"Templates","pl":"Szablony"},"summary":{"en":"Generic code: function and class templates, argument deduction, several parameters, specialisation, <code>auto<\/code> parameters, concepts.","pl":"Szablony (templates): szablony funkcji i klas, dedukcja argumentów, kilka parametrów, specjalizacja, parametry <code>auto<\/code>, koncepty."},"headers":[],"planned":false,"entries":[{"id":"function-templates","title":{"en":"Function templates","pl":"Szablony funkcji"},"explain":{"en":"<code>template &lt;typename T&gt;<\/code> lets one function work for many types; the compiler generates a separate version for each type you use. Usually <code>T<\/code> is deduced from the arguments; write <code>biggest&lt;double&gt;(...)<\/code> to choose it yourself, e.g. when the arguments have different types.","pl":"<code>template &lt;typename T&gt;<\/code> tworzy szablon funkcji (function template): jedną funkcję dla wielu typów; kompilator generuje osobną wersję dla każdego użytego typu. Zwykle <code>T<\/code> wynika z argumentów (dedukcja argumentów szablonu, template argument deduction); <code>biggest&lt;double&gt;(...)<\/code> podaje typ jawnie, np. gdy argumenty mają różne typy."},"code":"template <typename T>\nT biggest(T a, T b) {\n    return a > b ? a : b;\n}\n\nint main() {\n    std::cout << biggest(3, 7) << '\\n';            // T = int\n    std::cout << biggest(2.5, 1.5) << '\\n';        // T = double\n    std::cout << biggest<double>(1, 2.5) << '\\n';  // biggest(1, 2.5): error\n    std::cout << biggest<std::string>(\"pear\", \"apple\") << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"7\n2.5\n2.5\npear","error":false,"pitfall":{"en":"<code>biggest(\"pear\", \"apple\")<\/code> deduces <code>T = const char*<\/code> and compares the <em>addresses<\/em> of the two literals, not the text, so the result is arbitrary. Ask for <code>std::string<\/code> explicitly, as above.","pl":"<code>biggest(\"pear\", \"apple\")<\/code> dedukuje <code>T = const char*<\/code> i porównuje <em>adresy<\/em> literałów, a nie tekst, więc wynik jest przypadkowy. Wymuś <code>std::string<\/code>, jak w przykładzie."},"see":[{"topic":"functions","entry":null}]},{"id":"class-templates","title":{"en":"Class templates","pl":"Szablony klas"},"explain":{"en":"A class template is a blueprint for classes: <code>Box&lt;int&gt;<\/code> and <code>Box&lt;std::string&gt;<\/code> are two different types. Since C++17 the type can often be deduced from the constructor (<code>Box c(3.5);<\/code>). A method defined outside the class repeats the <code>template<\/code> line and is written as <code>Box&lt;T&gt;::get<\/code>.","pl":"Szablon klasy (class template) to przepis na klasy: <code>Box&lt;int&gt;<\/code> i <code>Box&lt;std::string&gt;<\/code> to dwa różne typy. Od C++17 typ często wynika z argumentów konstruktora (<code>Box c(3.5);<\/code>). Metoda definiowana poza klasą powtarza linię <code>template<\/code> i ma nazwę <code>Box&lt;T&gt;::get<\/code>."},"code":"template <typename T>\nclass Box {\npublic:\n    explicit Box(T value) : value_(value) {}\n    T get() const;\nprivate:\n    T value_;\n};\n\ntemplate <typename T>  // a method defined outside the class\nT Box<T>::get() const {\n    return value_;\n}\n\nint main() {\n    Box<int> a(42);\n    Box<std::string> b(\"hi\");\n    Box c(3.5);  // C++17: Box<double> deduced\n    std::cout << a.get() << ' ' << b.get() << ' ' << c.get() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"42 hi 3.5","error":false,"pitfall":{"en":"Keep the whole template, method bodies included, in the header. If you move the bodies to a <code>.cpp<\/code> file, everything compiles but the linker reports <em>undefined reference<\/em> errors.","pl":"Cały szablon, razem z ciałami metod, trzymaj w pliku nagłówkowym. Jeśli przeniesiesz ciała do pliku <code>.cpp<\/code>, wszystko się skompiluje, ale linker zgłosi błędy <em>undefined reference<\/em>."},"see":[{"topic":"classes","entry":null},{"topic":"headers","entry":null}]},{"id":"several-parameters","title":{"en":"Several template parameters","pl":"Kilka parametrów szablonu"},"explain":{"en":"A template can take several types, each deduced on its own. It can also take a <em>value<\/em> known at compile time, such as a size: <code>template &lt;typename T, int Size&gt;<\/code>. That's how <code>std::array&lt;int, 5&gt;<\/code> works.","pl":"Szablon może mieć kilka parametrów typu, każdy dedukowany osobno. Może też przyjmować <em>wartość<\/em> znaną w czasie kompilacji, np. rozmiar: <code>template &lt;typename T, int Size&gt;<\/code> (parametr nietypowy, non-type parameter). Tak działa <code>std::array&lt;int, 5&gt;<\/code>."},"code":"template <typename A, typename B>\nvoid showPair(A a, B b) {\n    std::cout << '(' << a << \", \" << b << \")\\n\";\n}\n\ntemplate <typename T, int Size>  // Size is a value, not a type\nclass Buffer {\npublic:\n    int capacity() const { return Size; }\nprivate:\n    T data_[Size]{};\n};\n\nint main() {\n    showPair(1, \"one\");  // A = int, B = const char*\n    showPair(2.5, 'x');  // A = double, B = char\n    Buffer<double, 16> buf;\n    std::cout << buf.capacity() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"(1, one)\n(2.5, x)\n16","error":false,"pitfall":{"en":"Template arguments must be compile-time constants: <code>Buffer&lt;double, n&gt;<\/code> with an <code>int n<\/code> read from the user doesn't compile (a <code>constexpr<\/code> one is fine). For sizes known only at run time, use <code>std::vector<\/code>.","pl":"Argumenty szablonu muszą być stałymi czasu kompilacji: <code>Buffer&lt;double, n&gt;<\/code> z <code>int n<\/code> wczytanym od użytkownika się nie skompiluje (stała <code>constexpr<\/code> jest w porządku). Dla rozmiarów znanych dopiero w czasie działania programu użyj <code>std::vector<\/code>."},"see":[{"topic":"arrays","entry":null},{"topic":"vector","entry":null}]},{"id":"specialisation","title":{"en":"Specialisation","pl":"Specjalizacja"},"explain":{"en":"<code>template &lt;&gt;<\/code> gives a separate implementation for one specific type, while all other types use the general version. The standard library does this, e.g. for <code>std::hash&lt;int&gt;<\/code>. For functions, a plain overload is usually simpler than a specialisation.","pl":"<code>template &lt;&gt;<\/code> definiuje osobną implementację dla jednego konkretnego typu (specjalizacja, specialisation), a pozostałe typy korzystają z wersji ogólnej. Tak robi biblioteka standardowa, np. dla <code>std::hash&lt;int&gt;<\/code>. Dla funkcji prościej jest zwykle napisać przeciążenie (overload) niż specjalizację."},"code":"template <typename T>\nstruct TypeName {\n    static std::string get() { return \"unknown\"; }\n};\n\ntemplate <>  // used when T is int\nstruct TypeName<int> {\n    static std::string get() { return \"int\"; }\n};\n\ntemplate <>  // used when T is double\nstruct TypeName<double> {\n    static std::string get() { return \"double\"; }\n};\n\nint main() {\n    std::cout << TypeName<int>::get() << '\\n';\n    std::cout << TypeName<double>::get() << '\\n';\n    std::cout << TypeName<char>::get() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"int\ndouble\nunknown","error":false,"pitfall":null,"see":[]},{"id":"auto-parameters","title":{"en":"auto parameters (C++20)","pl":"Parametry auto (C++20)"},"explain":{"en":"In C++20 a parameter declared <code>auto<\/code> turns the function into a template (an <em>abbreviated function template<\/em>): <code>void printAll(const auto&amp; items)<\/code> means <code>template &lt;typename T&gt; void printAll(const T&amp; items)<\/code>. Handy for short generic helpers.","pl":"W C++20 parametr zadeklarowany jako <code>auto<\/code> zamienia funkcję w szablon (skrócony szablon funkcji, abbreviated function template): <code>void printAll(const auto&amp; items)<\/code> znaczy to samo co <code>template &lt;typename T&gt; void printAll(const T&amp; items)<\/code>. Wygodne przy krótkich, uniwersalnych funkcjach pomocniczych."},"code":"void printAll(const auto& items) {  // works for any container\n    for (const auto& x : items) {\n        std::cout << x << ' ';\n    }\n    std::cout << '\\n';\n}\n\nint main() {\n    printAll(std::vector<int>{1, 2, 3});\n    printAll(std::list<std::string>{\"a\", \"b\"});\n    printAll(std::set<char>{'z', 'x', 'y'});\n}","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 3\na b\nx y z","error":false,"pitfall":{"en":"Every <code>auto<\/code> is a separate type parameter: in <code>void f(auto a, auto b)<\/code> the arguments may have different types (<code>f(1, 2.5)<\/code> works). If they must match, write <code>template &lt;typename T&gt; void f(T a, T b)<\/code>.","pl":"Każde <code>auto<\/code> to osobny parametr typu: w <code>void f(auto a, auto b)<\/code> argumenty mogą mieć różne typy (<code>f(1, 2.5)<\/code> działa). Jeśli mają być takie same, napisz <code>template &lt;typename T&gt; void f(T a, T b)<\/code>."},"see":[{"topic":"lambdas","entry":null}]},{"id":"concepts","title":{"en":"Concepts and requires (C++20)","pl":"Koncepty i requires (C++20)"},"explain":{"en":"A concept states what a type must be, e.g. <code>std::integral<\/code> or <code>std::floating_point<\/code> from <code>&lt;concepts&gt;<\/code>. Use it as <code>template &lt;std::integral T&gt;<\/code>, in a <code>requires<\/code> clause, or as <code>std::floating_point auto<\/code>. A wrong type then gives a short <em>constraints not satisfied<\/em> error instead of pages of template noise.","pl":"Koncept (concept) określa, jaki musi być typ, np. <code>std::integral<\/code> czy <code>std::floating_point<\/code> z nagłówka <code>&lt;concepts&gt;<\/code>. Można go użyć jako <code>template &lt;std::integral T&gt;<\/code>, w klauzuli <code>requires<\/code> albo jako <code>std::floating_point auto<\/code>. Zły typ daje wtedy krótki błąd <em>constraints not satisfied<\/em> zamiast kilku stron komunikatów o szablonach."},"code":"template <typename T>\n    requires std::integral<T>\nbool isEven(T n) {\n    return n % 2 == 0;\n}\n\nvoid printSquare(std::floating_point auto x) {\n    std::cout << x * x << '\\n';\n}\n\nint main() {\n    std::cout << std::boolalpha << isEven(10) << ' ' << isEven(7L) << '\\n';\n    printSquare(1.5);\n    // isEven(2.5);     // error: constraints not satisfied\n    // printSquare(3);  // error: int is not a floating-point type\n}","lang":"cpp","codeTitle":null,"input":null,"output":"true false\n2.25","error":false,"pitfall":null,"see":[]}]},{"id":"exceptions","glyph":"try","name":{"en":"Exceptions","pl":"Wyjątki"},"summary":{"en":"Error handling: <code>throw<\/code> / <code>try<\/code> / <code>catch<\/code>, standard exceptions and <code>what()<\/code>, catching by <code>const&amp;<\/code>, custom exceptions, <code>noexcept<\/code>, <code>catch (...)<\/code>.","pl":"Wyjątki (exceptions): <code>throw<\/code> / <code>try<\/code> / <code>catch<\/code>, wyjątki standardowe i <code>what()<\/code>, łapanie przez <code>const&amp;<\/code>, własne klasy wyjątków, <code>noexcept<\/code>, <code>catch (...)<\/code>."},"headers":["<stdexcept>"],"planned":false,"entries":[{"id":"throw-try-catch","title":{"en":"throw, try, catch","pl":"throw, try, catch"},"explain":{"en":"<code>throw<\/code> reports an error and leaves the function at once. The nearest <code>try<\/code> block with a <code>catch<\/code> matching the exception's type handles it: the rest of the <code>try<\/code> block is skipped, and the program carries on after the <code>catch<\/code>.","pl":"<code>throw<\/code> zgłasza błąd, czyli rzuca wyjątek (throws an exception), i natychmiast opuszcza funkcję. Obsługuje go najbliższy blok <code>try<\/code>, którego <code>catch<\/code> pasuje do typu wyjątku: reszta bloku <code>try<\/code> jest pomijana, a program działa dalej za blokiem <code>catch<\/code>."},"code":"double divide(double a, double b) {\n    if (b == 0) {\n        throw std::runtime_error(\"division by zero\");\n    }\n    return a / b;\n}\n\nint main() {\n    try {\n        std::cout << divide(10, 4) << '\\n';\n        std::cout << divide(1, 0) << '\\n';  // throws: the rest is skipped\n        std::cout << \"never printed\\n\";\n    } catch (const std::runtime_error& e) {\n        std::cout << \"Error: \" << e.what() << '\\n';\n    }\n    std::cout << \"program continues\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"2.5\nError: division by zero\nprogram continues","error":false,"pitfall":{"en":"An exception that no <code>catch<\/code> handles ends the program with <em>terminate called after throwing an instance of ...<\/em>. Catch exceptions at least in <code>main<\/code>.","pl":"Wyjątek, którego nie złapie żaden <code>catch<\/code>, kończy program komunikatem <em>terminate called after throwing an instance of ...<\/em>. Łap wyjątki przynajmniej w <code>main<\/code>."},"see":[]},{"id":"standard-exceptions","title":{"en":"Standard exceptions","pl":"Wyjątki standardowe"},"explain":{"en":"The library throws its own exceptions: <code>at()<\/code> throws <code>std::out_of_range<\/code>, and <code>std::stoi<\/code> throws <code>std::invalid_argument<\/code> for text that isn't a number. You can throw them too: <code>throw std::invalid_argument(\"negative age\");<\/code>. All of them derive from <code>std::exception<\/code>, whose <code>what()<\/code> returns the message.","pl":"Biblioteka standardowa rzuca własne wyjątki: <code>at()<\/code> rzuca <code>std::out_of_range<\/code>, a <code>std::stoi<\/code> rzuca <code>std::invalid_argument<\/code> dla tekstu, który nie jest liczbą. Możesz też rzucać je sam: <code>throw std::invalid_argument(\"negative age\");<\/code>. Wszystkie dziedziczą po <code>std::exception<\/code>, którego <code>what()<\/code> zwraca komunikat."},"code":"std::vector<int> v{1, 2, 3};\ntry {\n    std::cout << v.at(10) << '\\n';\n} catch (const std::out_of_range&) {\n    std::cout << \"bad index\\n\";\n}\ntry {\n    std::cout << std::stoi(\"abc\") << '\\n';\n} catch (const std::invalid_argument&) {\n    std::cout << \"not a number\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"bad index\nnot a number","error":false,"pitfall":{"en":"<code>v[10]<\/code> doesn't throw: an out-of-range index with <code>[]<\/code> is undefined behaviour. Only <code>at()<\/code> checks the index.","pl":"<code>v[10]<\/code> nie rzuca wyjątku: indeks poza zakresem przy <code>[]<\/code> to niezdefiniowane zachowanie (undefined behaviour). Indeks sprawdza tylko <code>at()<\/code>."},"see":[{"topic":"vector","entry":null},{"topic":"strings","entry":null}]},{"id":"several-catch-blocks","title":{"en":"Several catch blocks, by const&amp;","pl":"Kilka bloków catch, przez const&amp;"},"explain":{"en":"A <code>try<\/code> can have several <code>catch<\/code> blocks and the first one that matches wins, so put the most specific types first and <code>std::exception<\/code> last. Catch by <code>const&amp;<\/code>: nothing is copied, and a derived exception keeps its real type.","pl":"Jeden <code>try<\/code> może mieć kilka bloków <code>catch<\/code> i wygrywa pierwszy pasujący, więc najpierw umieść typy najbardziej szczegółowe, a <code>std::exception<\/code> na końcu. Łap przez <code>const&amp;<\/code>: nic nie jest kopiowane, a wyjątek pochodny zachowuje swój prawdziwy typ."},"code":"void checkAge(int age) {\n    if (age < 0) {\n        throw std::invalid_argument(\"age is negative\");\n    }\n    if (age > 150) {\n        throw std::out_of_range(\"age is too large\");\n    }\n}\n\nint main() {\n    for (int age : {20, -5, 200}) {\n        try {\n            checkAge(age);\n            std::cout << age << \" is OK\\n\";\n        } catch (const std::invalid_argument& e) {  // most specific first\n            std::cout << \"invalid: \" << e.what() << '\\n';\n        } catch (const std::exception& e) {  // any other standard exception\n            std::cout << \"error: \" << e.what() << '\\n';\n        }\n    }\n}","lang":"cpp","codeTitle":null,"input":null,"output":"20 is OK\ninvalid: age is negative\nerror: age is too large","error":false,"pitfall":{"en":"Catching by value (<code>catch (std::exception e)<\/code>) copies and slices the exception. And with <code>catch (const std::exception&amp;)<\/code> first, the blocks below it never run (g++ warns: <em>will be caught by earlier handler<\/em>).","pl":"Łapanie przez wartość (<code>catch (std::exception e)<\/code>) kopiuje i wycina (slicing) wyjątek. A jeśli <code>catch (const std::exception&amp;)<\/code> stoi pierwszy, bloki pod nim nigdy się nie wykonają (g++ ostrzega: <em>will be caught by earlier handler<\/em>)."},"see":[]},{"id":"custom-exceptions","title":{"en":"Custom exception classes","pl":"Własne klasy wyjątków"},"explain":{"en":"Derive your own exception from <code>std::runtime_error<\/code> (or another standard one): pass the message to the base constructor and add any extra data you need. It can then be caught by its own type or as any <code>std::exception<\/code>.","pl":"Własny wyjątek wyprowadź z <code>std::runtime_error<\/code> (albo innego standardowego): przekaż komunikat do konstruktora bazowego i dodaj potrzebne dane. Taki wyjątek złapiesz po jego własnym typie albo jako dowolny <code>std::exception<\/code>."},"code":"class InsufficientFunds : public std::runtime_error {\npublic:\n    explicit InsufficientFunds(double missing)\n        : std::runtime_error(\"insufficient funds\"), missing_(missing) {}\n    double missing() const { return missing_; }\nprivate:\n    double missing_;\n};\n\nvoid withdraw(double balance, double amount) {\n    if (amount > balance) {\n        throw InsufficientFunds(amount - balance);\n    }\n    std::cout << \"withdrew \" << amount << '\\n';\n}\n\nint main() {\n    try {\n        withdraw(100, 30);\n        withdraw(100, 150);\n    } catch (const InsufficientFunds& e) {\n        std::cout << e.what() << \", missing \" << e.missing() << '\\n';\n    }\n}","lang":"cpp","codeTitle":null,"input":null,"output":"withdrew 30\ninsufficient funds, missing 50","error":false,"pitfall":{"en":"Don't throw plain values like <code>throw \"error\";<\/code> or <code>throw 42;<\/code>: a <code>catch (const std::exception&amp;)<\/code> won't catch them, and they have no <code>what()<\/code>. Throw classes derived from <code>std::exception<\/code>.","pl":"Nie rzucaj zwykłych wartości, jak <code>throw \"error\";<\/code> czy <code>throw 42;<\/code>: <code>catch (const std::exception&amp;)<\/code> ich nie złapie i nie mają <code>what()<\/code>. Rzucaj klasy dziedziczące po <code>std::exception<\/code>."},"see":[{"topic":"inheritance","entry":null}]},{"id":"noexcept","title":{"en":"noexcept","pl":"noexcept"},"explain":{"en":"<code>noexcept<\/code> promises that a function never throws; if it throws anyway, <code>std::terminate<\/code> ends the program at once. Mark move constructors and <code>swap<\/code> <code>noexcept<\/code>: <code>std::vector<\/code> then moves its elements instead of copying them when it grows. The <code>noexcept(...)<\/code> operator tells whether an expression can throw.","pl":"<code>noexcept<\/code> to obietnica, że funkcja nigdy nie rzuci wyjątku; jeśli mimo to rzuci, <code>std::terminate<\/code> natychmiast kończy program. Oznaczaj jako <code>noexcept<\/code> konstruktory przenoszące (move constructors) i <code>swap<\/code>: <code>std::vector<\/code> będzie wtedy przy powiększaniu przenosił elementy zamiast je kopiować. Operator <code>noexcept(...)<\/code> mówi, czy wyrażenie może rzucić wyjątek."},"code":"int square(int x) noexcept {  // promises not to throw\n    return x * x;\n}\n\nint parse(const std::string& s) {  // may throw (std::stoi can)\n    return std::stoi(s);\n}\n\nint main() {\n    std::cout << std::boolalpha;\n    std::cout << noexcept(square(2)) << '\\n';\n    std::cout << noexcept(parse(\"1\")) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"true\nfalse","error":false,"pitfall":{"en":"An exception leaving a <code>noexcept<\/code> function or a destructor (destructors are <code>noexcept<\/code> by default) never reaches your <code>catch<\/code>: the program is terminated. Catch it inside, or don't mark the function <code>noexcept<\/code>.","pl":"Wyjątek wychodzący z funkcji <code>noexcept<\/code> albo z destruktora (destruktory są domyślnie <code>noexcept<\/code>) nigdy nie dotrze do twojego <code>catch<\/code>: program zostanie przerwany. Złap go w środku albo nie oznaczaj funkcji jako <code>noexcept<\/code>."},"see":[{"topic":"copy-move","entry":null}]},{"id":"catch-all","title":{"en":"catch (...) and rethrowing","pl":"catch (...) i ponowne rzucenie"},"explain":{"en":"<code>catch (...)<\/code> catches anything, even non-standard values, but you can't see what was thrown, so put it last. Inside any <code>catch<\/code>, a bare <code>throw;<\/code> rethrows the current exception unchanged, e.g. after cleaning up.","pl":"<code>catch (...)<\/code> łapie wszystko, nawet niestandardowe wartości, ale nie widać, co zostało rzucone, więc umieszczaj go na końcu. W dowolnym <code>catch<\/code> samo <code>throw;<\/code> rzuca ponownie (rethrow) ten sam wyjątek bez zmian, np. po posprzątaniu."},"code":"void save() {\n    try {\n        throw std::runtime_error(\"disk full\");\n    } catch (...) {  // catches anything\n        std::cout << \"cleaning up\\n\";\n        throw;  // rethrows the same exception\n    }\n}\n\nint main() {\n    try {\n        save();\n    } catch (const std::exception& e) {\n        std::cout << \"error: \" << e.what() << '\\n';\n    }\n    try {\n        throw 42;  // anything can be thrown, even an int\n    } catch (...) {\n        std::cout << \"unknown error\\n\";\n    }\n}","lang":"cpp","codeTitle":null,"input":null,"output":"cleaning up\nerror: disk full\nunknown error","error":false,"pitfall":{"en":"Rethrow with <code>throw;<\/code>, not <code>throw e;<\/code>: the latter throws a copy of the static type, so <code>catch (const std::exception&amp; e)<\/code> followed by <code>throw e;<\/code> turns a <code>std::runtime_error<\/code> into a plain <code>std::exception<\/code>.","pl":"Rzucaj ponownie przez <code>throw;<\/code>, a nie <code>throw e;<\/code>: to drugie rzuca kopię typu statycznego, więc <code>catch (const std::exception&amp; e)<\/code> z <code>throw e;<\/code> w środku zamienia <code>std::runtime_error<\/code> w zwykły <code>std::exception<\/code>."},"see":[]}]},{"id":"files","glyph":"file","name":{"en":"Files","pl":"Pliki"},"summary":{"en":"Writing and reading text files with std::ofstream and std::ifstream, checking that a file opened, append mode and parsing lines with std::stringstream.","pl":"Pliki tekstowe: zapis i odczyt przez std::ofstream i std::ifstream, sprawdzanie otwarcia pliku, dopisywanie na końcu i rozbiór linii przez std::stringstream."},"headers":["<fstream>","<sstream>"],"planned":false,"entries":[{"id":"writing","title":{"en":"Writing a file","pl":"Zapis do pliku"},"explain":{"en":"<code>std::ofstream<\/code> creates the file and works just like <code>std::cout<\/code>: send text and numbers with <code>&lt;&lt;<\/code>. The file is closed when the stream goes out of scope, or earlier with <code>close()<\/code>. <code>std::cout &lt;&lt; in.rdbuf()<\/code> prints a whole file at once.","pl":"<code>std::ofstream<\/code> tworzy plik i działa jak <code>std::cout<\/code>: tekst i liczby wysyłasz operatorem <code>&lt;&lt;<\/code>. Plik zamyka się sam, gdy strumień (stream) wychodzi z zasięgu, albo wcześniej przez <code>close()<\/code>. <code>std::cout &lt;&lt; in.rdbuf()<\/code> wypisuje cały plik naraz."},"code":"std::ofstream out(\"hello.txt\");\nout << \"Hello, file!\\n\";\nout << 42 << ' ' << 3.5 << '\\n';\nout.close();  // also happens automatically at the end of the scope\n\nstd::ifstream in(\"hello.txt\");\nstd::cout << in.rdbuf();  // print the whole file","lang":"cpp","codeTitle":null,"input":null,"output":"Hello, file!\n42 3.5","error":false,"pitfall":{"en":"Writes are buffered: until the <code>std::ofstream<\/code> is closed (or flushed), the file may still be empty. Close the writer, or put it in its own <code>{ }<\/code> block, before reading the same file.","pl":"Zapis jest buforowany: dopóki <code>std::ofstream<\/code> nie zostanie zamknięty (albo opróżniony przez <code>flush()<\/code>), plik może być jeszcze pusty. Zanim zaczniesz czytać ten sam plik, zamknij strumień zapisu albo umieść go we własnym bloku <code>{ }<\/code>."},"see":[]},{"id":"reading-lines","title":{"en":"Reading line by line","pl":"Odczyt linia po linii"},"explain":{"en":"<code>std::ifstream<\/code> opens a file for reading. <code>while (std::getline(in, line))<\/code> reads one whole line per pass, spaces included, and stops at the end of the file.","pl":"<code>std::ifstream<\/code> otwiera plik do odczytu. <code>while (std::getline(in, line))<\/code> w każdym obiegu wczytuje całą linię, razem ze spacjami, i kończy się na końcu pliku."},"code":"{   // create a file to read\n    std::ofstream out(\"poem.txt\");\n    out << \"Roses are red\\nViolets are blue\\n\";\n}\nstd::ifstream in(\"poem.txt\");\nstd::string line;\nint n = 0;\nwhile (std::getline(in, line)) {\n    std::cout << ++n << \": \" << line << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"1: Roses are red\n2: Violets are blue","error":false,"pitfall":null,"see":[{"topic":"strings","entry":null}]},{"id":"reading-values","title":{"en":"Reading words and numbers","pl":"Odczyt słów i liczb"},"explain":{"en":"<code>in &gt;&gt; x<\/code> reads the next value and skips spaces and newlines, just like <code>std::cin<\/code>. Use the read itself as the loop condition: it becomes false at the end of the file or at something that isn't a number. With a <code>std::string<\/code> it reads word by word.","pl":"<code>in &gt;&gt; x<\/code> wczytuje kolejną wartość i pomija spacje oraz znaki nowej linii, tak jak <code>std::cin<\/code>. Samo wczytanie zrób warunkiem pętli: staje się fałszywe na końcu pliku albo na czymś, co nie jest liczbą. Ze zmienną <code>std::string<\/code> czytasz słowo po słowie."},"code":"{\n    std::ofstream out(\"numbers.txt\");\n    out << \"4 8\\n15 16\\n23 42\\n\";\n}\nstd::ifstream in(\"numbers.txt\");\nint x, sum = 0, count = 0;\nwhile (in >> x) {\n    sum += x;\n    ++count;\n}\nstd::cout << count << \" numbers, sum \" << sum << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"6 numbers, sum 108","error":false,"pitfall":{"en":"<code>while (!in.eof()) { in &gt;&gt; x; ... }<\/code> is a classic bug: <code>eof()<\/code> turns true only <em>after<\/em> a read has failed, so the last value gets processed twice (or garbage once). Loop on <code>while (in &gt;&gt; x)<\/code> instead.","pl":"<code>while (!in.eof()) { in &gt;&gt; x; ... }<\/code> to klasyczny błąd: <code>eof()<\/code> staje się prawdą dopiero <em>po<\/em> nieudanym odczycie, więc ostatnia wartość zostaje przetworzona dwa razy (albo raz śmieciowa). Pisz <code>while (in &gt;&gt; x)<\/code>."},"see":[{"topic":"io","entry":null}]},{"id":"checking-open","title":{"en":"Did the file open?","pl":"Czy plik się otworzył?"},"explain":{"en":"Opening a missing file throws nothing and prints nothing: the stream just enters a failed state and every read fails. Always check with <code>if (!in)<\/code> or <code>in.is_open()<\/code> and stop with a clear message.","pl":"Otwarcie nieistniejącego pliku nie rzuca wyjątku i niczego nie wypisuje: strumień po prostu przechodzi w stan błędu i każdy odczyt się nie udaje. Zawsze sprawdzaj <code>if (!in)<\/code> albo <code>in.is_open()<\/code> i zakończ program z czytelnym komunikatem."},"code":"std::ifstream in(\"missing.txt\");\nif (!in.is_open()) {  // or simply: if (!in)\n    std::cout << \"Cannot open missing.txt\\n\";\n    return 1;  // end with an error code\n}\nstd::cout << \"File opened\\n\";","lang":"cpp","codeTitle":null,"input":null,"output":"Cannot open missing.txt","error":false,"pitfall":{"en":"A relative path like <code>\"data.txt\"<\/code> is looked up in the <em>working directory<\/em> (where the program is run from), not next to the <code>.cpp<\/code> file. IDEs often run the program from a build folder, so put the file there or use a full path.","pl":"Ścieżka względna, np. <code>\"data.txt\"<\/code>, jest szukana w <em>katalogu roboczym<\/em> (working directory), czyli tam, skąd uruchomiono program, a nie obok pliku <code>.cpp<\/code>. IDE często uruchamia program z folderu kompilacji, więc umieść plik tam albo podaj pełną ścieżkę."},"see":[]},{"id":"append","title":{"en":"Appending to a file","pl":"Dopisywanie do pliku"},"explain":{"en":"By default <code>std::ofstream<\/code> erases the file when it opens it. Pass <code>std::ios::app<\/code> (append mode) to keep the old contents and add new text at the end, e.g. for a log.","pl":"Domyślnie <code>std::ofstream<\/code> czyści plik przy otwarciu. Przekaż <code>std::ios::app<\/code> (tryb dopisywania, append mode), żeby zachować starą zawartość i dopisywać nowy tekst na końcu, np. w pliku z logami."},"code":"for (int run = 1; run <= 3; ++run) {\n    std::ofstream out(\"log.txt\", std::ios::app);  // add to the end\n    out << \"run \" << run << '\\n';\n}  // out is closed at the end of every pass\nstd::ifstream in(\"log.txt\");\nstd::cout << in.rdbuf();","lang":"cpp","codeTitle":null,"input":null,"output":"run 1\nrun 2\nrun 3","error":false,"pitfall":{"en":"Without <code>std::ios::app<\/code> every open truncates the file, so this loop would leave only <code>run 3<\/code>. Opening an <code>std::ofstream<\/code> on a file you only meant to read wipes it as well.","pl":"Bez <code>std::ios::app<\/code> każde otwarcie obcina plik do zera, więc ta pętla zostawiłaby tylko <code>run 3<\/code>. Otwarcie <code>std::ofstream<\/code> na pliku, który miał być tylko czytany, też go wyczyści."},"see":[]},{"id":"stringstream","title":{"en":"Parsing a line with stringstream","pl":"Rozbiór linii przez stringstream"},"explain":{"en":"<code>std::istringstream<\/code> turns a string into a stream, so you can read from it with <code>&gt;&gt;<\/code> like from a file. Typical use: read a file with <code>getline<\/code>, then split each line. <code>std::getline(ss, field, ',')<\/code> splits on commas (CSV).","pl":"<code>std::istringstream<\/code> zamienia napis w strumień, z którego czytasz operatorem <code>&gt;&gt;<\/code> tak jak z pliku. Typowe użycie: wczytujesz plik przez <code>getline<\/code>, a potem rozbijasz każdą linię. <code>std::getline(ss, field, ',')<\/code> dzieli tekst po przecinkach (CSV)."},"code":"std::istringstream ss(\"Ada 5 4 5\");\nstd::string name;\nint grade, sum = 0;\nss >> name;\nwhile (ss >> grade) sum += grade;\nstd::cout << name << \": \" << sum << '\\n';\n\nstd::istringstream csv(\"red,green,blue\");\nstd::string field;\nwhile (std::getline(csv, field, ',')) std::cout << '[' << field << \"] \";","lang":"cpp","codeTitle":null,"input":null,"output":"Ada: 14\n[red] [green] [blue]","error":false,"pitfall":{"en":"After a stream hits its end, its error flags stay set, so reusing it with <code>ss.str(newLine)<\/code> alone reads nothing (you'd also need <code>ss.clear()<\/code>). Simpler: create a fresh <code>std::istringstream<\/code> inside the loop for every line.","pl":"Gdy strumień dojdzie do końca, jego flagi błędu zostają ustawione, więc ponowne użycie go przez samo <code>ss.str(newLine)<\/code> niczego nie wczyta (trzeba jeszcze <code>ss.clear()<\/code>). Prościej: twórz nowy <code>std::istringstream<\/code> wewnątrz pętli dla każdej linii."},"see":[{"topic":"strings","entry":null}]}]},{"id":"headers","glyph":".h","name":{"en":"Header files","pl":"Pliki nagłówkowe"},"summary":{"en":"Splitting a program into .h and .cpp files: declarations vs definitions, \"...\" vs &lt;...&gt; includes, compiling several files, include guards and the one-definition rule.","pl":"Pliki nagłówkowe (header files): podział programu na pliki .h i .cpp, deklaracje i definicje, include z \"...\" i &lt;...&gt;, kompilacja kilku plików, strażniki dołączania i reguła jednej definicji."},"headers":[],"planned":false,"entries":[{"id":"header-file","title":{"en":"The header (.h)","pl":"Nagłówek (.h)"},"explain":{"en":"A header says <em>what exists<\/em>: types and function declarations (prototypes), without function bodies. Every <code>.cpp<\/code> file that uses <code>Point<\/code> includes it. <code>#pragma once<\/code> makes sure it is read only once per <code>.cpp<\/code> file.","pl":"Nagłówek mówi, <em>co istnieje<\/em>: typy i deklaracje (declarations) funkcji, czyli prototypy bez ciał. Dołącza go każdy plik <code>.cpp<\/code>, który używa <code>Point<\/code>. <code>#pragma once<\/code> sprawia, że w jednym pliku <code>.cpp<\/code> zostanie wczytany tylko raz."},"code":"#pragma once  // include this file only once per .cpp\n\nstruct Point {  // a type definition: fine in a header\n    double x;\n    double y;\n};\n\ndouble dist(Point a, Point b);  // declarations only:\nvoid print(Point p);            // no function bodies here","lang":"cpp","codeTitle":"point.h","input":null,"output":null,"error":false,"pitfall":{"en":"A header must include what it uses itself: if <code>point.h<\/code> used <code>std::string<\/code>, it would need its own <code>#include &lt;string&gt;<\/code> instead of relying on the <code>.cpp<\/code> files to include it first.","pl":"Nagłówek musi sam dołączać to, czego używa: gdyby <code>point.h<\/code> korzystał z <code>std::string<\/code>, potrzebowałby własnego <code>#include &lt;string&gt;<\/code>, a nie liczyć na to, że pliki <code>.cpp<\/code> dołączą go wcześniej."},"see":[]},{"id":"source-file","title":{"en":"The source file (.cpp)","pl":"Plik źródłowy (.cpp)"},"explain":{"en":"The matching <code>.cpp<\/code> holds the definitions: the function bodies, i.e. <em>how<\/em> it works. It includes its own header first, so the compiler checks that declarations and definitions agree.","pl":"Pasujący plik <code>.cpp<\/code> zawiera definicje (definitions), czyli ciała funkcji: <em>jak<\/em> to działa. Dołącza najpierw własny nagłówek, dzięki czemu kompilator sprawdzi, czy deklaracje zgadzają się z definicjami."},"code":"#include \"point.h\"\n#include <cmath>\n#include <iostream>\n\ndouble dist(Point a, Point b) {  // definition: the body\n    return std::hypot(b.x - a.x, b.y - a.y);\n}\n\nvoid print(Point p) {\n    std::cout << '(' << p.x << \", \" << p.y << \")\\n\";\n}","lang":"cpp","codeTitle":"point.cpp","input":null,"output":null,"error":false,"pitfall":null,"see":[{"topic":"functions","entry":null}]},{"id":"main-file","title":{"en":"Using it from main.cpp","pl":"Użycie w main.cpp"},"explain":{"en":"<code>main.cpp<\/code> includes only the header; the declarations are enough to call the functions. <code>#include \"point.h\"<\/code> in quotes looks next to the current file first (your own headers), while <code>&lt;iostream&gt;<\/code> in angle brackets searches only the compiler's directories (the standard library).","pl":"<code>main.cpp<\/code> dołącza tylko nagłówek: do wywołania funkcji wystarczą deklaracje. <code>#include \"point.h\"<\/code> w cudzysłowie szuka najpierw obok bieżącego pliku (twoje własne nagłówki), a <code>&lt;iostream&gt;<\/code> w nawiasach ostrych szuka tylko w katalogach kompilatora (biblioteka standardowa)."},"code":"#include <iostream>  // <...>: standard library\n#include \"point.h\"   // \"...\": our own file, looked up next to main.cpp first\n\nint main() {\n    Point a{0, 0};\n    Point b{3, 4};\n    print(b);\n    std::cout << dist(a, b) << '\\n';\n}","lang":"cpp","codeTitle":"main.cpp","input":null,"output":null,"error":false,"pitfall":null,"see":[]},{"id":"compiling","title":{"en":"Compiling several files","pl":"Kompilacja kilku plików"},"explain":{"en":"Give g++ every <code>.cpp<\/code> file (never the <code>.h<\/code> files): each is compiled on its own, then the linker joins them into one program. In bigger projects <code>g++ -c point.cpp<\/code> compiles one file to <code>point.o<\/code>, so only changed files need recompiling.","pl":"Podaj g++ wszystkie pliki <code>.cpp<\/code> (nigdy <code>.h<\/code>): każdy jest kompilowany osobno, a potem konsolidator (linker) łączy je w jeden program. W większych projektach <code>g++ -c point.cpp<\/code> kompiluje jeden plik do <code>point.o<\/code>, więc ponownie kompilujesz tylko zmienione pliki."},"code":"g++ -std=c++20 -Wall -Wextra main.cpp point.cpp -o app\n./app","lang":"shell","codeTitle":null,"input":null,"output":"(3, 4)\n5","error":false,"pitfall":{"en":"*undefined reference to <code>dist(Point, Point)'* is a linker error: the function was declared but its <\/code>.cpp<code> wasn't compiled in. Add the file to the command (or to the IDE project). Never <\/code>#include \"point.cpp\"`.","pl":"*undefined reference to <code>dist(Point, Point)'* to błąd linkera: funkcja jest zadeklarowana, ale jej plik <\/code>.cpp<code> nie został skompilowany razem z resztą. Dodaj ten plik do polecenia (albo do projektu w IDE). Nigdy nie pisz <\/code>#include \"point.cpp\"`."},"see":[{"topic":"program","entry":null}]},{"id":"include-guards","title":{"en":"Include guards","pl":"Strażniki dołączania"},"explain":{"en":"If <code>main.cpp<\/code> includes <code>point.h<\/code> and also <code>line.h<\/code>, which includes <code>point.h<\/code> again, <code>Point<\/code> is defined twice: <em>redefinition of 'struct Point'<\/em>. The classic fix is an include guard; <code>#pragma once<\/code> does the same in one line and works in all major compilers.","pl":"Jeśli <code>main.cpp<\/code> dołącza <code>point.h<\/code> i <code>line.h<\/code>, który znowu dołącza <code>point.h<\/code>, to <code>Point<\/code> zostaje zdefiniowany dwa razy: <em>redefinition of 'struct Point'<\/em>. Klasycznym rozwiązaniem jest strażnik dołączania (include guard); <code>#pragma once<\/code> robi to samo w jednej linii i działa we wszystkich popularnych kompilatorach."},"code":"#ifndef POINT_H  // first time: POINT_H is not defined yet...\n#define POINT_H  // ...so define it and keep the contents\n\nstruct Point {\n    double x;\n    double y;\n};\n\ndouble dist(Point a, Point b);\nvoid print(Point p);\n\n#endif  // next time: everything up to here is skipped","lang":"cpp","codeTitle":"point.h","input":null,"output":null,"error":false,"pitfall":{"en":"Every header needs its own guard name. Copy <code>point.h<\/code> to <code>line.h<\/code> and keep <code>POINT_H<\/code>, and whichever is included second is silently skipped, giving confusing <em>'Line' was not declared<\/em> errors.","pl":"Każdy nagłówek potrzebuje własnej nazwy strażnika. Skopiujesz <code>point.h<\/code> do <code>line.h<\/code> i zostawisz <code>POINT_H<\/code>, a ten dołączony jako drugi zostanie po cichu pominięty, co da mylące błędy <em>'Line' was not declared<\/em>."},"see":[]},{"id":"odr","title":{"en":"One-definition rule","pl":"Reguła jednej definicji"},"explain":{"en":"Each function and global variable may be <em>defined<\/em> only once in the whole program (the one-definition rule, ODR). A header is pasted into every <code>.cpp<\/code> that includes it, so put only declarations there, plus types, templates and <code>inline<\/code> functions, which are allowed in several files.","pl":"Każda funkcja i zmienna globalna może być <em>zdefiniowana<\/em> tylko raz w całym programie (reguła jednej definicji, one-definition rule, ODR). Nagłówek jest wklejany do każdego <code>.cpp<\/code>, który go dołącza, więc umieszczaj w nim tylko deklaracje oraz typy, szablony i funkcje <code>inline<\/code>, które mogą występować w wielu plikach."},"code":"#pragma once\n\nint square(int x);        // declaration: fine in a header\nextern int call_count;    // global variable: declared here,\n                          // defined in exactly one .cpp\ninline int cube(int x) {  // inline: may be defined in a header\n    return x * x * x;\n}\n\nint twice(int x) {        // ERROR as soon as two .cpp files include this:\n    return 2 * x;         // multiple definition of `twice(int)'\n}","lang":"cpp","codeTitle":"math_utils.h","input":null,"output":null,"error":false,"pitfall":{"en":"A global like <code>int counter = 0;<\/code> in a header breaks the same way. Write <code>extern int counter;<\/code> in the header and <code>int counter = 0;<\/code> in one <code>.cpp<\/code> file (or, since C++17, <code>inline int counter = 0;<\/code> in the header).","pl":"Zmienna globalna typu <code>int counter = 0;<\/code> w nagłówku psuje się tak samo. W nagłówku napisz <code>extern int counter;<\/code>, a <code>int counter = 0;<\/code> w jednym pliku <code>.cpp<\/code> (albo, od C++17, <code>inline int counter = 0;<\/code> w nagłówku)."},"see":[{"topic":"templates","entry":null},{"topic":"enums","entry":null}]}]},{"id":"enums","glyph":"enum","name":{"en":"Enums &amp; namespaces","pl":"Wyliczenia i przestrzenie nazw"},"summary":{"en":"enum class vs plain enum, underlying values and static_cast, switch over an enum, namespaces and using type aliases.","pl":"Wyliczenia (enums): enum class kontra zwykły enum, wartości i static_cast, switch po wyliczeniu, przestrzenie nazw (namespaces) i aliasy typów przez using."},"headers":[],"planned":false,"entries":[{"id":"enum-class","title":{"en":"enum class","pl":"enum class"},"explain":{"en":"An <code>enum class<\/code> (scoped enum) is a type with a fixed set of named values. Use it instead of magic numbers or strings for states, directions, menu options. The names are written with the type prefix: <code>Color::Green<\/code>.","pl":"<code>enum class<\/code> (wyliczenie z zakresem, scoped enum) to typ o stałym zestawie nazwanych wartości. Używaj go zamiast magicznych liczb czy napisów dla stanów, kierunków, opcji menu. Nazwy piszesz z przedrostkiem typu: <code>Color::Green<\/code>."},"code":"enum class Color { Red, Green, Blue };\n\nColor c = Color::Green;\nif (c == Color::Green) {\n    std::cout << \"go!\\n\";\n}\nc = Color::Red;\nstd::cout << (c == Color::Green) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"go!\n0","error":false,"pitfall":{"en":"<code>std::cout &lt;&lt; c<\/code> does not compile for an <code>enum class<\/code>: there's no automatic conversion to a number or text. Cast it with <code>static_cast&lt;int&gt;(c)<\/code> or write a function that returns its name.","pl":"<code>std::cout &lt;&lt; c<\/code> nie skompiluje się dla <code>enum class<\/code>: nie ma automatycznej konwersji na liczbę ani tekst. Rzutuj przez <code>static_cast&lt;int&gt;(c)<\/code> albo napisz funkcję zwracającą nazwę."},"see":[]},{"id":"plain-enum","title":{"en":"Plain enum vs enum class","pl":"Zwykły enum a enum class"},"explain":{"en":"The old C-style <code>enum<\/code> puts its names straight into the surrounding scope and converts to <code>int<\/code> silently. That's why two plain enums in one scope can't both have an <code>Orange<\/code>, and why mistakes like comparing a fruit with a number compile. Prefer <code>enum class<\/code> in new code.","pl":"Stary <code>enum<\/code> w stylu C wrzuca swoje nazwy wprost do otaczającego zakresu (scope) i po cichu zamienia się na <code>int<\/code>. Dlatego dwa zwykłe wyliczenia w tym samym zakresie nie mogą mieć wartości o tej samej nazwie, np. <code>Orange<\/code>, a błędy typu porównanie owocu z liczbą się kompilują. W nowym kodzie wybieraj <code>enum class<\/code>."},"code":"enum Fruit { Apple, Banana };          // plain enum: names leak out\nenum class Size { Small, Large };      // scoped: Size::Small\n\nFruit f = Banana;                      // no prefix needed\nint n = f;                             // silently becomes 1\nSize s = Size::Large;\n// int m = s;                          // error: no implicit conversion\nstd::cout << n << ' ' << (f == 1) << ' ' << static_cast<int>(s) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 1 1","error":false,"pitfall":null,"see":[]},{"id":"values","title":{"en":"Values and static_cast","pl":"Wartości i static_cast"},"explain":{"en":"Enumerators count from 0 unless you give them values. <code>static_cast&lt;int&gt;<\/code> gives the number, <code>static_cast&lt;Status&gt;<\/code> goes back from a number. After <code>:<\/code> you can pick the underlying type, e.g. <code>std::uint8_t<\/code> to save memory.","pl":"Wartości wyliczenia (enumerators) są numerowane od 0, chyba że nadasz im własne. <code>static_cast&lt;int&gt;<\/code> zwraca liczbę, a <code>static_cast&lt;Status&gt;<\/code> zamienia liczbę z powrotem na wyliczenie. Po <code>:<\/code> możesz wybrać typ bazowy (underlying type), np. <code>std::uint8_t<\/code>, żeby oszczędzić pamięć."},"code":"enum class Status { Ok = 200, NotFound = 404, Error = 500 };\nenum class Level : std::uint8_t { Low, Medium, High };  // 0, 1, 2\n\nStatus s = Status::NotFound;\nstd::cout << static_cast<int>(s) << '\\n';\n\nStatus t = static_cast<Status>(500);\nstd::cout << (t == Status::Error) << '\\n';\nstd::cout << static_cast<int>(Level::High) << ' ' << sizeof(Level) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"404\n1\n2 1","error":false,"pitfall":{"en":"<code>static_cast&lt;Status&gt;(123)<\/code> compiles and gives a value that matches no enumerator; nothing checks it. Validate numbers (e.g. user input) before casting them to an enum.","pl":"<code>static_cast&lt;Status&gt;(123)<\/code> się kompiluje i daje wartość, która nie pasuje do żadnej nazwy; nikt tego nie sprawdza. Liczby (np. wpisane przez użytkownika) sprawdzaj przed rzutowaniem na wyliczenie."},"see":[]},{"id":"switch","title":{"en":"switch over an enum","pl":"switch po wyliczeniu"},"explain":{"en":"<code>switch<\/code> is the natural way to handle each enum value. In C++20 <code>using enum Dir;<\/code> inside the function lets you write <code>case North:<\/code> without the prefix.","pl":"<code>switch<\/code> to naturalny sposób, żeby obsłużyć każdą wartość wyliczenia. W C++20 <code>using enum Dir;<\/code> wewnątrz funkcji pozwala pisać <code>case North:<\/code> bez przedrostka."},"code":"enum class Dir { North, East, South, West };\n\nstd::string name(Dir d) {\n    switch (d) {\n        case Dir::North: return \"north\";\n        case Dir::East:  return \"east\";\n        case Dir::South: return \"south\";\n        case Dir::West:  return \"west\";\n    }\n    return \"?\";  // only reached for an invalid value\n}\n\nint main() {\n    for (Dir d : {Dir::North, Dir::West}) {\n        std::cout << name(d) << '\\n';\n    }\n}","lang":"cpp","codeTitle":null,"input":null,"output":"north\nwest","error":false,"pitfall":{"en":"Leave out <code>default:<\/code> when you handle every value: then <code>-Wall<\/code> warns <em>enumeration value 'West' not handled in switch<\/em> as soon as someone adds a new value and forgets this <code>switch<\/code>.","pl":"Pomiń <code>default:<\/code>, gdy obsługujesz wszystkie wartości: wtedy <code>-Wall<\/code> ostrzeże <em>enumeration value 'West' not handled in switch<\/em>, gdy ktoś doda nową wartość i zapomni o tym <code>switch<\/code>."},"see":[{"topic":"conditionals","entry":null}]},{"id":"namespaces","title":{"en":"Namespaces","pl":"Przestrzenie nazw"},"explain":{"en":"A <code>namespace<\/code> groups related names so they don't clash with others; <code>::<\/code> reaches inside. Namespaces can be nested (also written <code>namespace geo::units<\/code>). <code>using geo::pi;<\/code> brings in one name, and <code>namespace gu = geo::units;<\/code> makes a short alias.","pl":"Przestrzeń nazw (namespace) grupuje powiązane nazwy, żeby nie kolidowały z innymi; <code>::<\/code> sięga do jej wnętrza. Przestrzenie można zagnieżdżać (także zapisem <code>namespace geo::units<\/code>). <code>using geo::pi;<\/code> wprowadza jedną nazwę, a <code>namespace gu = geo::units;<\/code> tworzy krótki alias."},"code":"namespace geo {\n    constexpr double pi = 3.14159;\n    double circle_area(double r) { return pi * r * r; }\n\n    namespace units {  // nested: geo::units\n        double cm_to_m(double cm) { return cm / 100; }\n    }\n}\n\nint main() {\n    std::cout << geo::circle_area(2.0) << '\\n';\n    namespace gu = geo::units;\n    std::cout << gu::cm_to_m(250) << '\\n';\n    using geo::pi;\n    std::cout << pi << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"12.5664\n2.5\n3.14159","error":false,"pitfall":{"en":"When a header declares <code>namespace geo { double area(double r); }<\/code>, the <code>.cpp<\/code> must define <code>double geo::area(double r) { ... }<\/code>. Without <code>geo::<\/code> you define a different, global function and get <em>undefined reference to geo::area<\/em>.","pl":"Gdy nagłówek deklaruje <code>namespace geo { double area(double r); }<\/code>, plik <code>.cpp<\/code> musi zdefiniować <code>double geo::area(double r) { ... }<\/code>. Bez <code>geo::<\/code> definiujesz inną, globalną funkcję i dostajesz <em>undefined reference to geo::area<\/em>."},"see":[{"topic":"program","entry":null},{"topic":"headers","entry":null}]},{"id":"type-aliases","title":{"en":"Type aliases with using","pl":"Aliasy typów przez using"},"explain":{"en":"<code>using Name = type;<\/code> gives a long type a short, meaningful name. It is the modern form of <code>typedef<\/code> and also works with templates: <code>template &lt;typename T&gt; using Grid = std::vector&lt;std::vector&lt;T&gt;&gt;;<\/code>.","pl":"<code>using Nazwa = typ;<\/code> nadaje długiemu typowi krótką, znaczącą nazwę, czyli alias typu (type alias). To nowoczesna wersja <code>typedef<\/code>, działa też z szablonami: <code>template &lt;typename T&gt; using Grid = std::vector&lt;std::vector&lt;T&gt;&gt;;<\/code>."},"code":"using Grid = std::vector<std::vector<int>>;\nusing Score = double;\ntypedef unsigned long long Id;  // old style, same effect\n\nGrid g(2, std::vector<int>(3, 0));\nScore s = 4.5;\nId id = 1234567890123;\nstd::cout << g.size() << 'x' << g[0].size() << ' ' << s << ' ' << id << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"2x3 4.5 1234567890123","error":false,"pitfall":{"en":"An alias is not a new type: with <code>using Meters = double;<\/code> and <code>using Seconds = double;<\/code> you can pass seconds where meters are expected and the compiler won't notice. For real type safety wrap the value in a <code>struct<\/code>.","pl":"Alias to nie nowy typ: przy <code>using Meters = double;<\/code> i <code>using Seconds = double;<\/code> możesz przekazać sekundy tam, gdzie oczekiwane są metry, i kompilator tego nie zauważy. Prawdziwe bezpieczeństwo typów daje opakowanie wartości w <code>struct<\/code>."},"see":[{"topic":"templates","entry":null}]}]},{"id":"random","glyph":"rand","name":{"en":"Random numbers","pl":"Liczby losowe"},"summary":{"en":"Random numbers with &lt;random&gt;: std::mt19937 and std::random_device, uniform and normal distributions, fixed seeds, std::shuffle, and why not rand().","pl":"Liczby losowe z &lt;random&gt;: std::mt19937 i std::random_device, rozkłady jednostajne i normalny, stałe ziarno, std::shuffle i dlaczego nie rand()."},"headers":["<random>","<algorithm>"],"planned":false,"entries":[{"id":"dice","title":{"en":"Random integers (dice roll)","pl":"Losowe liczby całkowite (kostka)"},"explain":{"en":"Three steps: <code>std::random_device<\/code> gives a truly random seed, <code>std::mt19937<\/code> is a fast generator seeded with it, and <code>std::uniform_int_distribution<\/code> turns its output into numbers from a range. Both ends of <code>(1, 6)<\/code> are included. Output differs on every run, e.g.:","pl":"Trzy kroki: <code>std::random_device<\/code> daje naprawdę losowe ziarno (seed), <code>std::mt19937<\/code> to szybki generator liczb pseudolosowych (pseudo-random number generator) zasiany tym ziarnem, a <code>std::uniform_int_distribution<\/code> zamienia jego wynik na liczby z przedziału. Oba końce <code>(1, 6)<\/code> są włączone. Wynik jest inny przy każdym uruchomieniu, np.:"},"code":"std::random_device rd;\nstd::mt19937 gen(rd());                         // seed once\nstd::uniform_int_distribution<int> dice(1, 6);  // 1..6, both included\n\nfor (int i = 0; i < 10; ++i) {\n    std::cout << dice(gen) << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"3 6 1 1 4 2 6 5 3 3","error":false,"pitfall":{"en":"Create and seed the generator <strong>once<\/strong>, then reuse it. A new <code>std::mt19937<\/code> for every number is slow, and seeding it with the time (<code>std::time(nullptr)<\/code>) each time gives the same number for a whole second.","pl":"Utwórz i zasiej generator <strong>raz<\/strong>, a potem go używaj. Nowy <code>std::mt19937<\/code> dla każdej liczby jest wolny, a zasiewanie go za każdym razem czasem (<code>std::time(nullptr)<\/code>) daje tę samą liczbę przez całą sekundę."},"see":[]},{"id":"fixed-seed","title":{"en":"Fixed seed: repeatable results","pl":"Stałe ziarno: powtarzalne wyniki"},"explain":{"en":"With a fixed seed the generator produces the same sequence on every run, which makes bugs and tests repeatable. <code>gen()<\/code> alone gives a raw number from 0 to 4294967295, identical on every compiler; <code>seed()<\/code> restarts the sequence.","pl":"Ze stałym ziarnem generator daje ten sam ciąg przy każdym uruchomieniu, dzięki czemu błędy i testy da się powtórzyć. Samo <code>gen()<\/code> zwraca surową liczbę od 0 do 4294967295, taką samą w każdym kompilatorze; <code>seed()<\/code> zaczyna ciąg od nowa."},"code":"std::mt19937 gen(42);  // fixed seed\nfor (int i = 0; i < 3; ++i) std::cout << gen() << ' ';\nstd::cout << '\\n';\n\ngen.seed(42);          // same seed: same sequence again\nfor (int i = 0; i < 3; ++i) std::cout << gen() << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1608637542 3421126067 4083286876\n1608637542 3421126067 4083286876","error":false,"pitfall":{"en":"Don't turn raw numbers into a range with <code>gen() % 6 + 1<\/code>: it's easy to get the bounds wrong and it is slightly biased. Use a distribution. Note that distributions may give different numbers with different compilers even for the same seed.","pl":"Nie zamieniaj surowych liczb na przedział przez <code>gen() % 6 + 1<\/code>: łatwo pomylić granice, a wynik jest lekko nierówny. Używaj rozkładu (distribution). Pamiętaj, że rozkłady mogą dawać inne liczby w różnych kompilatorach nawet przy tym samym ziarnie."},"see":[]},{"id":"real-normal","title":{"en":"Real and normal distributions","pl":"Rozkład rzeczywisty i normalny"},"explain":{"en":"<code>std::uniform_real_distribution&lt;double&gt;(a, b)<\/code> gives any real number in <code>[a, b)<\/code>. <code>std::normal_distribution&lt;double&gt;(mean, stddev)<\/code> gives bell-curve values: most land near the mean. Output from g++, e.g.:","pl":"<code>std::uniform_real_distribution&lt;double&gt;(a, b)<\/code> daje dowolną liczbę rzeczywistą z przedziału <code>[a, b)<\/code>. <code>std::normal_distribution&lt;double&gt;(mean, stddev)<\/code> daje wartości z rozkładu normalnego (normal distribution, krzywa dzwonowa): większość wypada blisko średniej. Wynik z g++, np.:"},"code":"std::mt19937 gen(42);\nstd::uniform_real_distribution<double> unit(0.0, 1.0);  // [0, 1)\nstd::normal_distribution<double> height(175.0, 10.0);   // mean 175, std dev 10\n\nstd::cout << std::fixed << std::setprecision(2);\nfor (int i = 0; i < 3; ++i) {\n    std::cout << unit(gen) << \"  \" << height(gen) << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"0.80  180.44\n0.60  168.85\n0.45  174.05","error":false,"pitfall":null,"see":[{"topic":"io","entry":null}]},{"id":"helper","title":{"en":"A random_int helper","pl":"Funkcja random_int"},"explain":{"en":"A handy function for the whole program: the <code>static<\/code> generator is created and seeded only on the first call and then reused. Creating a distribution is cheap, so a new one per call is fine. Output differs on every run, e.g.:","pl":"Wygodna funkcja na cały program: generator <code>static<\/code> jest tworzony i zasiewany tylko przy pierwszym wywołaniu, a potem używany ponownie. Utworzenie rozkładu jest tanie, więc nowy przy każdym wywołaniu nie szkodzi. Wynik jest inny przy każdym uruchomieniu, np.:"},"code":"int random_int(int lo, int hi) {\n    static std::mt19937 gen(std::random_device{}());\n    std::uniform_int_distribution<int> dist(lo, hi);\n    return dist(gen);\n}\n\nint main() {\n    std::cout << random_int(1, 100) << ' ' << random_int(1, 100) << '\\n';\n    std::cout << (random_int(0, 1) == 0 ? \"heads\" : \"tails\") << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"57 12\ntails","error":false,"pitfall":null,"see":[{"topic":"functions","entry":null}]},{"id":"shuffle","title":{"en":"Shuffling with std::shuffle","pl":"Tasowanie przez std::shuffle"},"explain":{"en":"<code>std::shuffle(begin, end, gen)<\/code> puts the elements in random order, like shuffling a deck of cards. Pass your generator; with a fixed seed the order is repeatable. Output from g++, e.g.:","pl":"<code>std::shuffle(begin, end, gen)<\/code> ustawia elementy w losowej kolejności, jak tasowanie (shuffle) talii kart. Przekaż swój generator; przy stałym ziarnie kolejność jest powtarzalna. Wynik z g++, np.:"},"code":"std::vector<int> cards = {1, 2, 3, 4, 5, 6, 7, 8};\nstd::mt19937 gen(42);\nstd::shuffle(cards.begin(), cards.end(), gen);\nfor (int c : cards) std::cout << c << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"2 7 8 1 6 5 4 3","error":false,"pitfall":{"en":"<code>std::random_shuffle<\/code> was removed in C++17, so old tutorials using it no longer compile. Use <code>std::shuffle<\/code> with a generator.","pl":"<code>std::random_shuffle<\/code> usunięto w C++17, więc stare poradniki, które go używają, już się nie kompilują. Używaj <code>std::shuffle<\/code> z generatorem."},"see":[{"topic":"vector","entry":null},{"topic":"sorting","entry":null}]},{"id":"why-not-rand","title":{"en":"Why not rand()","pl":"Dlaczego nie rand()"},"explain":{"en":"<code>std::rand()<\/code> from C still works, but its quality is unspecified, <code>RAND_MAX<\/code> can be as small as 32767 (it is on Windows), and <code>% n<\/code> is biased. Recognise it in old code; write new code with <code>&lt;random&gt;<\/code>. Output differs on every run, e.g.:","pl":"<code>std::rand()<\/code> z języka C wciąż działa, ale jego jakość nie jest określona, <code>RAND_MAX<\/code> może wynosić zaledwie 32767 (tak jest na Windowsie), a <code>% n<\/code> daje nierówny rozkład. Rozpoznawaj go w starym kodzie; nowy pisz z <code>&lt;random&gt;<\/code>. Wynik jest inny przy każdym uruchomieniu, np.:"},"code":"#include <cstdlib>\n#include <ctime>\n#include <iostream>\n\nint main() {\n    std::srand(std::time(nullptr));  // old C style: seed with the clock\n    for (int i = 0; i < 5; ++i) {\n        std::cout << std::rand() % 6 + 1 << ' ';  // 1..6, slightly biased\n    }\n    std::cout << \"\\nRAND_MAX = \" << RAND_MAX << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"4 1 6 2 2\nRAND_MAX = 32767","error":false,"pitfall":{"en":"<code>srand(time(0))<\/code> inside a loop (or a function called in a loop) reseeds with the same second every time, so you get the same \"random\" number over and over. Seed once, at the start of <code>main<\/code>.","pl":"<code>srand(time(0))<\/code> wewnątrz pętli (albo funkcji wywoływanej w pętli) zasiewa generator tą samą sekundą za każdym razem, więc dostajesz w kółko tę samą „losową” liczbę. Zasiej raz, na początku <code>main<\/code>."},"see":[]}]}]}]};
</script>
<script>
// C++ cheat sheet: renders the map, the trail and the topic pages from window.CHEATSHEET
// (written by tools/build.py), and runs routing (#topic, #topic/entry), search, toggles and copy buttons.
(() => {
  "use strict";

  const DATA = window.CHEATSHEET;
  const root = document.documentElement;
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
  const lang = () => (root.lang === "en" ? "en" : "pl");
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const SHORTCUT = isMac ? "⌘ K" : "Ctrl K";
  const STORE = { arrangement: "cppsheet.arrangement", language: "cppsheet.language" };

  const UI = {
    title: { en: "C++ Cheat Sheet", pl: "Ściągawka z C++" },
    map: { en: "Map", pl: "Mapa" },
    trail: { en: "Trail", pl: "Szlak" },
    here: { en: "you are here", pl: "jesteś tu" },
    output: { en: "Output", pl: "Wynik" },
    input: { en: "Input", pl: "Wejście" },
    compileError: { en: "Compiler error", pl: "Błąd kompilacji" },
    copy: { en: "Copy", pl: "Kopiuj" },
    copied: { en: "Copied!", pl: "Skopiowano!" },
    watchOut: { en: "Watch out!", pl: "Uwaga!" },
    pitfall: { en: "Pitfall", pl: "Pułapka" },
    seeAlso: { en: "See also", pl: "Zobacz też" },
    nextStop: { en: "Next stop", pl: "Następny przystanek" },
    prevStop: { en: "Previous stop", pl: "Poprzedni przystanek" },
    startHere: { en: "Start here", pl: "Zacznij tutaj" },
    bubble: { en: "bubble", pl: "bąbelek" },
    stone: { en: "stone", pl: "kamień" },
    soon: { en: "coming soon", pl: "wkrótce" },
  };
  const LABELS = {
    arrangement: { en: "Overview style", pl: "Styl przeglądu" },
    language: { en: "Language", pl: "Język" },
    index: { en: "Index", pl: "Spis treści" },
    entries: { en: "Entries", pl: "Hasła" },
    topicOrder: { en: "Topic order", pl: "Kolejność tematów" },
    pitfall: { en: "Pitfall", pl: "Pułapka" },
    search: { en: "Search", pl: "Szukaj" },
    searchPlaceholder: { en: "Search topics, entries and code", pl: "Szukaj tematów, haseł i kodu" },
    results: { en: "Results", pl: "Wyniki" },
    lands: { en: "Areas", pl: "Obszary" },
  };

  // ---------- helpers ----------
  const ENTITIES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ENTITIES[c]);
  /** Both languages of a {en, pl} pair of HTML strings; CSS shows the current one. */
  const L = (o) => `<span data-lang="en">${o.en}</span><span data-lang="pl">${o.pl}</span>`;
  const plain = (html) =>
    html.replace(/<[^>]*>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l");
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const kbd = (k) => `<kbd>${esc(k)}</kbd>`;
  function plPlural(n, one, few, many) {
    if (n === 1) return one;
    const d = n % 10, h = n % 100;
    return d >= 2 && d <= 4 && (h < 12 || h > 14) ? few : many;
  }

  // ---------- data ----------
  const topics = [];
  const topicById = new Map();
  for (const area of DATA.areas) {
    area.topics.forEach((t, i) => {
      t.area = area;
      t.step = i + 1;
      topics.push(t);
      topicById.set(t.id, t);
    });
  }
  const live = topics.filter((t) => !t.planned);

  // ---------- syntax highlighting ----------
