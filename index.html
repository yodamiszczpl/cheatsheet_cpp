<!DOCTYPE html>
<html lang="pl" data-arrangement="map">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Ściągawka z C++ / C++ cheat sheet: krótkie hasła z przykładami kodu i ich wynikiem.">
<title>Ściągawka z C++</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='44' rx='14' fill='%23233041' transform='rotate(-6 32 32)'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='700' font-size='25' text-anchor='middle' fill='%23e9f2f7' transform='rotate(-6 32 32)'%3EC++%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap">
<script>
  // The remembered Map | Trail choice and language (?lang= wins), applied before the first paint.
  (function () {
    var root = document.documentElement;
    var titles = { en: "C++ Cheat Sheet", pl: "Ściągawka z C++" };
    var lang = new URLSearchParams(location.search).get("lang");
    try {
      if (localStorage.getItem("cppsheet.arrangement") === "trail") root.dataset.arrangement = "trail";
      if (!titles.hasOwnProperty(lang)) lang = localStorage.getItem("cppsheet.language");
    } catch (e) {}
    if (!titles.hasOwnProperty(lang)) lang = "pl";
    root.lang = lang;
    document.title = titles[lang];
  })();
</script>
<style>
/* C++ cheat sheet. Light and dark follow the system; data-theme="light|dark" on <html> forces one. */
:root {
  color-scheme: light;
  --sea: #e9f2f7;
  --sea-2: #d8e8f1;
  --wave: #c9dde9;
  --card: #fff;
  --ink: #233041;
  --ink-2: #475569;
  --ink-3: #586779;
  --line: #e4e9f0;
  --code-bg: #f4f6fb;
  --err: #b71c1c;
  --shadow: 0 10px 30px #2330411a;
  --isl-s: 55%;
  --isl-l: 86%;
  --deep-l: 25%;
  --focus: #1791cf;
  --sticker: #ffd43b;
  --pitfall-tint: 22%;
  --pitfall-output-tint: 30%;
  --tk-kw: #c2185b;
  --tk-str: #2e7d32;
  --tk-num: #bf360c;
  --tk-com: #586779;
  --tk-fn: #1565c0;
  --tk-bi: #6a1b9a;
  --tk-op: #475569;
  --tk-pp: #00838f;
  --font-round: "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --sea: #121a2b; --sea-2: #0e1523; --wave: #1c2740; --card: #1a2336;
    --ink: #e8eef7; --ink-2: #c8d3e0; --ink-3: #8d9db3; --line: #263149; --code-bg: #121a2b;
    --err: #ffaaa3; --shadow: 0 10px 30px #00000059;
    --isl-s: 38%; --isl-l: 26%; --deep-l: 80%; --focus: #55c1f6; --sticker: #f2c94c;
    --pitfall-tint: 16%; --pitfall-output-tint: 22%;
    --tk-kw: #ff79c6; --tk-str: #8be28b; --tk-num: #ffb86c; --tk-com: #8d9db3;
    --tk-fn: #82aaff; --tk-bi: #c3a6ff; --tk-op: #c8d3e0; --tk-pp: #7fdbca;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --sea: #121a2b; --sea-2: #0e1523; --wave: #1c2740; --card: #1a2336;
  --ink: #e8eef7; --ink-2: #c8d3e0; --ink-3: #8d9db3; --line: #263149; --code-bg: #121a2b;
  --err: #ffaaa3; --shadow: 0 10px 30px #00000059;
  --isl-s: 38%; --isl-l: 26%; --deep-l: 80%; --focus: #55c1f6; --sticker: #f2c94c;
  --pitfall-tint: 16%; --pitfall-output-tint: 22%;
  --tk-kw: #ff79c6; --tk-str: #8be28b; --tk-num: #ffb86c; --tk-com: #8d9db3;
  --tk-fn: #82aaff; --tk-bi: #c3a6ff; --tk-op: #c8d3e0; --tk-pp: #7fdbca;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden],
:root:not([data-arrangement="trail"]) [data-arrangement="trail"],
:root[data-arrangement="trail"] [data-arrangement="map"],
:root:not([lang="pl"]) [data-lang="pl"],
:root[lang="pl"] [data-lang="en"] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(1200px 700px at 30% 20%, var(--sea), var(--sea-2)) fixed;
  background-color: var(--sea-2);
  color: var(--ink);
  font: 16.5px/1.6 var(--font-body);
}
/* In the phone app the page runs under the status bar: paint that band, and keep sticky bars below it. */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--sea);
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}
code, pre { font-family: var(--font-mono); }
/* No ligatures: in C++ "->", "!=" and "<=" must look like what you type. */
/* !important because the `font` shorthand on these elements would reset it. */
code, pre, .glyph, .hero-glyph, .match { font-variant-ligatures: none !important; font-feature-settings: "calt" 0, "liga" 0 !important; }
kbd {
  white-space: nowrap;
  font: 600 .75em var(--font-body);
  background: var(--card);
  box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line);
  color: var(--ink-2);
  border-radius: 6px;
  padding: 2px 6px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
.stage { overflow: clip; }
.footer { text-align: center; color: var(--ink-2); padding: 24px 16px 32px; font-size: 14px; }
.footer p { margin: 0; }

/* ---------- top bar ---------- */
.top-bar {
  display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center;
  gap: 10px 16px; padding: 16px clamp(16px, 3vw, 32px);
}
.logo {
  display: flex; align-items: center; gap: 8px; margin: 0 auto 0 0;
  font: 700 22px var(--font-round); color: var(--ink); text-decoration: none;
}
.badge {
  display: inline-block; background: var(--ink); color: var(--sea);
  border-radius: 12px; padding: 0 9px; font-size: 18px; transform: rotate(-6deg);
}
.search-pill .prompt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-pill {
  flex: 1 1 0; min-width: 0; max-width: 460px; display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 12px 18px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--card); box-shadow: var(--shadow); color: var(--ink-3);
  font: 600 15px var(--font-body); text-align: left;
}
.search-pill:hover { color: var(--ink-2); }
.search-pill .icon { color: var(--ink-2); font-size: 20px; line-height: 1; }
.search-pill kbd { margin-left: auto; }
.switches { flex: none; display: flex; gap: 8px; }
.toggle { flex: none; display: flex; padding: 4px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); }
.toggle label { position: relative; }
.toggle input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.toggle label > span { display: block; padding: 6px 16px; border-radius: 999px; color: var(--ink-3); font: 700 14px var(--font-round); }
.toggle label:hover > span { color: var(--ink); }
.toggle input:checked + span { background: var(--ink); color: var(--card); }
.toggle input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (width <= 640px) {
  .search-pill { flex: none; padding: 10px 14px; }
  .site-title, .search-pill .prompt {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  .search-pill kbd { display: none; }
  .toggle label > span { padding: 6px 12px; }
}

/* ---------- overview: shared ---------- */
.overview {
  background-image: radial-gradient(circle at 1px 1px, var(--wave) 1.5px, transparent 0);
  background-size: 26px 26px;
}
.hint { text-align: center; color: var(--ink-2); margin: 0 0 24px; padding: 0 16px; font-size: 14px; }

/* ---------- overview: map ---------- */
.map { --u: min(1px, (100vw - 48px) / var(--widest)); }
.sea {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 72px 64px; max-width: 1400px; margin: 0 auto; padding: 48px 16px 32px;
}
.island {
  --land: hsl(var(--hue) var(--isl-s) var(--isl-l));
  position: relative; flex: none;
  width: calc(var(--size) * var(--u)); height: calc(var(--size) * var(--u));
  border-radius: var(--blob); background: var(--land);
  box-shadow:
    0 0 0 calc(10 * var(--u)) hsl(var(--hue) var(--isl-s) var(--isl-l) / .35),
    0 0 0 calc(22 * var(--u)) hsl(var(--hue) var(--isl-s) var(--isl-l) / .14),
    0 24px 40px #1428461f;
  transform: translateY(calc(var(--drift) * var(--u))) rotate(var(--tilt));
}
.island .flag {
  position: absolute; z-index: 1; top: -18px; left: 50%; transform: translate(-50%);
  margin: 0; white-space: nowrap; text-align: center; font-weight: 400; line-height: 1.3;
}
.island .flag > span {
  display: inline-block; padding: 3px 14px 4px; border-radius: 999px;
  font: 700 21px var(--font-round); color: hsl(var(--hue) 55% var(--deep-l));
  background: var(--card); box-shadow: 0 3px 0 hsl(var(--hue) 40% 50% / .35);
}
.island .bubbles { margin: 0; padding: 0; list-style: none; }
.island .slot { position: absolute; left: calc(50% + var(--x) * var(--u)); top: calc(50% + var(--y) * var(--u)); }
.bubble {
  position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
  width: calc(var(--bubble) * var(--u)); height: calc(var(--bubble) * var(--u));
  translate: -50% calc(-50% + var(--bob) * var(--u));
  border-radius: 50%; background: var(--card); color: var(--ink); text-align: center; text-decoration: none;
  box-shadow: 0 6px 0 hsl(var(--hue) 40% 45% / .35), 0 14px 24px #1428461f;
  transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .2s;
}
a.bubble:hover, a.bubble:focus-visible {
  transform: translateY(-6px) scale(1.08);
  box-shadow: 0 10px 0 hsl(var(--hue) 40% 45% / .35), 0 22px 30px #1428462e;
}
.bubble .glyph {
  font: 700 max(13px, calc(24 * var(--u))) var(--font-mono); letter-spacing: -.04em;
  color: hsl(var(--hue) 60% var(--deep-l)); white-space: nowrap;
}
.bubble .name { max-width: 88%; font: 700 max(10px, calc(14 * var(--u)))/1.15 var(--font-round); }
.bubble.planned {
  --bubble: 78; background: none; box-shadow: none; color: var(--ink-2);
  border: 2px dashed hsl(var(--hue) 25% 60% / .6);
}
.bubble.planned .glyph { font-size: max(10px, calc(16 * var(--u))); color: inherit; }
.bubble.planned .name { font-size: max(9px, calc(11 * var(--u))); }
.was-here { outline: 3px solid var(--focus); outline-offset: 3px; }

/* ---------- overview: trail ---------- */
.trail { max-width: 780px; margin: 0 auto; padding: 24px 16px 140px; }
.trail .start { margin: 0; text-align: center; font: 700 22px var(--font-round); }
.trail .arrow { display: block; color: var(--ink-3); font-size: 26px; animation: bob 1.6s ease-in-out infinite; }
.trail .start small { display: block; font: 600 14px var(--font-body); color: var(--ink-2); }
@keyframes bob { 50% { transform: translateY(5px); } }
.land {
  margin-top: 36px; padding: 26px 0 10px; border-radius: 48px; scroll-margin-top: 24px;
  background: linear-gradient(hsl(var(--hue) var(--isl-s) var(--isl-l) / .75), hsl(var(--hue) var(--isl-s) var(--isl-l) / .35));
}
.land .sign { text-align: center; padding: 0 16px; }
.land .sign h2 {
  display: inline-block; margin: 0; padding: 4px 22px 6px; border-radius: 999px;
  background: var(--card); box-shadow: 0 4px 0 hsl(var(--hue) 40% 50% / .35);
  font: 700 26px var(--font-round); color: hsl(var(--hue) 55% var(--deep-l));
}
.land .sign p { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; font-weight: 600; }
.land .path { position: relative; margin: 0 4%; }
.land .path svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.land .path path {
  fill: none; stroke: hsl(var(--hue) 45% 55% / .55); stroke-width: 5px;
  stroke-dasharray: 2 14; stroke-linecap: round; vector-effect: non-scaling-stroke;
}
.stones { margin: 0; padding: 0; list-style: none; }
.stones li { position: absolute; left: var(--x); top: var(--y); }
.stone {
  position: absolute; display: grid; place-items: center; width: 104px; height: 104px; translate: -50% -50%;
  border-radius: 50%; background: var(--card); color: var(--ink); text-decoration: none;
  box-shadow: 0 7px 0 hsl(var(--hue) 40% 45% / .4), 0 16px 26px #14284624;
  transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
}
a.stone:hover, a.stone:focus-visible { transform: translateY(-4px) scale(1.08); }
.stone .number {
  position: absolute; top: -4px; left: -4px; display: grid; place-items: center; width: 28px; height: 28px;
  border-radius: 50%; background: hsl(var(--hue) 55% var(--deep-l)); color: var(--card); font: 700 13px var(--font-round);
}
.stone .glyph { font: 700 26px var(--font-mono); letter-spacing: -.04em; color: hsl(var(--hue) 60% var(--deep-l)); white-space: nowrap; }
.stone .label {
  position: absolute; top: 50%; left: calc(100% + 16px); translate: 0 -50%; width: 250px;
  font: 600 13px/1.35 var(--font-body); color: var(--ink-2);
}
.stone .label b { display: block; font: 700 18px var(--font-round); color: var(--ink); }
.stone .label .summary { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
.stones .left .label { left: auto; right: calc(100% + 16px); text-align: right; }
.stone.planned { width: 74px; height: 74px; background: none; box-shadow: none; border: 2px dashed hsl(var(--hue) 25% 60% / .6); }
.stone.planned .glyph { color: var(--ink-2); font-size: 16px; }
.stone.planned .label { width: auto; white-space: nowrap; }
.stone.planned .label b { color: var(--ink-2); font-size: 14px; }
@media (width <= 600px) {
  .stone { width: 84px; height: 84px; }
  .stone .glyph { font-size: 21px; }
  .stone .label { width: 110px; }
  .stone .label b { font-size: 15px; }
  .stone .label .summary { display: none; }
}
.lands { position: fixed; z-index: 3; top: 50%; left: calc(16px + env(safe-area-inset-left, 0px)); transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
.dot {
  display: flex; align-items: center; gap: 10px; padding: 4px; border: 0; background: none; cursor: pointer;
  color: var(--ink-3); font: 700 13px var(--font-round); text-align: left;
}
.dot i {
  flex: none; width: 14px; height: 14px; border-radius: 50%;
  background: hsl(var(--hue) 50% 62%); box-shadow: 0 0 0 4px hsl(var(--hue) 50% 62% / .2); transition: transform .2s;
}
.dot > span { white-space: nowrap; opacity: 0; transform: translate(-6px); transition: opacity .2s, transform .2s; }
.lands:hover .dot > span, .dot:focus-visible > span, .dot[aria-current] > span { opacity: 1; transform: none; }
.dot[aria-current] { color: var(--ink); }
.dot[aria-current] i { transform: scale(1.35); }
@media (width <= 860px) { .lands { display: none; } }

/* ---------- search ---------- */
.search {
  width: min(600px, 100vw - 32px); margin: 10vh auto auto; padding: 0; border: 0; border-radius: 28px;
  background: var(--card); color: var(--ink); box-shadow: 0 30px 80px #0000004d;
}
.search::backdrop { background: #141e3259; backdrop-filter: blur(4px); }
.query {
  display: block; width: 100%; padding: 22px 26px; border: 0; border-bottom: 2px solid var(--line);
  background: none; color: var(--ink); font: 700 20px var(--font-round);
}
.query:focus-visible { outline: none; border-bottom-color: var(--focus); }
.query::placeholder { color: var(--ink-3); }
.query::-webkit-search-cancel-button { appearance: none; }
.results { max-height: 50vh; margin: 0; padding: 8px; list-style: none; overflow-y: auto; }
.results [role="option"] {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px;
  padding: 10px 16px; border-radius: 16px; cursor: pointer;
}
.results [aria-selected="true"] { background: var(--code-bg); box-shadow: inset 0 0 0 2px var(--focus); }
.results .title { font: 700 16px var(--font-round); }
.results .title code { font-size: .9em; }
.results .where { font: 600 12.5px var(--font-body); color: var(--ink-3); }
.results .match {
  flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 12.5px var(--font-mono); color: var(--ink-2);
}
.results .match mark, .results .title mark { background: color-mix(in srgb, var(--sticker) 45%, transparent); color: inherit; border-radius: 3px; }
.search .status:empty { display: none; }
.search .status { margin: 0; padding: 16px 26px 4px; color: var(--ink-3); }
.search .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; padding: 10px 24px 14px; color: var(--ink-3); font-size: 12.5px; }
.search .keys kbd + kbd { margin-left: 3px; }
@media (hover: none) { .search .keys { display: none; } }

/* ---------- topic view ---------- */
.topic-view {
  --strip: 56px;
  display: grid; grid-template-columns: 260px minmax(0, 1fr); align-items: start; gap: 8px;
  padding-left: clamp(8px, 2vw, 24px);
}
@media (width <= 860px) { .topic-view { --sticky-top: var(--strip); display: block; padding-left: 0; } }

/* rail (index on the left) */
.rail {
  position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); overflow-y: auto;
  padding: 14px 12px 48px 10px; scrollbar-width: thin;
}
.rail ul, .rail ol { margin: 0; padding: 0; list-style: none; }
.rail .arrangement { display: flex; flex-direction: column; gap: 22px; }
.rail .area { margin: 0 0 8px 4px; font: 700 15px var(--font-round); color: hsl(var(--hue) 55% var(--deep-l)); }
.rail .here {
  display: none; white-space: nowrap; font: 800 9.5px var(--font-body); text-transform: uppercase; letter-spacing: .08em;
}
.rail [aria-current="page"] .here { display: inline; }
.rail .entries {
  display: none; flex-direction: column; gap: 1px; margin: 4px 0 8px 14px; padding: 0 0 0 10px;
  border-left: 2px solid hsl(var(--hue) 45% 55% / .5);
}
.rail li:has(> [aria-current="page"]) > .entries { display: flex; }
.rail .entries a {
  display: block; padding: 3px 8px; border-radius: 8px; text-decoration: none;
  color: var(--ink-2); font: 600 13px/1.35 var(--font-body);
}
.rail .entries a:hover, .rail .entries a[aria-current] { background: var(--card); color: var(--ink); }
.rail .entries a[aria-current] { box-shadow: inset 3px 0 0 hsl(var(--hue) 55% var(--deep-l)); }
.mini {
  padding: 12px 14px 14px; border-radius: var(--blob);
  background: hsl(var(--hue) var(--isl-s) var(--isl-l)); box-shadow: 0 0 0 6px hsl(var(--hue) var(--isl-s) var(--isl-l) / .3);
}
.rail .pins { display: flex; flex-wrap: wrap; gap: 6px; }
.rail .pins > li:has(> [aria-current="page"]) { flex-basis: 100%; }
.pin {
  display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; max-width: 100%;
  padding: 4px 11px 4px 5px; border-radius: 16px; text-decoration: none;
  background: var(--card); box-shadow: 0 2px 0 hsl(var(--hue) 40% 45% / .3);
  font: 700 13px var(--font-body); color: var(--ink); transition: transform .15s;
}
.pin:hover { transform: translateY(-1px); }
.pin .glyph {
  padding: 1px 6px; border-radius: 999px; white-space: nowrap;
  background: hsl(var(--hue) var(--isl-s) var(--isl-l)); color: hsl(var(--hue) 60% var(--deep-l)); font: 700 11px var(--font-mono);
}
.pin[aria-current="page"] { background: hsl(var(--hue) 55% var(--deep-l)); color: var(--card); }
.pin[aria-current="page"] .glyph { background: var(--card); }
.pins .planned { padding: 3px 10px; border: 1.5px dashed var(--line); border-radius: 999px; color: var(--ink-2); font: 600 12px var(--font-body); }
.mini-trail .area { display: flex; align-items: center; gap: 8px; margin-left: 0; }
.mini-trail .area::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: hsl(var(--hue) 50% 62%); }
.rail .steps { margin-left: 5px; padding-left: 14px; border-left: 3px dotted hsl(var(--hue) 45% 55% / .5); }
.rail .steps > li { margin: 3px 0; }
.step {
  display: flex; align-items: center; gap: 8px; margin-left: -27px; padding: 3px 10px 3px 3px; border-radius: 999px;
  font: 700 14px var(--font-body); color: var(--ink); text-decoration: none; transition: background .15s;
}
.step:hover { background: hsl(var(--hue) var(--isl-s) var(--isl-l)); }
.step .number {
  flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--card); color: hsl(var(--hue) 55% var(--deep-l)); font: 700 11.5px var(--font-round);
  box-shadow: 0 0 0 3px var(--sea), 0 2px 0 3px hsl(var(--hue) 40% 45% / .25);
}
.step[aria-current="page"] { background: hsl(var(--hue) 55% var(--deep-l)); color: var(--card); }
.step .here { margin-left: auto; }
.steps .planned { display: flex; align-items: center; gap: 8px; margin-left: -24px; color: var(--ink-3); font: 600 13px var(--font-body); }
.steps .planned i { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px dashed var(--line); background: var(--sea); }
@media (width <= 860px) {
  .rail {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; height: var(--strip); max-height: none; padding: 8px 16px;
    overflow: auto hidden; scrollbar-width: none; background: linear-gradient(var(--sea) 80%, transparent);
  }
  .rail .arrangement { flex-direction: row; align-items: center; gap: 12px; width: max-content; }
  .mini .area, .rail .planned, .rail .entries, .rail li:has(> [aria-current="page"]) > .entries { display: none !important; }
  .mini-trail { display: flex; align-items: center; gap: 6px; }
  .mini-trail .area { margin: 0; font-size: 0; }
  .mini { padding: 6px 8px; }
  .rail .pins, .pin { flex-wrap: nowrap; }
  .pin { white-space: nowrap; max-width: none; }
  .rail .pins > li:has(> [aria-current="page"]) { flex-basis: auto; }
  .rail .steps { display: flex; gap: 6px; margin: 0; padding: 0; border: 0; }
  .rail .steps > li { margin: 0; }
  .step { margin: 0; white-space: nowrap; background: var(--card); }
  .step .here { margin-left: 0; }
}

/* topic page */
.topic { max-width: 1180px; margin: 0 auto; padding: 8px clamp(16px, 3vw, 32px) 64px; }
.topic:focus { outline: none; }
.topic:focus-visible .hero { outline: 3px solid var(--focus); outline-offset: 3px; }
.hero {
  position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px;
  padding: 26px 30px; border-radius: 32px; background: hsl(var(--hue) var(--isl-s) var(--isl-l));
}
.hero .home {
  position: absolute; top: 14px; right: 16px; padding: 6px 14px; border-radius: 999px; text-decoration: none;
  background: var(--card); box-shadow: 0 3px 0 hsl(var(--hue) 40% 45% / .35); font: 700 14px var(--font-round);
}
.hero-glyph {
  flex: none; display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%;
  background: var(--card); box-shadow: 0 6px 0 hsl(var(--hue) 40% 45% / .35);
  font: 700 28px var(--font-mono); letter-spacing: -.04em; color: hsl(var(--hue) 60% var(--deep-l)); white-space: nowrap;
}
.hero-text { flex: 240px; min-width: 0; }
.area-name {
  margin: 0 112px 10px 0; font: 800 12px var(--font-body); text-transform: uppercase; letter-spacing: .12em;
  color: hsl(var(--hue) 50% var(--deep-l));
}
.hero h1 { margin: 2px 0 6px; font: 700 clamp(36px, 6vw, 60px)/1 var(--font-round); overflow-wrap: anywhere; }
.hero .summary { margin: 0; color: var(--ink-2); font-weight: 600; }
.includes { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
.includes code {
  display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--card);
  font: 600 13px var(--font-mono); color: hsl(var(--hue) 60% var(--deep-l));
}
.includes code .pp { color: var(--tk-pp); }
.chips {
  position: sticky; top: calc(var(--sticky-top, 0px) + env(safe-area-inset-top, 0px)); z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0;
  background: linear-gradient(var(--sea) 70%, transparent);
}
.chips a {
  flex: none; padding: 6px 14px; border-radius: 999px; text-decoration: none;
  background: var(--card); box-shadow: var(--shadow); font: 700 13.5px var(--font-body);
}
.chips a:hover { background: hsl(var(--hue) var(--isl-s) var(--isl-l)); }
.chips code, .entry h2 code, .stop code { font-size: .9em; }
.cards { columns: 2 452px; column-gap: 20px; orphans: 1; widows: 1; }

/* entry card */
.entry {
  position: relative; display: inline-block; width: 100%; margin: 14px 0 6px; padding: 22px 24px 20px;
  vertical-align: top; break-inside: avoid; border-radius: 24px; background: var(--card); box-shadow: var(--shadow);
  scroll-margin-top: calc(var(--sticky-top, 0px) + 76px);
}
.entry:focus:not(:focus-visible) { outline: none; }
.entry h2 { margin: 0 0 6px; font: 700 22px/1.2 var(--font-round); color: hsl(var(--hue) 55% var(--deep-l)); }
.entry .explain { margin: 0 0 14px; color: var(--ink-2); }
.entry p code, .entry .pitfall code { padding: 1px 6px; border-radius: 6px; background: var(--code-bg); font-size: .86em; }
.sticker {
  position: absolute; top: -12px; right: 18px; padding: 4px 12px; border-radius: 10px; transform: rotate(4deg);
  background: var(--sticker); color: #3d2e00; font: 700 13px var(--font-round); box-shadow: 0 3px #0000001f;
}
.entry.flash { animation: flash 1.4s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes flash { 0% { box-shadow: 0 0 0 6px hsl(var(--hue) 70% 60%); transform: scale(.97); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .entry.flash { animation: none; box-shadow: 0 0 0 4px hsl(var(--hue) 70% 60%); } }

.code { position: relative; }
.code-title {
  display: inline-block; margin: 0 0 -2px 10px; padding: 3px 12px 4px; border-radius: 10px 10px 0 0;
  background: var(--code-bg); color: var(--ink-3); font: 700 12px var(--font-mono);
}
.code pre {
  margin: 0; padding: 14px 16px; border-radius: 14px; overflow-x: auto;
  background: var(--code-bg); color: var(--ink); font: 14px/1.6 var(--font-mono); tab-size: 4;
}
.copy {
  position: absolute; top: 8px; right: 8px; padding: 3px 10px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--card); box-shadow: var(--shadow); color: var(--ink-2); font: 700 12px var(--font-body);
}
.code-title + .copy { top: 32px; }
.copy:hover { color: var(--ink); }
@media (hover: hover) {
  .copy { opacity: 0; transition: opacity .15s; }
  .code:hover .copy, .copy:focus-visible, .copy[data-state] { opacity: 1; }
}
.tk-kw { color: var(--tk-kw); }
.tk-str { color: var(--tk-str); }
.tk-num { color: var(--tk-num); }
.tk-com { color: var(--tk-com); font-style: italic; }
.tk-fn { color: var(--tk-fn); }
.tk-bi { color: var(--tk-bi); }
.tk-op { color: var(--tk-op); }
.tk-pp { color: var(--tk-pp); }

.output {
  margin-top: 10px; padding: 10px 14px; border-radius: 14px;
  background: var(--output-bg, hsl(var(--hue) var(--isl-s) var(--isl-l) / .55));
}
.output.stdin { background: none; box-shadow: inset 0 0 0 2px hsl(var(--hue) var(--isl-s) var(--isl-l)); }
.output-label {
  margin: 0 0 2px; font: 800 11px var(--font-body); text-transform: uppercase; letter-spacing: .1em;
  color: hsl(var(--hue) 45% var(--deep-l));
}
.output pre { margin: 0; overflow-x: auto; font: 13.5px/1.55 var(--font-mono); }
.output .error { color: var(--err); white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 600; }

.pitfall {
  --output-bg: color-mix(in srgb, var(--sticker) var(--pitfall-output-tint), var(--card));
  --code-bg: color-mix(in srgb, var(--sticker) 8%, var(--card));
  margin-top: 14px; padding: 12px 16px; border-radius: 16px; font-size: 15px;
  background: color-mix(in srgb, var(--sticker) var(--pitfall-tint), var(--card));
}
.pitfall p { margin: 0; }
.see { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.see-label { margin-right: 4px; font: 800 11px var(--font-body); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.see a {
  padding: 3px 12px; border-radius: 999px; text-decoration: none;
  background: hsl(var(--hue) var(--isl-s) var(--isl-l)); font: 700 13px var(--font-body);
}
.see a:hover { text-decoration: underline; }

.stops { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; margin-top: 30px; }
.stop {
  padding: 14px 24px; border-radius: 24px; text-decoration: none; transition: transform .15s;
  background: var(--card); box-shadow: var(--shadow); font: 700 22px/1.3 var(--font-round);
}
.stop small { display: block; font: 800 11px var(--font-body); text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); }
.stop.next {
  margin-left: auto; text-align: right;
  background: hsl(var(--hue) var(--isl-s) var(--isl-l)); box-shadow: 0 6px 0 hsl(var(--hue) 40% 45% / .35);
}
.stop.next small { color: hsl(var(--hue) 45% var(--deep-l)); }
.stop:hover { transform: translateY(-2px); }
@media (width <= 600px) {
  .hero { padding: 52px 20px 22px; border-radius: 26px; }
  .hero-glyph { width: 64px; height: 64px; font-size: 20px; }
  .area-name { margin: 0; }
  .chips {
    flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    margin: 0 calc(-1 * clamp(16px, 3vw, 32px)); padding-inline: clamp(16px, 3vw, 32px);
  }
  .entry { padding: 20px 18px 18px; }
  .stop { flex: 100%; font-size: 19px; }
}
</style>

<script>
window.CHEATSHEET = {"stats":{"topics":37,"entries":217},"areas":[{"id":"basics","hue":160,"name":{"en":"C++ Basics","pl":"Podstawy C++"},"desc":{"en":"The core language: types, control flow, functions, strings and arrays.","pl":"Rdzeń języka: typy, sterowanie przepływem, funkcje, napisy i tablice."},"topics":[{"id":"program","glyph":"main","name":{"en":"First program","pl":"Pierwszy program"},"summary":{"en":"Hello world, compiling with g++, std:: and comments.","pl":"Pierwszy program: hello world, kompilacja g++, std:: i komentarze."},"headers":["<iostream>"],"planned":false,"entries":[{"id":"hello-world","title":{"en":"Hello, world","pl":"Hello, world"},"explain":{"en":"Every program starts in <code>main()<\/code>. <code>#include &lt;iostream&gt;<\/code> brings in <code>std::cout<\/code>, and <code>&lt;&lt;<\/code> sends text to the screen; <code>\\n<\/code> ends the line. <code>return 0;<\/code> tells the system that all went well.","pl":"Każdy program zaczyna się w funkcji <code>main()<\/code>. <code>#include &lt;iostream&gt;<\/code> dołącza bibliotekę z <code>std::cout<\/code>, a operator <code>&lt;&lt;<\/code> wysyła tekst na ekran; <code>\\n<\/code> kończy linię. <code>return 0;<\/code> oznacza, że program zakończył się poprawnie."},"code":"#include <iostream>\n\nint main() {\n    std::cout << \"Hello, world!\\n\";\n    return 0;\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Hello, world!","error":false,"pitfall":{"en":"Every statement ends with <code>;<\/code>. A missing one is reported as an error on the <em>next<\/em> line, so look one line up.","pl":"Każda instrukcja kończy się średnikiem <code>;<\/code>. Brakujący średnik kompilator zgłasza w <em>następnej<\/em> linii, więc szukaj błędu linię wyżej."},"see":[]},{"id":"snippets","title":{"en":"Running the snippets on this sheet","pl":"Jak uruchamiać przykłady z tej ściągi"},"explain":{"en":"Most snippets here are the inside of <code>main()<\/code>, with the <code>#include<\/code> lines left out (each topic lists its header at the top). To run one, paste it into this template.","pl":"Większość przykładów to wnętrze funkcji <code>main()<\/code> bez linii <code>#include<\/code> (potrzebny nagłówek (header) jest podany na górze każdego tematu). Żeby uruchomić przykład, wklej go do tego szablonu."},"code":"#include <bits/stdc++.h>  // g++ only: every standard header at once\n\nint main() {\n    // paste a snippet here\n}","lang":"cpp","codeTitle":null,"input":null,"output":null,"error":false,"pitfall":{"en":"<code>&lt;bits/stdc++.h&gt;<\/code> works only with g++ and slows compiling down. In real projects include exactly the headers you use, e.g. <code>&lt;iostream&gt;<\/code>, <code>&lt;vector&gt;<\/code>, <code>&lt;string&gt;<\/code>.","pl":"<code>&lt;bits/stdc++.h&gt;<\/code> działa tylko w g++ i spowalnia kompilację. W prawdziwych projektach dołączaj dokładnie te nagłówki, których używasz, np. <code>&lt;iostream&gt;<\/code>, <code>&lt;vector&gt;<\/code>, <code>&lt;string&gt;<\/code>."},"see":[]},{"id":"compiling","title":{"en":"Compiling and running","pl":"Kompilacja i uruchomienie"},"explain":{"en":"C++ is compiled: <code>g++<\/code> turns the source file into an executable, which you then run. <code>-Wall -Wextra<\/code> switch on warnings, and they catch real bugs. On Windows the file is <code>main.exe<\/code>.","pl":"C++ jest kompilowany (compiled): <code>g++<\/code> zamienia plik źródłowy w plik wykonywalny (executable), który potem uruchamiasz. <code>-Wall -Wextra<\/code> włączają ostrzeżenia (warnings), które wyłapują prawdziwe błędy. Na Windowsie plik nazywa się <code>main.exe<\/code>."},"code":"g++ -std=c++20 -Wall -Wextra main.cpp -o main\n./main","lang":"shell","codeTitle":null,"input":null,"output":"Hello, world!","error":false,"pitfall":null,"see":[]},{"id":"std-namespace","title":{"en":"std:: and using namespace","pl":"std:: i using namespace"},"explain":{"en":"Standard library names live in the namespace <code>std<\/code>, so you write <code>std::cout<\/code> or <code>std::string<\/code>. <code>using namespace std;<\/code> lets you drop the prefix, which is handy in short programs. This sheet writes <code>std::<\/code> everywhere.","pl":"Nazwy z biblioteki standardowej należą do przestrzeni nazw (namespace) <code>std<\/code>, więc piszesz <code>std::cout<\/code> albo <code>std::string<\/code>. <code>using namespace std;<\/code> pozwala pominąć ten przedrostek, co jest wygodne w krótkich programach. Ta ściąga wszędzie pisze <code>std::<\/code>."},"code":"#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    string name = \"Ada\";\n    cout << \"Hi, \" << name << endl;\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Hi, Ada","error":false,"pitfall":{"en":"Never put <code>using namespace std;<\/code> in a header file: it leaks into every file that includes it, and names like <code>count<\/code> or <code>distance<\/code> start clashing.","pl":"Nigdy nie wpisuj <code>using namespace std;<\/code> w pliku nagłówkowym: trafia wtedy do każdego pliku, który go dołącza, i nazwy typu <code>count<\/code> czy <code>distance<\/code> zaczynają ze sobą kolidować."},"see":[{"topic":"enums","entry":null},{"topic":"headers","entry":null}]},{"id":"comments","title":{"en":"Comments","pl":"Komentarze"},"explain":{"en":"<code>//<\/code> comments out the rest of the line, and <code>/* ... */<\/code> can span several lines. The compiler ignores both.","pl":"<code>//<\/code> zamienia resztę linii w komentarz, a <code>/* ... */<\/code> może obejmować kilka linii. Kompilator ignoruje oba rodzaje komentarzy."},"code":"// a one-line comment\n/* a comment\n   over several lines */\nint answer = 42;  // a comment after code\nstd::cout << answer << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"42","error":false,"pitfall":null,"see":[]}]},{"id":"variables","glyph":"int x","name":{"en":"Variables &amp; types","pl":"Zmienne i typy"},"summary":{"en":"Fundamental types, initialisation with = and {}, auto, const and constexpr, sizeof, limits and static_cast.","pl":"Zmienne (variables) i typy: typy podstawowe, inicjalizacja przez = i {}, auto, const i constexpr, sizeof, zakresy i static_cast."},"headers":[],"planned":false,"entries":[{"id":"fundamental-types","title":{"en":"Fundamental types","pl":"Typy podstawowe"},"explain":{"en":"Every variable has a type that never changes. <code>int<\/code> stores whole numbers, <code>long long<\/code> bigger whole numbers, <code>double<\/code> numbers with a fractional part, <code>char<\/code> a single character in single quotes, and <code>bool<\/code> <code>true<\/code> or <code>false<\/code> (printed as <code>1<\/code>/<code>0<\/code>). Prefer <code>double<\/code> to the less precise <code>float<\/code>.","pl":"Każda zmienna (variable) ma typ (type), którego nie da się zmienić. <code>int<\/code> przechowuje liczby całkowite (integers), <code>long long<\/code> większe liczby całkowite, <code>double<\/code> liczby zmiennoprzecinkowe (floating-point), <code>char<\/code> pojedynczy znak w apostrofach, a <code>bool<\/code> wartość <code>true<\/code> lub <code>false<\/code> (wypisywaną jako <code>1<\/code>/<code>0<\/code>). Zamiast mniej dokładnego <code>float<\/code> używaj <code>double<\/code>."},"code":"int age = 20;                       // whole number\nlong long people = 8'000'000'000;   // too big for int; ' groups digits\ndouble price = 4.99;                // number with a fraction\nchar grade = 'A';                   // one character, single quotes\nbool passed = true;                 // true or false\nstd::cout << age << ' ' << people << ' ' << price << '\\n';\nstd::cout << grade << ' ' << passed << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"20 8000000000 4.99\nA 1","error":false,"pitfall":{"en":"A local variable without an initial value holds garbage: <code>int sum; sum += 5;<\/code> reads an unknown value (undefined behaviour). Always initialise: <code>int sum = 0;<\/code>.","pl":"Zmienna lokalna bez wartości początkowej zawiera śmieci: <code>int sum; sum += 5;<\/code> odczytuje nieznaną wartość (niezdefiniowane zachowanie, undefined behaviour). Zawsze nadawaj wartość początkową: <code>int sum = 0;<\/code>."},"see":[]},{"id":"initialisation","title":{"en":"Initialisation: = and {}","pl":"Inicjalizacja: = i {}"},"explain":{"en":"You can initialise a variable with <code>=<\/code> or with braces <code>{}<\/code>; empty braces give zero. Braces also refuse <em>narrowing<\/em>: a conversion that loses data, like <code>double<\/code> to <code>int<\/code>, is a compile error, while <code>=<\/code> silently drops the fraction.","pl":"Zmienną można zainicjalizować (initialise) przez <code>=<\/code> albo nawiasami klamrowymi <code>{}<\/code>; puste klamry dają zero. Klamry dodatkowo blokują zawężanie (narrowing): konwersja, która gubi dane, np. z <code>double<\/code> do <code>int<\/code>, jest błędem kompilacji, a <code>=<\/code> po cichu obcina część ułamkową."},"code":"int a = 7;      // copy initialisation\nint b{7};       // brace initialisation\nint c{};        // empty braces: 0\nint d = 7.9;    // compiles, but d is 7\n// int e{7.9};  // error: narrowing conversion from double to int\nstd::cout << a << ' ' << b << ' ' << c << ' ' << d << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"7 7 0 7","error":false,"pitfall":null,"see":[]},{"id":"auto","title":{"en":"Type deduction with auto","pl":"Dedukcja typu: auto"},"explain":{"en":"<code>auto<\/code> takes the type from the initial value, so the variable must be initialised. It shines with long type names (iterators, map entries); for simple numbers writing <code>int<\/code> or <code>double<\/code> is often clearer.","pl":"<code>auto<\/code> przejmuje typ od wartości początkowej (dedukcja typu, type deduction), więc zmienna musi być zainicjalizowana. Najbardziej przydaje się przy długich nazwach typów (iteratory, elementy mapy); przy zwykłych liczbach <code>int<\/code> czy <code>double<\/code> bywa czytelniejsze."},"code":"auto count = 42;     // int\nauto ratio = 0.75;   // double\nauto big = 42LL;     // long long (suffix LL)\nauto letter = 'x';   // char\nauto half = 7 / 2;   // int, so 3\nauto text = \"hi\";    // const char*, not std::string!\nstd::cout << count << ' ' << ratio << ' ' << big << ' '\n          << letter << ' ' << half << ' ' << text << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"42 0.75 42 x 3 hi","error":false,"pitfall":{"en":"<code>auto s = \"hi\";<\/code> makes a C string (<code>const char*<\/code>), not a <code>std::string<\/code>, so <code>s.size()<\/code> and <code>s + \"!\"<\/code> don't work. Write <code>std::string s = \"hi\";<\/code>.","pl":"<code>auto s = \"hi\";<\/code> tworzy napis w stylu C (<code>const char*<\/code>), a nie <code>std::string<\/code>, więc <code>s.size()<\/code> ani <code>s + \"!\"<\/code> nie zadziałają. Napisz <code>std::string s = \"hi\";<\/code>."},"see":[{"topic":"strings","entry":null}]},{"id":"const-constexpr","title":{"en":"const and constexpr","pl":"const i constexpr"},"explain":{"en":"<code>const<\/code> makes a variable read-only once it is initialised, but its value may be computed while the program runs. <code>constexpr<\/code> is stricter: the value must be known at compile time, so it works where the compiler needs a constant, e.g. an array size. Mark everything that shouldn't change.","pl":"<code>const<\/code> sprawia, że po inicjalizacji zmiennej nie da się już zmienić, ale jej wartość może zostać obliczona dopiero w trakcie działania programu. <code>constexpr<\/code> jest surowszy: wartość musi być znana w czasie kompilacji (compile time), więc nadaje się tam, gdzie kompilator wymaga stałej (constant), np. jako rozmiar tablicy. Oznaczaj tak wszystko, co nie powinno się zmieniać."},"code":"constexpr int secondsPerDay = 24 * 60 * 60;  // computed by the compiler\nconstexpr double pi = 3.14159;\nint r = 2;                         // an ordinary variable\nconst double area = pi * r * r;    // fixed once set, computed at run time\n// area = 0;                       // error: assignment of read-only variable\n// constexpr double bad = pi * r;  // error: r is not a constant\nstd::cout << secondsPerDay << ' ' << area << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"86400 12.5664","error":false,"pitfall":null,"see":[]},{"id":"sizeof-limits","title":{"en":"sizeof and value ranges","pl":"sizeof i zakresy wartości"},"explain":{"en":"<code>sizeof<\/code> gives the size of a type in bytes, and <code>std::numeric_limits&lt;T&gt;<\/code> (from <code>&lt;limits&gt;<\/code>) its smallest and largest value. The sizes below are typical on PCs; only <code>sizeof(char) == 1<\/code> is guaranteed. An <code>int<\/code> ends at about 2 billion, so use <code>long long<\/code> for bigger values.","pl":"<code>sizeof<\/code> podaje rozmiar typu w bajtach, a <code>std::numeric_limits&lt;T&gt;<\/code> (z <code>&lt;limits&gt;<\/code>) jego najmniejszą i największą wartość. Rozmiary poniżej są typowe dla PC; gwarantowane jest tylko <code>sizeof(char) == 1<\/code>. <code>int<\/code> kończy się na około 2 miliardach, więc dla większych liczb używaj <code>long long<\/code>."},"code":"std::cout << sizeof(char) << ' ' << sizeof(int) << ' '\n          << sizeof(long long) << ' ' << sizeof(double) << '\\n';\nstd::cout << std::numeric_limits<int>::max() << '\\n';\nstd::cout << std::numeric_limits<int>::min() << '\\n';\nstd::cout << std::numeric_limits<long long>::max() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 4 8 8\n2147483647\n-2147483648\n9223372036854775807","error":false,"pitfall":{"en":"Going past the maximum of a signed type (overflow) is undefined behaviour. <code>long long x = 100000 * 100000;<\/code> is already wrong: both operands are <code>int<\/code>, so the product overflows <em>before<\/em> it is stored. Make one operand <code>long long<\/code>: <code>100000LL * 100000<\/code>.","pl":"Przekroczenie zakresu typu ze znakiem, czyli przepełnienie (overflow), to niezdefiniowane zachowanie. <code>long long x = 100000 * 100000;<\/code> jest już błędne: oba czynniki są typu <code>int<\/code>, więc iloczyn przepełnia się <em>zanim<\/em> trafi do zmiennej. Zrób z jednego czynnika <code>long long<\/code>: <code>100000LL * 100000<\/code>."},"see":[]},{"id":"static-cast","title":{"en":"Converting with static_cast","pl":"Konwersje: static_cast"},"explain":{"en":"<code>static_cast&lt;T&gt;(x)<\/code> converts a value to type <code>T<\/code> on purpose. Typical uses: real division of two <code>int<\/code>s, dropping the fraction (<code>double<\/code> to <code>int<\/code> truncates toward zero, it doesn't round; <code>std::round<\/code> from <code>&lt;cmath&gt;<\/code> does) and turning a <code>char<\/code> into its code and back.","pl":"<code>static_cast&lt;T&gt;(x)<\/code> celowo zamienia wartość na typ <code>T<\/code>, czyli wykonuje rzutowanie (cast). Typowe zastosowania: prawdziwe dzielenie dwóch <code>int<\/code>-ów, odcięcie części ułamkowej (<code>double<\/code> na <code>int<\/code> obcina w stronę zera, a nie zaokrągla; do zaokrąglania służy <code>std::round<\/code> z <code>&lt;cmath&gt;<\/code>) oraz zamiana <code>char<\/code> na kod znaku i z powrotem."},"code":"int total = 7, count = 2;\ndouble avg = static_cast<double>(total) / count;  // 3.5, not 3\nint whole = static_cast<int>(3.99);               // 3: truncated\ndouble rounded = std::round(3.99);                // 4\nchar letter = static_cast<char>(65);              // 'A'\nint code = static_cast<int>('a');                 // 97\nstd::cout << avg << ' ' << whole << ' ' << rounded << ' '\n          << letter << ' ' << code << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"3.5 3 4 A 97","error":false,"pitfall":{"en":"Cast an operand, not the result: <code>static_cast&lt;double&gt;(total / count)<\/code> is still <code>3<\/code>, because the <code>int<\/code> division has already happened. The C-style <code>(double)total<\/code> also works, but <code>static_cast<\/code> is easier to spot and safer.","pl":"Rzutuj argument, a nie wynik: <code>static_cast&lt;double&gt;(total / count)<\/code> to nadal <code>3<\/code>, bo dzielenie na <code>int<\/code>-ach już się wykonało. Rzutowanie w stylu C <code>(double)total<\/code> też działa, ale <code>static_cast<\/code> łatwiej zauważyć w kodzie i jest bezpieczniejsze."},"see":[{"topic":"operators","entry":null}]}]},{"id":"operators","glyph":"+=","name":{"en":"Operators","pl":"Operatory"},"summary":{"en":"Arithmetic, integer division and %, ++ and --, compound assignment, comparison and logical operators, precedence.","pl":"Operatory (operators): arytmetyka, dzielenie całkowite i %, ++ i --, przypisanie złożone, porównania, operatory logiczne i priorytety."},"headers":[],"planned":false,"entries":[{"id":"arithmetic","title":{"en":"Arithmetic and integer division","pl":"Arytmetyka i dzielenie całkowite"},"explain":{"en":"<code>/<\/code> on two integers is integer division: the fraction is dropped, rounding toward zero. <code>%<\/code> is the remainder (integers only): <code>n % 2 == 0<\/code> tests for even, <code>n % 10<\/code> is the last digit. With a negative left side the remainder is negative too, so test for odd with <code>n % 2 != 0<\/code>.","pl":"<code>/<\/code> na dwóch liczbach całkowitych to dzielenie całkowite (integer division): część ułamkowa przepada, wynik zaokrągla się w stronę zera. <code>%<\/code> daje resztę z dzielenia (remainder) i działa tylko na liczbach całkowitych: <code>n % 2 == 0<\/code> sprawdza parzystość, <code>n % 10<\/code> to ostatnia cyfra. Dla ujemnej lewej strony reszta też jest ujemna, więc nieparzystość sprawdzaj przez <code>n % 2 != 0<\/code>."},"code":"int a = 17, b = 5;\nstd::cout << a + b << ' ' << a - b << ' ' << a * b << '\\n';\nstd::cout << a / b << ' ' << a % b << '\\n';     // 17 = 3 * 5 + 2\nstd::cout << 17.0 / 5 << '\\n';                  // a double operand: real division\nstd::cout << -7 / 2 << ' ' << -7 % 2 << '\\n';   // toward zero, sign of the left side","lang":"cpp","codeTitle":null,"input":null,"output":"22 12 85\n3 2\n3.4\n-3 -1","error":false,"pitfall":{"en":"<code>double half = 1 / 2;<\/code> stores <code>0<\/code>: both operands are <code>int<\/code>, so the division is done in integers before the result becomes a <code>double<\/code>. Write <code>1.0 / 2<\/code>, or cast one operand: <code>static_cast&lt;double&gt;(a) / b<\/code>.","pl":"<code>double half = 1 / 2;<\/code> zapisuje <code>0<\/code>: oba argumenty są typu <code>int<\/code>, więc dzielenie odbywa się na liczbach całkowitych, zanim wynik zamieni się w <code>double<\/code>. Napisz <code>1.0 / 2<\/code> albo zrzutuj jeden argument: <code>static_cast&lt;double&gt;(a) / b<\/code>."},"see":[{"topic":"variables","entry":"static-cast"}]},{"id":"increment","title":{"en":"++ and --: pre vs post","pl":"++ i --: pre i post"},"explain":{"en":"<code>++i<\/code> and <code>i++<\/code> both add 1, and <code>--<\/code> subtracts 1. The difference shows only when you use the result: prefix <code>++i<\/code> gives the new value, postfix <code>i++<\/code> the old one. As a statement on its own, e.g. in a <code>for<\/code> loop, both do the same.","pl":"<code>++i<\/code> i <code>i++<\/code> zwiększają zmienną o 1 (inkrementacja, increment), a <code>--<\/code> zmniejsza o 1 (dekrementacja, decrement). Różnicę widać tylko wtedy, gdy używasz wyniku: przedrostkowe <code>++i<\/code> (prefix) daje nową wartość, przyrostkowe <code>i++<\/code> (postfix) starą. W osobnej instrukcji, np. w pętli <code>for<\/code>, oba działają tak samo."},"code":"int i = 5;\nint a = i++;   // a gets the old value 5, then i becomes 6\nint b = ++i;   // i becomes 7 first, then b gets 7\nstd::cout << a << ' ' << b << ' ' << i << '\\n';\n--i;\nstd::cout << i << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"5 7 7\n6","error":false,"pitfall":{"en":"Never modify the same variable twice in one expression: <code>x = i++ + ++i;<\/code> is undefined behaviour, and different compilers may give different answers. Use separate statements.","pl":"Nigdy nie zmieniaj tej samej zmiennej dwa razy w jednym wyrażeniu: <code>x = i++ + ++i;<\/code> to niezdefiniowane zachowanie (undefined behaviour) i różne kompilatory mogą dać różne wyniki. Rozbij to na osobne instrukcje."},"see":[{"topic":"loops","entry":null}]},{"id":"compound-assignment","title":{"en":"Compound assignment","pl":"Przypisanie złożone"},"explain":{"en":"<code>x += 5<\/code> is short for <code>x = x + 5<\/code>; <code>-=<\/code>, <code>*=<\/code>, <code>/=<\/code> and <code>%=<\/code> work the same way. <code>+=<\/code> also appends to a <code>std::string<\/code>.","pl":"Przypisanie złożone (compound assignment) <code>x += 5<\/code> to skrót od <code>x = x + 5<\/code>; tak samo działają <code>-=<\/code>, <code>*=<\/code>, <code>/=<\/code> i <code>%=<\/code>. <code>+=<\/code> dokleja też tekst na koniec <code>std::string<\/code>."},"code":"int x = 10;\nx += 5;  std::cout << x << ' ';    // x = x + 5\nx -= 3;  std::cout << x << ' ';    // x = x - 3\nx *= 2;  std::cout << x << ' ';    // x = x * 2\nx /= 5;  std::cout << x << ' ';    // integer division\nx %= 3;  std::cout << x << '\\n';   // remainder","lang":"cpp","codeTitle":null,"input":null,"output":"15 12 24 4 1","error":false,"pitfall":{"en":"<code>x =+ 5;<\/code> is not <code>x += 5;<\/code>: it reads as <code>x = +5;<\/code> and simply sets <code>x<\/code> to 5, without any error.","pl":"<code>x =+ 5;<\/code> to nie <code>x += 5;<\/code>: kompilator czyta to jako <code>x = +5;<\/code>, czyli po prostu ustawia <code>x<\/code> na 5, i nie zgłasza żadnego błędu."},"see":[]},{"id":"comparison","title":{"en":"Comparison operators","pl":"Operatory porównania"},"explain":{"en":"<code>==<\/code> <code>!=<\/code> <code>&lt;<\/code> <code>&lt;=<\/code> <code>&gt;<\/code> <code>&gt;=<\/code> compare two values and give a <code>bool<\/code>, which <code>std::cout<\/code> prints as <code>1<\/code>/<code>0<\/code> unless you send <code>std::boolalpha<\/code> first. Don't compare <code>double<\/code>s with <code>==<\/code>: rounding errors make <code>0.1 + 0.2 == 0.3<\/code> false. Check <code>std::abs(a - b) &lt; 1e-9<\/code> instead.","pl":"Operatory porównania (comparison operators) <code>==<\/code> <code>!=<\/code> <code>&lt;<\/code> <code>&lt;=<\/code> <code>&gt;<\/code> <code>&gt;=<\/code> dają <code>bool<\/code>, który <code>std::cout<\/code> wypisuje jako <code>1<\/code>/<code>0<\/code>, chyba że najpierw wyślesz <code>std::boolalpha<\/code>. Nie porównuj <code>double<\/code> przez <code>==<\/code>: przez błędy zaokrągleń <code>0.1 + 0.2 == 0.3<\/code> jest fałszem. Zamiast tego sprawdzaj <code>std::abs(a - b) &lt; 1e-9<\/code>."},"code":"int age = 20;\nstd::cout << std::boolalpha;   // print true/false, not 1/0\nstd::cout << (age == 20) << ' ' << (age != 20) << '\\n';\nstd::cout << (age < 18) << ' ' << (age >= 18) << '\\n';\ndouble sum = 0.1 + 0.2;\nstd::cout << (sum == 0.3) << '\\n';                    // rounding error!\nstd::cout << (std::abs(sum - 0.3) < 1e-9) << '\\n';    // close enough","lang":"cpp","codeTitle":null,"input":null,"output":"true false\nfalse true\nfalse\ntrue","error":false,"pitfall":{"en":"<code>0 &lt; x &lt; 10<\/code> doesn't check a range: it means <code>(0 &lt; x) &lt; 10<\/code>, i.e. <code>true<\/code>/<code>false<\/code> (1/0) compared with 10, which is always true. Write <code>0 &lt; x &amp;&amp; x &lt; 10<\/code>.","pl":"<code>0 &lt; x &lt; 10<\/code> nie sprawdza przedziału: oznacza <code>(0 &lt; x) &lt; 10<\/code>, czyli porównanie <code>true<\/code>/<code>false<\/code> (1/0) z 10, co zawsze jest prawdą. Napisz <code>0 &lt; x &amp;&amp; x &lt; 10<\/code>."},"see":[{"topic":"conditionals","entry":null}]},{"id":"logical","title":{"en":"Logical operators, short-circuit","pl":"Operatory logiczne"},"explain":{"en":"<code>&amp;&amp;<\/code> (and) is true when both sides are, <code>||<\/code> (or) when at least one is, and <code>!<\/code> (not) flips a <code>bool<\/code>. They short-circuit: <code>&amp;&amp;<\/code> stops at the first false and <code>||<\/code> at the first true, so the right side may never run. Use that as a guard: check first, then use.","pl":"Operatory logiczne (logical operators): <code>&amp;&amp;<\/code> (i) jest prawdą, gdy obie strony są prawdziwe, <code>||<\/code> (lub), gdy choć jedna, a <code>!<\/code> (nie) odwraca <code>bool<\/code>. Obowiązuje skrócone wartościowanie (short-circuit evaluation): <code>&amp;&amp;<\/code> kończy na pierwszym fałszu, <code>||<\/code> na pierwszej prawdzie, więc prawa strona może się w ogóle nie wykonać. To dobre zabezpieczenie: najpierw sprawdź, potem użyj."},"code":"int age = 16;\nbool withParent = true;\nstd::cout << std::boolalpha;\nstd::cout << (age >= 13 && age <= 19) << '\\n';   // teenager?\nstd::cout << (age >= 18 || withParent) << '\\n';  // may enter?\nstd::cout << !withParent << '\\n';\nint count = 0, total = 10;\nstd::cout << (count != 0 && total / count > 2) << '\\n';  // no division by 0","lang":"cpp","codeTitle":null,"input":null,"output":"true\ntrue\nfalse\nfalse","error":false,"pitfall":{"en":"<code>x == 1 || 2<\/code> is always true: it means <code>(x == 1) || 2<\/code>, and <code>2<\/code> counts as true. Repeat the variable: <code>x == 1 || x == 2<\/code>.","pl":"<code>x == 1 || 2<\/code> jest zawsze prawdą: oznacza <code>(x == 1) || 2<\/code>, a <code>2<\/code> liczy się jako prawda. Powtórz zmienną: <code>x == 1 || x == 2<\/code>."},"see":[]},{"id":"precedence","title":{"en":"Precedence surprises","pl":"Pułapki priorytetów"},"explain":{"en":"From strongest to weakest: <code>!<\/code> <code>++<\/code> <code>--<\/code> unary <code>-<\/code>; <code>*<\/code> <code>/<\/code> <code>%<\/code>; <code>+<\/code> <code>-<\/code>; <code>&lt;&lt;<\/code> <code>&gt;&gt;<\/code>; <code>&lt;<\/code> <code>&lt;=<\/code> <code>&gt;<\/code> <code>&gt;=<\/code>; <code>==<\/code> <code>!=<\/code>; <code>&amp;&amp;<\/code>; <code>||<\/code>; then <code>?:<\/code> and <code>=<\/code> <code>+=<\/code>. Operators on the same level go left to right (assignment right to left). When in doubt, add parentheses.","pl":"Priorytet operatorów (operator precedence), od najsilniejszych: <code>!<\/code> <code>++<\/code> <code>--<\/code> jednoargumentowy <code>-<\/code>; <code>*<\/code> <code>/<\/code> <code>%<\/code>; <code>+<\/code> <code>-<\/code>; <code>&lt;&lt;<\/code> <code>&gt;&gt;<\/code>; <code>&lt;<\/code> <code>&lt;=<\/code> <code>&gt;<\/code> <code>&gt;=<\/code>; <code>==<\/code> <code>!=<\/code>; <code>&amp;&amp;<\/code>; <code>||<\/code>; na końcu <code>?:<\/code> oraz <code>=<\/code> <code>+=<\/code>. Operatory z tego samego poziomu liczą się od lewej do prawej (przypisanie od prawej). W razie wątpliwości dodaj nawiasy."},"code":"int a = 2, b = 3, c = 4;\nstd::cout << a + b * c << '\\n';     // * before +: 2 + 12\nstd::cout << (a + b) * c << '\\n';   // parentheses first\nstd::cout << 10 - 4 - 3 << '\\n';    // left to right: (10 - 4) - 3\nstd::cout << 7 / 2 * 2 << '\\n';     // (7 / 2) * 2 = 3 * 2\nstd::cout << (a < b) << '\\n';       // () needed: << is stronger than <","lang":"cpp","codeTitle":null,"input":null,"output":"14\n20\n3\n6\n1","error":false,"pitfall":{"en":"<code>std::cout &lt;&lt; a &lt; b;<\/code> doesn't compile: <code>&lt;&lt;<\/code> is stronger than <code>&lt;<\/code>, so it means <code>(std::cout &lt;&lt; a) &lt; b<\/code>. Always put comparisons inside <code>std::cout<\/code> in parentheses: <code>std::cout &lt;&lt; (a &lt; b);<\/code>.","pl":"<code>std::cout &lt;&lt; a &lt; b;<\/code> się nie skompiluje: <code>&lt;&lt;<\/code> jest silniejsze niż <code>&lt;<\/code>, więc to znaczy <code>(std::cout &lt;&lt; a) &lt; b<\/code>. Porównania wewnątrz <code>std::cout<\/code> zawsze bierz w nawiasy: <code>std::cout &lt;&lt; (a &lt; b);<\/code>."},"see":[]}]},{"id":"io","glyph":"<<","name":{"en":"Input &amp; output","pl":"Wejście i wyjście"},"summary":{"en":"Printing with std::cout, reading with std::cin and std::getline, formatting with &lt;iomanip&gt; and std::format.","pl":"Wejście i wyjście (input/output): wypisywanie przez std::cout, wczytywanie przez std::cin i std::getline, formatowanie z &lt;iomanip&gt; i std::format."},"headers":["<iostream>","<string>","<iomanip>","<format>"],"planned":false,"entries":[{"id":"cout","title":{"en":"Printing with std::cout","pl":"Wypisywanie: std::cout"},"explain":{"en":"<code>&lt;&lt;<\/code> sends values to <code>std::cout<\/code> and can be chained. Nothing is added between values, so put spaces and <code>'\\n'<\/code> in yourself. <code>std::endl<\/code> also ends the line but flushes the buffer every time, which is slower; <code>'\\n'<\/code> is enough.","pl":"Operator <code>&lt;&lt;<\/code> wysyła wartości do strumienia (stream) <code>std::cout<\/code> i można go łączyć w łańcuch. Między wartościami nic nie jest dodawane, więc spacje i <code>'\\n'<\/code> musisz wstawić sam. <code>std::endl<\/code> też kończy linię, ale za każdym razem opróżnia bufor (flush), co jest wolniejsze; <code>'\\n'<\/code> w zupełności wystarczy."},"code":"int x = 3;\ndouble y = 2.5;\nstd::cout << \"x = \" << x << \", y = \" << y << '\\n';\nstd::cout << x << y << '\\n';          // no space added: 32.5\nstd::cout << \"sum: \" << x + y << '\\n';\nstd::cout << \"line 1\\nline 2\" << std::endl;","lang":"cpp","codeTitle":null,"input":null,"output":"x = 3, y = 2.5\n32.5\nsum: 5.5\nline 1\nline 2","error":false,"pitfall":null,"see":[]},{"id":"cin","title":{"en":"Reading with std::cin","pl":"Wczytywanie: std::cin"},"explain":{"en":"<code>std::cin &gt;&gt; x<\/code> reads a value of <code>x<\/code>'s type, skipping any whitespace (spaces, tabs, newlines) before it, so the values may be on one line or on several. Chain reads like writes: <code>std::cin &gt;&gt; a &gt;&gt; b<\/code>.","pl":"<code>std::cin &gt;&gt; x<\/code> wczytuje wartość typu zmiennej <code>x<\/code>, pomijając poprzedzające ją białe znaki (whitespace): spacje, tabulatory i znaki nowej linii. Wartości mogą więc być w jednej linii albo w kilku. Odczyty łączy się tak samo jak wypisywanie: <code>std::cin &gt;&gt; a &gt;&gt; b<\/code>."},"code":"std::string name;\nint age = 0;\ndouble height = 0.0;\nstd::cin >> name >> age >> height;\nstd::cout << name << \", \" << age << \", \" << height << \" m\\n\";","lang":"cpp","codeTitle":null,"input":"Ada 36\n1.65","output":"Ada, 36, 1.65 m","error":false,"pitfall":{"en":"<code>&gt;&gt;<\/code> into a <code>std::string<\/code> reads one word only: for the input <code>Ada Lovelace<\/code> it stores <code>Ada<\/code> and leaves <code>Lovelace<\/code> for the next read. Use <code>std::getline<\/code> for whole lines.","pl":"<code>&gt;&gt;<\/code> do <code>std::string<\/code> wczytuje tylko jedno słowo: z wejścia <code>Ada Lovelace<\/code> zapisze <code>Ada<\/code>, a <code>Lovelace<\/code> zostawi na następny odczyt. Całe linie wczytuj przez <code>std::getline<\/code>."},"see":[]},{"id":"read-loop","title":{"en":"Reading until the input ends","pl":"Wczytywanie do końca danych"},"explain":{"en":"<code>std::cin &gt;&gt; x<\/code> counts as <code>false<\/code> when reading fails: at the end of the input or when the text isn't a number. So <code>while (std::cin &gt;&gt; x)<\/code> reads any number of values. In a terminal, end the input with Ctrl+D (Linux/macOS) or Ctrl+Z and Enter (Windows).","pl":"<code>std::cin &gt;&gt; x<\/code> daje <code>false<\/code>, gdy odczyt się nie uda: na końcu danych albo gdy tekst nie jest liczbą. Dzięki temu <code>while (std::cin &gt;&gt; x)<\/code> wczyta dowolnie wiele wartości. W terminalu koniec danych (end of input) zgłaszasz przez Ctrl+D (Linux/macOS) albo Ctrl+Z i Enter (Windows)."},"code":"int x = 0, sum = 0, count = 0;\nwhile (std::cin >> x) {   // stops at the end of input or at a non-number\n    sum += x;\n    ++count;\n}\nstd::cout << count << \" numbers, sum \" << sum << '\\n';","lang":"cpp","codeTitle":null,"input":"4 8 15\n16 23 42","output":"6 numbers, sum 108","error":false,"pitfall":{"en":"After a failed read (e.g. letters typed into an <code>int<\/code>), <code>std::cin<\/code> stays in a fail state and skips every later <code>&gt;&gt;<\/code>. To try again, call <code>std::cin.clear()<\/code>, then throw the bad line away with <code>std::cin.ignore(std::numeric_limits&lt;std::streamsize&gt;::max(), '\\n')<\/code>.","pl":"Po nieudanym odczycie (np. litery wpisane do <code>int<\/code>) <code>std::cin<\/code> zostaje w stanie błędu (fail state) i pomija każde kolejne <code>&gt;&gt;<\/code>. Żeby spróbować ponownie, wywołaj <code>std::cin.clear()<\/code>, a potem wyrzuć błędną linię przez <code>std::cin.ignore(std::numeric_limits&lt;std::streamsize&gt;::max(), '\\n')<\/code>."},"see":[]},{"id":"getline","title":{"en":"Whole lines: std::getline","pl":"Całe linie: std::getline"},"explain":{"en":"<code>std::getline(std::cin, s)<\/code> reads a whole line, spaces included, into a <code>std::string<\/code> and drops the <code>'\\n'<\/code>. Like <code>&gt;&gt;<\/code>, it works in a loop: <code>while (std::getline(std::cin, line))<\/code>. When you mix it with <code>&gt;&gt;<\/code>, first skip the leftover newline with <code>std::ws<\/code>.","pl":"<code>std::getline(std::cin, s)<\/code> wczytuje całą linię razem ze spacjami do <code>std::string<\/code> i odrzuca <code>'\\n'<\/code>. Podobnie jak <code>&gt;&gt;<\/code> działa w pętli: <code>while (std::getline(std::cin, line))<\/code>. Jeśli mieszasz ją z <code>&gt;&gt;<\/code>, najpierw pomiń zaległy znak nowej linii przez <code>std::ws<\/code>."},"code":"int age = 0;\nstd::string fullName;\nstd::cin >> age;                               // leaves '\\n' in the input\nstd::getline(std::cin >> std::ws, fullName);   // std::ws skips it\nstd::cout << fullName << \" (\" << age << \")\\n\";","lang":"cpp","codeTitle":null,"input":"36\nAda Lovelace","output":"Ada Lovelace (36)","error":false,"pitfall":{"en":"Without <code>std::ws<\/code>, a <code>getline<\/code> right after <code>std::cin &gt;&gt; age<\/code> returns an empty string at once: it reads the rest of the line with <code>36<\/code>, which is just the <code>'\\n'<\/code> left by Enter. Skip it with <code>std::cin &gt;&gt; std::ws<\/code> or <code>std::cin.ignore()<\/code> first.","pl":"Bez <code>std::ws<\/code> wywołanie <code>getline<\/code> zaraz po <code>std::cin &gt;&gt; age<\/code> od razu zwraca pusty napis: czyta resztę linii z <code>36<\/code>, czyli sam <code>'\\n'<\/code> pozostawiony przez Enter. Najpierw pomiń go przez <code>std::cin &gt;&gt; std::ws<\/code> albo <code>std::cin.ignore()<\/code>."},"see":[{"topic":"strings","entry":null}]},{"id":"iomanip","title":{"en":"Formatting with &lt;iomanip&gt;","pl":"Formatowanie: &lt;iomanip&gt;"},"explain":{"en":"<code>std::fixed<\/code> with <code>std::setprecision(n)<\/code> prints exactly <code>n<\/code> decimal places. <code>std::setw(n)<\/code> pads the next value to <code>n<\/code> columns (right-aligned unless you use <code>std::left<\/code>), and <code>std::setfill<\/code> picks the padding character. Only <code>setw<\/code> resets after one value; the others stay in effect until changed.","pl":"Manipulatory (manipulators) z <code>&lt;iomanip&gt;<\/code>: <code>std::fixed<\/code> razem z <code>std::setprecision(n)<\/code> daje dokładnie <code>n<\/code> miejsc po przecinku. <code>std::setw(n)<\/code> wyrównuje następną wartość do <code>n<\/code> kolumn (do prawej, chyba że użyjesz <code>std::left<\/code>), a <code>std::setfill<\/code> wybiera znak wypełnienia. Tylko <code>setw<\/code> działa na jedną wartość; pozostałe obowiązują aż do zmiany."},"code":"double pi = 3.14159265;\nstd::cout << std::fixed << std::setprecision(2) << pi << '\\n';\nstd::cout << '[' << std::setw(6) << 42 << \"]\\n\";\nstd::cout << '[' << std::left << std::setw(6) << 42 << \"]\\n\";\nstd::cout << std::right << std::setfill('0') << std::setw(3) << 7 << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"3.14\n[    42]\n[42    ]\n007","error":false,"pitfall":{"en":"Without <code>std::fixed<\/code>, <code>setprecision(2)<\/code> counts <em>significant<\/em> digits, not decimal places: <code>3.14159<\/code> prints as <code>3.1<\/code> and <code>1234.5<\/code> as <code>1.2e+03<\/code>.","pl":"Bez <code>std::fixed<\/code> <code>setprecision(2)<\/code> liczy cyfry <em>znaczące<\/em>, a nie miejsca po przecinku: <code>3.14159<\/code> wypisze się jako <code>3.1<\/code>, a <code>1234.5<\/code> jako <code>1.2e+03<\/code>."},"see":[]},{"id":"format","title":{"en":"std::format (C++20)","pl":"std::format (C++20)"},"explain":{"en":"<code>std::format<\/code> builds a <code>std::string<\/code> from a pattern: each <code>{}<\/code> is replaced by the next argument. After a <code>:<\/code> comes the format: <code>.1f<\/code> one decimal place, <code>&gt;6<\/code> / <code>&lt;6<\/code> / <code>^6<\/code> right, left or centre in 6 columns, <code>05<\/code> zero-padding, <code>x<\/code> hex. Needs g++ 13+ or a recent MSVC; C++23 adds <code>std::println<\/code>, which prints directly.","pl":"<code>std::format<\/code> buduje <code>std::string<\/code> według wzorca: każde <code>{}<\/code> zastępuje kolejny argument. Po dwukropku podajesz format: <code>.1f<\/code> to jedno miejsce po przecinku, <code>&gt;6<\/code> / <code>&lt;6<\/code> / <code>^6<\/code> wyrównanie do prawej, lewej lub środka w 6 kolumnach, <code>05<\/code> dopełnienie zerami, <code>x<\/code> zapis szesnastkowy. Wymaga g++ 13+ lub nowego MSVC; C++23 dodaje <code>std::println<\/code>, które od razu wypisuje tekst."},"code":"std::string name = \"Ada\";\ndouble score = 92.456;\nstd::cout << std::format(\"{} scored {:.1f} points\\n\", name, score);\nstd::cout << std::format(\"[{:>6}] [{:<6}] [{:^6}]\\n\", 42, 42, 42);\nstd::cout << std::format(\"{:05} {:x}\\n\", 42, 255);","lang":"cpp","codeTitle":null,"input":null,"output":"Ada scored 92.5 points\n[    42] [42    ] [  42  ]\n00042 ff","error":false,"pitfall":null,"see":[]}]},{"id":"conditionals","glyph":"if","name":{"en":"Conditionals","pl":"Warunki"},"summary":{"en":"if / else if / else, switch and fall-through, the ternary operator ?:, = vs == and if with an initialiser.","pl":"Instrukcje warunkowe (conditionals): if / else if / else, switch i przechodzenie bez break, operator ?:, = kontra == oraz if z inicjalizatorem."},"headers":[],"planned":false,"entries":[{"id":"if-else","title":{"en":"if / else if / else","pl":"if / else if / else"},"explain":{"en":"Conditions are checked from the top, and only the block of the first true one runs; <code>else<\/code> catches everything else. Both <code>else if<\/code> and <code>else<\/code> are optional.","pl":"Instrukcja warunkowa <code>if<\/code> (if statement) sprawdza warunki od góry i wykonuje tylko blok pierwszego prawdziwego; <code>else<\/code> obsługuje wszystkie pozostałe przypadki. Zarówno <code>else if<\/code>, jak i <code>else<\/code> są opcjonalne."},"code":"int score = 72;\nif (score >= 90) {\n    std::cout << \"A\\n\";\n} else if (score >= 70) {\n    std::cout << \"B\\n\";      // first true condition wins\n} else if (score >= 50) {\n    std::cout << \"C\\n\";      // true too, but skipped\n} else {\n    std::cout << \"fail\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"B","error":false,"pitfall":{"en":"A <code>;<\/code> right after the condition ends the <code>if<\/code>: in <code>if (x &gt; 0); { ... }<\/code> the block always runs. And without braces only the next single statement belongs to the <code>if<\/code>, so always write <code>{}<\/code>.","pl":"Średnik tuż po warunku kończy <code>if<\/code>: w <code>if (x &gt; 0); { ... }<\/code> blok wykona się zawsze. A bez klamer do <code>if<\/code> należy tylko jedna następna instrukcja, więc zawsze pisz <code>{}<\/code>."},"see":[]},{"id":"conditions","title":{"en":"Conditions and = vs ==","pl":"Warunki i = kontra =="},"explain":{"en":"A condition is anything that gives a <code>bool<\/code>: a comparison, a <code>bool<\/code> variable, or conditions joined with <code>&amp;&amp;<\/code>, <code>||<\/code> and <code>!<\/code>. A number works too: <code>0<\/code> is false and every other value is true.","pl":"Warunkiem (condition) może być wszystko, co daje <code>bool<\/code>: porównanie, zmienna typu <code>bool<\/code> albo warunki połączone przez <code>&amp;&amp;<\/code>, <code>||<\/code> i <code>!<\/code>. Liczba też się nada: <code>0<\/code> to fałsz, a każda inna wartość to prawda."},"code":"int n = 0;\nbool loggedIn = true;\nif (n == 0) {               // == compares\n    std::cout << \"zero\\n\";\n}\nif (!n) {                   // 0 is false, any other number is true\n    std::cout << \"still zero\\n\";\n}\nif (loggedIn && n < 10) {   // join conditions with && || !\n    std::cout << \"welcome\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"zero\nstill zero\nwelcome","error":false,"pitfall":{"en":"<code>if (x = 5)<\/code> assigns 5 to <code>x<\/code>, so the condition is always true. Comparison is <code>==<\/code>. Compile with <code>-Wall<\/code>: g++ then warns <em>suggest parentheses around assignment used as truth value<\/em>.","pl":"<code>if (x = 5)<\/code> przypisuje 5 do <code>x<\/code>, więc warunek jest zawsze prawdziwy. Porównanie to <code>==<\/code>. Kompiluj z <code>-Wall<\/code>: g++ ostrzeże wtedy komunikatem <em>suggest parentheses around assignment used as truth value<\/em>."},"see":[{"topic":"operators","entry":null}]},{"id":"switch","title":{"en":"switch","pl":"switch"},"explain":{"en":"<code>switch<\/code> jumps to the <code>case<\/code> equal to the value, and <code>break<\/code> leaves the switch; <code>default<\/code> handles all other values. Stacked labels share one block. It works only with integers, <code>char<\/code>s and enums, and every <code>case<\/code> value must be a constant.","pl":"<code>switch<\/code> skacze do etykiety <code>case<\/code> równej wartości wyrażenia, a <code>break<\/code> wychodzi ze switcha; <code>default<\/code> obsługuje wszystkie inne wartości. Kilka etykiet jedna pod drugą dzieli wspólny blok. Działa tylko z liczbami całkowitymi, <code>char<\/code> i typami wyliczeniowymi (enums), a każda wartość przy <code>case<\/code> musi być stałą."},"code":"char op = '*';\nswitch (op) {\n    case '+':\n        std::cout << \"add\\n\";\n        break;\n    case '*':\n    case 'x':                  // two labels, one block\n        std::cout << \"multiply\\n\";\n        break;\n    default:\n        std::cout << \"unknown\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"multiply","error":false,"pitfall":{"en":"You can't <code>switch<\/code> on a <code>std::string<\/code>; use <code>if<\/code> / <code>else if<\/code> instead. To declare a variable inside a <code>case<\/code>, wrap that case in braces <code>{ }<\/code>, otherwise g++ reports <em>jump to case label<\/em>.","pl":"Nie da się użyć <code>switch<\/code> na <code>std::string<\/code>; zamiast tego użyj <code>if<\/code> / <code>else if<\/code>. Żeby zadeklarować zmienną wewnątrz <code>case<\/code>, otocz ten przypadek klamrami <code>{ }<\/code>, inaczej g++ zgłosi błąd <em>jump to case label<\/em>."},"see":[{"topic":"enums","entry":null}]},{"id":"fall-through","title":{"en":"Fall-through without break","pl":"Przechodzenie bez break"},"explain":{"en":"<code>case<\/code> labels are only jump targets: without <code>break<\/code>, execution falls through into the code of the next case. Usually that's a bug, and g++ with <code>-Wextra<\/code> warns about it. When you want it, mark the spot with <code>[[fallthrough]];<\/code> (C++17).","pl":"Etykiety <code>case<\/code> to tylko miejsca skoku: bez <code>break<\/code> wykonanie przechodzi dalej (fall-through) do kodu następnego przypadku. Zwykle to błąd i g++ z <code>-Wextra<\/code> ostrzega przed nim. Jeśli robisz to celowo, oznacz to miejsce przez <code>[[fallthrough]];<\/code> (C++17)."},"code":"int stars = 2;\nswitch (stars) {\n    case 3:\n        std::cout << \"gold \";\n        [[fallthrough]];       // no break: go on into case 2\n    case 2:\n        std::cout << \"silver \";\n        [[fallthrough]];\n    case 1:\n        std::cout << \"bronze\\n\";\n        break;\n}","lang":"cpp","codeTitle":null,"input":null,"output":"silver bronze","error":false,"pitfall":null,"see":[]},{"id":"ternary","title":{"en":"Ternary operator ?:","pl":"Operator trójargumentowy ?:"},"explain":{"en":"<code>condition ? a : b<\/code> is an expression: it gives <code>a<\/code> when the condition is true, otherwise <code>b<\/code>. Handy for choosing a value inline; for several branches or for actions, use <code>if<\/code>.","pl":"Operator trójargumentowy (ternary operator) <code>warunek ? a : b<\/code> to wyrażenie: daje <code>a<\/code>, gdy warunek jest prawdziwy, a w przeciwnym razie <code>b<\/code>. Przydaje się do wyboru wartości w jednej linii; przy kilku gałęziach albo gdy trzeba coś wykonać, użyj <code>if<\/code>."},"code":"int a = 7, b = 12;\nint bigger = (a > b) ? a : b;\nstd::cout << bigger << '\\n';\nint n = 1;\nstd::cout << n << (n == 1 ? \" file\" : \" files\") << '\\n';\nn = 3;\nstd::cout << n << (n == 1 ? \" file\" : \" files\") << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"12\n1 file\n3 files","error":false,"pitfall":{"en":"Inside <code>std::cout &lt;&lt; ...<\/code> put the whole <code>?:<\/code> in parentheses: <code>std::cout &lt;&lt; n == 1 ? \"a\" : \"b\";<\/code> doesn't compile, because <code>&lt;&lt;<\/code> binds tighter than <code>==<\/code> and <code>?:<\/code>.","pl":"Wewnątrz <code>std::cout &lt;&lt; ...<\/code> całe wyrażenie <code>?:<\/code> bierz w nawiasy: <code>std::cout &lt;&lt; n == 1 ? \"a\" : \"b\";<\/code> się nie skompiluje, bo <code>&lt;&lt;<\/code> wiąże silniej niż <code>==<\/code> i <code>?:<\/code>."},"see":[{"topic":"operators","entry":"precedence"}]},{"id":"if-init","title":{"en":"if with an initialiser (C++17)","pl":"if z inicjalizatorem (C++17)"},"explain":{"en":"<code>if (init; condition)<\/code> declares a variable that exists only inside the <code>if<\/code> and its <code>else<\/code>, which keeps helpers like a search result out of the surrounding code. <code>switch (init; value)<\/code> works the same way.","pl":"<code>if (inicjalizacja; warunek)<\/code> deklaruje zmienną, której zasięg (scope) obejmuje tylko <code>if<\/code> i jego <code>else<\/code>. Dzięki temu zmienne pomocnicze, np. wynik wyszukiwania, nie zaśmiecają reszty kodu. Tak samo działa <code>switch (inicjalizacja; wartość)<\/code>."},"code":"std::string email = \"ada@example.com\";\nif (auto at = email.find('@'); at != std::string::npos) {\n    std::cout << \"user: \" << email.substr(0, at) << '\\n';\n} else {\n    std::cout << \"no @ in the address\\n\";\n}\n// 'at' doesn't exist here","lang":"cpp","codeTitle":null,"input":null,"output":"user: ada","error":false,"pitfall":null,"see":[{"topic":"strings","entry":null},{"topic":"map","entry":null}]}]},{"id":"loops","glyph":"for","name":{"en":"Loops","pl":"Pętle"},"summary":{"en":"for, while, do … while, range-based for, break / continue and nested loops.","pl":"Pętle (loops): for, while, do … while, for po zakresie, break / continue i pętle zagnieżdżone."},"headers":[],"planned":false,"entries":[{"id":"for","title":{"en":"for loop","pl":"Pętla for"},"explain":{"en":"<code>for (start; condition; step)<\/code>: the start runs once, the condition is checked before every pass, and the step runs after each pass. Use <code>for<\/code> when you know how many times to repeat. The counter <code>i<\/code> exists only inside the loop.","pl":"<code>for (start; warunek; krok)<\/code>: start wykonuje się raz, warunek jest sprawdzany przed każdą iteracją (iteration), a krok po każdej iteracji. Używaj <code>for<\/code>, gdy wiesz, ile razy coś powtórzyć. Licznik <code>i<\/code> istnieje tylko wewnątrz pętli."},"code":"for (int i = 0; i < 5; ++i) {\n    std::cout << i << ' ';\n}\nstd::cout << '\\n';\nfor (int i = 10; i > 0; i -= 3) {   // counting down by 3\n    std::cout << i << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"0 1 2 3 4\n10 7 4 1","error":false,"pitfall":{"en":"A semicolon right after the parentheses, <code>for (int i = 0; i &lt; 5; ++i);<\/code>, is the whole loop body (an empty statement), so the block below is not part of the loop and runs just once. The same slip after <code>while (...)<\/code> usually gives an infinite loop.","pl":"Średnik tuż za nawiasem, <code>for (int i = 0; i &lt; 5; ++i);<\/code>, jest całą treścią pętli (pustą instrukcją), więc blok poniżej nie należy do pętli i wykona się tylko raz. Ten sam błąd po <code>while (...)<\/code> zwykle kończy się pętlą nieskończoną."},"see":[]},{"id":"while","title":{"en":"while loop","pl":"Pętla while"},"explain":{"en":"<code>while (condition)<\/code> repeats as long as the condition is true. It checks the condition <em>before<\/em> each pass, so the body may not run at all. Use it when you don't know the number of passes in advance, e.g. until a number runs out of digits.","pl":"<code>while (warunek)<\/code> powtarza treść, dopóki warunek jest prawdziwy. Sprawdza go <em>przed<\/em> każdą iteracją, więc treść może się nie wykonać ani razu. Używaj jej, gdy nie znasz z góry liczby powtórzeń, np. dopóki liczbie nie skończą się cyfry."},"code":"int n = 1234;\nint digits = 0;\nwhile (n > 0) {\n    n /= 10;      // drop the last digit\n    ++digits;\n}\nstd::cout << digits << \" digits\\n\";","lang":"cpp","codeTitle":null,"input":null,"output":"4 digits","error":false,"pitfall":{"en":"Something inside the loop must change the condition. Forget <code>n /= 10<\/code>, or jump over it with <code>continue<\/code>, and the loop never ends (an infinite loop). Stop such a program with Ctrl+C.","pl":"Coś w pętli musi zmieniać warunek. Jeśli zapomnisz o <code>n /= 10<\/code> albo przeskoczysz je przez <code>continue<\/code>, powstanie pętla nieskończona (infinite loop). Taki program przerwiesz sk
