\n}\nfor (const auto& [k, v] : m) std::cout << k << '=' << v << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"0\n3=three","error":false,"pitfall":{"en":"<code>m.erase(it); ++it;<\/code> uses an iterator that no longer exists: undefined behaviour. Use <code>it = m.erase(it);<\/code>, or in C++20 simply <code>std::erase_if(m, [](const auto&amp; p) { return p.first % 2 == 0; });<\/code>.","pl":"<code>m.erase(it); ++it;<\/code> używa iteratora, który już nie istnieje: to niezdefiniowane zachowanie (undefined behaviour). Pisz <code>it = m.erase(it);<\/code> albo w C++20 po prostu <code>std::erase_if(m, [](const auto&amp; p) { return p.first % 2 == 0; });<\/code>."},"see":[{"topic":"iterators","entry":null},{"topic":"transforming","entry":null}]},{"id":"counting","title":{"en":"Counting occurrences","pl":"Zliczanie wystąpień"},"explain":{"en":"Here <code>[]<\/code> creating missing keys is exactly what you want: <code>++freq[w]<\/code> starts a new word at 0 and adds 1. The result comes out sorted by key. A <code>std::map&lt;char, int&gt;<\/code> counts letters the same way.","pl":"Tutaj to, że <code>[]<\/code> tworzy brakujące klucze, jest dokładnie tym, czego chcesz: <code>++freq[w]<\/code> zaczyna nowe słowo od 0 i dodaje 1. Wynik wychodzi posortowany według klucza. Tak samo <code>std::map&lt;char, int&gt;<\/code> policzy litery."},"code":"std::vector<std::string> words{\"to\", \"be\", \"or\", \"not\", \"to\", \"be\"};\nstd::map<std::string, int> freq;\nfor (const auto& w : words) {\n    ++freq[w];                 // a new word starts at 0\n}\nfor (const auto& [w, n] : freq) std::cout << w << ' ' << n << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"be 2\nnot 1\nor 1\nto 2","error":false,"pitfall":{"en":"The map is sorted by key, not by count. To list the most common first, copy it into a <code>std::vector&lt;std::pair&lt;std::string, int&gt;&gt;<\/code> and sort that by <code>second<\/code>.","pl":"Mapa jest posortowana według klucza, a nie liczby wystąpień. Żeby wypisać najczęstsze słowa najpierw, skopiuj ją do <code>std::vector&lt;std::pair&lt;std::string, int&gt;&gt;<\/code> i posortuj go według <code>second<\/code>."},"see":[{"topic":"sorting","entry":null}]},{"id":"unordered-map","title":{"en":"std::unordered_map","pl":"std::unordered_map"},"explain":{"en":"Same interface as <code>std::map<\/code> (<code>[]<\/code>, <code>at<\/code>, <code>find<\/code>, <code>contains<\/code>, <code>erase<\/code>), but built on a hash table: lookups are O(1) on average instead of O(log n), and the keys are in no particular order. Use it when you don't need sorted keys.","pl":"Ten sam interfejs co <code>std::map<\/code> (<code>[]<\/code>, <code>at<\/code>, <code>find<\/code>, <code>contains<\/code>, <code>erase<\/code>), ale zbudowany na tablicy mieszającej (hash table): wyszukiwanie trwa średnio O(1) zamiast O(log n), a klucze nie są w żadnej określonej kolejności. Używaj, gdy nie potrzebujesz posortowanych kluczy."},"code":"std::unordered_map<std::string, int> price{{\"tea\", 4}, {\"cake\", 9}};\nprice[\"coffee\"] = 7;\nstd::cout << price.size() << ' ' << price.at(\"cake\") << '\\n';\nstd::cout << std::boolalpha << price.contains(\"milk\") << '\\n';\nint total = 0;\nfor (const auto& [item, p] : price) total += p;   // any order\nstd::cout << total << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"3 9\nfalse\n20","error":false,"pitfall":{"en":"The iteration order is unspecified and can change after an insert, so never rely on it; use <code>std::map<\/code> when you need sorted output. Keys also need a hash: <code>std::unordered_map&lt;std::pair&lt;int, int&gt;, int&gt;<\/code> doesn't compile without a custom one, while <code>std::map<\/code> accepts it.","pl":"Kolejność przechodzenia jest nieokreślona i może się zmienić po wstawieniu elementu, więc nigdy na niej nie polegaj; gdy potrzebujesz posortowanego wyniku, użyj <code>std::map<\/code>. Klucze muszą też mieć funkcję skrótu (hash): <code>std::unordered_map&lt;std::pair&lt;int, int&gt;, int&gt;<\/code> nie skompiluje się bez własnej, a <code>std::map<\/code> przyjmie taki klucz bez problemu."},"see":[{"topic":"set","entry":"unordered-set"}]}]},{"id":"set","glyph":"{ }","name":{"en":"set","pl":"set"},"summary":{"en":"Collections of unique values: std::set (sorted), insert / erase / contains, removing duplicates, std::unordered_set, std::multiset.","pl":"Zbiór (set) unikalnych wartości: std::set (posortowany), insert / erase / contains, usuwanie duplikatów, std::unordered_set, std::multiset."},"headers":["<set>","<unordered_set>"],"planned":false,"entries":[{"id":"basics","title":{"en":"Sorted and unique","pl":"Posortowany i bez powtórzeń"},"explain":{"en":"A <code>std::set&lt;T&gt;<\/code> keeps each value once and always in ascending order. Inserting a value that is already there does nothing. Inserting, erasing and searching are O(log n).","pl":"<code>std::set&lt;T&gt;<\/code> przechowuje każdą wartość tylko raz i zawsze w kolejności rosnącej. Wstawienie wartości, która już jest w zbiorze, nic nie zmienia. Wstawianie, usuwanie i wyszukiwanie mają złożoność O(log n)."},"code":"std::set<int> s{5, 1, 3, 1, 5};\ns.insert(4);\ns.insert(3);                     // already there: ignored\nfor (int x : s) std::cout << x << ' ';\nstd::cout << '\\n' << s.size() << '\\n';\nstd::cout << *s.begin() << ' ' << *s.rbegin() << '\\n';   // min and max","lang":"cpp","codeTitle":null,"input":null,"output":"1 3 4 5\n4\n1 5","error":false,"pitfall":{"en":"A set has no <code>[]<\/code> and no positions: <code>s[0]<\/code> doesn't compile. The smallest element is <code>*s.begin()<\/code>, the largest <code>*s.rbegin()<\/code>. Elements are <code>const<\/code>: to change one, erase it and insert the new value.","pl":"Zbiór nie ma <code>[]<\/code> ani numerów pozycji: <code>s[0]<\/code> się nie skompiluje. Najmniejszy element to <code>*s.begin()<\/code>, największy to <code>*s.rbegin()<\/code>. Elementy są <code>const<\/code>: żeby jeden zmienić, usuń go i wstaw nową wartość."},"see":[]},{"id":"insert-erase-find","title":{"en":"insert, erase, contains","pl":"insert, erase, contains"},"explain":{"en":"<code>insert<\/code> returns a pair: an iterator and a <code>bool<\/code> that is <code>true<\/code> if the value was new. <code>erase(value)<\/code> removes it. Check membership with <code>contains<\/code> (C++20), <code>count<\/code> (0 or 1) or <code>find<\/code> (<code>end()<\/code> if missing).","pl":"<code>insert<\/code> zwraca parę: iterator i <code>bool<\/code>, który ma wartość <code>true<\/code>, jeśli wartość była nowa. <code>erase(wartość)<\/code> ją usuwa. Przynależność sprawdzisz przez <code>contains<\/code> (C++20), <code>count<\/code> (0 albo 1) lub <code>find<\/code> (<code>end()<\/code>, gdy brak)."},"code":"std::set<std::string> tags{\"cpp\", \"stl\"};\nbool added = tags.insert(\"cpp\").second;      // already there\nstd::cout << std::boolalpha << added << '\\n';\ntags.erase(\"stl\");\nstd::cout << tags.contains(\"stl\") << ' ' << tags.count(\"cpp\") << '\\n';\nif (tags.find(\"cpp\") != tags.end()) {\n    std::cout << \"found cpp\\n\";\n}","lang":"cpp","codeTitle":null,"input":null,"output":"false\nfalse 1\nfound cpp","error":false,"pitfall":{"en":"Don't search a set with <code>std::find(s.begin(), s.end(), x)<\/code>: it checks the elements one by one, O(n). The member functions <code>s.find(x)<\/code> / <code>s.contains(x)<\/code> use the sorted structure and take O(log n).","pl":"Nie przeszukuj zbioru przez <code>std::find(s.begin(), s.end(), x)<\/code>: sprawdza elementy po kolei, O(n). Metody <code>s.find(x)<\/code> / <code>s.contains(x)<\/code> korzystają z uporządkowanej struktury i działają w O(log n)."},"see":[{"topic":"searching","entry":null}]},{"id":"remove-duplicates","title":{"en":"Removing duplicates","pl":"Usuwanie duplikatów"},"explain":{"en":"Building a set from a vector drops the duplicates and sorts the rest. To keep the original order instead, remember what you have seen: <code>insert(x).second<\/code> is <code>true<\/code> only the first time.","pl":"Zbudowanie zbioru z wektora usuwa duplikaty i sortuje resztę. Jeśli chcesz zachować pierwotną kolejność, zapamiętuj, co już było: <code>insert(x).second<\/code> ma wartość <code>true<\/code> tylko za pierwszym razem."},"code":"std::vector<int> v{4, 1, 4, 2, 1, 3};\nstd::set<int> s(v.begin(), v.end());          // sorted, unique\nstd::vector<int> sorted_unique(s.begin(), s.end());\nfor (int x : sorted_unique) std::cout << x << ' ';\nstd::cout << '\\n';\nstd::set<int> seen;                           // keep the original order\nfor (int x : v) {\n    if (seen.insert(x).second) std::cout << x << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 3 4\n4 1 2 3","error":false,"pitfall":null,"see":[{"topic":"sorting","entry":null},{"topic":"vector","entry":null}]},{"id":"unordered-set","title":{"en":"std::unordered_set","pl":"std::unordered_set"},"explain":{"en":"A hash-based set: <code>insert<\/code>, <code>erase<\/code>, <code>contains<\/code> and <code>find<\/code> work as in <code>std::set<\/code> but take O(1) on average, and the elements are in no particular order. A good choice for “have I seen this?” checks.","pl":"Zbiór oparty na tablicy mieszającej (hash table): <code>insert<\/code>, <code>erase<\/code>, <code>contains<\/code> i <code>find<\/code> działają jak w <code>std::set<\/code>, ale średnio w czasie O(1), a elementy nie są w żadnej określonej kolejności. Dobry wybór do sprawdzania „czy to już było?”."},"code":"std::vector<int> v{3, 8, 3, 5, 8};\nstd::unordered_set<int> seen;\nfor (int x : v) {\n    if (seen.contains(x)) std::cout << \"repeat: \" << x << '\\n';\n    seen.insert(x);\n}\nstd::cout << seen.size() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"repeat: 3\nrepeat: 8\n3","error":false,"pitfall":{"en":"Looping over an <code>unordered_set<\/code> gives the elements in an unspecified order that can change after inserts. If you print them, use <code>std::set<\/code> or copy them into a vector and sort it.","pl":"Pętla po <code>unordered_set<\/code> zwraca elementy w nieokreślonej kolejności, która może się zmienić po kolejnych wstawieniach. Jeśli je wypisujesz, użyj <code>std::set<\/code> albo skopiuj je do wektora i go posortuj."},"see":[{"topic":"map","entry":"unordered-map"}]},{"id":"multiset","title":{"en":"std::multiset","pl":"std::multiset"},"explain":{"en":"Like <code>std::set<\/code>, sorted, but duplicates are allowed. <code>count(x)<\/code> says how many copies there are. Handy as a sorted bag of values when you also need to remove single ones.","pl":"Jak <code>std::set<\/code>, posortowany, ale z dozwolonymi duplikatami. <code>count(x)<\/code> mówi, ile jest kopii danej wartości. Przydaje się jako posortowany „worek” wartości, z którego trzeba też usuwać pojedyncze elementy."},"code":"std::multiset<int> ms{3, 1, 3, 2, 3};\nstd::cout << ms.count(3) << '\\n';\nms.erase(ms.find(3));            // removes ONE 3\nfor (int x : ms) std::cout << x << ' ';\nstd::cout << '\\n';\nms.erase(3);                     // removes ALL the 3s\nstd::cout << ms.size() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"3\n1 2 3 3\n2","error":false,"pitfall":{"en":"<code>ms.erase(value)<\/code> removes every copy. To remove just one, erase an iterator: <code>ms.erase(ms.find(x))<\/code>, and check first that <code>find<\/code> didn't return <code>end()<\/code>.","pl":"<code>ms.erase(wartość)<\/code> usuwa wszystkie kopie. Żeby usunąć tylko jedną, usuń przez iterator: <code>ms.erase(ms.find(x))<\/code>, i najpierw sprawdź, czy <code>find<\/code> nie zwrócił <code>end()<\/code>."},"see":[]}]},{"id":"pair-tuple","glyph":"(a,b)","name":{"en":"pair &amp; tuple","pl":"pair i tuple"},"summary":{"en":"Grouping values without a struct: std::pair, std::tuple and std::get, structured bindings, comparing pairs, returning several values.","pl":"Para (pair) i krotka (tuple), czyli grupowanie wartości bez struktury: std::pair, std::tuple i std::get, dowiązania strukturalne, porównywanie par, zwracanie kilku wartości."},"headers":["<utility>","<tuple>"],"planned":false,"entries":[{"id":"pair","title":{"en":"std::pair","pl":"std::pair"},"explain":{"en":"A <code>std::pair&lt;A, B&gt;<\/code> holds two values, <code>first<\/code> and <code>second<\/code>, of any types. <code>std::make_pair<\/code> and C++17's <code>std::pair{...}<\/code> deduce the types for you. Map elements are pairs too.","pl":"<code>std::pair&lt;A, B&gt;<\/code> przechowuje dwie wartości dowolnych typów: <code>first<\/code> i <code>second<\/code>. <code>std::make_pair<\/code> oraz <code>std::pair{...}<\/code> z C++17 same wydedukują typy. Elementy mapy to również pary."},"code":"std::pair<std::string, int> p{\"Ann\", 31};\nstd::cout << p.first << ' ' << p.second << '\\n';\np.second = 32;\nauto q = std::make_pair(2, 'x');      // std::pair<int, char>\nstd::pair r{1.5, true};               // C++17: std::pair<double, bool>\nstd::cout << p.second << ' ' << q.first << q.second << ' ' << r.first << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"Ann 31\n32 2x 1.5","error":false,"pitfall":{"en":"<code>std::make_pair(\"Ann\", 1)<\/code> and <code>std::pair{\"Ann\", 1}<\/code> deduce <code>const char*<\/code>, not <code>std::string<\/code>, so <code>==<\/code> on the names compares addresses. Spell out the type, <code>std::pair&lt;std::string, int&gt;<\/code>, when you want a string.","pl":"<code>std::make_pair(\"Ann\", 1)<\/code> i <code>std::pair{\"Ann\", 1}<\/code> dedukują typ <code>const char*<\/code>, a nie <code>std::string<\/code>, więc <code>==<\/code> na imionach porównuje adresy. Jeśli chcesz mieć <code>std::string<\/code>, podaj typ wprost: <code>std::pair&lt;std::string, int&gt;<\/code>."},"see":[{"topic":"map","entry":null}]},{"id":"tuple","title":{"en":"std::tuple and std::get","pl":"std::tuple i std::get"},"explain":{"en":"A <code>std::tuple<\/code> is a pair with any number of elements. Read or change element <code>i<\/code> with <code>std::get&lt;i&gt;(t)<\/code>, or with <code>std::get&lt;Type&gt;(t)<\/code> when that type appears only once. <code>std::make_tuple<\/code> deduces the types.","pl":"<code>std::tuple<\/code> to para z dowolną liczbą elementów. Element <code>i<\/code> odczytasz lub zmienisz przez <code>std::get&lt;i&gt;(t)<\/code>, albo przez <code>std::get&lt;Typ&gt;(t)<\/code>, jeśli ten typ występuje tylko raz. <code>std::make_tuple<\/code> sam dedukuje typy."},"code":"std::tuple<std::string, int, double> t{\"Ann\", 31, 4.5};\nstd::cout << std::get<0>(t) << ' ' << std::get<1>(t) << '\\n';\nstd::get<2>(t) = 5.5;                        // get returns a reference\nstd::cout << std::get<double>(t) << '\\n';    // by type, if it is unique\nauto u = std::make_tuple(7, 'z');\nstd::cout << std::get<1>(u) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"Ann 31\n5.5\nz","error":false,"pitfall":{"en":"The index in <code>std::get&lt;i&gt;<\/code> must be known at compile time, so you can't loop over a tuple with an ordinary <code>for<\/code>. If you keep writing <code>std::get&lt;2&gt;(t)<\/code>, a <code>struct<\/code> with named fields is clearer.","pl":"Indeks w <code>std::get&lt;i&gt;<\/code> musi być znany w czasie kompilacji, więc nie przejdziesz po krotce zwykłą pętlą <code>for<\/code>. Jeśli ciągle piszesz <code>std::get&lt;2&gt;(t)<\/code>, czytelniejsza będzie struktura (<code>struct<\/code>) z nazwanymi polami."},"see":[]},{"id":"structured-bindings","title":{"en":"Structured bindings","pl":"Dowiązania strukturalne"},"explain":{"en":"<code>auto [a, b] = p;<\/code> (C++17) unpacks a pair, tuple, struct or array into named variables, one name per element. <code>auto&amp;<\/code> binds to the original instead of copying. Before C++17, <code>std::tie(a, b) = p;<\/code> assigned to existing variables.","pl":"<code>auto [a, b] = p;<\/code> (C++17) rozpakowuje parę, krotkę, strukturę albo tablicę do nazwanych zmiennych, po jednej nazwie na element (dowiązanie strukturalne, structured binding). <code>auto&amp;<\/code> odwołuje się do oryginału zamiast go kopiować. Przed C++17 używano <code>std::tie(a, b) = p;<\/code>, które przypisuje do istniejących zmiennych."},"code":"std::pair<std::string, int> p{\"Ann\", 31};\nauto [name, age] = p;                // copies\nstd::cout << name << ' ' << age << '\\n';\nauto& [n, a] = p;                    // references into p\na = 40;\nstd::cout << n << ' ' << p.second << '\\n';\nauto [x, y, z] = std::tuple{1, 2.5, 'c'};\nstd::cout << x << ' ' << y << ' ' << z << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"Ann 31\nAnn 40\n1 2.5 c","error":false,"pitfall":{"en":"<code>auto [name, age] = p;<\/code> makes copies, so <code>age = 40;<\/code> leaves <code>p<\/code> unchanged. Use <code>auto&amp;<\/code> to modify the original and <code>const auto&amp;<\/code> in loops to avoid copying. The number of names must match the number of elements exactly.","pl":"<code>auto [name, age] = p;<\/code> tworzy kopie, więc <code>age = 40;<\/code> nie zmienia <code>p<\/code>. Użyj <code>auto&amp;<\/code>, żeby zmieniać oryginał, a w pętlach <code>const auto&amp;<\/code>, żeby uniknąć kopiowania. Liczba nazw musi dokładnie odpowiadać liczbie elementów."},"see":[{"topic":"map","entry":"iterating"}]},{"id":"comparing","title":{"en":"Comparing and sorting pairs","pl":"Porównywanie i sortowanie par"},"explain":{"en":"Pairs and tuples compare lexicographically: by <code>first<\/code>, and only on a tie by <code>second<\/code>. So sorting a vector of pairs sorts by the first element, then the second. To compare structs by several fields, compare <code>std::tie(a.x, a.y) &lt; std::tie(b.x, b.y)<\/code>.","pl":"Pary i krotki porównuje się leksykograficznie: najpierw według <code>first<\/code>, a dopiero przy remisie według <code>second<\/code>. Dlatego sortowanie wektora par układa je według pierwszego elementu, potem drugiego. Struktury według kilku pól porównasz przez <code>std::tie(a.x, a.y) &lt; std::tie(b.x, b.y)<\/code>."},"code":"std::pair<int, char> a{1, 'b'};\nstd::pair<int, char> b{1, 'c'};\nstd::cout << (a < b) << ' ' << (a == b) << '\\n';   // first equal: compare second\nstd::vector<std::pair<int, std::string>> v{{2, \"b\"}, {1, \"z\"}, {2, \"a\"}};\nstd::sort(v.begin(), v.end());\nfor (const auto& [num, s] : v) std::cout << num << s << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 0\n1z 2a 2b","error":false,"pitfall":{"en":"To sort by <code>second<\/code> (e.g. words by count), either store the pairs the other way round, <code>{count, word}<\/code>, or pass <code>std::sort<\/code> a comparator that compares <code>second<\/code>.","pl":"Żeby posortować według <code>second<\/code> (np. słowa według liczby wystąpień), albo trzymaj pary odwrotnie, <code>{count, word}<\/code>, albo przekaż do <code>std::sort<\/code> komparator (comparator), który porównuje <code>second<\/code>."},"see":[{"topic":"sorting","entry":null}]},{"id":"returning","title":{"en":"Returning several values","pl":"Zwracanie kilku wartości"},"explain":{"en":"A function can return a <code>std::pair<\/code> or <code>std::tuple<\/code> with <code>return {a, b};<\/code> and the caller unpacks it with a structured binding. For more than two or three values, or results used in many places, a <code>struct<\/code> with named fields reads better.","pl":"Funkcja może zwrócić <code>std::pair<\/code> albo <code>std::tuple<\/code> przez <code>return {a, b};<\/code>, a wywołujący rozpakuje wynik dowiązaniem strukturalnym. Przy więcej niż dwóch–trzech wartościach albo wyniku używanym w wielu miejscach lepiej sprawdzi się <code>struct<\/code> z nazwanymi polami."},"code":"std::pair<int, int> divide(int a, int b) {\n    return {a / b, a % b};               // quotient, remainder\n}\n\nstd::tuple<int, int, double> stats(const std::vector<int>& v) {\n    int lo = v[0], hi = v[0], sum = 0;\n    for (int x : v) {\n        lo = std::min(lo, x);\n        hi = std::max(hi, x);\n        sum += x;\n    }\n    return {lo, hi, static_cast<double>(sum) / v.size()};\n}\n\nint main() {\n    auto [q, r] = divide(17, 5);\n    std::cout << q << ' ' << r << '\\n';\n    auto [lo, hi, avg] = stats({4, 9, 2, 6});\n    std::cout << lo << ' ' << hi << ' ' << avg << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"3 2\n2 9 5.25","error":false,"pitfall":null,"see":[{"topic":"functions","entry":null}]}]},{"id":"stack-queue","glyph":"push","name":{"en":"stack &amp; queue","pl":"stack i queue"},"summary":{"en":"Container adaptors: std::stack (LIFO), std::queue (FIFO), std::priority_queue (max- and min-heap) and why pop() returns nothing.","pl":"Adaptery kontenerów (container adaptors): std::stack (LIFO), std::queue (FIFO), std::priority_queue (kopiec max i min) i dlaczego pop() nic nie zwraca."},"headers":["<stack>","<queue>"],"planned":false,"entries":[{"id":"stack","title":{"en":"std::stack (LIFO)","pl":"std::stack (LIFO)"},"explain":{"en":"A stack gives access only to its top: <code>push<\/code> puts an element on top, <code>top<\/code> reads it and <code>pop<\/code> removes it. The last element in is the first out (LIFO). Use it for undo, matching brackets or depth-first search.","pl":"Stos (stack) daje dostęp tylko do wierzchołka: <code>push<\/code> kładzie element na wierzch, <code>top<\/code> go odczytuje, a <code>pop<\/code> usuwa. Ostatni włożony element wychodzi pierwszy (LIFO, last in, first out). Przydaje się do cofania operacji (undo), sprawdzania nawiasów i przeszukiwania w głąb (DFS)."},"code":"std::stack<int> s;\ns.push(1);\ns.push(2);\ns.push(3);\nstd::cout << \"top: \" << s.top() << \", size: \" << s.size() << '\\n';\nwhile (!s.empty()) {\n    std::cout << s.top() << ' ';   // read the top...\n    s.pop();                       // ...then remove it\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"top: 3, size: 3\n3 2 1","error":false,"pitfall":{"en":"<code>top()<\/code> and <code>pop()<\/code> on an empty stack are undefined behaviour, not an exception. Check <code>!s.empty()<\/code> first.","pl":"<code>top()<\/code> i <code>pop()<\/code> na pustym stosie to niezdefiniowane zachowanie (undefined behaviour), a nie wyjątek. Najpierw sprawdź <code>!s.empty()<\/code>."},"see":[]},{"id":"queue","title":{"en":"std::queue (FIFO)","pl":"std::queue (FIFO)"},"explain":{"en":"A queue works like a line at a shop: <code>push<\/code> adds at the back, <code>front<\/code> reads and <code>pop<\/code> removes the oldest element (first in, first out). <code>back<\/code> shows the newest one. Typical uses: breadth-first search (BFS) and handling tasks in order.","pl":"Kolejka (queue) działa jak kolejka w sklepie: <code>push<\/code> dodaje na koniec, <code>front<\/code> odczytuje, a <code>pop<\/code> usuwa najstarszy element (FIFO, first in, first out). <code>back<\/code> pokazuje najnowszy. Typowe zastosowania: przeszukiwanie wszerz (BFS) i obsługa zadań po kolei."},"code":"std::queue<std::string> q;\nq.push(\"Ann\");\nq.push(\"Bob\");\nq.push(\"Cid\");\nstd::cout << \"front: \" << q.front() << \", back: \" << q.back() << '\\n';\nwhile (!q.empty()) {\n    std::cout << q.front() << ' ';\n    q.pop();                       // removes the front\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"front: Ann, back: Cid\nAnn Bob Cid","error":false,"pitfall":{"en":"The names differ: <code>std::stack<\/code> and <code>std::priority_queue<\/code> have <code>top()<\/code>, while <code>std::queue<\/code> has <code>front()<\/code> and <code>back()<\/code>. <code>q.top()<\/code> does not compile.","pl":"Nazwy się różnią: <code>std::stack<\/code> i <code>std::priority_queue<\/code> mają <code>top()<\/code>, a <code>std::queue<\/code> ma <code>front()<\/code> i <code>back()<\/code>. <code>q.top()<\/code> się nie skompiluje."},"see":[]},{"id":"pop-returns-nothing","title":{"en":"pop() returns nothing","pl":"pop() nic nie zwraca"},"explain":{"en":"<code>pop()<\/code> only removes the element and returns <code>void<\/code>. To take an element out, first read it with <code>top()<\/code> (<code>front()<\/code> for a queue), then call <code>pop()<\/code>.","pl":"<code>pop()<\/code> tylko usuwa element i zwraca <code>void<\/code>. Żeby wyjąć element, najpierw odczytaj go przez <code>top()<\/code> (w kolejce przez <code>front()<\/code>), a dopiero potem wywołaj <code>pop()<\/code>."},"code":"std::stack<int> s;\ns.push(42);\nint x = s.pop();   // wrong: pop() returns void","lang":"cpp","codeTitle":null,"input":null,"output":"error: void value not ignored as it ought to be","error":true,"pitfall":{"en":"<code>int&amp; x = s.top(); s.pop();<\/code> compiles but leaves <code>x<\/code> dangling: the element it refers to is gone. Copy the value instead: <code>int x = s.top();<\/code>.","pl":"<code>int&amp; x = s.top(); s.pop();<\/code> się kompiluje, ale <code>x<\/code> zostaje wiszącą referencją (dangling reference), bo element już nie istnieje. Skopiuj wartość: <code>int x = s.top();<\/code>."},"see":[{"topic":"references","entry":null}]},{"id":"priority-queue","title":{"en":"std::priority_queue (max-heap)","pl":"std::priority_queue (kopiec max)"},"explain":{"en":"A priority queue always has the largest element on <code>top()<\/code>; <code>push<\/code> and <code>pop<\/code> take O(log n). Inside it is a heap, not a sorted list, so you can't iterate over it, only take elements from the top. Use it for \"the most important task next\" or the k largest values.","pl":"Kolejka priorytetowa (priority queue) zawsze ma największy element na <code>top()<\/code>; <code>push<\/code> i <code>pop<\/code> działają w O(log n). W środku jest kopiec (heap), a nie posortowana lista, więc nie da się po nim iterować, można tylko zdejmować elementy z góry. Przydaje się do wybierania „najważniejszego zadania” albo k największych wartości."},"code":"std::priority_queue<int> pq;\nfor (int x : {3, 8, 1, 5}) {\n    pq.push(x);\n}\nstd::cout << \"top: \" << pq.top() << '\\n';   // always the largest\nwhile (!pq.empty()) {\n    std::cout << pq.top() << ' ';\n    pq.pop();\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"top: 8\n8 5 3 1","error":false,"pitfall":{"en":"Printing a priority queue empties it, because <code>top<\/code> + <code>pop<\/code> is the only way to see the elements. If you still need it, print a copy: <code>auto copy = pq;<\/code>.","pl":"Wypisanie kolejki priorytetowej ją opróżnia, bo elementy widać tylko przez <code>top<\/code> + <code>pop<\/code>. Jeśli jeszcze jej potrzebujesz, wypisuj kopię: <code>auto copy = pq;<\/code>."},"see":[]},{"id":"min-heap","title":{"en":"Min-heap with std::greater","pl":"Kopiec min z std::greater"},"explain":{"en":"Pass <code>std::greater&lt;int&gt;<\/code> as the third template argument to get the smallest element on top; the second one, the underlying container, must then be written too. Pairs work as well: they compare by <code>first<\/code>, then by <code>second<\/code>, which is handy for (distance, vertex) in Dijkstra's algorithm.","pl":"Podaj <code>std::greater&lt;int&gt;<\/code> jako trzeci argument szablonu, a na górze będzie najmniejszy element; wtedy trzeba też wpisać drugi argument, czyli kontener pod spodem. Działa to również dla par: porównują się po <code>first<\/code>, potem po <code>second<\/code>, co przydaje się np. dla par (odległość, wierzchołek) w algorytmie Dijkstry."},"code":"std::priority_queue<int, std::vector<int>, std::greater<int>> pq;\nfor (int x : {3, 8, 1, 5}) {\n    pq.push(x);\n}\nwhile (!pq.empty()) {\n    std::cout << pq.top() << ' ';   // smallest first\n    pq.pop();\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 3 5 8","error":false,"pitfall":{"en":"It feels backwards: with <code>std::sort<\/code>, <code>std::greater<\/code> sorts <em>descending<\/em>, but in a priority queue it puts the <em>smallest<\/em> element on top. The top is always the element that would come <em>last<\/em> if you sorted with the same comparator.","pl":"To działa „na odwrót”: w <code>std::sort<\/code> komparator <code>std::greater<\/code> sortuje <em>malejąco<\/em>, a w kolejce priorytetowej daje <em>najmniejszy<\/em> element na górze. Na górze jest zawsze ten element, który przy sortowaniu tym samym komparatorem byłby <em>ostatni<\/em>."},"see":[{"topic":"sorting","entry":null},{"topic":"pair-tuple","entry":null}]},{"id":"matching-brackets","title":{"en":"Example: matching brackets","pl":"Przykład: sprawdzanie nawiasów"},"explain":{"en":"A classic stack task: push every opening bracket; at a closing one, the top of the stack must be its partner. At the end the stack must be empty.","pl":"Klasyczne zadanie na stos: każdy nawias otwierający wkładamy na stos, a przy zamykającym na wierzchu musi leżeć jego para. Na końcu stos musi być pusty."},"code":"bool balanced(const std::string& text) {\n    std::stack<char> opening;\n    for (char c : text) {\n        if (c == '(' || c == '[' || c == '{') {\n            opening.push(c);\n        } else if (c == ')' || c == ']' || c == '}') {\n            char want = c == ')' ? '(' : c == ']' ? '[' : '{';\n            if (opening.empty() || opening.top() != want) {\n                return false;\n            }\n            opening.pop();\n        }\n    }\n    return opening.empty();   // anything left open?\n}\n\nint main() {\n    std::cout << std::boolalpha;\n    std::cout << balanced(\"{a[b(c)]}\") << '\\n';\n    std::cout << balanced(\"(]\") << '\\n';\n    std::cout << balanced(\"((\") << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"true\nfalse\nfalse","error":false,"pitfall":null,"see":[]}]},{"id":"deque-list","glyph":"<->","name":{"en":"deque &amp; list","pl":"deque i list"},"summary":{"en":"std::deque (fast at both ends), std::list (linked list: insert and erase anywhere, splice, no []) and choosing the right container.","pl":"std::deque (szybki na obu końcach), std::list (lista dwukierunkowa: wstawianie i usuwanie w dowolnym miejscu, splice, brak []) i wybór właściwego kontenera."},"headers":["<deque>","<list>"],"planned":false,"entries":[{"id":"deque","title":{"en":"std::deque: both ends","pl":"std::deque: oba końce"},"explain":{"en":"A deque (double-ended queue, say \"deck\") adds and removes quickly at the front <em>and<\/em> at the back, and still has <code>[]<\/code> and <code>at<\/code>. Use it when you need <code>push_front<\/code>, e.g. for a sliding window or a queue you also index into.","pl":"Deque (double-ended queue, czyt. „dek”) to kolejka dwustronna: szybko dodaje i usuwa elementy z przodu <em>i<\/em> z tyłu, a do tego ma <code>[]<\/code> i <code>at<\/code>. Używaj jej, gdy potrzebujesz <code>push_front<\/code>, np. w przesuwanym oknie (sliding window) albo kolejce, do której odwołujesz się też po indeksie."},"code":"std::deque<int> d{2, 3};\nd.push_front(1);    // fast at the front\nd.push_back(4);     // and at the back\nstd::cout << d.front() << ' ' << d.back() << ' ' << d[1] << '\\n';\nd.pop_front();\nd.pop_back();\nfor (int x : d) {\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 4 2\n2 3","error":false,"pitfall":{"en":"<code>std::vector<\/code> has no <code>push_front<\/code>. <code>v.insert(v.begin(), x)<\/code> works, but it shifts every element, O(n) each time. If you often add at the front, use a deque.","pl":"<code>std::vector<\/code> nie ma <code>push_front<\/code>. <code>v.insert(v.begin(), x)<\/code> działa, ale przesuwa wszystkie elementy, za każdym razem O(n). Jeśli często dodajesz na początek, użyj deque."},"see":[{"topic":"vector","entry":null},{"topic":"stack-queue","entry":null}]},{"id":"list","title":{"en":"std::list basics","pl":"std::list: podstawy"},"explain":{"en":"<code>std::list<\/code> is a doubly linked list: every element is a separate node that knows its neighbours. It has <code>push_front<\/code> / <code>push_back<\/code>, <code>front<\/code> / <code>back<\/code> and range-based <code>for<\/code>, but no indexing: to reach the n-th element you have to walk there.","pl":"<code>std::list<\/code> to lista dwukierunkowa (doubly linked list): każdy element to osobny węzeł (node), który zna swoich sąsiadów. Ma <code>push_front<\/code> / <code>push_back<\/code>, <code>front<\/code> / <code>back<\/code> i pętlę zakresową <code>for<\/code>, ale nie ma indeksowania: do n-tego elementu trzeba dojść krok po kroku."},"code":"std::list<int> l{2, 3};\nl.push_front(1);\nl.push_back(4);\nfor (int x : l) {\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';\nstd::cout << l.front() << ' ' << l.back() << ' ' << l.size() << '\\n';\n// l[1];  // error: std::list has no operator[]","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 3 4\n1 4 4","error":false,"pitfall":{"en":"<code>l[1]<\/code> does not compile. <code>*std::next(l.begin(), 1)<\/code> works, but it walks the list step by step (O(n)); calling it in a loop makes the loop O(n²). If you need indexing, use a vector or a deque.","pl":"<code>l[1]<\/code> się nie skompiluje. <code>*std::next(l.begin(), 1)<\/code> działa, ale przechodzi listę krok po kroku (O(n)); wywołane w pętli robi z niej O(n²). Jeśli potrzebujesz indeksowania, użyj vectora albo deque."},"see":[{"topic":"iterators","entry":null}]},{"id":"insert-erase","title":{"en":"Inserting and erasing anywhere","pl":"Wstawianie i usuwanie w środku"},"explain":{"en":"<code>insert(it, value)<\/code> adds before the iterator <code>it<\/code>; <code>erase(it)<\/code> removes that element and returns an iterator to the next one. Both are O(1) because nothing is shifted, and iterators to the other elements stay valid.","pl":"<code>insert(it, value)<\/code> wstawia element przed iteratorem (iterator) <code>it<\/code>, a <code>erase(it)<\/code> usuwa wskazany element i zwraca iterator do następnego. Obie operacje są O(1), bo nic nie jest przesuwane, a iteratory do pozostałych elementów pozostają ważne."},"code":"std::list<std::string> l{\"a\", \"c\", \"x\", \"d\"};\nauto it = std::find(l.begin(), l.end(), \"c\");\nl.insert(it, \"b\");           // before \"c\"; it still points at \"c\"\nauto next = l.erase(std::next(it));   // remove \"x\"\nstd::cout << *it << ' ' << *next << '\\n';\nfor (const auto& s : l) {\n    std::cout << s << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"c d\na b c d","error":false,"pitfall":{"en":"Only the insert/erase itself is O(1). Finding the position (<code>std::find<\/code>) still walks the list, O(n). A list pays off when you already hold iterators to the places you change.","pl":"O(1) jest tylko samo wstawienie lub usunięcie. Znalezienie miejsca (<code>std::find<\/code>) i tak przechodzi listę, czyli O(n). Lista się opłaca, gdy masz już iteratory do miejsc, które zmieniasz."},"see":[]},{"id":"list-methods","title":{"en":"sort, unique, remove","pl":"sort, unique, remove"},"explain":{"en":"A list has its own member functions for jobs that the general algorithms can't do on it: <code>l.sort()<\/code>, <code>l.unique()<\/code> (drops adjacent duplicates), <code>l.remove(value)<\/code> (drops every copy of the value) and <code>l.reverse()<\/code>.","pl":"Lista ma własne metody do zadań, których ogólne algorytmy na niej nie wykonają: <code>l.sort()<\/code>, <code>l.unique()<\/code> (usuwa sąsiadujące duplikaty), <code>l.remove(value)<\/code> (usuwa każde wystąpienie wartości) i <code>l.reverse()<\/code>."},"code":"std::list<int> l{5, 3, 5, 1, 3, 3};\nl.sort();          // not std::sort!\nl.unique();        // 1 3 5\nfor (int x : l) {\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';\nl.remove(3);       // 1 5\nl.reverse();\nstd::cout << l.front() << ' ' << l.back() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 3 5\n5 1","error":false,"pitfall":{"en":"<code>std::sort(l.begin(), l.end())<\/code> does not compile: <code>std::sort<\/code> needs random-access iterators (<code>it + n<\/code>), and a list only steps one by one. Call <code>l.sort()<\/code> instead.","pl":"<code>std::sort(l.begin(), l.end())<\/code> się nie skompiluje: <code>std::sort<\/code> wymaga iteratorów o dostępie swobodnym (random access, <code>it + n<\/code>), a lista przechodzi tylko krok po kroku. Wywołaj <code>l.sort()<\/code>."},"see":[{"topic":"sorting","entry":null}]},{"id":"splice","title":{"en":"splice: moving nodes","pl":"splice: przenoszenie węzłów"},"explain":{"en":"<code>a.splice(pos, b)<\/code> moves all nodes of <code>b<\/code> into <code>a<\/code> before <code>pos<\/code> without copying anything; <code>b<\/code> ends up empty. <code>a.splice(pos, a, it)<\/code> moves a single element, even within the same list (e.g. \"move to front\" in an LRU cache).","pl":"<code>a.splice(pos, b)<\/code> przenosi wszystkie węzły listy <code>b<\/code> do <code>a<\/code> przed <code>pos<\/code>, niczego nie kopiując; <code>b<\/code> zostaje pusta. <code>a.splice(pos, a, it)<\/code> przenosi jeden element, także w obrębie tej samej listy (np. „przesuń na początek” w pamięci podręcznej LRU)."},"code":"std::list<int> a{1, 2, 6};\nstd::list<int> b{3, 4, 5};\na.splice(std::next(a.begin(), 2), b);         // all of b goes before 6\nfor (int x : a) {\n    std::cout << x << ' ';\n}\nstd::cout << \"| b.size() = \" << b.size() << '\\n';\na.splice(a.begin(), a, std::prev(a.end()));   // last element to the front\nstd::cout << a.front() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 3 4 5 6 | b.size() = 0\n6","error":false,"pitfall":null,"see":[]},{"id":"choosing","title":{"en":"Choosing a container","pl":"Wybór kontenera"},"explain":{"en":"Start with <code>std::vector<\/code>. Switch to <code>std::deque<\/code> when you need to add or remove at the front. Choose <code>std::list<\/code> only when you insert and erase in the middle through iterators a lot, or need <code>splice<\/code> or iterators that stay valid while other elements come and go.","pl":"Zacznij od <code>std::vector<\/code>. Przejdź na <code>std::deque<\/code>, gdy musisz dodawać lub usuwać z przodu. <code>std::list<\/code> wybieraj tylko wtedy, gdy często wstawiasz i usuwasz w środku przez iteratory albo potrzebujesz <code>splice<\/code> lub iteratorów, które pozostają ważne, gdy dodajesz i usuwasz inne elementy."},"code":"                    vector   deque   list\n[] / at             O(1)     O(1)    -\npush_back           O(1)*    O(1)    O(1)\npush_front          -        O(1)    O(1)\ninsert/erase middle O(n)     O(n)    O(1)**\ncontiguous memory   yes      no      no\n\n*  amortised    ** once you have an iterator there","lang":"text","codeTitle":null,"input":null,"output":null,"error":false,"pitfall":{"en":"On paper a list wins for inserts in the middle, but in practice a vector is often faster: the list first has to walk to the position, and its nodes are scattered in memory. Measure before you pick a list.","pl":"Na papierze lista wygrywa przy wstawianiu w środku, ale w praktyce vector jest często szybszy: lista musi najpierw dojść do miejsca, a jej węzły są rozrzucone po pamięci. Zmierz, zanim wybierzesz listę."},"see":[{"topic":"vector","entry":null},{"topic":"map","entry":null},{"topic":"set","entry":null},{"topic":"stack-queue","entry":null}]}]}]},{"id":"algorithms","hue":90,"name":{"en":"STL algorithms","pl":"Algorytmy STL"},"desc":{"en":"Iterators, lambdas and the &lt;algorithm&gt; toolbox.","pl":"Iteratory, lambdy i skrzynka narzędzi z &lt;algorithm&gt;."},"topics":[{"id":"iterators","glyph":"it++","name":{"en":"Iterators","pl":"Iteratory"},"summary":{"en":"begin/end, looping with an iterator, const and reverse iterators, std::next/advance/distance and iterator invalidation.","pl":"Iteratory (iterators): begin/end, pętle z iteratorem, iteratory const i odwrotne, std::next/advance/distance oraz unieważnianie iteratorów."},"headers":["<iterator>"],"planned":false,"entries":[{"id":"begin-end","title":{"en":"begin and end","pl":"begin i end"},"explain":{"en":"An iterator points at an element of a container: <code>*it<\/code> reads it, <code>++it<\/code> moves to the next one. <code>begin()<\/code> points at the first element, <code>end()<\/code> one <em>past<\/em> the last. Algorithms take such a range, e.g. <code>std::sort(v.begin(), v.end())<\/code>.","pl":"Iterator wskazuje element kontenera: <code>*it<\/code> go odczytuje, a <code>++it<\/code> przechodzi do następnego. <code>begin()<\/code> wskazuje pierwszy element, a <code>end()<\/code> miejsce <em>za<\/em> ostatnim. Algorytmy przyjmują taki zakres (range), np. <code>std::sort(v.begin(), v.end())<\/code>."},"code":"std::vector<int> v{10, 20, 30};\nauto first = v.begin();     // points at 10\nauto last = v.end() - 1;    // end() is one PAST the last element\nstd::cout << *first << ' ' << *last << '\\n';\n++first;                    // move to the next element\nstd::cout << *first << '\\n';\nstd::vector<int> empty;\nstd::cout << std::boolalpha << (empty.begin() == empty.end()) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"10 30\n20\ntrue","error":false,"pitfall":{"en":"<code>*v.end()<\/code> is undefined behaviour: there is no element there. In an empty container <code>begin() == end()<\/code>, so <code>*v.begin()<\/code> is UB too. Check <code>!v.empty()<\/code> first.","pl":"<code>*v.end()<\/code> to niezdefiniowane zachowanie (undefined behaviour, UB): tam nie ma żadnego elementu. W pustym kontenerze <code>begin() == end()<\/code>, więc <code>*v.begin()<\/code> też jest UB. Najpierw sprawdź <code>!v.empty()<\/code>."},"see":[{"topic":"vector","entry":null},{"topic":"sorting","entry":null}]},{"id":"iterator-loop","title":{"en":"Looping with an iterator","pl":"Pętla z iteratorem"},"explain":{"en":"Start at <code>begin()<\/code>, stop at <code>end()<\/code>, step with <code>++it<\/code>. The full type <code>std::vector&lt;std::string&gt;::iterator<\/code> is long, so write <code>auto<\/code>. Through <code>*it<\/code> you can change the element; <code>it-&gt;size()<\/code> is short for <code>(*it).size()<\/code>.","pl":"Zaczynasz od <code>begin()<\/code>, kończysz na <code>end()<\/code>, przesuwasz się przez <code>++it<\/code>. Pełny typ <code>std::vector&lt;std::string&gt;::iterator<\/code> jest długi, więc pisz <code>auto<\/code>. Przez <code>*it<\/code> możesz zmienić element; <code>it-&gt;size()<\/code> to skrót od <code>(*it).size()<\/code>."},"code":"std::vector<std::string> words{\"ant\", \"bee\", \"cat\"};\n// auto = std::vector<std::string>::iterator\nfor (auto it = words.begin(); it != words.end(); ++it) {\n    *it += \"s\";                    // *it is the element itself\n    std::cout << *it << \": \" << it->size() << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"ants: 4\nbees: 4\ncats: 4","error":false,"pitfall":{"en":"Compare with <code>it != v.end()<\/code>, not <code>it &lt; v.end()<\/code>: <code>&lt;<\/code> works only for vectors and similar, while <code>!=<\/code> works for every container (list, map, set…).","pl":"Porównuj przez <code>it != v.end()<\/code>, a nie <code>it &lt; v.end()<\/code>: <code>&lt;<\/code> działa tylko dla vectora i podobnych, a <code>!=<\/code> dla każdego kontenera (list, map, set…)."},"see":[{"topic":"loops","entry":null}]},{"id":"const-iterators","title":{"en":"const iterators","pl":"Iteratory const"},"explain":{"en":"A <code>const_iterator<\/code> can read but not change the element. You get one from <code>begin()<\/code> on a <code>const<\/code> container, or from <code>cbegin()<\/code> / <code>cend()<\/code> on any container. Use it when you only read.","pl":"Iterator <code>const_iterator<\/code> pozwala czytać element, ale nie zmieniać go. Dostajesz go z <code>begin()<\/code> na kontenerze <code>const<\/code> albo z <code>cbegin()<\/code> / <code>cend()<\/code> na dowolnym kontenerze. Używaj go, gdy tylko czytasz."},"code":"void print(const std::vector<int>& v) {\n    // v is const, so v.begin() gives a const_iterator\n    for (auto it = v.begin(); it != v.end(); ++it) {\n        // *it = 0;  // error: assignment of read-only location\n        std::cout << *it << ' ';\n    }\n    std::cout << '\\n';\n}\n\nint main() {\n    std::vector<int> v{3, 1, 2};\n    print(v);\n    auto it = v.cbegin();   // read-only, although v is not const\n    std::cout << *it << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"3 1 2\n3","error":false,"pitfall":{"en":"<code>const_iterator<\/code> is not the same as <code>const iterator<\/code>. A <code>const_iterator<\/code> can move but can't change the element; a <code>const std::vector&lt;int&gt;::iterator<\/code> can change the element but can't move (<code>++it<\/code> fails).","pl":"<code>const_iterator<\/code> to nie to samo co <code>const iterator<\/code>. <code>const_iterator<\/code> może się przesuwać, ale nie zmieni elementu; <code>const std::vector&lt;int&gt;::iterator<\/code> może zmienić element, ale nie może się przesunąć (<code>++it<\/code> się nie skompiluje)."},"see":[]},{"id":"reverse-iterators","title":{"en":"Reverse iterators","pl":"Iteratory odwrotne"},"explain":{"en":"<code>rbegin()<\/code> points at the last element and <code>rend()<\/code> before the first; <code>++<\/code> on a reverse iterator moves <em>backwards<\/em>. Any iterator range can also build a new container, e.g. a reversed copy of a string.","pl":"<code>rbegin()<\/code> wskazuje ostatni element, a <code>rend()<\/code> miejsce przed pierwszym; <code>++<\/code> na iteratorze odwrotnym (reverse iterator) przesuwa się <em>do tyłu<\/em>. Z dowolnego zakresu iteratorów można też zbudować nowy kontener, np. odwróconą kopię napisu."},"code":"std::vector<int> v{1, 2, 3, 4};\nfor (auto it = v.rbegin(); it != v.rend(); ++it) {   // ++ goes backwards\n    std::cout << *it << ' ';\n}\nstd::cout << '\\n';\nstd::string s = \"stressed\";\nstd::string r(s.rbegin(), s.rend());   // a string from an iterator range\nstd::cout << r << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"4 3 2 1\ndesserts","error":false,"pitfall":{"en":"Looping backwards with an index, <code>for (std::size_t i = v.size() - 1; i &gt;= 0; --i)<\/code>, never ends: an unsigned <code>i<\/code> is always <code>&gt;= 0<\/code> and wraps around to a huge number. Use <code>rbegin()<\/code> / <code>rend()<\/code> instead.","pl":"Pętla wstecz po indeksie, <code>for (std::size_t i = v.size() - 1; i &gt;= 0; --i)<\/code>, nigdy się nie kończy: <code>i<\/code> bez znaku (unsigned) jest zawsze <code>&gt;= 0<\/code> i „przekręca się” do ogromnej liczby. Użyj <code>rbegin()<\/code> / <code>rend()<\/code>."},"see":[{"topic":"strings","entry":null}]},{"id":"next-advance-distance","title":{"en":"next, advance, distance","pl":"next, advance, distance"},"explain":{"en":"<code>std::next(it, n)<\/code> returns a new iterator n steps ahead, <code>std::prev<\/code> goes back, <code>std::advance(it, n)<\/code> moves <code>it<\/code> itself, and <code>std::distance(a, b)<\/code> counts the steps from <code>a<\/code> to <code>b<\/code>. They work for every container; <code>std::distance(v.begin(), it)<\/code> turns an iterator into an index.","pl":"<code>std::next(it, n)<\/code> zwraca nowy iterator o n kroków dalej, <code>std::prev<\/code> cofa, <code>std::advance(it, n)<\/code> przesuwa sam <code>it<\/code>, a <code>std::distance(a, b)<\/code> liczy kroki od <code>a<\/code> do <code>b<\/code>. Działają dla każdego kontenera; <code>std::distance(v.begin(), it)<\/code> zamienia iterator na indeks."},"code":"std::list<int> l{10, 20, 30, 40, 50};\nauto it = std::next(l.begin(), 2);       // new iterator, 2 steps ahead\nstd::cout << *it << '\\n';\nstd::advance(it, 1);                     // moves it itself\nstd::cout << *it << '\\n';\nstd::cout << *std::prev(l.end()) << '\\n';            // the last element\nstd::cout << std::distance(l.begin(), it) << '\\n';   // its index","lang":"cpp","codeTitle":null,"input":null,"output":"30\n40\n50\n3","error":false,"pitfall":{"en":"<code>it + 2<\/code> compiles only for random-access iterators (vector, deque, string, array). For list, set and map use <code>std::next<\/code>. Moving past <code>end()<\/code> is undefined behaviour with both.","pl":"<code>it + 2<\/code> kompiluje się tylko dla iteratorów o dostępie swobodnym (random access: vector, deque, string, array). Dla list, set i map użyj <code>std::next<\/code>. Wyjście poza <code>end()<\/code> to niezdefiniowane zachowanie w obu przypadkach."},"see":[{"topic":"deque-list","entry":null},{"topic":"searching","entry":null}]},{"id":"invalidation","title":{"en":"Iterator invalidation","pl":"Unieważnianie iteratorów"},"explain":{"en":"Changing a container can invalidate iterators (and references) into it. In a vector, <code>push_back<\/code> / <code>insert<\/code> may move all elements to new memory, and <code>erase<\/code> invalidates the erased element and everything after it. To erase while looping, continue from the iterator that <code>erase<\/code> returns.","pl":"Zmiana kontenera może unieważnić (invalidate) iteratory i referencje do jego elementów. W vectorze <code>push_back<\/code> / <code>insert<\/code> mogą przenieść wszystkie elementy w nowe miejsce pamięci, a <code>erase<\/code> unieważnia usunięty element i wszystkie za nim. Żeby usuwać w trakcie pętli, kontynuuj od iteratora zwróconego przez <code>erase<\/code>."},"code":"std::vector<int> v{1, 2, 3, 4, 5, 6};\nfor (auto it = v.begin(); it != v.end(); ) {   // no ++it here\n    if (*it % 2 == 0) {\n        it = v.erase(it);   // returns the next valid iterator\n    } else {\n        ++it;\n    }\n}\nfor (int x : v) {\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 3 5","error":false,"pitfall":{"en":"<code>v.erase(it); ++it;<\/code> uses an invalid iterator, and <code>for (int x : v) v.push_back(x);<\/code> breaks the hidden iterators of the range <code>for<\/code>: both are undefined behaviour. In C++20 the simplest way is <code>std::erase_if(v, pred)<\/code>.","pl":"<code>v.erase(it); ++it;<\/code> używa unieważnionego iteratora, a <code>for (int x : v) v.push_back(x);<\/code> psuje ukryte iteratory pętli zakresowej <code>for<\/code>: oba przypadki to niezdefiniowane zachowanie. W C++20 najprościej użyć <code>std::erase_if(v, pred)<\/code>."},"see":[{"topic":"transforming","entry":null},{"topic":"vector","entry":null}]}]},{"id":"lambdas","glyph":"[]{}","name":{"en":"Lambdas","pl":"Lambdy"},"summary":{"en":"Lambda syntax, captures ([=], [&amp;], named), mutable, generic lambdas, std::function and lambdas in algorithms.","pl":"Lambdy (lambda expressions): składnia, przechwytywanie (captures) [=], [&amp;] i po nazwie, mutable, lambdy generyczne, std::function i lambdy w algorytmach."},"headers":["<algorithm>","<functional>"],"planned":false,"entries":[{"id":"syntax","title":{"en":"Lambda syntax","pl":"Składnia lambdy"},"explain":{"en":"<code>[captures](parameters) { body }<\/code> is a small unnamed function written right where you need it. Store it in an <code>auto<\/code> variable and call it like a function. The return type is deduced from <code>return<\/code>, or given with <code>-&gt; type<\/code>.","pl":"<code>[captures](parameters) { body }<\/code> to mała, nienazwana funkcja zapisana dokładnie tam, gdzie jej potrzebujesz. Zapisz ją w zmiennej <code>auto<\/code> i wywołuj jak zwykłą funkcję. Typ zwracany jest wydedukowany z <code>return<\/code> albo podany jawnie przez <code>-&gt; typ<\/code>."},"code":"auto greet = [] { std::cout << \"Hi!\\n\"; };       // no parameters\ngreet();\nauto add = [](int a, int b) { return a + b; };   // returns int (deduced)\nstd::cout << add(2, 3) << '\\n';\nauto half = [](int x) -> double {                // explicit return type\n    if (x < 0) return 0;                         // int 0 becomes 0.0\n    return x / 2.0;\n};\nstd::cout << half(7) << ' ' << half(-4) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"Hi!\n5\n3.5 0","error":false,"pitfall":{"en":"Without <code>-&gt; double<\/code>, <code>half<\/code> does not compile: <code>return 0;<\/code> gives <code>int<\/code> and <code>return x / 2.0;<\/code> gives <code>double<\/code>, and all returns must deduce the same type. Add <code>-&gt; type<\/code> or write <code>return 0.0;<\/code>.","pl":"Bez <code>-&gt; double<\/code> lambda <code>half<\/code> się nie skompiluje: <code>return 0;<\/code> daje <code>int<\/code>, a <code>return x / 2.0;<\/code> daje <code>double<\/code>, a wszystkie <code>return<\/code> muszą dawać ten sam typ. Dopisz <code>-&gt; typ<\/code> albo napisz <code>return 0.0;<\/code>."},"see":[{"topic":"functions","entry":null}]},{"id":"captures","title":{"en":"Captures","pl":"Przechwytywanie zmiennych"},"explain":{"en":"A lambda sees local variables only if it captures them. <code>[x]<\/code> copies <code>x<\/code> when the lambda is created, <code>[&amp;x]<\/code> refers to the original. <code>[=]<\/code> copies everything used, <code>[&amp;]<\/code> takes everything by reference, and they mix: <code>[=, &amp;total]<\/code>. <code>[]<\/code> captures nothing.","pl":"Lambda widzi zmienne lokalne tylko wtedy, gdy je przechwyci (capture). <code>[x]<\/code> kopiuje <code>x<\/code> w chwili utworzenia lambdy, a <code>[&amp;x]<\/code> odwołuje się do oryginału. <code>[=]<\/code> kopiuje wszystko, czego używa, <code>[&amp;]<\/code> bierze wszystko przez referencję, i można je łączyć: <code>[=, &amp;total]<\/code>. <code>[]<\/code> nie przechwytuje niczego."},"code":"int x = 1;\nauto byValue = [x] { return x; };   // a copy of x, taken now\nauto byRef = [&x] { return x; };    // a reference to x\nx = 100;\nstd::cout << byValue() << ' ' << byRef() << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 100","error":false,"pitfall":{"en":"A lambda that captures locals by reference must not outlive them. Returning <code>[&amp;] { return count; }<\/code> from a function leaves a dangling reference: calling it later is undefined behaviour. Capture by value instead.","pl":"Lambda, która przechwytuje zmienne lokalne przez referencję, nie może żyć dłużej niż one. Zwrócenie <code>[&amp;] { return count; }<\/code> z funkcji zostawia wiszącą referencję (dangling reference): późniejsze wywołanie to niezdefiniowane zachowanie. Przechwytuj wtedy przez wartość."},"see":[{"topic":"references","entry":null}]},{"id":"with-algorithms","title":{"en":"Lambdas with algorithms","pl":"Lambdy w algorytmach"},"explain":{"en":"The most common use: pass a lambda as the comparator or condition of an algorithm. A comparator takes two elements and returns <code>true<\/code> if the first goes first; a predicate takes one and returns <code>bool<\/code>. Captures let it use local values, like <code>limit<\/code> here.","pl":"Najczęstsze zastosowanie: lambda jako komparator albo warunek algorytmu. Komparator dostaje dwa elementy i zwraca <code>true<\/code>, gdy pierwszy ma być przed drugim; predykat (predicate) dostaje jeden element i zwraca <code>bool<\/code>. Dzięki przechwytywaniu może korzystać ze zmiennych lokalnych, jak tutaj <code>limit<\/code>."},"code":"std::vector<int> v{5, -2, 8, -7, 3};\nstd::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });\nfor (int x : v) {\n    std::cout << x << ' ';\n}\nstd::cout << '\\n';\nint limit = 4;\nauto big = std::count_if(v.begin(), v.end(), [limit](int x) { return x > limit; });\nstd::cout << big << \" greater than \" << limit << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"8 5 3 -2 -7\n2 greater than 4","error":false,"pitfall":{"en":"A comparator must be strict: <code>a &gt; b<\/code>, never <code>a &gt;= b<\/code>. With <code>&gt;=<\/code> equal elements compare as \"before each other\", which is undefined behaviour in <code>std::sort<\/code> and can crash.","pl":"Komparator musi być ostry: <code>a &gt; b<\/code>, nigdy <code>a &gt;= b<\/code>. Przy <code>&gt;=<\/code> równe elementy są „przed sobą nawzajem”, co w <code>std::sort<\/code> jest niezdefiniowanym zachowaniem i może skończyć się awarią programu."},"see":[{"topic":"sorting","entry":null},{"topic":"searching","entry":null},{"topic":"transforming","entry":null}]},{"id":"mutable","title":{"en":"mutable lambdas","pl":"Lambdy mutable"},"explain":{"en":"Copies captured by value are read-only inside the lambda. <code>mutable<\/code> lets the lambda change <em>its own copy<\/em>, which is kept between calls, so the lambda can count or remember things. The original variable stays untouched.","pl":"Kopie przechwycone przez wartość są wewnątrz lambdy tylko do odczytu. <code>mutable<\/code> pozwala lambdzie zmieniać <em>własną kopię<\/em>, która przetrwa między wywołaniami, więc lambda może coś liczyć albo zapamiętywać. Oryginalna zmienna pozostaje bez zmian."},"code":"int calls = 0;\nauto counter = [calls]() mutable { return ++calls; };   // changes its own copy\nfor (int i = 0; i < 3; ++i) {\n    std::cout << counter() << ' ';\n}\nstd::cout << \"| calls = \" << calls << '\\n';   // the original is unchanged","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 3 | calls = 0","error":false,"pitfall":{"en":"Without <code>mutable<\/code>, <code>++calls<\/code> is a compile error (\"increment of read-only variable\"). If you want to change the original variable, capture it by reference, <code>[&amp;calls]<\/code>, instead of adding <code>mutable<\/code>.","pl":"Bez <code>mutable<\/code> instrukcja <code>++calls<\/code> to błąd kompilacji („increment of read-only variable”). Jeśli chcesz zmienić oryginalną zmienną, przechwyć ją przez referencję, <code>[&amp;calls]<\/code>, zamiast dopisywać <code>mutable<\/code>."},"see":[]},{"id":"generic","title":{"en":"Generic lambdas (auto)","pl":"Lambdy generyczne (auto)"},"explain":{"en":"With <code>auto<\/code> parameters a lambda works for any type, like a function template: the compiler makes a separate version for each type it is called with. Handy for printing helpers and comparators.","pl":"Z parametrami <code>auto<\/code> lambda działa dla dowolnego typu, jak szablon funkcji (function template): kompilator tworzy osobną wersję dla każdego typu, z którym ją wywołasz. Przydaje się do pomocniczych funkcji wypisujących i komparatorów."},"code":"auto print = [](const auto& x) { std::cout << x << '\\n'; };\nprint(42);\nprint(3.5);\nprint(\"text\");\nstd::vector<std::string> words{\"pear\", \"fig\", \"banana\"};\nstd::sort(words.begin(), words.end(),\n          [](const auto& a, const auto& b) { return a.size() < b.size(); });\nprint(words.front());","lang":"cpp","codeTitle":null,"input":null,"output":"42\n3.5\ntext\nfig","error":false,"pitfall":null,"see":[{"topic":"templates","entry":null}]},{"id":"std-function","title":{"en":"Storing: auto vs std::function","pl":"auto czy std::function"},"explain":{"en":"Every lambda has its own unique type, so an <code>auto<\/code> variable can't later hold a different lambda. <code>std::function&lt;int(int)&gt;<\/code> (from <code>&lt;functional&gt;<\/code>) holds <em>any<\/em> callable that takes an <code>int<\/code> and returns an <code>int<\/code>: use it for a variable you reassign, a container of functions or a class member.","pl":"Każda lambda ma swój własny, unikalny typ, więc zmienna <code>auto<\/code> nie przyjmie później innej lambdy. <code>std::function&lt;int(int)&gt;<\/code> (z <code>&lt;functional&gt;<\/code>) przechowuje <em>dowolny<\/em> obiekt wywoływalny (callable), który przyjmuje <code>int<\/code> i zwraca <code>int<\/code>: używaj go dla zmiennej, którą podmieniasz, kontenera funkcji albo pola klasy."},"code":"auto f = [](int x) { return x + 1; };\n// f = [](int x) { return x * 2; };   // error: a different lambda type\nstd::cout << f(5) << '\\n';\nstd::function<int(int)> g = f;\ng = [](int x) { return x * 2; };     // OK: same signature int(int)\nstd::cout << g(5) << '\\n';\nstd::map<char, std::function<int(int, int)>> ops{\n    {'+', [](int a, int b) { return a + b; }},\n    {'*', [](int a, int b) { return a * b; }},\n};\nstd::cout << ops['*'](6, 7) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"6\n10\n42","error":false,"pitfall":{"en":"Calling an empty <code>std::function<\/code> throws <code>std::bad_function_call<\/code>; check with <code>if (g)<\/code>. <code>std::function<\/code> is also slower than a plain lambda, so keep <code>auto<\/code> when the type never changes.","pl":"Wywołanie pustego <code>std::function<\/code> rzuca wyjątek <code>std::bad_function_call<\/code>; sprawdzaj przez <code>if (g)<\/code>. <code>std::function<\/code> jest też wolniejsze od zwykłej lambdy, więc zostań przy <code>auto<\/code>, gdy typ się nie zmienia."},"see":[{"topic":"map","entry":null}]}]},{"id":"sorting","glyph":"sort","name":{"en":"Sorting","pl":"Sortowanie"},"summary":{"en":"std::sort up and down, custom comparators, sorting structs, stable_sort, reverse, unique, partial_sort and nth_element.","pl":"Sortowanie (sorting): std::sort rosnąco i malejąco, własne komparatory, sortowanie struktur, stable_sort, reverse, unique, partial_sort i nth_element."},"headers":["<algorithm>","<functional>"],"planned":false,"entries":[{"id":"sort","title":{"en":"Ascending and descending","pl":"Rosnąco i malejąco"},"explain":{"en":"<code>std::sort(v.begin(), v.end())<\/code> sorts the range in place, ascending, in O(n log n). Pass <code>std::greater&lt;&gt;()<\/code> (from <code>&lt;functional&gt;<\/code>) as the third argument to sort descending. Strings sort alphabetically.","pl":"<code>std::sort(v.begin(), v.end())<\/code> sortuje zakres (range) w miejscu (in place), rosnąco, w czasie O(n log n). Żeby posortować malejąco, podaj jako trzeci argument <code>std::greater&lt;&gt;()<\/code> (z <code>&lt;functional&gt;<\/code>). Napisy są sortowane alfabetycznie."},"code":"std::vector<int> v{5, 2, 9, 1, 7};\nstd::sort(v.begin(), v.end());                    // ascending\nfor (int x : v) std::cout << x << ' ';\nstd::cout << '\\n';\nstd::sort(v.begin(), v.end(), std::greater<>());  // descending\nfor (int x : v) std::cout << x << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 5 7 9\n9 7 5 2 1","error":false,"pitfall":{"en":"<code>std::sort<\/code> needs random-access iterators, so <code>std::sort(lst.begin(), lst.end())<\/code> on a <code>std::list<\/code> does not compile. Use the member function <code>lst.sort()<\/code> instead.","pl":"<code>std::sort<\/code> wymaga iteratorów o dostępie swobodnym (random-access iterators), więc <code>std::sort(lst.begin(), lst.end())<\/code> dla <code>std::list<\/code> się nie skompiluje. Użyj wtedy metody <code>lst.sort()<\/code>."},"see":[{"topic":"vector","entry":null},{"topic":"deque-list","entry":null},{"topic":"ranges","entry":null}]},{"id":"comparator","title":{"en":"Custom comparator","pl":"Własny komparator"},"explain":{"en":"The third argument can be any function or lambda <code>comp(a, b)<\/code> that returns <code>true<\/code> when <code>a<\/code> should come <strong>before<\/strong> <code>b<\/code>. Here words are sorted by length instead of alphabetically.","pl":"Trzecim argumentem może być dowolna funkcja lub lambda <code>comp(a, b)<\/code>, która zwraca <code>true<\/code>, gdy <code>a<\/code> ma się znaleźć <strong>przed<\/strong> <code>b<\/code>. Taką funkcję nazywamy komparatorem (comparator). Tutaj słowa są sortowane według długości, a nie alfabetycznie."},"code":"std::vector<std::string> words{\"banana\", \"fig\", \"kiwi\", \"apple\"};\nstd::sort(words.begin(), words.end(),\n          [](const std::string& a, const std::string& b) {\n              return a.size() < b.size();\n          });\nfor (const auto& w : words) std::cout << w << ' ';\nstd::cout << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"fig kiwi apple banana","error":false,"pitfall":{"en":"The comparator must be strict: use <code>&lt;<\/code> or <code>&gt;<\/code>, never <code>&lt;=<\/code> or <code>&gt;=<\/code>. With <code>&lt;=<\/code> equal elements compare as \"before each other\", which is undefined behaviour and can crash <code>std::sort<\/code>.","pl":"Komparator musi być ostry: używaj <code>&lt;<\/code> albo <code>&gt;<\/code>, nigdy <code>&lt;=<\/code> ani <code>&gt;=<\/code>. Przy <code>&lt;=<\/code> równe elementy są nawzajem „przed sobą”, co jest niezdefiniowanym zachowaniem (undefined behaviour) i może nawet wywrócić program."},"see":[{"topic":"lambdas","entry":null}]},{"id":"structs","title":{"en":"Sorting structs by a field","pl":"Sortowanie struktur po polu"},"explain":{"en":"A struct has no built-in order, so give <code>std::sort<\/code> a lambda that compares the field you want. For several keys, compare the first one and fall back to the next only on a tie.","pl":"Struktura (struct) nie ma wbudowanego porządku, więc przekaż do <code>std::sort<\/code> lambdę, która porównuje wybrane pole. Przy kilku kluczach porównuj pierwszy, a po następny sięgaj dopiero przy remisie."},"code":"struct Student {\n    std::string name;\n    int grade;\n};\n\nint main() {\n    std::vector<Student> s{{\"Tom\", 4}, {\"Bob\", 5}, {\"Eve\", 3}, {\"Ann\", 5}};\n    std::sort(s.begin(), s.end(), [](const Student& a, const Student& b) {\n        if (a.grade != b.grade) return a.grade > b.grade;  // best first\n        return a.name < b.name;                            // then by name\n    });\n    for (const auto& st : s) std::cout << st.name << ' ' << st.grade << '\\n';\n}","lang":"cpp","codeTitle":null,"input":null,"output":"Ann 5\nBob 5\nTom 4\nEve 3","error":false,"pitfall":{"en":"<code>std::sort(s.begin(), s.end())<\/code> on structs without a comparator fails with a long error about <code>operator&lt;<\/code>. Pass a lambda, or define <code>operator&lt;<\/code> (or <code>&lt;=&gt;<\/code>) for the struct.","pl":"<code>std::sort(s.begin(), s.end())<\/code> na strukturach bez komparatora kończy się długim błędem o <code>operator&lt;<\/code>. Przekaż lambdę albo zdefiniuj w strukturze <code>operator&lt;<\/code> (lub <code>&lt;=&gt;<\/code>)."},"see":[{"topic":"lambdas","entry":null},{"topic":"operator-overloading","entry":null},{"topic":"ranges","entry":null}]},{"id":"stable-sort","title":{"en":"Stable sort","pl":"Sortowanie stabilne"},"explain":{"en":"<code>std::sort<\/code> may reorder elements that compare equal. <code>std::stable_sort<\/code> keeps them in their original order, so sorting a name-ordered list by grade keeps the names in order within each grade.","pl":"<code>std::sort<\/code> może zamienić kolejność elementów, które są sobie równe. Sortowanie stabilne (stable sort) <code>std::stable_sort<\/code> zachowuje ich pierwotną kolejność. Jeśli lista była ułożona alfabetycznie, to po sortowaniu według ocen osoby z tą samą oceną nadal stoją w kolejności alfabetycznej."},"code":"std::vector<std::pair<std::string, int>> v{\n    {\"Ann\", 3}, {\"Bob\", 5}, {\"Cid\", 3}, {\"Dan\", 5}};  // sorted by name\nstd::stable_sort(v.begin(), v.end(), [](const auto& a, const auto& b) {\n    return a.second > b.second;                     // by grade only\n});\nfor (const auto& [name, grade] : v)\n    std::cout << name << ' ' << grade << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"Bob 5\nDan 5\nAnn 3\nCid 3","error":false,"pitfall":null,"see":[{"topic":"pair-tuple","entry":null}]},{"id":"reverse-unique","title":{"en":"reverse and unique","pl":"reverse i unique"},"explain":{"en":"<code>std::reverse<\/code> flips a range in place. <code>std::unique<\/code> squeezes runs of equal neighbours into one and returns the new logical end; <code>erase<\/code> from there to <code>end()<\/code> actually removes the leftovers. Sort first to drop all duplicates.","pl":"<code>std::reverse<\/code> odwraca zakres w miejscu. <code>std::unique<\/code> zostawia jeden element z każdej serii równych sąsiadów i zwraca nowy logiczny koniec; dopiero <code>erase<\/code> od tego miejsca do <code>end()<\/code> naprawdę usuwa resztki. Żeby usunąć wszystkie duplikaty (duplicates), najpierw posortuj."},"code":"std::vector<int> v{3, 1, 3, 2, 1, 3};\nstd::sort(v.begin(), v.end());                      // 1 1 2 3 3 3\nv.erase(std::unique(v.begin(), v.end()), v.end());  // 1 2 3\nstd::reverse(v.begin(), v.end());                   // 3 2 1\nfor (int x : v) std::cout << x << ' ';\nstd::cout << \"(size \" << v.size() << \")\\n\";","lang":"cpp","codeTitle":null,"input":null,"output":"3 2 1 (size 3)","error":false,"pitfall":{"en":"<code>std::unique<\/code> only removes <strong>adjacent<\/strong> duplicates and never changes the size: <code>{1, 2, 1}<\/code> stays as it is. Sort first, and always <code>erase<\/code> what it returns (or use a <code>std::set<\/code>).","pl":"<code>std::unique<\/code> usuwa tylko <strong>sąsiadujące<\/strong> duplikaty i nigdy nie zmienia rozmiaru: <code>{1, 2, 1}<\/code> zostaje bez zmian. Najpierw posortuj i zawsze wywołaj <code>erase<\/code> na tym, co zwróci (albo użyj <code>std::set<\/code>)."},"see":[{"topic":"set","entry":null},{"topic":"transforming","entry":"erase-remove"}]},{"id":"partial-sort","title":{"en":"partial_sort and nth_element","pl":"partial_sort i nth_element"},"explain":{"en":"<code>std::partial_sort<\/code> sorts only the first k elements (the k smallest), which is faster than a full sort for a top-k list. <code>std::nth_element<\/code> just puts the element that belongs at position n there, in O(n) on average: ideal for a median.","pl":"<code>std::partial_sort<\/code> sortuje tylko pierwsze k elementów (k najmniejszych), co jest szybsze od pełnego sortowania, gdy potrzebujesz „top k”. <code>std::nth_element<\/code> stawia na pozycji n element, który znalazłby się tam po pełnym sortowaniu, średnio w czasie O(n): idealne do mediany."},"code":"std::vector<int> v{9, 4, 7, 1, 8, 2, 6};\nstd::partial_sort(v.begin(), v.begin() + 3, v.end());\nstd::cout << v[0] << ' ' << v[1] << ' ' << v[2] << '\\n';  // 3 smallest\n\nstd::vector<int> w{9, 4, 7, 1, 8, 2, 6};\nauto mid = w.begin() + w.size() / 2;\nstd::nth_element(w.begin(), mid, w.end());\nstd::cout << \"median: \" << *mid << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"1 2 4\nmedian: 6","error":false,"pitfall":{"en":"After <code>std::nth_element<\/code> only the n-th element is in its final place: smaller ones are before it and larger ones after it, but in no particular order. Don't treat the rest as sorted.","pl":"Po <code>std::nth_element<\/code> tylko n-ty element stoi na swoim docelowym miejscu: mniejsze są przed nim, a większe za nim, ale w dowolnej kolejności. Nie zakładaj, że reszta jest posortowana."},"see":[]}]},{"id":"searching","glyph":"find","name":{"en":"Searching","pl":"Wyszukiwanie"},"summary":{"en":"find and find_if, count and count_if, min_element and max_element, any_of / all_of / none_of, binary search with lower_bound and upper_bound.","pl":"Wyszukiwanie (searching): find i find_if, count i count_if, min_element i max_element, any_of / all_of / none_of, wyszukiwanie binarne z lower_bound i upper_bound."},"headers":["<algorithm>"],"planned":false,"entries":[{"id":"find","title":{"en":"find and find_if","pl":"find i find_if"},"explain":{"en":"<code>std::find<\/code> looks for a value, <code>std::find_if<\/code> for the first element where a predicate (a function returning <code>bool<\/code>) is true. Both return an iterator to it, or <code>end()<\/code> if there is none; <code>it - v.begin()<\/code> gives the index.","pl":"<code>std::find<\/code> szuka wartości, a <code>std::find_if<\/code> pierwszego elementu, dla którego predykat (predicate), czyli funkcja zwracająca <code>bool<\/code>, jest prawdziwy. Obie zwracają iterator do znalezionego elementu albo <code>end()<\/code>, gdy go nie ma; <code>it - v.begin()<\/code> daje indeks."},"code":"std::vector<int> v{4, 8, 15, 16, 23, 42};\nauto it = std::find(v.begin(), v.end(), 16);\nif (it != v.end())\n    std::cout << \"16 at index \" << (it - v.begin()) << '\\n';\n\nauto odd = std::find_if(v.begin(), v.end(),\n                        [](int x) { return x % 2 != 0; });\nif (odd != v.end())\n    std::cout << \"first odd: \" << *odd << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"16 at index 3\nfirst odd: 15","error":false,"pitfall":{"en":"Always compare the result with <code>end()<\/code> before using <code>*it<\/code>: if nothing was found, <code>*it<\/code> is undefined behaviour. For <code>std::set<\/code> and <code>std::map<\/code> use their own <code>.find()<\/code>, which is much faster.","pl":"Zanim użyjesz <code>*it<\/code>, zawsze porównaj wynik z <code>end()<\/code>: jeśli nic nie znaleziono, <code>*it<\/code> to niezdefiniowane zachowanie (undefined behaviour). Dla <code>std::set<\/code> i <code>std::map<\/code> używaj ich własnej metody <code>.find()<\/code>, która jest dużo szybsza."},"see":[{"topic":"iterators","entry":null},{"topic":"lambdas","entry":null},{"topic":"map","entry":null},{"topic":"set","entry":null}]},{"id":"count","title":{"en":"count and count_if","pl":"count i count_if"},"explain":{"en":"<code>std::count<\/code> says how many elements equal a value; <code>std::count_if<\/code> how many satisfy a predicate. They work on any range, <code>std::string<\/code> included.","pl":"<code>std::count<\/code> mówi, ile elementów jest równych danej wartości, a <code>std::count_if<\/code>, ile spełnia predykat. Działają na każdym zakresie (range), także na <code>std::string<\/code>."},"code":"std::vector<int> grades{5, 3, 4, 5, 2, 5};\nstd::cout << std::count(grades.begin(), grades.end(), 5) << '\\n';\nstd::cout << std::count_if(grades.begin(), grades.end(),\n                           [](int g) { return g >= 4; }) << '\\n';\n\nstd::string s = \"banana\";\nstd::cout << std::count(s.begin(), s.end(), 'a') << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"3\n4\n3","error":false,"pitfall":null,"see":[]},{"id":"min-max-element","title":{"en":"Smallest and largest","pl":"Najmniejszy i największy"},"explain":{"en":"<code>std::min_element<\/code> and <code>std::max_element<\/code> return an iterator: <code>*it<\/code> is the value, <code>it - v.begin()<\/code> its index (the first one if there are ties). For structs pass a comparator that says \"less than\", even for <code>max_element<\/code>.","pl":"<code>std::min_element<\/code> i <code>std::max_element<\/code> zwracają iterator: <code>*it<\/code> to wartość, a <code>it - v.begin()<\/code> jej indeks (przy remisie pierwszy z nich). Dla struktur (structs) podaj komparator (comparator) mówiący „mniejsze niż”, także w <code>max_element<\/code>."},"code":"std::vector<int> v{3, 9, 1, 7, 9};\nauto lo = std::min_element(v.begin(), v.end());\nauto hi = std::max_element(v.begin(), v.end());\nstd::cout << \"min \" << *lo << \" at \" << (lo - v.begin()) << '\\n';\nstd::cout << \"max \" << *hi << \" at \" << (hi - v.begin()) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"min 1 at 2\nmax 9 at 1","error":false,"pitfall":{"en":"On an empty container both return <code>end()<\/code>, and <code>*it<\/code> is then undefined behaviour. Check <code>!v.empty()<\/code> first.","pl":"Dla pustego kontenera obie funkcje zwracają <code>end()<\/code>, a wtedy <code>*it<\/code> to niezdefiniowane zachowanie. Najpierw sprawdź <code>!v.empty()<\/code>."},"see":[{"topic":"transforming","entry":null}]},{"id":"any-all-none","title":{"en":"any_of, all_of, none_of","pl":"any_of, all_of, none_of"},"explain":{"en":"Answer yes/no questions about a whole range: is the predicate true for at least one, for every, or for no element? They stop as soon as the answer is known. On an empty range <code>all_of<\/code> and <code>none_of<\/code> are <code>true<\/code>, <code>any_of<\/code> is <code>false<\/code>.","pl":"Odpowiadają na pytania tak/nie o cały zakres: czy predykat jest prawdziwy dla choć jednego elementu, dla wszystkich, czy dla żadnego? Kończą pracę, gdy tylko znają odpowiedź. Dla pustego zakresu <code>all_of<\/code> i <code>none_of<\/code> dają <code>true<\/code>, a <code>any_of<\/code> daje <code>false<\/code>."},"code":"std::vector<int> v{2, 4, 6, 7};\nauto even = [](int x) { return x % 2 == 0; };\nstd::cout << std::boolalpha;\nstd::cout << \"all even:  \" << std::all_of(v.begin(), v.end(), even) << '\\n';\nstd::cout << \"any even:  \" << std::any_of(v.begin(), v.end(), even) << '\\n';\nstd::cout << \"none even: \" << std::none_of(v.begin(), v.end(), even) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"all even:  false\nany even:  true\nnone even: false","error":false,"pitfall":null,"see":[{"topic":"lambdas","entry":null}]},{"id":"binary-search","title":{"en":"Binary search","pl":"Wyszukiwanie binarne"},"explain":{"en":"On <strong>sorted<\/strong> data <code>std::binary_search<\/code> checks whether a value is there in O(log n) steps instead of O(n), by halving the range each time. It only says yes or no; to get the position use <code>std::lower_bound<\/code>.","pl":"Na <strong>posortowanych<\/strong> danych <code>std::binary_search<\/code> sprawdza, czy wartość występuje, w O(log n) krokach zamiast O(n), za każdym razem dzieląc zakres na pół. Mówi tylko tak albo nie; pozycję daje <code>std::lower_bound<\/code>."},"code":"std::vector<int> v{1, 3, 5, 7, 9};  // must be sorted!\nstd::cout << std::boolalpha\n          << std::binary_search(v.begin(), v.end(), 7) << ' '\n          << std::binary_search(v.begin(), v.end(), 4) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"true false","error":false,"pitfall":{"en":"On unsorted data the binary search functions give wrong answers without any error. Call <code>std::sort<\/code> first (and sort with the same comparator you search with).","pl":"Na nieposortowanych danych funkcje wyszukiwania binarnego (binary search) dają błędne wyniki bez żadnego ostrzeżenia. Najpierw wywołaj <code>std::sort<\/code> (z tym samym komparatorem, którego używasz przy szukaniu)."},"see":[{"topic":"sorting","entry":null}]},{"id":"bounds","title":{"en":"lower_bound and upper_bound","pl":"lower_bound i upper_bound"},"explain":{"en":"On sorted data <code>std::lower_bound<\/code> returns the first element <code>&gt;= x<\/code> and <code>std::upper_bound<\/code> the first <code>&gt; x<\/code>, both in O(log n). Their difference is how many times <code>x<\/code> occurs, and <code>v.insert(lower_bound(...), x)<\/code> keeps the vector sorted.","pl":"Na posortowanych danych <code>std::lower_bound<\/code> zwraca pierwszy element <code>&gt;= x<\/code>, a <code>std::upper_bound<\/code> pierwszy <code>&gt; x<\/code>, oba w czasie O(log n). Różnica między nimi to liczba wystąpień <code>x<\/code>, a <code>v.insert(lower_bound(...), x)<\/code> wstawia element tak, że wektor zostaje posortowany."},"code":"std::vector<int> v{1, 3, 3, 3, 7, 9};\nauto lo = std::lower_bound(v.begin(), v.end(), 3);  // first >= 3\nauto hi = std::upper_bound(v.begin(), v.end(), 3);  // first > 3\nstd::cout << \"first 3 at \" << (lo - v.begin()) << '\\n';\nstd::cout << \"count of 3: \" << (hi - lo) << '\\n';\n\nauto pos = std::lower_bound(v.begin(), v.end(), 5);\nstd::cout << \"5 would go at \" << (pos - v.begin()) << '\\n';","lang":"cpp","codeTitle":null,"input":null,"output":"first 3 at 1\ncount of 3: 3\n5 would go at 4","error":false,"pitfall":{"en":"<code>lower_bound<\/code> returns a position even when <code>x<\/code> is missing. To check that it was found, test <code>it != v.end() &amp;&amp; *it == x<\/code>.","pl":"<code>lower_bound<\/code> zwraca pozycję także wtedy, gdy <code>x<\/code> nie ma w danych. Żeby sprawdzić, czy element znaleziono, użyj warunku <code>it != v.end() &amp;&amp; *it == x<\/code>."},"see":[{"topic":"sorting","entry":null},{"topic":"set","entry":null}]}]},{"id":"transforming","glyph":"accum","name":{"en":"Transform &amp; sum","pl":"Przekształcanie i sumowanie"},"summary":{"en":"Summing with accumulate, transform, fill and iota, copy_if, removing elements (erase-remove, erase_if), min, max and clamp.","pl":"Przekształcanie (transforming) i sumowanie: accumulate,
